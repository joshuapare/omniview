ly. Form and Review locked; no safe parser is claimed.':'Form owns only demonstrated paths. Manual edits switch to source-only fallback.'}</div><label>YAML 1.2 source<textarea id="source" spellcheck="false">${esc(raw)}</textarea></label>`}else if(section==='advanced'){html=`<h2>Advanced / ownership</h2><div class="row"><h3>Status · Read only</h3><span class="muted">Controller conditions unavailable in offline preview.</span></div><div class="row"><h3>Unrepresented fields</h3><span class="muted">Use YAML; manual source remains intact and disables Form.</span></div><div class="warning">No status writes, ownership takeover, certificate inspection, or automatic dependency creation.</div>`}else{html=`<h2>${K.value==='XListenerSet'?'Attach listeners':K.value==='XBackendTrafficPolicy'?'Protect backend traffic':'Define mesh ownership'} ${help(K.value==='XListenerSet'?'Parent Gateway must permit ListenerSets. ReferenceGrants are not inherited. No attachment or certificate validity is inferred.':K.value==='XBackendTrafficPolicy'?'Targets are local backend objects, not Service ports. Extended retry features need controller support.':'Controller name is immutable. Parameters namespace is required only for namespaced references.')}</h2><div class="grid">${field('Name *','name',state.name,'text',S.value==='edit')}${K.value==='XMesh'?field('Controller name *','controller',state.controller,'text',S.value==='edit'):'<label>Namespace<input value="preview" disabled></label>'}</div>`;
