<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossplane Operations • Design Preview</title><style>
:root{color-scheme:dark;--bg:#101112;--panel:#1f2125;--input:#141517;--border:#373a42;--text:#e8e9ed;--muted:#a4a9b4;--accent:#9bafff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--border);border-radius:5px;background:var(--input);min-height:32px;padding:6px 9px}button{cursor:pointer}button:hover{background:#343944}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}header.shell{padding:20px 28px;border-bottom:1px solid #292c31;color:var(--muted)}.fixture{text-align:center;color:var(--muted);margin:18px}dialog{position:relative;display:flex;flex-direction:column;margin:0 auto;width:min(1000px,calc(100vw - 24px));height:min(700px,calc(100vh - 130px));padding:0;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);box-shadow:0 30px 90px #0008}dialog>header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:16px}h1{font-size:17px;margin:0 0 5px}small,.muted{color:var(--muted)}.toolbar{display:flex;gap:6px;align-items:center}.layout{display:flex;min-height:0;flex:1}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--border)}nav button{display:block;width:100%;text-align:left;background:none;border:0;margin-bottom:5px}nav button.active{background:#303642;color:#bcc9ff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}h2{font-size:14px;margin:0 0 16px}h3{font-size:13px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}label{color:#c7cbd4}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input,.row select{min-width:0;flex:1}.box{border:1px solid var(--border);border-radius:7px;padding:14px;margin-bottom:12px}.warn{background:#3b3020;color:#efcf99;border:1px solid #695335;padding:10px 12px;border-radius:5px;margin:0 0 16px}.error{color:#ffadb4;margin:8px 0}.pill{font-size:11px;border:1px solid #4c5363;border-radius:12px;padding:3px 8px;color:#c0caff}footer{padding:12px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}.primary{background:#aabcff;color:#15203c;border:0;font-weight:600}.help{padding:0;width:22px;min-height:22px;border-radius:50%;margin-left:6px}.popover{position:fixed;z-index:5;max-width:330px;background:#323741;padding:12px;border:1px solid #6e778a;border-radius:6px;box-shadow:0 8px 30px #0007}textarea{width:100%;min-height:190px;resize:vertical;line-height:1.6;font-family:ui-monospace,monospace}#source{height:385px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c4d0ec;line-height:1.65}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--border)}@media(max-width:700px){nav{width:125px;padding:12px 6px}main{padding:16px}.grid{grid-template-columns:1fr}dialog>header{padding:12px;flex-wrap:wrap}footer{padding:12px}.fixture{margin:8px}}
</style><header class="shell">Omniview　/　preview-cluster　/　Crossplane Operations</header><p class="fixture">Interactive design mock • Synthetic fixtures only • No cluster requests</p><dialog open aria-label="Crossplane operation editor"><header><div><h1 id="title"></h1><small>preview-cluster · Cluster-scoped · ops.crossplane.io/v1alpha1</small></div><div class="toolbar"><button id="form">Form</button><button id="yaml">YAML</button><button id="help" class="help" aria-label="Operations help">?</button></div></header><div class="layout"><nav aria-label="Editor sections"><button data-section="setup" class="active">01　Setup</button><button data-section="pipeline">02　Function pipeline</button><button data-section="advanced">03　Advanced</button><button data-section="history">04　Execution history</button><button data-section="availability">05　Availability</button></nav><main id="main"></main></div><footer><span id="foot">Draft only · No request sent</span><div class="toolbar"><button id="back" hidden>Back to Draft</button><button id="review" class="primary">Review Draft</button></div></footer></dialog><script>
const q=new URLSearchParams(location.search),kind=q.get('kind')||'CronOperation',edit=q.get('intent')==='edit',generated=q.get('ownership')==='generated',completed=q.get('state')==='completed';let section='setup',mode='form',raw='',sourceDirty=false,reviewing=false,steps=[{step:'',fn:''}],state={name:edit?'nightly-check':'',schedule:'',concurrency:'',success:'',failed:'',deadline:'',api:'',watchedKind:'',namespace:'',labelKey:'',labelValue:'',retry:''},error='';const main=document.querySelector('main'),title=document.querySelector('#title');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const locked=generated||completed;title.textContent=(locked?'Inspect ':edit?'Edit ':'Create ')+kind;
if(edit){Object.assign(state,{schedule:'0 2 * * *',api:'apps/v1',watchedKind:'Deployment',namespace:'preview',labelKey:'app',labelValue:'preview'});steps=[{step:'check-policy',fn:'function-policy-preview'}]}
function field(label,key,type='text',placeholder='',disabled=false){return `<div class="field"><label for="${key}">${label}</label><input id="${key}" name="${key}" autocomplete="off" type="${type}" value="${esc(state[key])}" placeholder="${placeholder}" ${disabled||locked?'disabled':''}></div>`}function select(label,key,options){return `<div class="field"><label for="${key}">${label}</label><select id="${key}" ${locked?'disabled':''}><option value="">Not set</option>${options.map(x=>`<option ${state[key]===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function manifest(){let p=steps.map(s=>`      - step: ${JSON.stringify(s.step)}\n        functionRef:\n          name: ${JSON.stringify(s.fn)}`).join('\n');let spec=kind==='Operation'?`  mode: Pipeline\n  pipeline:\n${p.replaceAll('      -','    -').replaceAll('        function','      function').replaceAll('          name','        name')}`:`${kind==='CronOperation'?`  schedule: ${JSON.stringify(state.schedule)}\n`:`  watch:\n    apiVersion: ${JSON.stringify(state.api)}\n    kind: ${JSON.stringify(state.watchedKind)}${state.namespace?'\n    namespace: '+JSON.stringify(state.namespace):''}${state.labelKey?'\n    matchLabels:\n      '+JSON.stringify(state.labelKey)+': '+JSON.stringify(state.labelValue):''}\n`}  operationTemplate:\n    spec:\n      mode: Pipeline\n      pipeline:\n${p.replaceAll('      -','        -').replaceAll('        function','          function').replaceAll('          name','            name')}`;const base=kind==='Operation'?'  ':'      ';if(state.retry)spec+='\n'+base+'retryLimit: '+state.retry;if(kind!=='Operation'){for(const [k,f]of [['concurrency','concurrencyPolicy'],['success','successfulHistoryLimit'],['failed','failedHistoryLimit'],['deadline','startingDeadlineSeconds']])if(state[k]&&(k!=='deadline'||kind==='CronOperation'))spec+='\n  '+f+': '+state[k]}return `apiVersion: ops.crossplane.io/v1alpha1\nkind: ${kind}\nmetadata:\n  name: ${JSON.stringify(state.name)}\nspec:\n${spec}\n`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));document.querySelector('#review').disabled=locked||sourceDirty;document.querySelector('#review').hidden=reviewing;document.querySelector('#back').hidden=!reviewing;if(reviewing){main.innerHTML=`<h2>Review ${edit?'Changes':'Submission'}</h2><div class="warn">${kind==='Operation'?'Submitting can execute functions that change cluster resources.':edit?'Changes affect future runs; existing Operations remain unchanged.':'Controller may create Operations that execute functions and change resources.'} No request will be sent.</div><div class="box">Destination　<b>preview-cluster</b> · Cluster-scoped<br>Intent　${edit?'Update draft':'Create draft'} · ${kind}</div><pre>${esc(manifest())}</pre>`;return}if(mode==='yaml'){main.innerHTML=`<h2>Source draft</h2><div class="warn">${sourceDirty?'Manual source retained verbatim. Form and review are locked; no safe parser is claimed.':'Generated draft. Manual edits stay intact and lock Form; no source is persisted.'}</div><label for="source">YAML · ${kind}</label><textarea id="source" spellcheck="false" ${locked?'readonly':''}>${esc(sourceDirty?raw:manifest())}</textarea>`;return}if(sourceDirty){main.innerHTML='<h2>Form unavailable</h2><div class="warn">Source was edited. Return to YAML to continue; exact raw source remains intact.</div>';return}if(locked){main.innerHTML=`<h2>${generated?'Controller-owned execution':'Completed execution'}</h2><div class="warn">${generated?'Owner: CronOperation nightly-check. Change its template for future runs.':'Completed runs are inspect-only in this design. Submit a separate, deliberate Operation to run again.'}</div><div class="box"><h3>Pipeline result · Synthetic fixture</h3>Step　check-policy<br>Function　function-policy-preview<br>Outcome　${completed?'Succeeded':'Pending'}<br>Applied resources　Not loaded</div><div class="box">Spec, owner references and status are read-only. No retry, rerun, status edit or delete action is implied.</div><button id="owner">Inspect Owner Reference</button>`;bind();return}
if(section==='setup'){main.innerHTML=`<h2>${kind==='Operation'?'One-shot execution':kind==='CronOperation'?'Schedule an operation':'React to resource changes'}</h2>${kind==='Operation'?'<div class="warn">Deliberate submission only. Functions may change cluster resources.</div>':''}${field('Name *','name','text','operation-name…',edit)}${kind==='CronOperation'?`${field('Cron schedule *','schedule','text','0 2 * * *…')}<div class="grid">${select('Concurrent runs','concurrency',['Allow','Forbid','Replace'])}${field('Missed-run deadline · seconds','deadline','text','Omitted…')}</div>`:kind==='WatchOperation'?`<div class="grid">${field('Watched API version *','api','text','apps/v1…',edit)}${field('Watched kind *','watchedKind','text','Deployment…',edit)}</div>${edit?'<small>API version and kind are immutable.</small>':''}${field('Watched namespace','namespace','text','Empty means all namespaces…')}<div class="warn">An empty namespace watches all namespaces. An empty selector matches all resources of this kind.</div><div class="grid">${field('Match label · key','labelKey','text','app…')}${field('Match label · value','labelValue','text','preview…')}</div>${select('Concurrent runs','concurrency',['Allow','Forbid','Replace'])}`:'<div class="box">Execution mode　<b>Pipeline</b><br><small>Choose installed functions in the next section. No function is selected automatically.</small></div>'}<p class="error" role="alert">${error}</p>`}
if(section==='pipeline'){main.innerHTML=`<h2>Function pipeline <span class="pill">${steps.length} / 99</span></h2>${steps.map((s,i)=>`<div class="box"><div class="row"><b>Step ${i+1}</b><button data-remove="${i}" aria-label="Remove step ${i+1}">Remove</button></div><div class="grid"><div class="field"><label for="step${i}">Unique step name *</label><input id="step${i}" data-step="${i}" value="${esc(s.step)}" autocomplete="off"></div><div class="field"><label for="fn${i}">Function reference *</label><select id="fn${i}" data-fn="${i}"><option value="">Choose function</option>${['function-policy-preview','function-audit-preview'].map(f=>`<option ${s.fn===f?'selected':''}>${f}</option>`).join('')}</select></div></div></div>`).join('')}<button id="add" ${steps.length>=99?'disabled':''}>Add Step</button><p class="error" role="alert">${error}</p><small>Reference choices are synthetic fixtures, not installed-function or permission claims.</small>`}
if(section==='advanced'){main.innerHTML=`<h2>Advanced execution</h2>${field('Retry failure limit · int64','retry','text','Omitted…')}<div class="box"><h3>Function input & resource requirements</h3><button id="sourceAdvanced">Edit Exact Source</button><p class="muted">Arbitrary input, credentials references and required-resource selectors use source only.</p></div>${kind!=='Operation'?`<div class="grid">${field('Successful runs to retain · int32','success','text','Omitted · API default 3…')}${field('Failed runs to retain · int32','failed','text','Omitted · API default 1…')}</div>`:''}<small>Credential values are never fetched. Source fixtures contain no credentials or annotations.</small>`}
if(section==='history'){main.innerHTML='<h2>Execution history</h2><div class="box">Synthetic fixture · No controller status queried</div><table><tr><th>Operation</th><th>Owner</th><th>Result</th></tr><tr><td>nightly-check-preview</td><td>CronOperation</td><td>Not loaded</td></tr></table><p><button id="inspectRun">Inspect Generated Run</button></p><small>status conditions, result and applied-resource references remain read-only.</small>'}
if(section==='availability'){main.innerHTML=`<h2>Access & availability</h2><div class="field"><label for="availability">Simulate availability</label><select id="availability"><option>Choose state</option><option>Operations feature disabled</option><option>API not installed</option><option>Create denied</option><option>Function lookup denied</option><option>Function lookup unavailable</option><option>No functions found</option><option>Unsupported API version</option></select></div><div id="availabilityMessage" role="status"></div>`}bind()}
function bind(){main.querySelectorAll('input[id]').forEach(el=>el.oninput=()=>{if(el.dataset.step!==undefined)steps[+el.dataset.step].step=el.value;else state[el.id]=el.value});main.querySelectorAll('select[id]').forEach(el=>el.onchange=()=>{if(el.dataset.fn!==undefined)steps[+el.dataset.fn].fn=el.value;else if(el.id==='availability'){document.querySelector('#availabilityMessage').innerHTML='<div class="warn">'+esc(el.value)+'. Draft retained. Review unavailable; discovery is not permission or controller readiness.</div>';document.querySelector('#review').disabled=true}else state[el.id]=el.value});main.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{steps.splice(+el.dataset.remove,1);render()});let a=document.querySelector('#add');if(a)a.onclick=()=>{steps.push({step:'',fn:''});render();document.querySelector('#step'+(steps.length-1)).focus()};let src=document.querySelector('#sourceAdvanced');if(src)src.onclick=()=>{mode='yaml';render();bindSource()};let run=document.querySelector('#inspectRun');if(run)run.onclick=()=>location.href='?kind=Operation&ownership=generated';let owner=document.querySelector('#owner');if(owner)owner.onclick=()=>{main.innerHTML='<h2>Owner reference · Synthetic fixture</h2><div class="box">ops.crossplane.io/v1alpha1<br>CronOperation / nightly-check<br>controller: true</div><div class="warn">Inspect-only. No owner or execution is changed.</div>'}}
function bindSource(){let s=document.querySelector('#source');if(s)s.oninput=()=>{raw=s.value;sourceDirty=true;document.querySelector('#review').disabled=true}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{section=b.dataset.section;mode='form';error='';reviewing=false;render()});document.querySelector('#yaml').onclick=()=>{mode='yaml';render();bindSource()};document.querySelector('#form').onclick=()=>{mode='form';render()};document.querySelector('#back').onclick=()=>{reviewing=false;render()};document.querySelector('#review').onclick=()=>{error='';if(!state.name){section='setup';error='Enter an operation name.'}else if(kind==='CronOperation'&&state.schedule.trim().split(/\s+/).length!==5){section='setup';error='Enter a five-field cron expression. Server validation remains required.'}else if(kind==='WatchOperation'&&(!state.api||!state.watchedKind)){section='setup';error='Enter watched API version and kind.'}else if(!steps.length||steps.some(s=>!s.step||!s.fn)||new Set(steps.map(s=>s.step)).size!==steps.length){section='pipeline';error='Add 1–99 steps with unique names and a function reference.'}else if(['retry','deadline','success','failed'].some(k=>state[k]&&!/^-?\d+$/.test(state[k]))){section='advanced';error='Use exact integer values.'}else reviewing=true;render();if(error)main.querySelector('input,select')?.focus()};let help=document.querySelector('#help');function showHelp(){if(document.querySelector('.popover'))return;let p=document.createElement('div');p.className='popover';p.id='helpContent';p.setAttribute('role','tooltip');p.textContent='Crossplane v2.0.0 Operations require the Operations feature and installed functions. API discovery alone does not prove enablement, permission, or controller readiness.';let r=help.getBoundingClientRect();p.style.top=(r.bottom+8)+'px';p.style.left=Math.max(12,r.right-330)+'px';document.body.append(p);help.setAttribute('aria-describedby','helpContent')}help.onclick=showHelp;help.onmouseenter=showHelp;help.onfocus=showHelp;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.popover')){document.querySelector('.popover').remove();help.removeAttribute('aria-describedby');help.focus();help.onfocus=null}});render();
let unavailable=false;
document.addEventListener('input',()=>{error='';main.querySelector('.error')?.replaceChildren()});
document.addEventListener('change',e=>{if(e.target.id==='availability')unavailable=e.target.value!=='Choose state'});
document.addEventListener('click',e=>{if(e.target.closest('#review')&&unavailable){e.stopImmediatePropagation();document.querySelector('#foot').textContent='Review blocked · Resolve availability first'}},true);
document.querySelectorAll('nav button,#form,#yaml').forEach(b=>b.addEventListener('click',()=>{if(unavailable)document.querySelector('#review').disabled=true}));
document.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const nodes=[...document.querySelector('dialog').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea')].filter(n=>!n.hidden&&n.getClientRects().length);let first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.querySelector('#yaml').addEventListener('click',()=>{if(locked){main.innerHTML='<h2>Execution Source</h2><div class="warn">Original source is not loaded in this fixture. Do not reconstruct or edit a generated execution.</div>'}});
if(completed)document.querySelector('#owner')?.remove();
function watchOwnerFixture(){if(generated&&q.get('owner')==='WatchOperation'){let warning=main.querySelector('.warn');if(warning)warning.textContent='Owner: WatchOperation watch-preview. Change its template for future runs.';let owner=main.querySelector('#owner');if(owner)owner.onclick=()=>{main.innerHTML='<h2>Owner reference · Synthetic fixture</h2><div class="box">ops.crossplane.io/v1alpha1<br>WatchOperation / watch-preview<br>controller: true</div><div class="warn">Inspect-only. No owner or execution is changed.</div>'}}}
watchOwnerFixture();document.querySelectorAll('nav button,#form').forEach(b=>b.addEventListener('click',watchOwnerFixture));
</script></html>
