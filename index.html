<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flux source editor · design preview</title><style>:root{color-scheme:dark;font:13px system-ui;background:#111318;color:#dde2eb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#20242d;border:1px solid #414957;border-radius:5px;min-height:32px;padding:6px 9px}button{cursor:pointer}button:hover{background:#303848}:focus-visible{outline:2px solid #9cafff;outline-offset:2px}header.fixture{height:76px;padding:18px 24px;color:#a6afbe;display:flex;gap:12px;align-items:center}.frame{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 100px));margin:0 auto;border:1px solid #424958;border-radius:10px;background:#191c23;display:flex;flex-direction:column;box-shadow:0 20px 80px #0007}.top{padding:16px 24px;border-bottom:1px solid #333a46;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 5px}small,.muted{color:#9ca8bb}.body{display:flex;flex:1;min-height:0}nav{width:180px;padding:20px 12px;border-right:1px solid #333a46;flex-shrink:0}nav button{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent;border-color:transparent}nav button.active{background:#30394e;color:#c9d6ff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.wide{grid-column:1/-1}label{font-weight:500}input,select{width:100%}h2{font-size:14px;margin:0 0 18px}h3{font-size:13px;margin:24px 0 12px}.help{min-height:22px;padding:0 6px;margin-left:5px;color:#b5c5ee}footer{padding:14px 24px;border-top:1px solid #333a46;display:flex;align-items:center;gap:10px}footer span{flex:1;color:#aeb8c8}.primary{background:#8fa8f4;color:#101723;border-color:#8fa8f4}.notice{padding:10px 12px;border:1px solid #7d6740;background:#332b1e;border-radius:
