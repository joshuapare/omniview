};let current='VirtualService',mode='form',drafts={},sourceText={},reviewing=false;const $=x=>document.getElementById(x);function draft(){return drafts[current]??=Object.fromEntries([['metadata.name','preview-'+current.toLowerCase()],...kinds[current].fields.map(f=>[f[1],f[2]])])}function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}function field(label,path,value,type){let wrap=el('label',label);let input;if(Array.isArray(type)){input=el('select','');type.forEach(v=>input.add(new Option(v,v)));input.value=value}else{input=el('input','');input.type=type==='number'?'number':'text';input.value=value}input.name=path;input.autocomplete='off';input.setAttribute('aria-label',label);input.oninput=()=>{draft()[path]=input.value;sourceText[current]=null; $('footerstate').textContent='Unsaved local draft'};wrap.append(input);let hint=el('small',path);wrap.append(hint);return wrap}function source(){let d=draft();return '# Local mock source; exact text retained until form edits\n'+JSON.stringify({apiVersion:'networking.istio.io/'+kinds[current].v,kind:current,metadata:{name:d['metadata.name'],namespace:'preview'},ownedFields:d},null,2)}function render(){let k=kinds[current],life=$('lifecycle').value;$('version').textContent=k.v;$('title').textContent=(life==='Generated'?'Inspect ':life+' ')+current;$('nav').replaceChildren();Object.keys(kinds).forEach(n=>{let b=el('button',n);b.className=n===current?'active':'';b.onclick=()=>{current=n;mode='form';reviewing=false;render()};$('nav').append(b)});let m=$('main');m.replaceChildren();m.append(el('h2',reviewing?'Review Local Changes':k.subtitle));$('review').disabled=['Generated','Denied','Unavailable'].includes(life);if(['Denied','Unavailable'].includes(life)){m.append(el('div',life==='Denied'?'Access denied · Request permission for this namespaced resource. Draft remains local.':'API unavailable · Install/discover Istio CRDs before authoring. No fallback version selected.'));return}if(life==='Generated'){m.append(Object.assign(el('div',current==='WorkloadEntry'?'Automatically registered WorkloadEntry · Controller-owned. Edit and Create are unavailable.':'Controller-owned preview · Inspect only. No ownership override.'),{className:'warning'}));m.append(el('pre','Owner: WorkloadGroup / preview-vm\nAddress: 192.0.2.20\nRegistration: synthetic fixture\nStatus: not evaluated'));return}if(reviewing){m.append(Object.assign(el('div',k.consequence),{className:'warning'}));m.append(el('p','Destination: preview-cluster / preview · '+current+' / '+draft()['metadata.name']));m.append(el('pre',Object.entries(draft()).map(([p,v])=>p+' → '+v).join('\n')));m.append(el('small','Non-mutating review. No Apply request exists in this prototype.'));return}if(mode==='source'){m.append(Object.assign(el('div','Expert source scratchpad · Form projection is limited. Modified source stays intact; form edits disabled until source is restored.'),{className:'warning'}));let t=el('textarea','');t.id='sourcearea';t.setAttribute('aria-label','Expert source scratchpad');t.spellcheck=false;t.value=sourceText[current]??source();t.oninput=()=>{sourceText[current]=t.value;$('footerstate').textContent='Source retained verbatim · Form locked'};m.append(t);return}if(sourceText[current]!=null){m.append(el('div','Source changed. Return to Source; unsupported text is preserved without conversion.'));return}let grid=el('div','');grid.className='grid';let name=field('Name *','metadata.name',draft()['metadata.name']);name.querySelector('input').disabled=life==='Edit';grid.append(name,field('Namespace','metadata.namespace','preview'));grid.lastChild.querySelector('input').disabled=true;k.fields.forEach(f=>grid.append(field(f[0],f[1],draft()[f[1]],f[3])));m.append(grid);if(k.rows){let sec=el('section','');sec.append(el('h2',k.rows));let rows=el('div','');rows.id='rows';let add=el('button','+ Add '+k.rows.toLowerCase().replace(/s$/,''));add.onclick=()=>{let r=el('div','');r.className='row';let inp=el('input','');i <script>
// Structured JSON is valid Kubernetes source; arbitrary source remains a locked scratchpad.
source = function(){
 const object={apiVersion:'networking.istio.io/'+kinds[current].v,kind:current,metadata:{name:draft()['metadata.name'],namespace:'preview'},spec:{}};
 for(const [path,value] of Object.entries(draft())){
  if(path==='metadata.name'||value==='')continue;
  const parts=path.replace(/\[(\d+)\]/g,'.$1').split('.');
  let node=object;
  for(let i=0;i<parts.length-1;i++){const key=parts[i];node=node[key]??=(/^\d+$/.test(parts[i+1])?[]:{});}
  const definition=kinds[current].fields.find(f=>f[1]===path);
  node[parts.at(-1)]=definition?.[3]==='number'?Number(value):path.endsWith('.patch.value')?JSON.parse(value):value;
 }
 return JSON.stringify(object,null,2);
};
const rowSpecs={
 VirtualService:[['Destination host','spec.http[0].route[{i}].destination.host',''],['Subset','spec.http[0].route[{i}].destination.subset',''],['Weight (%)','spec.http[0].route[{i}].weight','0','number']],
 DestinationRule:[['Subset name','spec.subsets[{i}].name',''],['Version label','spec.subsets[{i}].labels.version','']],
 Gateway:[['Server port','spec.servers[{i}].port.number','8080','number'],['Port name','spec.servers[{i}].port.name',''],['Protocol','spec.servers[{i}].port.protocol','HTTP',['HTTP','HTTPS','TCP','TLS']],['Allowed host','spec.servers[{i}].hosts[0]','']],
 ServiceEntry:[['Endpoint address','spec.endpoints[{i}].address','']],
 Sidecar:[['Egress host','spec.egress[0].hosts[{i}]','']],
 WorkloadGroup:[['Port name','portName',''],['Port number','portValue','8080','number']],
 EnvoyFilter:[['Apply to','spec.configPatches[{i}].applyTo','HTTP_FILTER',['HTTP_FILTER','NETWORK_FILTER','CLUSTER']],['Operation','spec.configPatches[{i}].patch.operation','MERGE',['MERGE','ADD','REMOVE']],['Patch value (JSON object)','spec.configPatches[{i}].patch.value','{}']]
};
const addedRows={};
const baseRender=render;
render=function(){
 baseRender();
 const rows=$('rows');if(!rows)return;
 const specs=rowSpecs[current];if(!specs)return;
 function showRows(){
 rows.replaceChildren();
 for(const index of addedRows[current]??[]){
  const group=el('div','');group.className='grid';group.style.marginBottom='16px';
  specs.forEach(f=>{const path=f[1].replace('{i}',index);group.append(field(f[0],path,draft()[path]??f[2],f[3]));});
  let remove=el('button','Remove Row');remove.onclick=()=>{addedRows[current]=addedRows[current].filter(i=>i!==index);specs.forEach(f=>delete draft()[f[1].replace('{i}',index)]);showRows()};group.append(remove);rows.append(group);
 }
 }
 rows.nextSibling.onclick=()=>{const list=addedRows[current]??=[];const i=Math.max(0,...list)+1;list.push(i);for(const f of specs)draft()[f[1].replace('{i}',i)]=f[2];showRows()};
 showRows();
};
const baseReview=$('review').onclick;
$('review').onclick=()=>{
 if(current==='VirtualService'){
  const sum=Object.entries(draft()).filter(([p])=>/^spec.http\[0\].route\[\d+\].weight$/.test(p)).reduce((a,[,v])=>a+Number(v),0);
  if(sum!==100){$('error').textContent='Destination weights must total 100. Current total: '+sum;return}
 }
 if(current==='EnvoyFilter'){try{JSON.parse(draft()['spec.configPatches[0].patch.value'])}catch{$('error').textContent='Patch value must be valid JSON.';return}}
 baseReview();
};
render();
</script>
<script>
// Map rows use a fixed, explicit port key in this compact design.
rowSpecs.WorkloadGroup=[['Metrics port','spec.template.ports.metrics','9090','number']];
const priorSource=source;
source=function(){
 const obj=JSON.parse(priorSource());
 for(const [path,value] of Object.entries(draft())){
  if(!/\.weight$|\.port.number$|\.ports\.[^.]+$/.test(path)||value==='')continue;
  const parts=path.replace(/\[(\d+)\]/g,'.$1').split('.');let n=obj;
  for(let i=0;i<parts.length-1;i++)n=n[parts[i]];
  n[parts.at(-1)]=Number(value);
 }
 if(current==='Gateway'&&obj.spec.servers?.[0]?.port?.protocol==='HTTP')delete obj.spec.servers[0].tls;
 return JSON.stringify(obj,null,2);
};
$('review').onclick=()=>{
 if(mode==='source'||sourceText[current]!=null){$('footerstate').textContent='Unsupported source remains intact; review unavailable';return}
 let message='';const d=draft();
 if(!d['metadata.name'])message='Enter a resource name.';
 if(current==='VirtualService'){
 const sum=Object.entries(d).filter(([p])=>/^spec.http\[0\].route\[\d+\].weight$/.test(p)).reduce((a,[,v])=>a+Number(v),0);
 if(sum!==100)message='Destination weights must total 100. Current total: '+sum;
 }
 for(const [path,value] of Object.entries(d)){
  if(/\.port.number$|\.ports\.[^.]+$/.test(path)&&(!(Number(value)>0)||Number(value)>65535))message='Enter a port from 1–65535.';
 }
 if(current==='EnvoyFilter'){
  if(!$('compat')?.checked)message='Confirm compatibility review before continuing.';
  try{JSON.parse(d['spec.configPatches[0].patch.value'])}catch{message='Patch value must be valid JSON.'}
 }
 if(message){$('error').textContent=message;$('error').scrollIntoView({block:'nearest'});return}
 reviewing=true;render();
};
window.addEventListener('beforeunload',e=>{if(Object.keys(drafts).length){e.preventDefault();e.returnValue=''}});
</script>
<script>
// Persist only explicit view preference. Never store resource drafts.
const rowsRender=render;
render=function(){

  b.onclick=()=>{current=b.textContent;mode=localStorage.getItem('istio-mock-view')==='source'?'source':'form';reviewing=false;render()};
 }
 const generated=Array.from($('lifecycle').options).find(option=>option.value==='Generated');
 generated.disabled=current!=='WorkloadEntry';
 if($('lifecycle').value==='Generated')$('main').querySelector('h2').textContent='Registered Workload Inspection';
};
$('source').onclick=()=>{mode='source';localStorage.setItem('istio-mock-view','source');reviewing=false;render()};
$('form').onclick=()=>{mode='form';localStorage.setItem('istio-mock-view','form');reviewing=false;render()};
mode=localStorage.getItem('istio-mock-view')==='source'?'source':'form';
render();
</script>
