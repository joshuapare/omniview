<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="theme-color" content="#101112"><title>CRD editor · design preview</title><style>
:root{color-scheme:dark;font:13px system-ui;color:#e6e7ea;background:#101112}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#191b1f;border:1px solid #41454e;border-radius:5px}button{cursor:pointer;padding:6px 12px;min-height:32px}button:hover{background:#343942}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #93b4ff;outline-offset:2px}input,select{height:32px;padding:5px 9px;width:100%}textarea{padding:12px;width:100%;resize:vertical;font:12px/1.6 ui-monospace,monospace}label{display:block;color:#bdc3ce;margin:12px 0 6px}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 18px}h3{font-size:13px;margin:18px 0 8px}.outer{padding:18px 28px;color:#8f97a4;display:flex;justify-content:space-between;align-items:center}.frame{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 110px));margin:18px auto;background:#202226;border:1px solid #3a3e46;border-radius:10px;display:flex;flex-direction:column;box-shadow:0 24px 90px #0008}.top{padding:18px 24px;border-bottom:1px solid #383c44;display:flex;align-items:center;justify-content:space-between}.sub{font-size:12px;color:#a1a8b5;margin-top:7px}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:16px 10px;border-right:1px solid #383c44}nav button{display:block;width:100%;text-align:left;border:0;background:none;margin:3px 0;color:#aeb5c1}nav button.active{background:#303c55;color:#c4d7ff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}footer{padding:14px 24px;border-top:1px solid #383c44;display:flex;align-items:center;justify-content:space-between}.primary{background:#4474ce;border-color:#638ee0;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.notice{border:1px solid #6f5a31;background:#3b3224;color:#ecd0a0;padding:10px 12px;border-radius:5px;margin:12px 0}.muted{color:#9ba3b0;font-size:12px}.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row input[type=checkbox],.row input[type=radio]{width:16px;height:16px}.row label{margin:0}.card{padding:12px;border:1px solid #41454e;border-radius:6px;margin:12px 0}.pill{color:#a6c0f2;border:1px solid #465773;border-radius:12px;padding:3px 9px;font-size:11px}.error{color:#ffb3b3;margin:8px 0}.help{padding:0;width:22px;min-height:22px;border-radius:50%;margin-left:6px}.popover{position:fixed;z-index:5;top:170px;right:max(28px,calc((100vw - 900px)/2));width:300px;padding:16px;background:#303641;border:1px solid #6d7f9e;border-radius:7px;box-shadow:0 10px 30px #0009;line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace}.toolbar{display:flex;gap:6px}.locked{opacity:.65}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #3b4049}@media(max-width:650px){nav{width:128px}.grid{grid-template-columns:1fr}.top,main,footer{padding:14px}.outer{padding:10px;font-size:11px}.frame{margin:8px auto}.top{gap:8px}h1{font-size:14px}}
@media(max-width:900px){.frame{height:calc(100dvh - 160px);margin:8px auto}.outer{min-height:100px;gap:20px}}
</style><body><div class="outer"><span>OMNIVIEW / API Extensions</span><span>Synthetic fixtures · isolated HTML mock · no cluster requests <button id="fixture">Load sample</button> <button id="edit">Edit sample</button></span></div><section class="frame" role="dialog" aria-modal="true" aria-labelledby="title"><header class="top"><div><h1 id="title">Create CustomResourceDefinition</h1><div class="sub">preview-cluster <span aria-hidden="true">/</span> Cluster-scoped · apiextensions.k8s.io/v1</div></div><div class="toolbar"><button id="form">Form</button><button id="yaml">YAML</button></div></header><div class="body"><nav aria-label="Editor sections"></nav><main id="main"></main></div><footer><span id="foot" class="muted">Draft only · no API requests</span><div class="toolbar"><button id="back" hidden>Back to draft</button><button id="review" class="primary">Review draft</button></div></footer></section><div id="help" class="popover" role="tooltip" hidden></div><script>
const $=s=>document.querySelector(s),sections=['Names & scope','Versions & schema','Conversion','Subresources','Columns & selectors','Status & ownership','Availability'];let section=0,mode='form',editing=false,raw=null,review=false,error='',helpOpener;let d={group:'',plural:'',kind:'',singular:'',short:'',categories:'',scope:'Namespaced',versions:[{name:'',served:true,storage:true,schema:'{\n  "type": "object"\n}'}],strategy:'None',endpoint:'Service',namespace:'',service:'',path:'',port:'',url:'',reviews:'',status:false,scale:false,specPath:'',statusPath:'',selector:'',columns:[],fields:[]};const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const input=(key,label,value=d[key],locked=false)=>`<div><label for="${key}">${label}</label><input autocomplete="off" spellcheck="false" id="${key}" name="${key}" data-key="${key}" value="${escape(value)}" ${locked?'disabled':''}></div>`;const help=(text)=>`<button class="help" data-help="${escape(text)}" aria-label="More information">?</button>`;
function sample(edit=false){editing=edit;raw=null;review=false;d={...d,group:'preview.example.org',plural:'widgets',kind:'Widget',singular:'widget',short:'wdg',categories:'',scope:'Namespaced',versions:[{name:'v1',served:true,storage:true,schema:'{\n  "type": "object",\n  "properties": {\n    "spec": {"type": "object", "properties": {"replicas": {"type": "integer"}}},\n    "status": {"type": "object", "properties": {"replicas": {"type": "integer"}, "selector": {"type": "string"}}}\n  }\n}'}],namespace:'preview-system',service:'widget-converter',path:'/convert',port:'',reviews:'v1',status:true,specPath:'.spec.replicas',statusPath:'.status.replicas',selector:'.status.selector'};section=0;mode='form';render()}
function manifest(){let versions=d.versions.map(v=>({name:v.name,served:v.served,storage:v.storage,schema:{openAPIV3Schema:JSON.parse(v.schema)},...(v.deprecated?{deprecated:true,...(v.warning?{deprecationWarning:v.warning}:{})}:{}),...(d.status||d.scale?{subresources:{...(d.status?{status:{}}:{}),...(d.scale?{scale:{specReplicasPath:d.specPath,statusReplicasPath:d.statusPath,...(d.selector?{labelSelectorPath:d.selector}:{})}}:{})}}:{}),...(d.columns.length?{additionalPrinterColumns:d.columns}:{}),...(d.fields.length?{selectableFields:d.fields.map(jsonPath=>({jsonPath}))}:{})}));return '# Synthetic CRD draft; no mutation\n'+JSON.stringify({apiVersion:'apiextensions.k8s.io/v1',kind:'CustomResourceDefinition',metadata:{name:d.plural+'.'+d.group},spec:{group:d.group,names:{plural:d.plural,kind:d.kind,...(d.singular?{singular:d.singular}:{}),...(d.short?{shortNames:d.short.split(',').map(s=>s.trim())}:{}),...(d.categories?{categories:d.categories.split(',').map(s=>s.trim())}:{})},scope:d.scope,versions,conversion:{strategy:d.strategy,...(d.strategy==='Webhook'?{webhook:{conversionReviewVersions:d.reviews.split(',').filter(Boolean),clientConfig:d.endpoint==='Service'?{service:{namespace:d.namespace,name:d.service,...(d.path?{path:d.path}:{}),...(d.port?{port:Number(d.port)}:{})}}:{url:d.url}}}:{})}}},null,2)}
function validate(){if(raw!==null)return 'Source-only draft: structural and server validation required. Source remains intact.';if(!d.group||!d.plural||!d.kind){section=0;return 'Enter API group, plural name, and kind.'}if(!/^[a-z0-9]+([.-][a-z0-9]+)*$/.test(d.group)||!/^[a-z][a-z0-9-]*$/.test(d.plural)){section=0;return 'Use a DNS group and lowercase plural name.'}if(d.versions.some(v=>!v.name)||new Set(d.versions.map(v=>v.name)).size!==d.versions.length||d.versions.filter(v=>v.storage).length!==1||!d.versions.some(v=>v.served)){section=1;return 'Use unique version names, at least one served version, and exactly one storage version.'}try{for(const v of d.versions)if(JSON.parse(v.schema).type!=='object')throw 0}catch{section=1;return 'Enter a JSON schema with root type object. Full structural validation remains server-side.'}if(d.strategy==='Webhook'&&(!d.reviews|| (d.endpoint==='Service'?(!d.namespace||!d.service):!/^https:\/\/[^?#@]+$/.test(d.url)))){section=2;return 'Choose a service or HTTPS URL without credentials, query, or fragment; enter review versions.'}if(d.scale&&(!/^\.spec\.[\w.]+$/.test(d.specPath)||!/^\.status\.[\w.]+$/.test(d.statusPath))){section=3;return 'Use dot paths under .spec and .status without arrays.'}return ''}
function render(){ $('#title').textContent=(editing?'Edit':'Create')+' CustomResourceDefinition';$('nav').innerHTML=sections.map((s,i)=>`<button data-section="${i}" class="${section===i?'active':''}" aria-current="${section===i?'page':'false'}">${s}</button>`).join('');$('#back').hidden=!review;$('#review').hidden=review;let html='';if(review){html=`<h2>Review API definition</h2><span class="pill">Non-mutating preview</span><div class="notice">Changes affect every custom resource using this API. Schema pruning can remove fields; conversion failures can block reads and writes.</div><table><tr><th>Destination</th><td>preview-cluster · cluster scope</td></tr><tr><th>API</th><td>${escape(d.group)} / ${escape(d.kind)}</td></tr><tr><th>Storage</th><td>${escape(d.versions.find(v=>v.storage)?.name)} · migration not performed</td></tr><tr><th>Conversion</th><td>${d.strategy} · availability not tested</td></tr></table><h3>Draft source</h3><pre>${escape(manifest())}</pre>`}else if(mode==='yaml'){let text=raw??(()=>{try{return manifest()}catch{return '# Schema JSON invalid. Return to Form to repair.'}})();html=`<h2>YAML source ${help('JSON is valid YAML. This isolated mock uses JSON syntax for structured authoring. Any manual source edit retains exact text and makes Form read-only; no lossless parser is claimed.')}</h2><div class="notice">Manual edits remain source-only. No import, parsing, or submission occurs.</div><label for="source">Single draft source</label><textarea id="source" rows="22" spellcheck="false">${escape(text)}</textarea>`}else if(raw!==null){html='<h2>Source-only draft</h2><div class="notice">Form cannot safely represent edited source. Return to YAML; your exact text remains intact.</div>'}else {html=`<h2>${sections[section]}</h2>`;if(section===0)html+=`<div class="grid">${input('group','API group *',d.group,editing)}${input('plural','Plural name *',d.plural,editing)}${input('kind','Kind *',d.kind,editing)}<div><label for="scope">Custom resource scope ${help('The CRD itself is always cluster-scoped. This choice controls its instances. Scope and kind are locked after Established; group and plural are always immutable.')}</label><select id="scope" data-key="scope" ${editing?'disabled':''}><option ${d.scope==='Namespaced'?'selected':''}>Namespaced</option><option ${d.scope==='Cluster'?'selected':''}>Cluster</option></select></div>${input('singular','Singular name (optional)')}${input('short','Short names (comma-separated)')}${input('categories','Categories (comma-separated)')}</div><h3>Definition name</h3><code>${escape(d.plural||'plural')}.${escape(d.group||'group')}</code>${editing?'<div class="notice">Established fixture: identity, kind, and scope locked. No delete/recreate shortcut.</div>':''}`;
if(section===1)html+=`<div class="muted">Exactly one storage version. Schema controls apply per version.</div>${d.versions.map((v,i)=>`<div class="card"><div class="row"><label for="vn${i}">Version</label><input id="vn${i}" data-v="${i}" data-prop="name" value="${escape(v.name)}"><button data-remove="${i}" ${editing&&i===0?'disabled':''}>Remove</button></div><div class="row"><input id="sv${i}" type="checkbox" data-v="${i}" data-prop="served" ${v.served?'checked':''}><label for="sv${i}">Served</label><input id="st${i}" type="radio" name="storage" data-storage="${i}" ${v.storage?'checked':''}><label for="st${i}">Storage</label><input id="dp${i}" type="checkbox" data-v="${i}" data-prop="deprecated" ${v.deprecated?'checked':''}><label for="dp${i}">Deprecated</label></div>${v.deprecated?`<label for="dw${i}">Deprecation warning</label><input id="dw${i}" data-v="${i}" data-prop="warning" value="${escape(v.warning||'')}">`:''}<label for="schema${i}">Structural schema · JSON ${help('Advanced editor preserves exact schema text across navigation. Defaults, CEL, list semantics, and unknown-field preservation require full structural validation in production. No inferred schema is generated.')}</label><textarea id="schema${i}" rows="7" spellcheck="false" data-v="${i}" data-prop="schema">${escape(v.schema)}</textarea></div>`).join('')}<button id="add-version">+ Add version</button>${editing?'<div class="notice">v1 remains in status.storedVersions. Removal blocked; changing storage does not migrate existing objects.</div>':''}`;
if(section===2)html+=`<label for="strategy">Conversion strategy ${help('None only changes apiVersion; it does not translate incompatible schemas. Webhook requires a separately installed service and supported ConversionReview versions. ConversionReview is protocol, not a resource to create.')}</label><select id="strategy" data-key="strategy"><option ${d.strategy==='None'?'selected':''}>None</option><option ${d.strategy==='Webhook'?'selected':''}>Webhook</option></select>${d.strategy==='Webhook'?`<div class="notice">Webhook failure can block API reads and writes. No endpoint or trust validation is performed.</div><label for="endpoint">Endpoint kind</label><select id="endpoint" data-key="endpoint"><option ${d.endpoint==='Service'?'selected':''}>Service</option><option ${d.endpoint==='URL'?'selected':''}>URL</option></select>${d.endpoint==='Service'?`<div class="grid">${input('namespace','Service namespace *')}${input('service','Existing Service name *')}${input('path','Path (optional)')}${input('port','Service port (omit for API default 443)')}</div>`:input('url','HTTPS URL *')}${input('reviews','ConversionReview versions · ordered, comma-separated *')}<h3>CA bundle</h3><span class="pill">Omitted · API server system roots</span><div class="muted">Sensitive source/import editing not exposed in this mock.</div>`:''}`;
if(section===3)html+=`<div class="row"><input id="status" type="checkbox" data-key="status" ${d.status?'checked':''}><label for="status">Expose /status</label>${help('Declares the custom resource status endpoint. Does not edit CRD status or install a controller.')}</div><div class="row"><input id="scale" type="checkbox" data-key="scale" ${d.scale?'checked':''}><label for="scale">Expose /scale</label></div>${d.scale?`${input('specPath','Desired replicas path *')}${input('statusPath','Observed replicas path *')}${input('selector','Selector string path (needed by HPA)')}<div class="notice">Paths must match each version’s schema. No scaler or workload is installed.</div>`:''}<div class="muted">Declarations apply to all shown versions. Imported per-version differences require source-only editing.</div>`;
if(section===4)html+=`<h3>Printer columns</h3>${d.columns.map((c,i)=>`<div class="card grid">${['name','type','jsonPath','format','description','priority'].map(k=>`<div><label for="col${i}${k}">${k}</label><input id="col${i}${k}" data-col="${i}" data-prop="${k}" value="${escape(c[k]??'')}"></div>`).join('')}<button data-rcol="${i}">Remove column</button></div>`).join('')}<button id="add-column">+ Add column</button><h3>Selectable fields ${help('Maximum eight simple dot paths to string, boolean, or integer fields; no metadata or arrays. CustomResourceFieldSelectors applicability must be checked against installed API support.')}</h3>${d.fields.map((f,i)=>`<div class="row"><input aria-label="Selectable path ${i+1}" data-field="${i}" value="${escape(f)}"><button data-rfield="${i}">Remove</button></div>`).join('')}<button id="add-field" ${d.fields.length>=8?'disabled':''}>+ Add selectable field</button>`;
if(section===5)html+=`<span class="pill">Read-only · synthetic ${editing?'existing':'not created'}</span><table><tr><th>Manager</th><td>${editing?'preview-gitops · spec owned':'No owner yet'}</td></tr><tr><th>Established</th><td>${editing?'True · fixture only':'Not available before creation'}</td></tr><tr><th>Accepted names</th><td>${editing?'widgets / Widget':'Not available'}</td></tr><tr><th>Stored versions</th><td>${editing?'v1':'Not available'}</td></tr><tr><th>Observed generation</th><td>Unavailable · gate-dependent</td></tr></table><div class="notice">Respect external ownership. Review changes in the owning Git repository; no force ownership or status write is offered.</div>`;
if(section===6)html+=`<label for="availability">Capability fixture</label><select id="availability"><option>Available</option><option>Discovery missing</option><option>Create denied</option><option>Update denied</option><option>Service lookup denied</option><option>Service lookup unavailable</option><option>Service lookup empty</option><option>Unsupported API version</option></select><div id="availability-message" class="notice">Discovery does not prove permission. No live authorization was checked.</div>`;}
$('#main').innerHTML=(error?`<div class="error" role="alert">${escape(error)}</div>`:'')+html;$('#foot').textContent=raw!==null?'Source retained verbatim · Form unavailable':'Draft only · no API requests';bind();}
function bind(){document.querySelectorAll('[data-key]').forEach(e=>e.oninput=()=>{d[e.dataset.key]=e.type==='checkbox'?e.checked:e.value;if(['strategy','endpoint','status','scale'].includes(e.dataset.key))render()});document.querySelectorAll('[data-v]').forEach(e=>e.oninput=()=>{d.versions[e.dataset.v][e.dataset.prop]=e.type==='checkbox'?e.checked:e.value;if(e.dataset.prop==='deprecated')render()});document.querySelectorAll('[data-storage]').forEach(e=>e.onchange=()=>{d.versions.forEach((v,i)=>v.storage=i===+e.dataset.storage);render()});document.querySelectorAll('[data-section]').forEach(e=>e.onclick=()=>{section=+e.dataset.section;review=false;error='';render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{d.versions.splice(+e.dataset.remove,1);render()});$('#add-version')?.addEventListener('click',()=>{d.versions.push({name:'',served:true,storage:false,schema:'{\n  "type": "object"\n}'});render()});$('#source')?.addEventListener('input',e=>{raw=e.target.value;$('#foot').textContent='Source retained verbatim · Form unavailable'});document.querySelectorAll('[data-help]').forEach(e=>{const show=()=>{helpOpener=e;$('#help').textContent=e.dataset.help;$('#help').hidden=false};e.onclick=show;e.onfocus=show;e.onmouseenter=show;e.onmouseleave=()=>{if(document.activeElement!==e)$('#help').hidden=true}});$('#availability')?.addEventListener('change',e=>{let v=e.target.value;$('#availability-message').textContent=({'Discovery missing':'API not discovered. Retain draft; no create available.','Create denied':'Create denied. Draft retained; review only.','Update denied':'Update denied. Existing source inspect only.','Service lookup denied':'Service list forbidden. Keep existing reference; do not treat as empty.','Service lookup unavailable':'Service lookup failed. Keep reference and retry outside this mock.','Service lookup empty':'No Services returned in fixture namespace. No companion is created.','Unsupported API version':'Unsupported version. Source-only fallback; no conversion or reset.'})[v]||'Discovery does not prove permission. No live authorization was checked.'});$('#add-column')?.addEventListener('click',()=>{d.columns.push({name:'',type:'string',jsonPath:''});render()});document.querySelectorAll('[data-col]').forEach(e=>e.oninput=()=>d.columns[e.dataset.col][e.dataset.prop]=e.dataset.prop==='priority'?Number(e.value):e.value);document.querySelectorAll('[data-rcol]').forEach(e=>e.onclick=()=>{d.columns.splice(+e.dataset.rcol,1);render()});$('#add-field')?.addEventListener('click',()=>{d.fields.push('');render()});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>d.fields[e.dataset.field]=e.value);document.querySelectorAll('[data-rfield]').forEach(e=>e.onclick=()=>{d.fields.splice(+e.dataset.rfield,1);render()});}
$('#fixture').onclick=()=>sample();$('#edit').onclick=()=>sample(true);$('#yaml').onclick=()=>{mode='yaml';review=false;localStorage.setItem('mock279-mode','yaml');render()};$('#form').onclick=()=>{mode='form';review=false;localStorage.setItem('mock279-mode','form');render()};$('#review').onclick=()=>{error=validate();review=!error;render();if(error)$('#main input:not([disabled]),#main textarea')?.focus()};$('#back').onclick=()=>{review=false;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#help').hidden){e.preventDefault();$('#help').hidden=true;helpOpener?.focus();$('#help').hidden=true}if(e.key==='Tab'){let controls=[...document.querySelectorAll('.frame button:not([hidden]):not([disabled]),.frame input:not([disabled]),.frame select:not([disabled]),.frame textarea')].filter(e=>e.getClientRects().length);if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus()}}});window.addEventListener('beforeunload',e=>{if(d.group||raw){e.preventDefault();e.returnValue=''}});mode=localStorage.getItem('mock279-mode')||'form';render();
</script></body></html>
