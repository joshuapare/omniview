<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>Core resource editor · design preview</title><style>:root{color-scheme:dark;--bg:#101112;--surface:#1f2125;--border:#393d45;--muted:#a1a8b4;--accent:#8aaeff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8ebf1;font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;background:#272a30;border:1px solid var(--border);border-radius:5px}button,input,select{height:32px;padding:0 10px}button{cursor:pointer}button:hover{background:#343943}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}.shell{padding:24px;color:var(--muted)}.preview{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.dialog{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 110px));margin:20px auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 24px 100px #0008;color:#e8ebf1}header,footer{padding:16px 24px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}h1{font-size:17px;margin:0}h2{font-size:14px;margin:0 0 16px}.muted,small{color:var(--muted)}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--border)}nav button{width:100%;text-align:left;margin-bottom:6px}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field small{font-size:11px;overflow-wrap:anywhere}.wide{grid-column:1/-1}.warning{border-left:3px solid #d6a553;background:#352e23;padding:10px 12px;margin:16px 0;line-height:1.5}.error{color:#ffabb0;margin:8px 0}.primary{background:#6689d7;color:#fff;border-color:#6689d7}footer{border-top:1px solid var(--border);border-bottom:0}.help{position:absolute;max-width:310px;padding:14px;background:#303641;border:1px solid #64718a;border-radius:6px;z-index:3;line-height:1.6}.row{display:flex;gap:8px;margin:8px 0}.row input{min-width:0;flex:1}textarea{width:100%;height:340px;padding:12px;resize:vertical;font:12px ui-monospace,monospace;line-height:1.7}dl{display:grid;grid-template-columns:180px 1fr;gap:16px}dd{margin:0}code{font-size:11px;overflow-wrap:anywhere}.badge{font-size:11px;border:1px solid #495265;border-radius:4px;padding:3px 7px;color:#b9cafa} @media(max-width:700px){.grid{grid-template-columns:1fr}nav{width:130px}header,footer{padding:12px}.dialog{height:calc(100vh - 100px)}main{padding:16px}.shell{padding:8px}dl{grid-template-columns:1fr}.preview{margin:4px}}</style><div class="shell">Omniview / Kubernetes / Core <span class="badge">ISOLATED DESIGN MOCK · SYNTHETIC FIXTURES · NO REQUESTS</span><div class="preview"><label>Resource <select id="kind"></select></label><label>Intent <select id="intent"><option>Create</option><option>Edit</option></select></label><label>Capability <select id="cap"><option>Available fixture</option><option>Denied</option><option>Unavailable</option><option>Missing API</option><option>Empty references</option><option>Controller owned</option></select></label></div></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><header><div><h1 id="title"></h1><small id="destination"></small></div><div><button id="form">Form</button> <button id="source">YAML</button> <button id="help" aria-label="Resource help" aria-expanded="false">?</button></div></header><div class="body"><nav><button data-section="Configuration">Configuration</button><button data-section="Labels">Labels</button><button data-section="Connections">Connections</button><button data-section="Review">Review</button></nav><main id="main"></main></div><footer><span id="foot" class="muted">Draft only · nothing will be sent</span><button id="review" class="primary">Review draft</button></footer></section><script>
let C,kind,intent='Create',mode='Form',section='Configuration',drafts={},raw={},manual={},helpOpen=false;const $=s=>document.querySelector(s),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function doc(){return drafts[kind]||(drafts[kind]={name:'',values:{},labels:[]})}function yaml(){let d=doc();return '# Synthetic design draft; no server validation\napiVersion: v1\nkind: '+kind+'\nmetadata:\n  name: '+JSON.stringify(d.name)+(C[kind].scope?'':'\n  namespace: preview')+'\n# Guided paths (prototype projection; not a submission document)\n'+Object.entries(d.values).map(([p,v])=>'# '+p+' = '+JSON.stringify(v)).join('\n')+'\n'+d.labels.map(r=>'# metadata.labels['+JSON.stringify(r[0])+'] = '+JSON.stringify(r[1])).join('\n')}
function render(){let c=C[kind],d=doc(),inspect=c.inspect||($('#cap').value==='Controller owned'&&c.conditional);$('#title').textContent=(inspect?'Inspect':intent)+' '+kind;$('#destination').textContent='preview-cluster / '+(c.scope?'Cluster scoped':'Namespace: preview')+' · core/v1';$('#form').textContent=inspect?'Inspect':'Form';$('#review').textContent=inspect?'Review action':'Review draft';let body='<h2>'+esc(section)+'</h2>';if(mode==='YAML'){body+='<div class="warning">Source fallback · exact raw text retained. Manual source edits disable guided Form. This prototype does not parse or submit YAML.</div><label class="field">Draft source<textarea id="yaml" spellcheck="false">'+esc(raw[kind]??yaml())+'</textarea></label>'}else if(manual[kind]){body+='<div class="warning">Guided Form unavailable for manually edited source. Return to YAML; your text is intact.</div>'}else if(['Denied','Unavailable','Missing API'].includes($('#cap').value)){body+='<div class="warning">'+esc($('#cap').value)+': no permission or API support inferred. Draft retained; review blocked.</div>'}else if(section==='Review'){body+='<div class="warning">Non-mutating review · '+esc(c.warning)+'</div><dl><dt>Destination</dt><dd>preview-cluster / '+(c.scope?'cluster':'preview')+'</dd><dt>Operation</dt><dd>'+esc(inspect?'Connection/action handoff only':intent+' draft')+'</dd><dt>Changes</dt><dd>'+Object.keys(d.values).length+' explicitly entered fields; status excluded</dd></dl><p class="muted">No API call, permission check, reconciliation or success claimed.</p>'}else if(section==='Connections'){body+='<div class="warning">Existing workflows only. Requests require explicit destination, verb, RBAC and consequence review.</div>';let a=c.actions||({ServiceAccount:['Review token request'],Namespace:['Review finalize request'],ReplicationController:['Open scale workflow'],PodTemplate:['Open Pod template editor']}[kind])||['Open related resources'];body+=a.map(t=>'<button class="action">'+t+'</button> ').join('');body+='<p class="muted">Pod binding, eviction, attach, exec, log, port-forward, proxy, ephemeral containers and resize remain existing workflow links. No protocol payload becomes a resource form.</p>'}else if(inspect){body+='<span class="badge">INSPECT ONLY</span><dl>'+(c.facts||[['Ownership','metadata.ownerReferences','Controller-owned fixture'],['Source','spec','Read-only; use owner workflow']]).map(r=>'<dt>'+esc(r[0])+'<br><code>'+r[1]+'</code></dt><dd>'+esc(r[2])+'</dd>').join('')+'</dl><div class="warning">'+esc(c.warning)+'</div>'}else if(section==='Labels'){body+='<div id="rows">'+d.labels.map((r,i)=>'<div class="row"><input aria-label="Label key '+i+'" data-row="'+i+'" data-col="0" value="'+esc(r[0])+'"><input aria-label="Label value '+i+'" data-row="'+i+'" data-col="1" value="'+esc(r[1])+'"><button data-remove="'+i+'" aria-label="Remove label '+i+'">Remove</button></div>').join('')+'</div><button id="add">Add label</button>'}else{body+='<div class="grid"><label class="field">Name *<input id="name" autocomplete="off" value="'+esc(d.name)+'" '+(intent==='Edit'?'disabled':'')+'><small>metadata.name · '+(intent==='Edit'?'immutable identity':'required')+'</small></label><label class="field">Namespace<input value="'+(c.scope?'Not applicable':'preview')+'" disabled><small>'+(c.scope?'Cluster scope':'metadata.namespace · fixed destination')+'</small></label>';for(let [label,path,options] of c.fields){let locked=intent==='Edit'&&kind==='PersistentVolume'&&['spec.nfs.server','spec.nfs.path','spec.volumeMode'].includes(path);let disabled=locked||($('#cap').value==='Empty references'&&options?.includes('registry-preview'));body+='<label class="field">'+label+(options?'<select data-path="'+path+'" '+(disabled?'disabled':'')+'>'+['',...options].map(v=>'<option '+(d.values[path]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':'<input autocomplete="off" data-path="'+path+'" value="'+esc(d.values[path]||'')+'" '+(disabled?'disabled':'')+'>')+'<small>'+esc(path)+(locked?' · immutable':'')+'</small></label>'}body+='</div><div class="warning">'+esc(c.warning)+'</div>';if(c.conditional)body+='<label><input id="ownership" type="checkbox" '+(d.owned?'checked':'')+'> Confirm '+(kind==='PersistentVolume'?'static administrator':kind==='Endpoints'?'manual selectorless Service':'standalone legacy')+' ownership</label>';if($('#cap').value==='Empty references')body+='<div class="warning">Reference lookup empty. No reference automatically selected.</div>'}$('#main').innerHTML=body;bind()}
function bind(){let d=doc();$('#name')?.addEventListener('input',e=>d.name=e.target.value);document.querySelectorAll('[data-path]').forEach(e=>e.oninput=()=>{d.values[e.dataset.path]=e.value;if(kind==='LimitRange'&&e.dataset.path==='spec.limits[0].type'){for(let x of document.querySelectorAll('[data-path]'))if(x.dataset.path.includes('.default'))x.disabled=e.value!=='Container'}});$('#ownership')?.addEventListener('change',e=>d.owned=e.target.checked);$('#yaml')?.addEventListener('input',e=>{raw[kind]=e.target.value;manual[kind]=true});$('#add')?.addEventListener('click',()=>{d.labels.push(['','']);render();document.querySelector('[data-row="'+(d.labels.length-1)+'"]').focus()});document.querySelectorAll('[data-row]').forEach(e=>e.oninput=()=>d.labels[e.dataset.row][e.dataset.col]=e.value);document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{d.labels.splice(+e.dataset.remove,1);render()});document.querySelectorAll('.action').forEach(e=>e.onclick=()=>{section='Review';render()})}
function review(){let c=C[kind],d=doc();if(!c.inspect&&mode!=='YAML'&&!manual[kind]&&(!d.name||(c.conditional&&!d.owned))){$('#main').insertAdjacentHTML('afterbegin','<div class="error" role="alert">'+(!d.name?'Enter a resource name.':'Confirm ownership before review.')+'</div>');$('#name')?.focus();return}if(['Denied','Unavailable','Missing API'].includes($('#cap').value))return;section='Review';mode='Form';render()}
function help(){if(helpOpen)return;helpOpen=true;$('#help').setAttribute('aria-expanded','true');let p=document.createElement('div');p.className='help';p.id='helpbox';p.setAttribute('role','tooltip');p.textContent=C[kind].warning+' Field paths below controls identify exact adapter ownership. Omit leaves a field absent; source-only fields remain outside this mock.';p.style.right='max(20px,calc((100vw - 950px)/2))';p.style.top='155px';document.body.append(p)}function dismiss(){helpOpen=false;$('#helpbox')?.remove();$('#help').setAttribute('aria-expanded','false')}
$('#help').onclick=()=>helpOpen?dismiss():help();$('#help').onmouseenter=help;$('#help').onfocus=help;document.addEventListener('keydown',e=>{if(e.key==='Escape'){dismiss();$('#help').focus();dismiss()}if(e.key==='Tab'){let nodes=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input:not(:disabled),.dialog select:not(:disabled),.dialog textarea')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}});$('#form').onclick=()=>{mode='Form';render()};$('#source').onclick=()=>{mode='YAML';render()};$('#intent').onchange=e=>{intent=e.target.value;if(intent==='Edit'&&!doc().name)doc().name='preview-'+kind.toLowerCase();render()};$('#cap').onchange=render;$('#review').onclick=review;document.querySelectorAll('[data-section]').forEach(e=>e.onclick=()=>{section=e.dataset.section;render()});fetch('config.json').then(r=>r.json()).then(c=>{C=c;$('#kind').innerHTML=Object.keys(C).map(k=>'<option>'+k+'</option>').join('');kind=new URLSearchParams(location.search).get('kind')||'Namespace';$('#kind').value=kind;$('#kind').onchange=e=>{kind=e.target.value;mode='Form';section='Configuration';dismiss();history.replaceState(null,'','?kind='+kind);render()};render()});
</script><style>.dialog{height:min(700px,calc(100vh - 170px));margin:10px auto}@media(max-width:700px){.dialog{height:calc(100vh - 190px)}}.field small{display:none}.field:focus-within small{display:block}#helpbox{font-size:12px}</style><script src="validation.js"></script></html>
