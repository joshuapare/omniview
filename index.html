<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEDA event subscriptions · design preview</title><style>:root{color-scheme:dark;font:13px system-ui;background:#101112;color:#eceef0}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#202226;border:1px solid #41444b;border-radius:5px;min-height:32px;padding:5px 10px}button{cursor:pointer}button:hover{background:#32363e}:focus-visible{outline:2px solid #91b8ff;outline-offset:2px}header{padding:16px 24px;border-bottom:1px solid #303238;color:#a9afb9}.fixture{margin:20px auto;width:min(1000px,96vw);display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#a9afb9}.frame{width:min(1000px,96vw);height:700px;max-height:calc(100vh - 135px);margin:0 auto;background:#191a1c;border:1px solid #3c4047;border-radius:10px;display:flex;flex-direction:column;overflow:hidden}.head{padding:18px 24px;border-bottom:1px solid #303238;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 5px}small,.muted{color:#a7adb8}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid #303238}nav button{width:100%;text-align:left;margin-bottom:6px;background:transparent;border:0}nav button.active,.selected{background:#293b57;color:#b9d4ff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0}h2{font-size:15px;margin:0 0 18px}label.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{padding:14px;border:1px solid #393d44;border-radius:6px;margin:12px 0}.check{display:flex;gap:9px;align-items:center;margin:9px 0}.check input{min-height:16px}.warn{background:#352c1d;border:1px solid #75603a;padding:10px 12px;border-radius:5px;margin-bottom:16px;color:#f5d79d}.error{color:#ffb4ae;margin:8px 0}.help{width:28px;min-height:25px;padding:1px;border-radius:50 in"></main></div><div class="foot"><span id="summary">Draft only · experimental API</span><button id="back">Back to draft</button><button class="primary" id="review">Review subscription</button></div></section><script>
const $=s=>document.querySelector(s), events=['keda.scaledobject.ready.v1','keda.scaledobject.failed.v1','keda.scaledobject.removed.v1','keda.scaledjob.ready.v1','keda.scaledjob.failed.v1','keda.scaledjob.removed.v1','keda.authentication.triggerauthentication.created.v1','keda.authentication.triggerauthentication.updated.v1','keda.authentication.triggerauthentication.removed.v1','keda.authentication.clustertriggerauthentication.created.v1','keda.authentication.clustertriggerauthentication.updated.v1','keda.authentication.clustertriggerauthentication.removed.v1'];let d,page='Destination',mode='Form',raw='',sourceChanged=false,reviewing=false,errors=false,tip=null;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){d={name:'',namespace:'preview',http:false,azure:false,uri:'',endpoint:'',authKind:'',authName:'',clusterName:'',included:[],excluded:[]};if($('#scenario').value!=='create'){Object.assign(d,{name:'event-delivery',http:true,uri:'https://events.example.invalid/keda',included:[events[1]],authKind:'ClusterTriggerAuthentication',authName:'preview-event-auth'})}page='Destination';mode='Form';raw='';sourceChanged=false;reviewing=false;errors=false;render()}
function source(){return '# Synthetic draft — no request sent\napiVersion: eventing.keda.sh/v1alpha1\nkind: '+$('#kind').value+'\nmetadata:\n  name: '+JSON.stringify(d.name)+'\n'+($('#kind').value==='CloudEventSource'?'  namespace: '+JSON.stringify(d.namespace)+'\n':'')+'spec:\n'+(d.clusterName?'  clusterName: '+JSON.stringify(d.clusterName)+'\n':'')+(d.authName?'  authenticationRef:\n    name: '+JSON.stringify(d.authName)+'\n'+(d.authKind?'    kind: '+d.authKind+'\n':''):'')+'  destination:\n'+(d.http?'    http:\n      uri: '+JSON.stringify(d.uri)+'\n':'')+(d.azure?'    azureEventGridTopic:\n      endpoint: '+JSON.stringify(d.endpoint)+'\n':'')+((d.included.length||d.excluded.length)?'  eventSubscription:\n'+['included','excluded'].map(k=>d[k].length?'    '+k+'EventTypes:\n'+d[k].map(x=>'    - '+x+'\n').join(''):'').join(''):'')}
const field=(label,key,type='text',disabled=false)=>'<label class="field">'+label+'<input autocomplete="off" spellcheck="false" type="'+type+'" data-key="'+key+'" value="'+escape(d[key])+'" '+(disabled?'disabled':'')+'></label>';function help(){return '<button class="help" aria-label="Help with event delivery" id="help">?</button>'}function render(){let s=$('#scenario').value,cluster=$('#kind').value==='ClusterCloudEventSource',locked=s!=='create';$('#title').textContent=(locked?'Edit ':'Create ')+$('#kind').value;$('#destination').textContent='preview-cluster / '+(cluster?'Cluster-wide':d.namespace||'Choose namespace')+' · eventing.keda.sh/v1alpha1';$('#form').className=mode==='Form'?'selected':'';$('#yaml').className=mode==='YAML'?'selected':'';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#review').disabled=['denied','missing','unavailable','managed'].includes(s)||sourceChanged;let h='';if(['denied','missing','unavailable','managed'].includes(s)){h='<h2>'+({denied:'Access denied',missing:'CloudEvent APIs not installed',unavailable:'Discovery unavailable',managed:'Managed by GitOps'}[s])+'</h2><div class="warn">'+({denied:'Create/update permission denied. Ask an administrator for access.',missing:'Install the matching KEDA CRDs through your administrator. No install action runs here.',unavailable:'Cannot verify schema or permissions. Draft remains local; review is unavailable.',managed:'Change the owning repository instead. Direct edits can be overwritten.'}[s])+'</div><button id="retry">Recheck fixture</button>'}else if(reviewing){h='<h2>Review subscription</h2><div class="warn">'+(cluster?'Cluster-wide KEDA events':'KEDA events in namespace '+escape(d.namespace))+' may be delivered to external endpoints. No test event or API request will be sent.</div><dl><dt>Operation</dt><dd>'+ (locked?'Update existing subscription':'Create subscription')+'</dd><dt>Destination</dt><dd>preview-cluster / '+(cluster?'Cluster scope':escape(d.namespace))+'</dd><dt>HTTP sink</dt><dd>'+escape(d.http?d.uri:'Not configured')+'</dd><dt>Event Grid sink</dt><dd>'+escape(d.azure?d.endpoint:'Not configured')+'</dd><dt>Authentication</dt><dd>'+escape(d.authName||'Not configured')+' · reference only</dd><dt>Included</dt><dd>'+escape(d.included.join(', ')||'All event types')+'</dd><dt>Excluded</dt><dd>'+escape(d.excluded.join(', ')||'None')+'</dd></dl><div class="box">Review only. Delivery, controller support and endpoint authorization are unverified.</div>'}else if(mode==='YAML'){h='<h2>Source draft</h2>'+(sourceChanged?'<div class="warn">Manual source preserved exactly. Form and review are locked; no parser or lossless round-trip is claimed.</div>':'')+'<label class="field">YAML<textarea id="source" spellcheck="false">'+escape(sourceChanged?raw:source())+'</textarea></label>'}else if(sourceChanged){h='<h2>Source-only draft</h2><div class="warn">Unsupported or invalid source stays intact. Return to YAML to repair it. No form changes can overwrite it.</div>'}else if(page==='Destination'){h='<div class="row"><h2>Deliver KEDA events</h2>'+help()+'</div><div class="grid">'+field('Name *','name','text',locked)+(cluster?'<div class="box">Cluster scope · no namespace</div>':field('Namespace *','namespace','text',locked))+'</div><span class="pill">Experimental · controller availability unverified</span><div class="box"><label class="check"><input type="checkbox" data-toggle="http" '+(d.http?'checked':'')+'>HTTP endpoint</label>'+(d.http?field('Sink URL *','uri','url'):'')+'</div><div class="box"><label class="check"><input type="checkbox" data-toggle="azure" '+(d.azure?'checked':'')+'>Azure Event Grid topic</label>'+(d.azure?field('Topic endpoint *','endpoint','url'):'')+'</div><div class="grid"><label class="field">Authentication scope<select id="authKind"><option value="">Not configured</option><option '+(d.authKind==='TriggerAuthentication'?'selected':'')+'>TriggerAuthentication</option><option '+(d.authKind==='ClusterTriggerAuthentication'?'selected':'')+'>ClusterTriggerAuthentication</option></select></label><label class="field">Existing reference<select id="authName"><option value="">Choose reference…</option>'+(s==='empty'?'':'<option '+(d.authName?'selected':'')+'>preview-event-auth</option>')+'</select></label></div>'+(s==='empty'?'<div class="warn">No references found in fixture scope. No companion authentication resource will be created.</div>':'')+(cluster&&d.authKind==='TriggerAuthentication'?'<div class="warn">Namespaced authentication resolution requires operator namespace context. Use source until verified.</div>':'')+(errors?'<div class="error" role="alert">Enter a name, a namespace when required, and at least one valid HTTP(S) sink. Event Grid requires an authentication reference.</div>':'')}else if(page==='Event filters'){h='<h2>Choose events</h2><div class="muted">No include selections = all types. Exclusions remove selected types.</div><div class="grid">'+['included','excluded'].map(k=>'<div><h3>'+ (k==='included'?'Include only':'Exclude')+'</h3>'+events.map((e,i)=>'<label class="check"><input type="checkbox" data-filter="'+k+'" value="'+e+'" '+(d[k].includes(e)?'checked':'')+'><code>'+e+'</code></label>').join('')+'</div>').join('')+'</div>'+(d.included.some(x=>d.excluded.includes(x))?'<div class="warn">Same type included and excluded. Exclusion takes precedence; remove overlap for clarity.</div>':'')}else if(page==='Advanced'){h='<h2>Source identity</h2>'+field('Cluster name override (optional)','clusterName')+'<div class="box">Unknown fields and metadata remain source-only in this bounded prototype.</div>'}else{h='<h2>Observed status</h2><div class="box">No controller observation available in this isolated fixture.</div><div class="muted">status.conditions is read-only. Schema discovery does not prove delivery.</div>'}$('#main').innerHTML=h;bind()}
function bind(){document.querySelectorAll('[data-key]').forEach(e=>e.oninput=()=>{d[e.dataset.key]=e.value;$('#destination').textContent='preview-cluster / '+($('#kind').value==='ClusterCloudEventSource'?'Cluster-wide':d.namespace)+' · eventing.keda.sh/v1alpha1'});document.querySelectorAll('[data-toggle]').forEach(e=>e.onchange=()=>{d[e.dataset.toggle]=e.checked;render()});document.querySelectorAll('[data-filter]').forEach(e=>e.onchange=()=>{let a=d[e.dataset.filter];e.checked?a.push(e.value):a.splice(a.indexOf(e.value),1);render()});if($('#authKind'))$('#authKind').onchange=e=>{d.authKind=e.target.value;d.authName='';render()};if($('#authName'))$('#authName').onchange=e=>d.authName=e.target.value;if($('#source'))$('#source').oninput=e=>{raw=e.target.value;sourceChanged=true;$('#review').disabled=true};if($('#retry'))$('#retry').onclick=()=>render();if($('#help')){let e=$('#help');const open=()=>{if(tip)return;tip=document.createElement('div');tip.className='tip';tip.role='tooltip';tip.textContent='Subscriptions deliver KEDA events, not emitted-event records. HTTP and Event Grid may coexist. Authentication references never expose resolved secrets.';e.after(tip)};e.onclick=open;e.onfocus=open;e.onmouseenter=open;e.onmouseleave=()=>{if(document.activeElement!==e&&tip){tip.remove();tip=null}}}}
$('#kind').onchange=reset;$('#scenario').onchange=reset;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;reviewing=false;render()});$('#yaml').onclick=()=>{mode='YAML';reviewing=false;render()};$('#form').onclick=()=>{mode='Form';reviewing=false;render()};$('#back').onclick=()=>{reviewing=false;render()};$('#review').onclick=()=>{let okurl=v=>{try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password&&!u.search&&!u.hash}catch{return false}};errors=!d.name||($('#kind').value==='CloudEventSource'&&!d.namespace)||(!d.http&&!d.azure)||(d.http&&!okurl(d.uri))||(d.azure&&(!okurl(d.endpoint)||!d.authName));if(errors){page='Destination';mode='Form';render();$('#main input:not(:disabled)')?.focus()}else{reviewing=true;render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tip){tip.remove();tip=null;$('#help')?.focus();e.preventDefault()}});reset();
// Persist only explicit mode preference, never draft content.
const preferenceKey = 'issue316.editorMode';
try { const saved = localStorage.getItem(preferenceKey); if (saved === 'Form' || saved === 'YAML') { mode = saved; render(); } } catch {}
for (const id of ['form', 'yaml']) document.getElementById(id).addEventListener('click', () => { try { localStorage.setItem(preferenceKey, id === 'form' ? 'Form' : 'YAML'); } catch {} });
</script></html>
