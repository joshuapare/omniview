<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="theme-color" content="#101112"><title>Kyverno report inspector · Mock 329</title><style>:root{color-scheme:dark;--bg:#101112;--panel:#1f2125;--line:#363940;--muted:#a7acb8;--accent:#a9a0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf0f6;font:13px system-ui}button,input,select{font:inherit;color:inherit;background:#272a30;border:1px solid var(--line);border-radius:5px;min-height:32px;padding:5px 10px}button{cursor:pointer;touch-action:manipulation}button:hover{background:#363941}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}small,.muted{color:var(--muted)}.shell{padding:22px 28px;color:var(--muted)}.fixture{margin:12px auto;width:min(1000px,96vw);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dialog{width:min(1000px,96vw);height:700px;max-height:calc(100vh - 140px);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;box-shadow:0 24px 80px #0008}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0 0 7px}h2{font-size:15px;margin:0 0 16px}h3{font-size:13px;margin:20px 0 10px}.body{display:flex;min-height:0;flex:1}nav{width:180px;flex-shrink:0;border-right:1px solid var(--line);padding:20px 12px}nav button{display:block;width:100%;text-align:left;margin-bottom:5px;border-color:transparent;background:transparent}nav button.active{background:#39354d;color:#d9d2ff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{display:inline-block;border:1px solid #565260;color:#d8cffb;padding:3px 7px;border-radius:4px;font-size:11px}.notice{border-left:3px </style><div class="shell">Omniview / Resources / Kyverno</div><div class="fixture"><span>INTERACTIVE DESIGN · synthetic fixtures · no cluster requests</span><label>Kind <select id="kind"><option>EphemeralReport</option><option>ClusterEphemeralReport</option></select></label><label>Fixture <select id="state"><option value="ready">Available</option><option value="empty">No results</option><option value="denied">Access denied</option><option value="missing">CRD not installed</option><option value="unavailable">Service unavailable</option><option value="gone">Report expired</option><option value="unsupported">Unsupported version</option><option value="unowned">Owner unresolved</option><option value="loading">Loading</option></select></label></div><section class="dialog" role="dialog" aria-label="Report inspector"><header><div><h1 id="title"></h1><small id="destination"></small></div><div><span class="badge">Inspect only</span> <button id="help" aria-label="About transient reports" aria-expanded="false">?</button></div></header><div class="body"><nav aria-label="Report sections"><button class="active" data-page="outcomes">Rule outcomes</button><button data-page="owner">Owner & provenance</button><button data-page="source">Source projection</button><button data-page="actions">Action boundary</button></nav><main id="content"></main></div><footer><span class="muted">reports.kyverno.io/v1 · controller-generated</span><button id="review">Review boundary</button></footer></section><div id="popover" class="help" role="tooltip" hidden>Transient evidence can disappear after aggregation. A report is not a durable audit log. Its presence does not prove enforcement or policy health.</div><script>
let section='outcomes',query='',outcome='all',expanded=false,helpPinned=false;const $=s=>document.querySelector(s);const cluster=()=>$('#kind').value==='ClusterEphemeralReport';const owner=()=>cluster()?'Node / preview-node':'Deployment / preview-api';

function render(){let state=$('#state').value;$('#title').textContent=$('#kind').value+' / preview-evidence';$('#destination').textContent='preview-cluster · '+(cluster()?'Cluster scope · no namespace':'Namespace: preview');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===section));let html='';const states={denied:['Access denied','Get/list permission is denied. Ask an administrator; do not treat this as an empty report.'],missing:['API not installed','reports.kyverno.io/v1 discovery is absent. No authoring fallback is offered.'],unavailable:['Service unavailable','The fixture endpoint cannot be reached. Existing snapshot remains read-only.'],gone:['Report no longer exists','This transient report expired. No recreate or retry-evaluation action is available.'],loading:['Loading…','Waiting for a report snapshot.'],unsupported:['Unsupported representation','This fixture represents v2. Preserve original source; no conversion or editing is offered.']};if(states[state]){html=`<h2>${states[state][0]}</h2><div class="notice" role="status">${states[state][1]}</div><button id="retry">Retry fixture lookup</button>`;if(state==='unsupported')html+='<pre># Original unsupported fixture retained unchanged\napiVersion: reports.kyverno.io/v2\nkind: '+$('#kind').value+'\nunknownField: 9007199254740993\n</pre>';}else if(section==='outcomes'){html=`<h2>Rule outcomes <span class="badge">Snapshot</span></h2><div class="notice">Generated evidence. Create, edit and re-evaluate are not offered.</div><div class="toolbar"><input id="search" name="rule-search" autocomplete="off" aria-label="Filter policy or rule" placeholder="Find policy or rule…" value="${query}"><select id="outcome" aria-label="Outcome filter"><option value="all">All outcomes</option>${['pass','fail','warn','error','skip'].map(x=>`<option ${outcome===x?'selected':''}>${x}</option>`).join('')}</select><button id="clear">Clear filters</button></div><div id="rows"></div>`;}else if(section==='owner'){html='<h2>Owner & aggregation provenance</h2>'+fields([['Report owner · spec.owner',state==='unowned'?'Unresolved reference · UID retained':owner()],['Reference identity',cluster()?'v1 · Node · preview-node':'apps/v1 · Deployment · preview-api'],['Source label','background scan · fixture'],['Observed resource','UID-bound reference · not name-only'],['Created','2026-11-01T12:00:00Z'],['Aggregation','Not established by this snapshot']])+`<h3>Ownership boundaries</h3><div class="notice">spec.owner is evidence ownership, not proof of a metadata.ownerReferences controller relationship.</div><button id="reference">Inspect owner reference</button><div id="reference-result" aria-live="polite"></div>`;}else if(section==='source'){html='<h2>Source projection <span class="badge">Read-only · redacted</span></h2><div class="notice">Annotations, free-text messages and properties are omitted from this projection. Never a mutation source.</div><pre>'+`apiVersion: reports.kyverno.io/v1\nkind: ${$('#kind').value}\nmetadata:\n  name: preview-evidence\n${cluster()?'':'  namespace: preview\n'}spec:\n  owner:\n    apiVersion: ${cluster()?'v1':'apps/v1'}\n    kind: ${cluster()?'Node':'Deployment'}\n    name: ${cluster()?'preview-node':'preview-api'}\n    uid: preview-resource-uid\n  summary: {pass: 1, fail: 1}\n  results:\n    - policy: require-labels\n      rule: team-label\n      result: fail\n      timestamp: {seconds: 1793534400, nanos: 123456789}\n# Sensitive and unknown source stays in original snapshot; not serialized here.`+'</pre>';}else{html='<h2>Review inspection boundary</h2><div class="notice">No request will be sent. Deleting evidence can remove transient evaluation data without changing policy enforcement.</div>'+fields([['Destination','preview-cluster · '+(cluster()?'Cluster scope':'preview namespace')],['Create / edit','Not offered for generated report evidence'],['Delete','Not offered in this mock; use existing host action with RBAC and explicit confirmation'],['Re-evaluate','No invented endpoint or controller action'],['Policy / resource navigation','Resolve actual GVK, namespace and UID first'],['Snapshot validity','No claim of current state or completed aggregation']])+'<h3>Next step</h3><button id="back">Return to outcomes</button>';}$('#content').innerHTML=html;if($('#search')){$('#search').oninput=e=>{query=e.target.value;rows()};$('#outcome').onchange=e=>{outcome=e.target.value;rows()};$('#clear').onclick=()=>{query='';outcome='all';render()};rows()}if($('#reference'))$('#reference').onclick=()=>$('#reference-result').innerHTML='<div class="detail">'+(state==='unowned'?'Owner missing or not discoverable. Reference retained; no name-based substitution.':'Fixture reference only. Production must verify UID and permission before navigation.')+'</div>';if($('#retry'))$('#retry').onclick=()=>{$('#state').value='ready';render()};if($('#back'))$('#back').onclick=()=>{section='outcomes';render()}}
function rows(){let data=$('#state').value==='empty'?[]:[['require-labels','team-label','fail','high'],['safe-images','registry-check','pass','medium']];data=data.filter(r=>(outcome==='all'||r[2]===outcome)&&r.join(' ').includes(query));$('#rows').innerHTML=data.length?'<table><thead><tr><th>Policy / rule</th><th>Outcome</th><th>Severity</th><th>Details</th></tr></thead><tbody>'+data.map((r,i)=>`<tr><td>${r[0]}<br><small>${r[1]}</small></td><td class="${r[2]}">${r[2]}</td><td>${r[3]}</td><td><button class="details" data-index="${i}">Inspect result</button></td></tr>`).join('')+'</tbody></table><div id="detail"></div>':'<div class="detail">No matching outcomes. Clear filters or choose another snapshot.</div>';document.querySelectorAll('.details').forEach(b=>b.onclick=()=>{$('#detail').innerHTML='<div class="detail"><h3>Result details · read-only</h3>'+fields([['Resource',owner()],['Timestamp · UTC','2026-11-01T12:00:00.123456789Z'],['Scored','Not supplied · distinct from false'],['Category / source','Not supplied'],['Resource selector','Absent · explicit resource reference shown'],['Message / properties','Hidden by default · may contain sensitive payloads']])+'</div>'})}
$('nav').onclick=e=>{if(e.target.dataset.page){section=e.target.dataset.page;render()}};$('#kind').onchange=render;$('#state').onchange=render;$('#review').onclick=()=>{section='actions';render()};const show=()=>{$('#popover').hidden=false;$('#help').setAttribute('aria-expanded','true')},hide=()=>{$('#popover').hidden=true;$('#help').setAttribute('aria-expanded','false')};$('#help').onclick=()=>{helpPinned=!helpPinned;helpPinned?show():hide()};$('#help').onmouseenter=show;$('#help').onfocus=show;$('#help').onmouseleave=()=>{if(!helpPinned)hide()};$('#help').onblur=()=>{if(!helpPinned)hide()};document.onkeydown=e=>{if(e.key==='Escape'&&!$('#popover').hidden){helpPinned=false;hide();$('#help').focus();hide();e.preventDefault()}if(e.key==='Tab'){let els=[...document.querySelectorAll('.dialog button,.dialog input,.dialog select')].filter(x=>!x.disabled);let first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}};render();</script></html>
