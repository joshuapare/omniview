<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossplane resource studio · mock 320</title><style>:root{color-scheme:dark;--bg:#12151b;--panel:#1b2028;--line:#343c49;--text:#e0e6ef;--muted:#a0adbe;--accent:#8cafff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;background:#151a22;border:1px solid var(--line);border-radius:5px}button,input,select{min-height:32px;padding:5px 10px}button{cursor:pointer}button:hover{background:#303d53}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true],.primary{background:#345b99;border-color:#7396d1}input,select{width:100%}input[type=checkbox]{width:auto}header{height:48px;border-bottom:1px solid var(--line);padding:13px 24px;color:var(--muted)}.fixture{padding:12px 24px;display:flex;gap:12px;align-items:center}.fixture select{width:230px}.shell{width:min(1000px,calc(100vw - 24px));height:700px;max-height:calc(100vh - 115px);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 80px #0006}.top{padding:17px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 5px}small,.muted{color:var(--muted)}.body{display:flex;min-height:0;flex:1}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin-bottom:7px}main{overflow:auto;flex:1;min-width:0;padding:20px 24px;overscroll-behavior:contain}h2{font-size:14px;margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:block;margin-bottom:16px}.field span{display:flex;gap:7px;margin-bottom:7px}.field small{display:block;m 1><small id="subtitle"></small></div><div><button id="form">Form</button> <button id="yaml">YAML / JSON</button></div></div><div class="body"><nav><button data-section="Basics">Basics</button><button data-section="Configuration">Configuration</button><button data-section="Advanced">Advanced</button><button data-section="Review">Review</button></nav><main id="main"></main></div><footer><small>preview-cluster · Cluster scoped<br>Review only · nothing is submitted</small><button id="reset">Reset Fixture</button><button class="primary" id="review">Review Draft</button></footer></section><dialog id="help"><h2>Field Help</h2><p id="helptext"></p><button id="closehelp">Close Help</button></dialog><script>
let fixtures,idx=0,section='Basics',mode='Form',draft='',error='',helpReturn;const $=s=>document.querySelector(s),kinds=['CompositeResourceDefinition','Composition','EnvironmentConfig','ManagedResourceActivationPolicy','Usage','CompositionRevision','ManagedResourceDefinition'];const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);let generated=()=>idx>4,editing=()=>$('#operation').value==='Edit';
// JSON is a YAML subset. Patch a leaf token only; keep every untouched byte.
function tokens(s){let re=/"(?:\\.|[^"\\])*"|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null|[{}\[\]:,]/g,m,a=[];while(m=re.exec(s))a.push({s:m[0],start:m.index,end:re.lastIndex});return a}
function span(s,path){let ts=tokens(s),i=0,found;function walk(p){let st=ts[i]?.start,t=ts[i++];if(!t)throw Error();if(t.s==='{'){while(ts[i].s!=='}'){let k=JSON.parse(ts[i++].s);i++;walk([...p,k]);if(ts[i].s===',')i++;}i++;}else if(t.s==='['){let j=0;while(ts[i].s!==']'){walk([...p,String(j++)]);if(ts[i].s===',')i++;}i++;}if(p.join('.')===path)found=[st,ts[i-1].end]}walk([]);return found}
function patch(p,v){let r=span(draft,p);if(!r)throw Error('Path absent; use source to add optional fields.');draft=draft.slice(0,r[0])+JSON.stringify(v,null,2)+draft.slice(r[1]);}
function field(label,path,type='text',options=[],help=''){let v=get(JSON.parse(draft),path),lock=generated()||(editing()&&(['metadata.name','spec.group','spec.names.kind','spec.names.plural','spec.scope','spec.compositeTypeRef.apiVersion','spec.compositeTypeRef.kind','spec.enforcedCompositionRef.name'].includes(path)));return `<label class="field"><span>${label}${help?` <button type="button" class="help" data-help="${escape(help)}" aria-label="Help: ${label}">?</button>`:''}${lock?' · locked':''}</span>${type==='select'?`<select aria-label="${label}" name="${path}" data-path="${path}" ${lock?'disabled':''}>${options.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`:`<input autocomplete="off" name="${path}" aria-label="${label}" data-path="${path}" type="${type}" ${type==='checkbox'?(v?'checked':''):`value="${escape(v??'')}"`} ${lock?'disabled':''}>`}<small>${path}</small></label>`}
function rows(path,label,type){let a=get(JSON.parse(draft),path);return `<h2>${label}</h2>`+a.map((x,i)=>`<div class="row"><input aria-label="${label} ${i+1}" autocomplete="off" data-row="${path}" data-index="${i}" value="${escape(type==='pipeline'?x.step:x)}">${type==='pipeline'?`<select aria-label="Function ${i+1}" data-function="${i}"><option>${escape(x.functionRef.name)}</option><option>function-preview-transform</option></select>`:''}<button data-remove="${path}" data-index="${i}" aria-label="Remove ${label} ${i+1}">Remove</button></div>`).join('')+`<button data-add="${path}" data-type="${type}">Add ${type==='pipeline'?'Step':'Pattern'}</button><p class="muted">${path}${type==='pipeline'?'[*].step · functionRef.name':''}</p>`}
function render(){let o;try{o=JSON.parse(draft)}catch{}$('#title').textContent=(generated()?'Inspect ':editing()?'Edit ':'Create ')+kinds[idx];$('#subtitle').textContent=fixtures[idx].apiVersion+' · preview-cluster';$('#operation').disabled=generated();$('#form').setAttribute('aria-pressed',mode==='Form');$('#yaml').setAttribute('aria-pressed',mode!=='Form');document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.section===section));let main=$('#main');if($('#availability').value!=='Available fixture'){let a=$('#availability').value;main.innerHTML=`<h2>${escape(a)}</h2><div class="warning">${a==='API missing'?'This API is not installed. No create or edit is available.':a==='Permission denied'?'Access denied. Draft stays in memory; permissions are not inferred.':a==='Discovery unavailable'?'Discovery failed. Resource support and references are unknown.':'No matching references. No companion resources will be created.'}</div><button id="retry">Return to Fixture</button>`;$('#retry').onclick=()=>{$('#availability').value='Available fixture';render()};return}if(mode!=='Form'){main.innerHTML=`<div class="badge">JSON is valid YAML · source is never normalized on mode change</div><textarea id="source" aria-label="Manifest source" spellcheck="false" ${generated()?'readonly':''}></textarea><div class="error" aria-live="polite">${escape(error)}</div>`;$('#source').value=draft;$('#source').oninput=e=>{draft=e.target.value;error=''};return}if(!o || o.kind!==kinds[idx] || !o.metadata?.name || (idx===0&&(!o.spec?.names||!o.spec?.versions?.[0]?.schema?.openAPIV3Schema)) || (idx===1&&(!o.spec?.compositeTypeRef||!Array.isArray(o.spec.pipeline))) || (idx===2&&(!o.data||typeof o.data!=='object'||Array.isArray(o.data))) || (idx===3&&!Array.isArray(o.spec?.activate)) || (idx===4&&(!o.spec?.of?.resourceRef||typeof o.spec.reason!=='string'))){main.innerHTML='<div class="error">Invalid or unsupported YAML/JSON. Source stays intact. Return to source to repair it.</div>';return}let html=error?`<div class="error" role="alert">${escape(error)}</div>`:'';if(generated()){html+=`<div class="warning">Controller-owned. No ordinary Create, spec edit, delete, or status editor.</div><h2>${idx===5?'Composition Snapshot':'Provider-Installed Definition'}</h2>`;if(idx===5)html+=`<div class="inspect">Owner · ${o.metadata.ownerReferences[0].name}</div><div class="inspect">Revision · ${o.spec.revision}</div><div class="inspect">Composite type · ${o.spec.compositeTypeRef.apiVersion} / ${o.spec.compositeTypeRef.kind}</div><div class="inspect">Pipeline · render → function-preview-render</div><button id="owner">Inspect Owner Composition</button><div class="warning">Revision selection belongs to a composite resource, not this generated revision.</div>`;else html+=`<div class="inspect">Owner · ProviderRevision / provider-preview</div><div class="inspect">State · Inactive (fixture, not controller proof)</div><div class="inspect">Scope · Namespaced</div><div class="inspect">API · example.org/v1alpha1 / Database</div><div class="warning">Activation creates a CRD. Active → Inactive is forbidden by schema.</div><button id="activation">Draft Activation Policy</button>`;html+='<p class="muted">Observed conditions unavailable in fixture; status is read-only.</p>';}
else if(section==='Review'){let errors=validate(o);html+=`<h2>Review ${editing()?'Changes':'Creation'}</h2><div class="badge">preview-cluster · cluster-scoped · ${escape(o.metadata.name)}</div>${errors?`<div class="error">${escape(errors)}</div>`:'<div class="badge">Local checks passed · server admission not evaluated</div>'}<div class="warning">${['Defines an API and controller behavior. Scope, group and names cannot change after creation.','Pipeline changes may affect composites using Automatic updates. Manual policy is configured on XRD/composite, not Composition.','Environment values may influence compositions that select this config. No secret material belongs here.','Matching inactive definitions may become active. Removing a pattern does not prove deactivation.','Legacy Usage blocks deletion. Replay deletion can delete the protected resource after protection ends.'][idx]}</div><pre>${escape(draft)}</pre><button id="back">Back to Configuration</button>`;}
else if(section==='Basics'){html+='<h2>Identity</h2>'+field('Name *','metadata.name');if(idx===0)html+='<div class="grid">'+field('API Group *','spec.group')+field('Kind *','spec.names.kind')+field('Plural *','spec.names.plural')+field('Composite Scope','spec.scope','select',['Namespaced','Cluster'],'Scope of generated composites, not this cluster-scoped XRD. Immutable after creation.')+'</div>';if(idx===1)html+='<h2>Composite Type</h2><div class="grid">'+field('API Version *','spec.compositeTypeRef.apiVersion')+field('Kind *','spec.compositeTypeRef.kind')+'</div><span class="badge">Pipeline mode only in this snapshot</span>';if(idx===4)html+='<div class="warning">Deprecated API. Author only when legacy API and protection controller are supported. Prefer protection.crossplane.io.</div>';}
else if(section==='Configuration'){if(idx===0)html+='<h2>API Version & Schema</h2><div class="grid">'+field('Version *','spec.versions.0.name')+field('Served','spec.versions.0.served','checkbox')+field('Referenceable','spec.versions.0.referenceable','checkbox')+field('Revision Updates','spec.defaultCompositionUpdatePolicy','select',['Manual','Automatic'],'Manual requires explicit selection; Automatic follows eligible composition revisions.')+'</div><label class="field"><span>OpenAPI Schema <button class="help" data-help="Expert schema fragment. Entire owned schema subtree changes; unknown sibling fields stay untouched." aria-label="Help: OpenAPI Schema">?</button></span><textarea id="schema" aria-label="OpenAPI schema">'+escape(JSON.stringify(o.spec.versions[0].schema.openAPIV3Schema,null,2))+'</textarea><small>spec.versions[0].schema.openAPIV3Schema</small></label>';if(idx===1)html+=rows('spec.pipeline','Function Pipeline','pipeline')+'<div class="warning">Function installation and health are not verified. Function input, credentials references and requirements remain source-only; values are never resolved.</div>';if(idx===2)html+='<h2>Environment Data</h2>'+Object.entries(o.data).map(([k,v])=>field(k,'data.'+k,typeof v==='boolean'?'checkbox':typeof v==='number'?'number':'text')).join('')+'<button id="adddata">Add Data Key</button><span class="badge">Objects, arrays and null remain source-only</span>';if(idx===3)html+=rows('spec.activate','Activation Patterns','pattern')+'<div class="warning">Prefix wildcards only, not regular expressions. Match preview is unavailable without discovery.</div>';if(idx===4)html+='<h2>Protected Resource</h2><div class="grid">'+field('API Version *','spec.of.apiVersion')+field('Kind *','spec.of.kind')+field('Resource Name *','spec.of.resourceRef.name')+'</div>'+field('Protection Reason *','spec.reason')+field('Replay Deletion','spec.replayDeletion','checkbox','', 'May replay a pending deletion once protection ends. No deletion occurs in this mock.')+'<div class="warning">Replay deletion can delete the protected resource. Target references are not resolved.</div><button id="by">Add Using Resource</button><p class="muted">Selectors and controller-reference matching remain source-only.</p>';}
else html+='<h2>Advanced Source Boundary</h2><div class="badge">Optional fields remain omitted until explicitly authored</div><div class="inspect">'+['Additional versions, conversion webhooks, default/enforced composition refs, generated metadata and legacy v1 fields','Function input, requirements, credentials references, connection-secret namespace','Nested data, arrays, null and labels','Additional activation patterns; observed activated names are read-only','Using-resource references/selectors, target selectors, controller-reference matching'][idx]+'</div><div class="warning">Source-only shapes are preserved. No secret import, status editing or fabricated reference resolution.</div><button id="openSource">Open Source</button>';

function validate(o){if(!o.metadata?.name||!/^[a-z0-9][a-z0-9.-]*$/.test(o.metadata.name))return 'Name: enter a lowercase Kubernetes resource name.';if(idx===0&&(!o.spec.group||!o.spec.names.kind||!o.spec.names.plural||!o.spec.versions.length))return 'Complete group, names and at least one version.';if(idx===1&&(!o.spec.pipeline.length||new Set(o.spec.pipeline.map(x=>x.step)).size!==o.spec.pipeline.length||o.spec.pipeline.some(x=>!x.step||!x.functionRef.name)))return 'Pipeline: add at least one uniquely named step and a function.';if(idx===3&&(!o.spec.activate.length||o.spec.activate.some(x=>!x||/[\[\]()^$+?]/.test(x))))return 'Activation: add a name or prefix wildcard; regular expressions are unsupported.';if(idx===4&&(!o.spec.of||(!o.spec.by&&!o.spec.reason)))return 'Usage: choose a protected resource and supply reason or using resource.';return ''}
function bind(){document.querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>{let v=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;patch(el.dataset.path,v)});document.querySelectorAll('[data-help]').forEach(b=>{let open=()=>{helpReturn=b;$('#helptext').textContent=b.dataset.help;$('#help').showModal();$('#closehelp').focus()};b.onclick=e=>{e.preventDefault();open()}});document.querySelectorAll('[data-row]').forEach(el=>el.onchange=()=>{let p=el.dataset.row+'.'+el.dataset.index+(el.dataset.row==='spec.pipeline'?'.step':'');patch(p,el.value)});document.querySelectorAll('[data-function]').forEach(el=>el.onchange=()=>patch('spec.pipeline.'+el.dataset.function+'.functionRef.name',el.value));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let a=get(JSON.parse(draft),b.dataset.add);a.push(b.dataset.type==='pipeline'?{step:'step-'+(a.length+1),functionRef:{name:'function-preview-render'}}:'*.example.org');patch(b.dataset.add,a);render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=get(JSON.parse(draft),b.dataset.remove);a.splice(+b.dataset.index,1);patch(b.dataset.remove,a);render()});if($('#schema'))$('#schema').onchange=e=>{try{patch('spec.versions.0.schema.openAPIV3Schema',JSON.parse(e.target.value));error=''}catch{error='Schema: enter a valid JSON object. Source was not changed.';render()}};if($('#adddata'))$('#adddata').onclick=()=>{let o=JSON.parse(draft);let k='key'+Object.keys(o.data).length;patch('data',{...o.data,[k]:''});render()};if($('#by'))$('#by').onclick=()=>{let o=JSON.parse(draft);patch('spec',{...o.spec,by:{apiVersion:'platform.example.org/v1alpha1',kind:'Application',resourceRef:{name:'preview-app'}}});mode='YAML';render()};if($('#openSource'))$('#openSource').onclick=()=>{mode='YAML';render()};if($('#back'))$('#back').onclick=()=>{section='Configuration';render()};if($('#owner'))$('#owner').onclick=()=>switchKind(1);if($('#activation'))$('#activation').onclick=()=>switchKind(3)}
function switchKind(n){if(draft!==JSON.stringify(fixtures[idx],null,2)&&!confirm('Discard this in-memory draft and load another synthetic fixture?'))return;idx=n;$('#kind').value=n;draft=JSON.stringify(fixtures[idx],null,2);section='Basics';mode='Form';error='';render()}
$('#kind').onchange=e=>switchKind(+e.target.value);$('#operation').onchange=render;$('#availability').onchange=render;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});$('#form').onclick=()=>{mode='Form';render()};$('#yaml').onclick=()=>{mode='YAML';render()};$('#review').onclick=()=>{try{error=validate(JSON.parse(draft));}catch{error='Invalid source. Repair source before review.'}mode='Form';section='Review';render()};$('#reset').onclick=()=>{if(confirm('Discard in-memory changes?')){draft=JSON.stringify(fixtures[idx],null,2);error='';render()}};$('#closehelp').onclick=()=>{$('#help').close();helpReturn?.focus()};$('#help').addEventListener('cancel',()=>setTimeout(()=>helpReturn?.focus()));window.addEventListener('beforeunload',e=>{if(fixtures&&draft!==JSON.stringify(fixtures[idx],null,2)){e.preventDefault();e.returnValue=''}});fetch('fixtures.json').then(r=>r.json()).then(x=>{fixtures=x;$('#kind').innerHTML=kinds.map((k,i)=>`<option value="${i}">${k}</option>`).join('');draft=JSON.stringify(fixtures[0],null,2);render()});
