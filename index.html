</style><div class="shell">◈ &nbsp; omniview &nbsp; / &nbsp; Kubernetes &nbsp; / &nbsp; Certificates</div><div class="fixture">INTERACTIVE DESIGN MOCK · Synthetic fixtures only · No cluster connection or mutation</div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><header class="head"><div><h1 id="title"></h1><span class="muted" id="destination"></span></div><div class="line"><button id="form">Form</button><button id="source">YAML</button></div></header><div class="body"><nav aria-label="Certificate resources"><button data-kind="csr">Signing Request</button><button data-kind="trust">Trust Bundle</button><button data-kind="pod">Pod Request</button><hr><label for="intent">Intent</label><select id="intent"><option value="create">Create</option><option value="edit">Inspect / Edit</option></select><br><br><label for="availability">API / Access</label><select id="availability"><option value="available">Available fixture</option><option value="missing">Not served</option><option value="denied">Access denied</option><option value="unavailable">Lookup unavailable</option><option value="empty">No objects</option><option value="unsupported">Unsupported version</option><option value="loading">Loading</option></select></nav><main id="content"></main></div><footer class="footer"><span class="muted" id="foot">preview-cluster · Cluster scope</span><div><button id="back" hidden>Back to Draft</button> <button class="primary" id="review">Review Request</button></div></footer></section><div id="helpbox" role="tooltip" hidden></div><script>
const $=s=>document.querySelector(s);let kind='csr',mode='form',reviewing=false,lastHelp;const drafts={csr:{name:'',signer:'',duration:'',usages:[],loaded:false},trust:{name:'',signer:'',loaded:false},pod:{}};let raw='',rawEdited=false;const titles={csr:'CertificateSigningRequest',trust:'ClusterTrustBundle',pod:'PodCertificateRequest'};const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const edit=()=>$('#intent').value==='edit';function field(label,id,value,disabled=false,type='text'){return `<div class="field"><label for="${id}">${label}</label><input autocomplete="off" spellcheck="false" id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${disabled?'disabled':''}></div>`}function help(text){return `<button class="help" type="button" aria-label="Help" data-help="${esc(text)}">?</button>`}function projection(){let d=drafts[kind];return '# Redacted preview only — never a mutation source\napiVersion: certificates.k8s.io/'+(kind==='csr'?'v1':'v1beta1')+'\nkind: '+titles[kind]+'\nmetadata:\n  name: '+(d.name||'\"\"')+'\nspec:\n  signerName: '+(d.signer||'\"\"')+(kind==='csr'?'\n  request: "[hidden]"\n  usages: '+JSON.stringify(d.usages)+(d.duration?'\n  expirationSeconds: '+d.duration:''):kind==='trust'?'\n  trustBundle: "[hidden]"':'\n  podName: preview-app\n  pkixPublicKey: "[hidden]"\n  proofOfPossession: "[hidden]"')}
function render(){let d=drafts[kind],inspect=edit()||kind==='pod';$('#title').textContent=(kind==='pod'?'Inspect ':edit()?'Inspect / Edit ':'Create ')+titles[kind];$('#destination').textContent='certificates.k8s.io/'+(kind==='csr'?'v1':'v1beta1')+' · preview-cluster';$('#foot').textContent='preview-cluster · '+(kind==='pod'?'preview namespace':'Cluster scope');document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));$('#review').hidden=kind==='pod';$('#review').textContent=kind==='csr'&&inspect?'Review Approval':kind==='trust'?'Review Trust Change':'Review Request';$('#back').hidden=!reviewing;let av=$('#availability').value;if(av!=='available'){const texts={missing:'API not served. Check discovery and feature gates.',denied:'Access denied. Request the required resource verb; discovery is not permission.',unavailable:'Lookup unavailable. Retry without changing the draft.',empty:'No objects found. No request or trust bundle was selected.',unsupported:'Unsupported API version. Preserve original source; guided editing is unavailable.',loading:'Loading resource capabilities…'};$('#content').innerHTML=`<h2>${titles[kind]}</h2><div class="box" role="status">${texts[av]}</div><button id="retry">Retry Fixture Lookup</button>`;$('#review').disabled=true;$('#retry').onclick=()=>{$('#availability').value='available';render()};return}$('#review').disabled=false;
if(reviewing){$('#content').innerHTML=`<h2>Review · No Request Sent</h2><div class="notice">${kind==='trust'?'Changing trust anchors can break consumer trust. No Pod projection or rollout is created.':inspect?'Approval is consequential and does not issue a certificate. Verify requester identity and signer policy outside this masked preview.':'Request spec becomes immutable after creation. Approval, issuance and trust are separate.'}</div><div class="kv"><span>Destination</span><span>preview-cluster · Cluster scope</span></div><div class="kv"><span>Operation</span><span>${kind==='trust'?(inspect?'Update trust bundle':'Create trust bundle'):inspect?$('#approval')?.value||'Approval review':'Create request'}</span></div><div class="kv"><span>Name</span><span>${esc(d.name||'preview-request')}</span></div><div class="kv"><span>Signer</span><span>${esc(d.signer||'example.com/preview')}</span></div><div class="kv"><span>Material</span><span>Hidden · Never included in review output</span></div><div class="box" style="margin-top:20px">Local design preview only. Production must recheck RBAC, resourceVersion and server validation.</div>`;return}
if(mode==='source'){$('#content').innerHTML='<h2>YAML · Redacted Projection</h2><div class="notice">Read-only preview. Hidden material and annotations never enter this projection’s source.</div><textarea aria-label="Redacted YAML" readonly>'+esc(projection())+'</textarea><details><summary>Unsupported source boundary</summary><p class="muted">Production retains the original document verbatim. This mock does not import or parse raw material.</p></details>';return}
if(kind==='csr'){$('#content').innerHTML=`<h2>${inspect?'Request & Approval':'Request Details'}</h2>${inspect?'<div class="notice">Spec is immutable. Requester identity comes from the API server; status belongs to signer and approver.</div>':''}<div class="row">${field('Name *','name',d.name,inspect)}${field('Signer * '+help('Signer defines policy and trust. No signer is selected automatically. kubernetes.io/legacy-unknown is not allowed in v1.'),'signer',d.signer,inspect)}</div><div class="box"><label>Signing request *</label><span class="muted">${d.loaded?'Fixture request attached · Content hidden':'No request attached'}</span> <button id="attach" ${inspect?'disabled':''}>Attach Safe Fixture</button><div id="material-error" class="error"></div></div><div class="row">${field('Requested lifetime (seconds) '+help('Optional. Minimum 600 seconds; signer may issue a different duration.'),'duration',d.duration,inspect,'number')}<div><label>Usages *</label><div class="line"><select id="usage" aria-label="Key usage" ${inspect?'disabled':''}>${['digital signature','key encipherment','client auth','server auth','signing','content commitment','key agreement','data encipherment','cert sign','crl sign','encipher only','decipher only','any','code signing','email protection','s/mime','ipsec end system','ipsec tunnel','ipsec user','timestamping','ocsp signing','microsoft sgc','netscape sgc'].map(x=>'<option>'+x+'</option>').join('')}</select><button id="add" ${inspect?'disabled':''}>Add</button></div><div id="usages">${d.usages.map((x,i)=>`<div class="line"><span>${x}</span><button aria-label="Remove ${x}" data-remove="${i}" ${inspect?'disabled':''}>×</button></div>`).join('')}</div></div></div>${inspect?'<div class="box"><span class="badge">Pending · Fixture</span><div class="kv"><span>Certificate / conditions</span><span>Not issued · No conditions</span></div><div class="kv"><span>Requester</span><span>Identity hidden · Server-owned</span></div><label for="approval">Approval action</label><select id="approval"><option>Approve</option><option>Deny</option></select><p class="error">Requires update on /approval and approve on the named signer. Permission not verified.</p></div>':'<details><summary>Advanced · Metadata & ownership</summary><p class="muted">Metadata labels remain separate. Requester username, UID, groups and extra are server-owned. Status is read-only.</p></details>'}`;
}else if(kind==='trust'){$('#content').innerHTML=`<h2>${inspect?'Edit Trust Distribution':'Trust Anchors'}</h2><div class="notice">Administrator boundary · ClusterTrustBundle gate is default-off. Signer-linked bundles require attest permission.</div><div class="row">${field('Name *','name',d.name,inspect)}${field('Signer (optional) '+help('For example.com/preview, name must begin example.com:preview:. Omitted signer is distinct. Signer edits must still satisfy name rules.'),'signer',d.signer)}</div><div class="box"><label>Trust bundle *</label><span class="muted">${d.loaded?'Existing trust anchors retained · Hidden':'No trust anchors attached'}</span><div class="line"><button id="attach">${inspect?'Replace with Safe Fixture':'Attach Safe Fixture'}</button><button id="clear">Clear Attachment</button></div><div id="material-error" class="error"></div></div><div class="box"><h2>Distribution</h2><div class="kv"><span>Read access</span><span>Cluster-wide · Authenticated users</span></div><div class="kv"><span>Consumers</span><span>Not queried · No projection created</span></div></div><details><summary>Advanced · Validation</summary><p class="muted">Production validates PEM certificates with CA constraints, duplicates and size. Fixture attachment proves no certificate validity.</p></details>`;
}else{$('#content').innerHTML='<h2>Kubelet Request Lifecycle</h2><div class="notice">Kubelet-owned request · All spec fields immutable. No ordinary Create, Edit, Approve or Retry-Issue action.</div><span class="badge">Pending · Fixture</span>'+[['Pod','preview-app · preview namespace'],['Signer','example.com/preview'],['Identity binding','Pod UID / ServiceAccount UID / Node UID · Retained'],['Maximum lifetime','86400 seconds · Fixture server default'],['Public key / proof','Hidden · Kubelet-owned'],['Issued / Denied / Failed','No terminal condition'],['Certificate chain','Not issued · Hidden'],['Validity / refresh timestamps','Unavailable until signer populates status']].map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')+'<details><summary>Ownership & references</summary><p class="muted">Inspect referenced Pod, ServiceAccount and Node in existing resource views. No key generation, status edit or volume rewrite occurs here.</p></details>'}
wire();}
function wire(){for(let id of ['name','signer','duration'])if($('#'+id))$('#'+id).oninput=e=>{drafts[kind][id]=e.target.value;e.target.removeAttribute('aria-invalid');e.target.parentElement.querySelector('.error')?.remove()};if($('#attach'))$('#attach').onclick=()=>{drafts[kind].loaded=true;render()};if($('#clear'))$('#clear').onclick=()=>{drafts[kind].loaded=false;render()};if($('#add'))$('#add').onclick=()=>{let a=drafts.csr.usages,v=$('#usage').value;if(!a.includes(v))a.push(v);render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{drafts.csr.usages.splice(+b.dataset.remove,1);render()});document.querySelectorAll('[data-help]').forEach(b=>{let show=()=>{lastHelp=b;$('#helpbox').textContent=b.dataset.help;$('#helpbox').hidden=false};b.onclick=show;b.onfocus=show;b.onmouseenter=show;b.onmouseleave=()=>$('#helpbox').hidden=true})}
function validate(){let d=drafts[kind],errors=[];document.querySelectorAll('.error.local').forEach(x=>x.remove());let fail=(id,msg)=>{let el=$('#'+id);el.setAttribute('aria-invalid','true');el.insertAdjacentHTML('afterend','<div class="error local" role="alert">'+msg+'</div>');errors.push(el)};if(!d.name)fail('name','Enter a resource name.');if(kind==='csr'&&(!d.signer.includes('/')||d.signer==='kubernetes.io/legacy-unknown'))fail('signer','Enter a qualified signer name.');if(kind==='trust'&&d.signer&&!d.name.startsWith(d.signer.replaceAll('/',':')+':'))fail('signer','Name must use the signer prefix.');if(kind==='csr'&&d.duration&&(Number(d.duration)<600||!Number.isInteger(Number(d.duration))||Number(d.duration)>2147483647))fail('duration','Use an integer from 600 to 2147483647 seconds.');if(!d.loaded){$('#material-error').textContent='Attach material before review.';errors.push($('#attach'))}if(kind==='csr'&&!d.usages.length){$('#usages').innerHTML='<div class="error local" role="alert">Add at least one usage.</div>';errors.push($('#usage'))}errors[0]?.focus();return !errors.length}
$('#review').onclick=()=>{if(mode==='source'){mode='form';render()}if(validate()){reviewing=true;render()}};$('#back').onclick=()=>{reviewing=false;render()};$('#form').onclick=()=>{mode='form';reviewing=false;render()};$('#source').onclick=()=>{mode='source';reviewing=false;render()};document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;mode='form';reviewing=false;render()});$('#availability').onchange=()=>{reviewing=false;render()};$('#intent').onchange=()=>{if(edit()){let d=drafts[kind];if(kind!=='pod'){d.name=kind==='csr'?'preview-request':'example.com:preview:roots';d.signer='example.com/preview';d.loaded=true;if(kind==='csr'){d.usages=['digital signature','client auth'];d.duration='3600'}}}reviewing=false;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#helpbox').hidden){e.preventDefault();$('#helpbox').hidden=true;lastHelp?.focus();$('#helpbox').hidden=true}if(e.key==='Tab'){let a=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input:not(:disabled),.dialog select:not(:disabled),.dialog textarea')].filter(x=>x.offsetParent!==null);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});render();
</script></html>
