let section='runtime',mode='form',scenario='create',reviewing=false,raw=null,errors=false,helpAnchor=null;let d;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){d={name:scenario==='create'?'':'sandbox',handler:scenario==='create'?'':'sandbox-cri',cpu:'',memory:'',selectors:[],tolerations:[],labels:[]};raw=null;errors=false;reviewing=false;render()}function source(){if(raw!==null)return raw;let s='# RuntimeClass draft — no mutation\napiVersion: node.k8s.io/v1\nkind: RuntimeClass\nmetadata:\n  name: '+JSON.stringify(d.name)+'\n';if(d.labels.length)s+='  labels:\n'+d.labels.map(r=>'    '+JSON.stringify(r.k)+': '+JSON.stringify(r.v)).join('\n')+'\n';s+='handler: '+JSON.stringify(d.handler)+'\n';if(d.cpu||d.memory)s+='overhead:\n  podFixed:\n'+(d.cpu?'    cpu: '+JSON.stringify(d.cpu)+'\n':'')+(d.memory?'    memory: '+JSON.stringify(d.memory)+'\n':'');if(d.selectors.length||d.tolerations.length){s+='scheduling:\n';if(d.selectors.length)s+='  nodeSelector:\n'+d.selectors.map(r=>'    '+JSON.stringify(r.k)+': '+JSON.stringify(r.v)).join('\n')+'\n';if(d.tolerations.length)s+='  tolerations:\n'+d.tolerations.map(r=>'    - key: '+JSON.stringify(r.k)+'\n      operator: '+r.op+(r.op==='Equal'?'\n      value: '+JSON.stringify(r.v):'')+(r.effect?'\n      effect: '+r.effect:'')+(r.effect==='NoExecute'&&r.seconds!==''?'\n      tolerationSeconds: '+r.seconds:'')).join('\n')+'\n'}return s}function help(text){return '<button type="button" class="help" aria-label="Field help" data-help="'+esc(text)+'">?</button>'}function field(key,label,tip,disabled=false){return '<div class="field"><label for="'+key+'">'+label+(tip?help(tip):'')+'</label><input id="'+key+'" name="'+key+'" autocomplete="off" spellcheck="false" value="'+esc(d[key])+'" '+(disabled?'disabled':'')+'>'+((errors&&!d[key]&&(key==='name'||key==='handler'))?'<div class="error">Enter '+label.toLowerCase()+'.</div>':'')+'</div>'}function rows(kind){return d[kind].map((r,i)=>'<div class="row"><input aria-label="'+kind+' key '+(i+1)+'" data-list="'+kind+'" data-i="'+i+'" data-prop="k" value="'+esc(r.k)+'" placeholder="Label key…"><input aria-label="'+kind+' value '+(i+1)+'" data-list="'+kind+'" data-i="'+i+'" data-prop="v" value="'+esc(r.v)+'" placeholder="Value…"><button data-remove="'+kind+'" data-i="'+i+'" aria-label="Remove '+kind+' row '+(i+1)+'">×</button></div>').join('')}function render(){let readonly=scenario==='managed';$('#title').textContent=(scenario==='create'?'Create ':readonly?'Inspect ':'Edit ')+'RuntimeClass';$('#formMode').classList.toggle('active',mode==='form');$('#yamlMode').classList.toggle('active',mode==='yaml');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('#back').classList.toggle('hidden',!reviewing);$('#review').classList.toggle('hidden',reviewing||readonly||['missing','denied','unavailable'].includes(scenario));let html='';if(['missing','denied','unavailable'].includes(scenario)){html='<h2>'+({missing:'RuntimeClass API Not Discovered',denied:'Create Permission Denied',unavailable:'Discovery Unavailable'}[scenario])+'</h2><div class="note warn">'+({missing:'No node.k8s.io/v1 resource discovered. Select an installed version before authoring.',denied:'Fixture authorization denies create on cluster-scoped runtimeclasses. No mutation is offered.',unavailable:'Discovery failed. This is not an empty resource list or an authorization result.'}[scenario])+'</div><button id="retry">Retry Fixture Check</button>'}else if(reviewing){html='<h2>Review '+(scenario==='create'?'New RuntimeClass':'RuntimeClass Changes')+'</h2><div class="note warn">Runtime handler support is unverified. No runtime or node configuration will be installed.</div><div class="note">Destination: <b>preview-cluster</b> · Cluster-scoped<br>Scheduling and overhead affect newly admitted Pods. Existing Pods are not rewritten.<br>Selector conflicts reject Pod admission. Tolerations do not guarantee placement.</div><pre>'+esc(source())+'</pre><span class="badge">Preview only · Nothing sent</span>'}else if(mode==='yaml'){html='<h2>Source Draft</h2><div class="note">'+(raw!==null?'Manual source retained exactly. Guided editing and review are unavailable until schema-aware validation exists.':'Generated from owned fields. Manual edits remain source-only; no lossless parser is claimed.')+'</div><label for="source">YAML</label><textarea id="source" spellcheck="false" autocomplete="off" '+(readonly?'readonly':'')+'>'+esc(source())+'</textarea>'}else if(raw!==null){html='<h2>Source-Only Draft</h2><div class="note warn">Manual or unsupported YAML is preserved. Return to YAML to edit it. Form cannot safely patch this draft.</div>'}else{if(readonly)html+='<div class="note warn">Provisioner-owned fixture · Inspect only. Change the owning configuration, not this object.</div>';if(section==='runtime')html+='<h2>Runtime</h2><div class="grid">'+field('name','Name *','Cluster-wide DNS subdomain. Immutable on edit.',scenario!=='create')+field('handler','Handler *','Exact CRI handler configured by your node administrator. Lowercase DNS label, at most 63 characters. Immutable after creation.',scenario!=='create')+'</div><div class="note warn">Handler support on nodes is unverified. Creating this class does not install a runtime.</div><div class="note">Pods opt in through <code>spec.runtimeClassName</code>.</div>';if(section==='overhead')html+='<h2>Fixed Overhead per Pod '+help('Additional resources charged during Pod admission. Enter measured runtime overhead, not application requests. Blank fields stay omitted. Custom resource quantities remain in source.')+'</h2><div class="grid">'+field('cpu','CPU Quantity','Kubernetes quantity, for example 25m. No guessed default.')+field('memory','Memory Quantity','Kubernetes quantity, for example 64Mi. No guessed default.')+'</div><span class="muted">Blank = omitted</span>';if(section==='scheduling')html+='<h2>Required Node Labels '+help('Equality labels combine with AND. Merged with each Pod nodeSelector; conflicting values reject admission. No selector means all nodes are assumed to support this runtime.')+'</h2>'+rows('selectors')+'<button data-add="selectors">+ Add Node Label</button><div class="note warn">No live node matching is performed. Labels do not verify runtime support.</div><h2 style="margin-top:22px">Tolerations '+help('Appended during admission, excluding duplicates. Tolerations permit taints but do not select nodes. Empty key requires Exists. Seconds apply only to NoExecute; omission means forever.')+'</h2>'+d.tolerations.map((r,i)=>'<div class="row"><input aria-label="Taint key '+i+'" data-list="tolerations" data-i="'+i+'" data-prop="k" value="'+esc(r.k)+'" placeholder="Taint key…"><select aria-label="Operator '+i+'" data-list="tolerations" data-i="'+i+'" data-prop="op"><option '+(r.op==='Equal'?'selected':'')+'>Equal</option><option '+(r.op==='Exists'?'selected':'')+'>Exists</option></select><input aria-label="Taint value '+i+'" data-list="tolerations" data-i="'+i+'" data-prop="v" value="'+esc(r.v)+'" '+(r.op==='Exists'?'disabled':'')+' placeholder="Value…"><select aria-label="Effect '+i+'" data-list="tolerations" data-i="'+i+'" data-prop="effect">'+['','NoSchedule','PreferNoSchedule','NoExecute'].map(x=>'<option '+(r.effect===x?'selected':'')+' value="'+x+'">'+(x||'All effects')+'</option>').join('')+'</select>'+(r.effect==='NoExecute'?'<input aria-label="Toleration seconds '+i+'" data-list="tolerations" data-i="'+i+'" data-prop="seconds" value="'+esc(r.seconds)+'" inputmode="numeric" placeholder="Forever…">':'')+'<button data-remove="tolerations" data-i="'+i+'" aria-label="Remove toleration '+i+'">×</button></div>').join('')+'<button data-add="tolerations">+ Add Toleration</button>';if(section==='metadata')html+='<h2>Metadata Labels</h2>'+rows('labels')+'<button data-add="labels">+ Add Metadata Label</button><div class="note">Labels identify this RuntimeClass; they do not select nodes.</div>';if(errors)html+='<div class="error" role="status">'+validation().map(esc).join('<br>')+'</div>'}$('#content').innerHTML=html;if(readonly)$('#content').querySelectorAll('input,select,[data-add],[data-remove]').forEach(x=>x.disabled=true);bind()}
function validation(){let e=[];if(!d.name||d.name.length>253||!d.name.split('.').every(s=>/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(s)&&s.length<=63))e.push('Name: enter a valid DNS subdomain.');if(!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(d.handler)||d.handler.length>63)e.push('Handler: enter a lowercase DNS label, at most 63 characters.');for(let k of ['cpu','memory'])if(d[k]&&!/^\d+(\.\d+)?(m|Ki|Mi|Gi|Ti|Pi|Ei|[kMGTPE])?$/.test(d[k]))e.push(k+': use a nonnegative supported quantity or retain custom syntax in YAML.');for(let k of ['selectors','labels']){let seen=new Set;for(let r of d[k]){if(!r.k||seen.has(r.k))e.push(k+': enter unique nonempty keys.');seen.add(r.k)}}let ts=new Set;for(let r of d.tolerations){if(!r.k&&r.op!=='Exists')e.push('Empty taint key requires Exists.');if(r.effect==='NoExecute'&&r.seconds!==''&&!/^-?\d+$/.test(r.seconds))e.push('Toleration seconds must be an integer.');let key=JSON.stringify([r.k,r.op,r.op==='Equal'?r.v:'',r.effect]);if(ts.has(key))e.push('Remove duplicate toleration.');ts.add(key)}return e}
function bind(){document.querySelectorAll('[data-help]').forEach(b=>{const show=()=>{helpAnchor=b;let r=b.getBoundingClientRect();$('#help').textContent=b.dataset.help;$('#help').style.left=Math.min(r.left,innerWidth-330)+'px';$('#help').style.top=(r.bottom+6)+'px';$('#help').classList.remove('hidden')};b.onmouseenter=show;b.onfocus=show;b.onclick=show;b.onmouseleave=()=>$('#help').classList.add('hidden');b.onblur=()=>$('#help').classList.add('hidden')});$('#content').querySelectorAll('input[id]').forEach(x=>x.oninput=()=>d[x.id]=x.value);$('#content').querySelectorAll('[data-list]').forEach(x=>x.oninput=()=>{d[x.dataset.list][+x.dataset.i][x.dataset.prop]=x.value;if(x.tagName==='SELECT')render()});$('#content').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{d[b.dataset.add].push({k:'',v:'',op:'Equal',effect:'',seconds:''});render();$('#content').querySelectorAll('[data-list="'+b.dataset.add+'"]').item((d[b.dataset.add].length-1)*(b.dataset.add==='tolerations'?5:2))?.focus()});$('#content').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{d[b.dataset.remove].splice(+b.dataset.i,1);render()});if($('#source'))$('#source').oninput=e=>{raw=e.target.value};if($('#retry'))$('#retry').onclick=()=>{$('#content').insertAdjacentHTML('beforeend','<div class="note" role="status">Fixture result unchanged. No network request sent.</div>')}}
$('#scenario').onchange=e=>{scenario=e.target.value;mode='form';reset()};document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;reviewing=false;render()});$('#formMode').onclick=()=>{mode='form';localStorage.setItem('mock282-mode',mode);render()};$('#yamlMode').onclick=()=>{mode='yaml';localStorage.setItem('mock282-mode',mode);render()};$('#review').onclick=()=>{if(raw!==null){mode='form';render();return}errors=true;let e=validation();if(!e.length)reviewing=true;else section=!d.name||!d.handler?'runtime':section;render();if(e.length)$('#content input:not(:disabled)')?.focus()};$('#back').onclick=()=>{reviewing=false;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#help').classList.contains('hidden')){e.preventDefault();$('#help').classList.add('hidden');helpAnchor?.focus();$('#help').classList.add('hidden')}if(e.key==='Tab'){let els=[...$('#dialog').querySelectorAll('button:not([disabled]):not(.hidden),input:not([disabled]),select:not([disabled]),textarea')].filter(x=>x.getClientRects().length);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});reset();
// Keep only the explicit mode preference; resource drafts remain memory-only.
mode=localStorage.getItem('mock282-mode')==='yaml'?'yaml':'form';render();
