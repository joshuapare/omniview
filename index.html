<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Policy Reports · Mock 330</title><style>:root{color-scheme:dark;--bg:#101112;--panel:#191a1c;--line:#303238;--text:#e6e8eb;--muted:#9da3ae;--accent:#8bb4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select{font:inherit;color:inherit;background:#22252a;border:1px solid var(--line);border-radius:5px;min-height:32px;padding:5px 10px}button,a{touch-action:manipulation}button{cursor:pointer}button:hover{background:#303641}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true]{background:#25374f;color:#bcd4ff;border-color:#557aaa}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--accent)}.lab{display:flex;gap:12px;align-items:center;padding:20px 24px;color:var(--muted);flex-wrap:wrap}.lab label{display:flex;gap:8px;align-items:center}.shell{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 120px));margin:25px auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;box-shadow:0 20px 80px #0008}header{padding:20px 24px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0 0 8px}h2{font-size:14px;margin:0 0 16px}h3{font-size:13px}.sub{color:var(--muted);font-size:12px}.badge{border:1px solid #404550;border-radius:4px;padding:3px 6px;font-size:11px}.body{display:flex;min-height:0;flex:1}nav{width:180px;flex-shrink:0;border-right:1px solid var(--line);padding:16px 12px}nav button{display:block;width:100%;text-align:left;margin-bottom:6px;border-color:transparent;background:transparent}main{padding:20px 24px;overflow:auto;min-width:0;flex:1;overscroll-behavior:contain}.warning{padding:10px 12px;border-left:3px solid #d9ad65;background:#30291e;color:#e8ca9c;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:120px}.counts{display:flex;gap:8px;flex-wrap:wrap}.counts button{font-variant-numeric:tabular-nums}.fail{color:#ff9f9f}.pass{color:#98d9b0}.warn{color:#f1cf8c}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500}td,th{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}td button{padding:3px 6px;min-height:26px}footer{border-top:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.grid{display:grid;grid-template-columns:130px 1fr;gap:12px;overflow-wrap:anywhere}.grid dt{color:var(--muted)}.grid dd{margin:0}.help{position:absolute;max-width:330px;background:#292e37;border:1px solid #697486;border-radius:6px;padding:12px;z-index:3;box-shadow:0 8px 30px #0008}.source{white-space:pre-wrap;overflow-wrap:anywhere;background:#121416;padding:16px;border:1px solid var(--line);font:12px/1.7 monospace}.empty{padding:48px 16px;text-align:center;color:var(--muted)}.detail{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:6px}.primary{background:#345785;border-color:#6387b7}#notice{margin:12px 0;color:#e8ca9c} @media(max-width:700px){.lab{padding:10px}.shell{margin:8px auto;height:calc(100vh - 155px)}nav{width:135px;padding:12px 6px}main,header{padding:16px}footer{padding:12px}.grid{grid-template-columns:100px 1fr}th:nth-child(3),td:nth-child(3){display:none}}</style><body><div class="lab"><span>Interactive HTML mock · synthetic fixtures · no network or mutations</span><label>Kind <select id="kind"><option>PolicyReport</option><option>ClusterPolicyReport</option></select></label><label>Fixture <select id="fixture"><option value="ready">Populated</option><option value="unowned">Unknown producer</option><option value="empty">Empty results</option><option value="denied">Read denied</option><option value="missing">API not installed</option><option value="unavailable">API unavailable</option><option value="unsupported">Unsupported version</option><option value="invalid">Inconsistent report</option></select></label></div><section class="shell" aria-label="Report inspector"><header><h1 id="title"></h1><div class="sub" id="destination"></div></header><div class="body"><nav aria-label="Report sections"><button data-tab="Results">Results</button><button data-tab="Ownership">Ownership</button><button data-tab="Source">Source</button><button data-tab="Review">Action boundary</button></nav><main id="main" tabindex="-1"></main></div><footer><span class="sub grow" id="foot"></span><button id="create" disabled>Create</button><button id="edit" disabled>Edit</button><button id="review">Review boundary</button></footer></section><script>
const $=s=>document.querySelector(s);let tab='Results',outcome='',query='',producer='',detail=false;const rows=[{result:'fail',policy:'require-labels',rule:'team-label',source:'kyverno',severity:'medium',message:'Required team label is absent.',category:'Metadata',scored:true},{result:'pass',policy:'restrict-privileged',rule:'no-privileged',source:'kyverno',severity:'high',message:'No privileged containers found.',category:'Pod Security',scored:true},{result:'warn',policy:'image-origin',rule:'trusted-registry',source:'other-engine',severity:'low',message:'Registry could not be attributed.',category:'Supply Chain',scored:false},{result:'error',policy:'check-context',rule:'lookup',source:'other-engine',severity:'info',message:'Producer reported evaluation error.',category:'Context',scored:false},{result:'skip',policy:'node-baseline',rule:'linux-only',source:'kyverno',severity:'info',message:'Rule not selected for this subject.',category:'Platform',scored:false}];
function kind(){return $('#kind').value}function fixture(){return $('#fixture').value}function resource(){return kind()==='PolicyReport'?'Deployment / preview / storefront':'Node / preview-node'}function help(){return '<button id="help" aria-label="About report ownership" aria-expanded="false">?</button>'}function source(){return '# Read-only safe projection; annotations and arbitrary properties omitted\napiVersion: wgpolicyk8s.io/'+(fixture()==='unsupported'?'v9':'v1alpha2')+'\nkind: '+kind()+'\nmetadata:\n  name: preview-report\n'+(kind()==='PolicyReport'?'  namespace: preview\n':'')+'scope:\n  apiVersion: '+(kind()==='PolicyReport'?'apps/v1':'v1')+'\n  kind: '+(kind()==='PolicyReport'?'Deployment':'Node')+'\n  name: '+(kind()==='PolicyReport'?'storefront':'preview-node')+'\nsummary: {pass: 1, fail: 1, warn: 1, error: 1, skip: 1}\nresults:\n- policy: require-labels\n  rule: team-label\n  result: fail\n  source: kyverno\n  severity: medium\n  scored: true\n  timestamp: {seconds: 1793491200, nanos: 123456789}\n# Unknown source content retained outside this projection. No mutation payload.'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));$('#title').textContent=kind()+' · preview-report';$('#destination').textContent='preview-cluster / '+(kind()==='PolicyReport'?'preview namespace':'Cluster scope')+' · wgpolicyk8s.io/v1alpha2';$('#foot').textContent='Inspection only · producer-managed output';let f=fixture(),m=$('#main');if(['denied','missing','unavailable'].includes(f)){m.innerHTML='<h2>'+({denied:'Report read denied',missing:'Policy Report API not installed',unavailable:'Report API unavailable'})[f]+'</h2><div class="warning">'+({denied:'Request get access for this resource and scope. No report content loaded.',missing:'Install the CRDs and a compatible producer separately. Discovery does not prove producer support.',unavailable:'Retry the read when the API is reachable. No empty-results claim.'})[f]+'</div><button id="retry">Retry fixture read</button>';$('#retry').onclick=()=>{$('#notice')?.remove();m.insertAdjacentHTML('beforeend','<p id="notice" role="status">Fixture remains '+f+'. No request sent.</p>')};return}let warning=f==='unsupported'?'<div class="warning">Unsupported API version. Safe source inspection only; no form conversion.</div>':f==='invalid'?'<div class="warning">Reported summary does not match result rows. Treat counts as producer-reported; inspect source.</div>':'';if(f==='unsupported'&&tab==='Results')tab='Source';if(tab==='Results'){m.innerHTML=warning+'<h2>Policy results '+help()+'</h2><div class="counts">'+['pass','fail','warn','error','skip'].map(x=>'<button class="'+x+'" data-outcome="'+x+'" aria-pressed="'+(outcome===x)+'">'+x+' · '+(f==='empty'?0:1)+'</button>').join('')+'</div><div class="toolbar"><input id="search" aria-label="Filter policy or rule" placeholder="Policy or rule…" autocomplete="off" name="query"><select id="producer" aria-label="Producer"><option value="">All producers</option><option>kyverno</option><option>other-engine</option></select><button id="clear">Clear</button></div><div id="results"></div><div id="detail"></div>';$('#search').value=query;$('#producer').value=producer;$('#search').oninput=e=>{query=e.target.value;table()};$('#producer').onchange=e=>{producer=e.target.value;table()};$('#clear').onclick=()=>{outcome='';query='';producer='';detail=false;render()};document.querySelectorAll('[data-outcome]').forEach(b=>b.onclick=()=>{outcome=outcome===b.dataset.outcome?'':b.dataset.outcome;render()});table();bindHelp()}else if(tab==='Ownership'){m.innerHTML=warning+'<h2>Producer & ownership '+help()+'</h2><div class="warning">Do not edit report results to change policy behavior.</div><dl class="grid"><dt>Producer identifiers</dt><dd>'+(f==='unowned'?'Not reported':'kyverno, other-engine')+'</dd><dt>Owner reference</dt><dd>'+(f==='unowned'?'Absent · ownership unknown':resource()+' · fixture reference')+'</dd><dt>Field manager</dt><dd>'+(f==='unowned'?'Not reported':'kyverno-reports-controller · fixture metadata')+'</dd><dt>Report scope</dt><dd>'+resource()+'</dd><dt>Scope selector</dt><dd>Absent in this fixture</dd><dt>Authoring</dt><dd>Create and edit unavailable in this inspector</dd></dl><div class="detail">Producer identity is reported data, not verified controller health.</div>';bindHelp()}else if(tab==='Source'){m.innerHTML=warning+'<h2>Source <span class="badge">Read-only projection</span></h2><div class="warning">Sensitive annotations, free-text messages and arbitrary properties are not shown. This projection is never submitted.</div><pre class="source"></pre>';m.querySelector('pre').textContent=source()}else{m.innerHTML='<h2>Review action boundary</h2><div class="warning">Report changes cannot fix a violation. No create, update, delete or rescan request will be sent.</div><dl class="grid"><dt>Destination</dt><dd>preview-cluster / '+(kind()==='PolicyReport'?'preview':'cluster scope')+'</dd><dt>Object</dt><dd>'+kind()+' / preview-report</dd><dt>Available here</dt><dd>Inspect results, filter, inspect producer attribution</dd><dt>Policy changes</dt><dd>Use the owning policy editor, if installed and authorized</dd><dt>Producer action</dt><dd>No universal rescan endpoint in this API</dd></dl><button id="ack" class="primary">Acknowledge inspection only</button><div id="notice" role="status"></div>';$('#ack').onclick=()=>$('#notice').textContent='Boundary reviewed locally. No mutation sent.'}}
function table(){let r=fixture()==='empty'?[]:rows.filter(x=>(!outcome||x.result===outcome)&&(!producer||x.source===producer)&&(x.policy+' '+x.rule).includes(query.toLowerCase()));$('#results').innerHTML=r.length?'<table><thead><tr><th>Outcome / severity</th><th>Policy / rule</th><th>Producer</th><th></th></tr></thead><tbody>'+r.map(x=>'<tr><td><span class="'+x.result+'">'+x.result+'</span><br><span class="sub">'+x.severity+'</span></td><td>'+x.policy+'<br><span class="sub">'+x.rule+'</span></td><td>'+x.source+'</td><td><button data-row="'+rows.indexOf(x)+'">Inspect</button></td></tr>').join('')+'</tbody></table>':'<div class="empty" role="status">'+(fixture()==='empty'?'No results reported. This is not proof of compliance.':'No matching results. Clear filters to see all results.')+'</div>';document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{let x=rows[+b.dataset.row];$('#detail').innerHTML='<div class="detail"><h3>'+x.policy+' / '+x.rule+'</h3><dl class="grid"><dt>Message</dt><dd>'+x.message+' <span class="badge">Synthetic</span></dd><dt>Category / scored</dt><dd>'+x.category+' / '+x.scored+'</dd><dt>Observed time</dt><dd>1793491200 seconds · 123456789 nanos</dd><dt>Subject</dt><dd>'+resource()+'</dd><dt>Resource selector</dt><dd>Absent · report scope applies</dd><dt>Properties</dt><dd>Hidden in privacy-safe projection</dd></dl><button id="resource">Inspect resource reference</button><div id="reference" role="status"></div></div>';$('#resource').onclick=()=>$('#reference').textContent='Fixture reference only. Resource lookup unavailable; no navigation or write attempted.'})}
function bindHelp(){let b=$('#help');let show=()=>{if($('#popover'))return;b.setAttribute('aria-expanded','true');b.insertAdjacentHTML('afterend','<span id="popover" role="tooltip" class="help">Results belong to the reporting producer. Summary counts are reported, not recalculated. No report mutation or universal rescan action exists here.</span>')};b.onclick=show;b.onmouseenter=show;b.onfocus=show;b.onmouseleave=()=>{if(document.activeElement!==b)closeHelp()}}
function closeHelp(){let p=$('#popover');if(p){p.remove();$('#help')?.setAttribute('aria-expanded','false')}}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#popover')){e.preventDefault();closeHelp();$('#help').focus();closeHelp()}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#kind').onchange=()=>{detail=false;render()};$('#fixture').onchange=()=>{tab='Results';render()};$('#review').onclick=()=>{tab='Review';render()};render();
const renderInspector = render;
render = function () {
  if (fixture() === 'unsupported' && tab === 'Results') tab = 'Source';
  renderInspector();
  if (fixture() === 'unsupported') $('#destination').textContent = $('#destination').textContent.replace('v1alpha2', 'v9');
};
const renderResults = table;
table = function () {
  if ($('#detail')) $('#detail').replaceChildren();
  renderResults();
};
render();
</script></body></html>
