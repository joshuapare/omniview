<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Policy editor · isolated mock</title><style>
:root{color-scheme:dark;--bg:#101112;--panel:#191a1c;--line:#34373d;--muted:#a3a9b4;--accent:#8eaaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e7e9ee;font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;background:#22252b;border:1px solid var(--line);border-radius:5px;min-height:32px;padding:5px 10px}button{cursor:pointer}button:hover{background:#303541}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.active{background:#334360;color:#dce6ff;border-color:#7395df}.outside{max-width:1000px;margin:35px auto 15px;display:flex;gap:12px;align-items:center;color:var(--muted)}.shell{width:min(1000px,calc(100vw - 28px));height:min(700px,calc(100vh - 120px));margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;box-shadow:0 24px 90px #0008}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 5px}small,.muted{color:var(--muted)}.body{display:flex;flex:1;min-height:0}nav{width:180px;padding:20px 12px;background:#151618;border-right:1px solid var(--line);flex-shrink:0}nav button{display:block;width:100%;text-align:left;margin-bottom:7px;background:transparent;border-color:transparent}main{padding:20px 24px;overflow:auto;flex:1;min-width:0}h2{font-size:15px;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}hr{border:0;border-top:1px solid var(--line);margin:20px 0}.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.row input{min-width:0;flex:1}.notice{padding:11px 12px;border:1px solid #675332;background:#332a1c;border-radius:5px;margin:14px 0;color:#f0d39d}.error{color:#ffb1b6;margin:6px 0}.chip{font-size:11px;background:#263246;color:#bfd0fa;padding:3px 7px;border-radius:4px}footer{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:1px solid var(--line)}.primary{background:#7698ec;color:#101725;font-weight:650}.help{width:23px;min-height:23px;padding:0;border-radius:50%;margin-left:6px}#tip{position:absolute;z-index:5;width:300px;background:#303642;border:1px solid #6a7895;padding:12px;border-radius:6px;box-shadow:0 10px 35px #0008}textarea{width:100%;height:360px;font:12px/1.7 ui-monospace,monospace;resize:vertical}dt{color:var(--muted);margin-top:15px}dd{margin:6px 0}table{width:100%;border-collapse:collapse}td{padding:11px 0;border-bottom:1px solid var(--line)}@media(max-width:700px){nav{width:135px}.grid{grid-template-columns:1fr}.outside{margin:12px 14px}.shell{height:calc(100vh - 95px)}header,main,footer{padding:14px}.outside span{display:none}}
</style><div class="outside"><b>OMNIVIEW</b><span> / Kubernetes / Policy</span><select id="scenario" aria-label="Mock scenario"><option value="create">Create fixture</option><option value="edit">Edit fixture</option><option value="managed">Managed fixture</option><option value="denied">Permission denied</option><option value="missing">API unavailable</option></select><small>Interactive HTML mock · synthetic fixtures · no requests</small></div><section class="shell" aria-label="PodDisruptionBudget editor"><header><div><h1 id="title">Create PodDisruptionBudget</h1><small>preview-cluster → <span id="dest">choose namespace</span> · policy/v1</small></div><div><button id="form" class="active">Form</button> <button id="yaml">YAML</button></div></header><div class="body"><nav><button data-page="budget" class="active">Budget & identity</button><button data-page="selector">Pod selection</button><button data-page="policy">Unhealthy pods</button><button data-page="status">Disruption status</button><button data-page="eviction">Eviction boundary</button></nav><main id="main"></main></div><footer><span id="foot" class="muted">Draft only · nothing submitted</span><div><button id="back" hidden>Back to draft</button> <button class="primary" id="review">Review budget</button></div></footer></section><div id="tip" role="tooltip" hidden></div><script>
const $=s=>document.querySelector(s);let page='budget',mode='form',manual=false,raw='',review=false,invalid=false,scenario='create';const d={name:'',ns:'',kind:'minAvailable',unit:'pods',amount:'',selection:'labels',rows:[{key:'',op:'Equals',value:''}],policy:''};let opener;
function help(button,text){const t=$('#tip');opener=button;t.textContent=text;t.hidden=false;const r=button.getBoundingClientRect();t.style.left=Math.min(r.left,innerWidth-320)+'px';t.style.top=Math.min(r.bottom+8,innerHeight-120)+'px'}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#tip').hidden){$('#tip').hidden=true;opener?.focus()}});
function source(){if(manual)return raw;let s='# Local policy draft; no request is sent\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: '+(d.name||'""')+'\n  namespace: '+(d.ns||'""')+'\nspec:\n';if(d.amount!=='')s+='  '+d.kind+': '+(d.unit==='percent'?'"'+d.amount+'%"':d.amount)+'\n';if(d.selection==='all')s+='  selector: {}\n';else if(d.selection==='none')s+='  selector: null\n';else{const eq=d.rows.filter(r=>r.op==='Equals'&&r.key);const ex=d.rows.filter(r=>r.op!=='Equals'&&r.key);s+='  selector:\n';if(eq.length)s+='    matchLabels:\n'+eq.map(r=>'      '+r.key+': '+JSON.stringify(r.value)+'\n').join('');if(ex.length)s+='    matchExpressions:\n'+ex.map(r=>'      - key: '+r.key+'\n        operator: '+r.op+'\n'+(['In','NotIn'].includes(r.op)?'        values: ['+r.value.split(',').map(v=>JSON.stringify(v.trim())).join(', ')+']\n':'')).join('')}if(d.policy)s+='  unhealthyPodEvictionPolicy: '+d.policy+'\n';return s}
const field=(label,id,value,extra='')=>`<label>${label}<input id="${id}" name="${id}" autocomplete="off" value="${value}" ${extra}></label>`;const opts=(arr,val)=>arr.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${l}</option>`).join('');const select=(id,arr,val)=>`<select id="${id}" aria-label="${id}">${opts(arr,val)}</select>`;
function render(){const locked=scenario==='managed'||scenario==='denied'||scenario==='missing';$('#title').textContent=(scenario==='create'?'Create':'Inspect / edit')+' PodDisruptionBudget';$('#dest').textContent=d.ns||'choose namespace';$('#back').hidden=!review;$('#review').hidden=review;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#form').classList.toggle('active',mode==='form');$('#yaml').classList.toggle('active',mode==='yaml');let h='';if(scenario==='missing')h='<h2>policy/v1 unavailable</h2><div class="notice">Discovery did not return PodDisruptionBudget. Draft retained; authoring unavailable.</div>';else if(review)h=`<h2>Review ${scenario==='create'?'new':'updated'} budget</h2><span class="chip">Non-mutating review</span><dl><dt>Destination</dt><dd>preview-cluster / ${d.ns} / ${d.name}</dd><dt>Budget</dt><dd>${d.kind==='minAvailable'?'Keep at least':'Allow at most'} ${d.amount}${d.unit==='percent'?'%':' pods'} ${d.kind==='minAvailable'?'available':'unavailable'}</dd><dt>Pod selection</dt><dd>${d.selection==='all'?'ALL pods in namespace':d.selection==='none'?'No pods (null selector)':d.rows.map(r=>r.key+' '+r.op+' '+r.value).join(' AND ')}</dd><dt>Unhealthy-pod policy</dt><dd>${d.policy||'Omitted · server default IfHealthyBudget'}</dd></dl><div class="notice">Voluntary evictions may be blocked. This does not prevent direct deletion or involuntary disruption.${d.policy==='AlwaysAllow'?' Running unready pods may be evicted even when budget is not met.':''}</div><small>No API call, dry run, or permission check was performed.</small>`;else if(mode==='yaml')h=`<h2>Source draft</h2><small>Manual edits remain exact; Form becomes read-only. No parser or lossless rewrite is claimed.</small><textarea id="source" aria-label="YAML source" spellcheck="false"></textarea>${manual?'<div class="notice">Manually edited source retained. Validation and review unavailable in this isolated mock.</div>':''}`;else if(manual)h='<h2>Source-only draft</h2><div class="notice">Manual source may contain unsupported or invalid YAML. Return to YAML to repair; your exact text stays intact.</div>';else if(page==='budget')h=`<h2>Availability during voluntary disruption <button class="help" data-help="Percentages round up. minAvailable: 100% or maxUnavailable: 0 can block all voluntary evictions. maxUnavailable requires pods managed by a compatible scalable controller.">?</button></h2><div class="grid">${field('Name *','name',d.name,scenario!=='create'?'disabled':'')}<label>Namespace *${select('ns',[['','Choose namespace…'],['preview','preview'],['sandbox','sandbox']],d.ns)}</label></div>${scenario!=='create'?'<small>Identity is fixed. Spec fields remain mutable; status is controller-owned.</small>':''}<hr><label>Budget rule${select('kind',[['minAvailable','Keep a minimum available'],['maxUnavailable','Limit maximum unavailable']],d.kind)}</label><div class="grid">${field('Amount *','amount',d.amount,'inputmode="numeric"')}<label>Measure${select('unit',[['pods','Pod count'],['percent','Percentage']],d.unit)}</label></div>${invalid?'<div class="error" role="alert">Enter a DNS name, namespace, nonnegative whole amount (percentage ≤100), and valid selector rows.</div>':''}<div class="notice">Budget affects voluntary eviction only. Review pod selection before saving.</div>`;else if(page==='selector')h=`<h2>Which pods does this protect? <button class="help" data-help="policy/v1: omitted or null selector matches no pods; empty {} matches every pod in this namespace. Label and expression rows combine with AND. In and NotIn take comma-separated values; Exists and DoesNotExist omit values.">?</button></h2><label>Selection${select('selection',[['labels','Match pod labels'],['all','All pods in namespace · {}'],['none','No pods · null']],d.selection)}</label>${d.selection==='labels'?d.rows.map((r,i)=>`<div class="row"><input aria-label="Label key ${i+1}" data-row="${i}" data-prop="key" value="${r.key}" placeholder="app…"><select aria-label="Operator ${i+1}" data-row="${i}" data-prop="op">${opts(['Equals','In','NotIn','Exists','DoesNotExist'].map(x=>[x,x]),r.op)}</select><input aria-label="Label values ${i+1}" data-row="${i}" data-prop="value" value="${r.value}" ${['Exists','DoesNotExist'].includes(r.op)?'disabled':''} placeholder="web…"><button data-remove="${i}" aria-label="Remove selector ${i+1}">×</button></div>`).join('')+'<button id="add">+ Add requirement</button>':''}${d.selection==='all'?'<div class="notice">Every pod in '+(d.ns||'the chosen namespace')+' will be selected. Confirm this broad scope in review.</div>':''}<hr><label>Pod lookup fixture${select('lookup',[['ready','Available'],['loading','Loading'],['empty','Empty'],['denied','Denied'],['unavailable','Unavailable']],'ready')}</label><div id="lookupResult" class="muted">Fixture references only: preview-web-0, preview-web-1. No live match count.</div>`;else if(page==='policy')h=`<h2>Unhealthy-pod eviction <button class="help" data-help="Healthy means Ready=True. AlwaysAllow applies to Running but unready pods, not all pods. Healthy pods remain subject to the budget. Unknown future policy values must not be treated as permission to evict.">?</button></h2><label>Running, unready pods${select('policy',[['','Use server default · omit field'],['IfHealthyBudget','Only if healthy budget is satisfied'],['AlwaysAllow','Allow regardless of budget']],d.policy)}</label>${d.policy==='AlwaysAllow'?'<div class="notice">Running unready pods may be evicted before they recover, even when the application is disrupted.</div>':''}`;else if(page==='status')h='<h2>Controller-owned status <span class="chip">Read only</span></h2><div class="notice">Fixture status is stale: observedGeneration 3 ≠ metadata.generation 4. Do not use it as eviction permission.</div><table><tr><td>Disruptions allowed</td><td>1 · stale</td></tr><tr><td>Healthy / desired / expected</td><td>3 / 2 / 3 · stale</td></tr><tr><td>DisruptionAllowed condition</td><td>True · SufficientPods · stale</td></tr><tr><td>Disrupted pods</td><td>Empty fixture map</td></tr></table><small>Status counters, timestamps, conditions, and disruptedPods are never authored by this form.</small>';else h='<h2>Eviction belongs to the Pod action</h2><span class="chip">Request-only · policy/v1 Eviction</span><dl><dt>Endpoint</dt><dd>POST /api/v1/namespaces/{namespace}/pods/{name}/eviction</dd><dt>Boundary</dt><dd>Open the existing Pod eviction review with target identity.</dd><dt>Request fields</dt><dd>metadata.name / namespace; optional deleteOptions (grace period, preconditions, dryRun).</dd></dl><div class="notice">A budget is not permission to evict. RBAC, current budget and API admission decide. No Eviction resource is saved.</div><button disabled>Pod action unavailable in isolated mock</button>';
if(scenario==='managed')h='<div class="notice">Managed by fixture GitOps owner. Edit the owning source; local authoring locked.</div>'+h;if(scenario==='denied')h='<div class="notice">Update denied (fixture). Read-only inspection; draft retained.</div>'+h;$('#main').innerHTML=h;if($('#source'))$('#source').value=source();$('#review').disabled=locked||manual;$('#main').querySelectorAll('input,select,textarea').forEach(el=>{if(locked)el.disabled=true;el.oninput=()=>{if(el.id==='source'){raw=el.value;manual=true;$('#review').disabled=true;return}if(el.dataset.row!==undefined){d.rows[el.dataset.row][el.dataset.prop]=el.value;if(el.dataset.prop==='op')render()}else{d[el.id]=el.value;$('#dest').textContent=d.ns||'choose namespace';if(['selection','kind','unit','policy'].includes(el.id))render()}}});if(scenario!=='create'&&$('#ns'))$('#ns').disabled=true;document.querySelectorAll('[data-help]').forEach(b=>{b.onclick=()=>help(b,b.dataset.help);b.onfocus=()=>help(b,b.dataset.help);b.onmouseenter=()=>help(b,b.dataset.help)});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{d.rows.splice(+b.dataset.remove,1);render()});if($('#add'))$('#add').onclick=()=>{d.rows.push({key:'',op:'Equals',value:''});render();document.querySelectorAll('[data-prop="key"]')[d.rows.length-1].focus()};if($('#lookup'))$('#lookup').onchange=e=>$('#lookupResult').textContent=({ready:'Fixture references: preview-web-0, preview-web-1. No live match count.',loading:'Loading fixture lookup…',empty:'No pods returned (fixture).',denied:'Pod list permission denied (fixture); selector remains editable.',unavailable:'Pod lookup unavailable (fixture); selector remains editable.'})[e.target.value]}
$('nav').onclick=e=>{if(e.target.dataset.page){page=e.target.dataset.page;review=false;render()}};$('#form').onclick=()=>{mode='form';review=false;render()};$('#yaml').onclick=()=>{mode='yaml';review=false;render()};$('#back').onclick=()=>{review=false;render()};$('#review').onclick=()=>{invalid=!/^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$/.test(d.name)||!d.ns||!/^\d+$/.test(d.amount)||(d.unit==='percent'&&+d.amount>100)||(d.selection==='labels'&&(!d.rows.length||d.rows.some(r=>!r.key||(['Equals','In','NotIn'].includes(r.op)&&!r.value))));if(invalid){page='budget';mode='form';render();$('#name').focus()}else{review=true;render()}};$('#scenario').onchange=e=>{scenario=e.target.value;review=false;if(scenario!=='create'){Object.assign(d,{name:'preview-web-budget',ns:'preview',amount:'1',kind:'maxUnavailable'});d.rows=[{key:'app',op:'Equals',value:'preview-web'}]}render()};render();
</script></html>
