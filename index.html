<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11151b"><title>Gateway API · resource editor preview</title><style>:root{color-scheme:dark;font:13px system-ui;background:#101319;color:#e1e6ed}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#171e28;border:1px solid #354050;border-radius:5px;min-height:32px;padding:5px 10px}button{cursor:pointer}button:hover{background:#28384b}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #70b4ff;outline-offset:2px}.fixture{height:64px;padding:16px 28px;display:flex;align-items:center;gap:16px;color:#98a8bb}.fixture label{display:flex;align-items:center;gap:8px}.shell{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 100px));margin:10px auto;background:#171c24;border:1px solid #354050;border-radius:9px;display:flex;flex-direction:column;box-shadow:0 24px 70px #0007}header{padding:18px 24px;border-bottom:1px solid #303945;display:flex;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0 0 5px}small,.muted{color:#96a5b6}main{display:flex;flex:1;min-height:0}nav{width:180px;padding:20px 12px;border-right:1px solid #303945;flex-shrink:0}nav button{display:block;text-align:left;width:100%;margin-bottom:8px;border-color:transparent;background:transparent}nav button.active{background:#263d58;color:#9dceff}.content{flex:1;overflow:auto;min-width:0;padding:20px 24px;overscroll-behavior:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field input,.field select{width:100%}h2{font-size:14px;margin:0 0 18px}h3{font-size:13px}.badge{font-size:11px;border:1px solid #435061;border-radius:12px;padding:3px 8px;color:#b7c9de}.notice{border-left:3px solid #dcaa5d;background:#332c21;color:#f3d39f;padding:10px 12px;margin:0 0 16px}.error{color:#ffa7a7;margin:12px 0}.row{display:flex;gap:8px;align-items:center}footer{border-top:1px solid #303945;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}footer small{overflow-wrap:anywhere}.primary{background:#3579ba;border-color:#4a92d5;color:white}textarea{width:100%;height:360px;font:12px ui-monospace,monospace;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111720;padding:16px;color:#aaceef}dialog{max-width:440px;background:#202936;color:#e1e6ed;border:1px solid #60748c;border-radius:8px;padding:20px}dialog::backdrop{background:#0008}.help{border-radius:50%;padding:0;width:26px;min-height:26px}.actions{margin-top:18px;display:flex;gap:8px}.status{padding:14px;border:1px solid #34465a;border-radius:6px;margin-bottom:12px}@media(max-width:700px){.fixture{height:auto;flex-wrap:wrap;padding:8px}.shell{height:calc(100vh - 150px);margin:0 auto}nav{width:135px;padding:12px 6px}.content{padding:16px}.grid{grid-template-columns:1fr}header{padding:12px}footer{padding:10px}header h1{font-size:15px}}</style><body><div class="fixture"><span>◈ Synthetic fixture · no cluster connection</span><label>Resource <select id="kind"></select></label><label>Scenario <select id="scenario"><option>Create</option><option>Edit</option><option>RBAC denied</option><option>API missing</option><option>References denied</option><option>Empty references</option><option>Controller-owned</option></select></label></div><section class="shell" aria-label="Gateway resource editor"><header><div><h1 id="title"></h1><small id="subtitle"></small></div><div class="row"><span id="channel" class="badge"></span><button id="help" class="help" aria-label="Field and safety help">?</button><button id="form">Form</button><button id="source">YAML</button></div></header><main><nav id="nav"></nav><div class="content" id="content"></div></main><footer><small id="destination"></small><div class="row"><button id="reset">Reset fixture</button><button id="review" class="primary">Review draft</button></div></footer></section><dialog id="helpDialog"><h2>Gateway API help</h2><p id="helpText">References show names only. Cross-namespace backends need a ReferenceGrant in the target namespace. Discovery does not prove controller support or permission. No companion resource is created.</p><button id="closeHelp">Close help</button></dialog><script>
let defs,kind='HTTPRoute',section='Configure',mode='Form',drafts={},texts={},sourceChanged={},error='',extra=0;const $=x=>document.getElementById(x);const experimental=k=>['TCPRoute','TLSRoute','UDPRoute'].includes(k);const version=k=>k==='ReferenceGrant'?'v1beta1':experimental(k)?'v1alpha2':'v1';function put(o,p,v){let a=p.split('.');for(let i=0;i<a.length-1;i++){if(!o[a[i]])o[a[i]]=isNaN(+a[i+1])?{}:[];o=o[a[i]]}o[a.at(-1)]=v}function get(o,p){return p.split('.').reduce((v,k)=>v?.[k],o)}function init(){let d={apiVersion:'gateway.networking.k8s.io/'+version(kind),kind,metadata:{name:'preview-'+kind.toLowerCase(),...(kind==='GatewayClass'?{}:{namespace:'preview'})},spec:{}};for(let [l,p,t,v]of defs[kind]){if(p.includes('caCertificateRefs'))continue;put(d,p,t==='number'?+v:v.split('|')[0])}drafts[kind]=d;sourceChanged[kind]=false;texts[kind]=null}function render(){let d=drafts[kind];$('title').textContent=($('scenario').value==='Edit'?'Edit ':'Create ')+kind;$('subtitle').textContent='gateway.networking.k8s.io/'+version(kind);$('channel').textContent=experimental(kind)?'Experimental · support unverified':'Standard · support unverified';$('destination').textContent='preview-cluster / '+(kind==='GatewayClass'?'cluster scope · administrator':'preview')+' · local draft only';$('nav').innerHTML=['Configure','Advanced','Attachment','Review'].map(n=>`<button class="${section===n?'active':''}" data-section="${n}">${n}</button>`).join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});let s=$('scenario').value;let blocked=['RBAC denied','API missing','Controller-owned'].includes(s);$('review').disabled=blocked||sourceChanged[kind];let html='';if(blocked){html=`<h2>${s}</h2><div class="notice">${s==='RBAC denied'?'Create/update permission denied. Ask an administrator.':s==='API missing'?'Resource API unavailable. Install the matching channel before authoring.':'Managed resource. Inspect owning configuration; do not overwrite controller intent.'}</div><pre>${JSON.stringify(d,null,2)}</pre>`}else if(mode==='YAML'){html='<h2>Source draft <span class="badge">JSON syntax is valid YAML 1.2</span></h2><div class="notice">Source edits stay exact. This isolated mock cannot reconcile source back into Form; review is blocked after edits.</div><textarea id="yaml" aria-label="Exact source draft" spellcheck="false"></textarea>'}else if(sourceChanged[kind]){html='<h2>Source-only draft</h2><div class="notice">Your exact source remains intact. Return to YAML, or reset the fixture to restore guided controls.</div>'}else if(section==='Attachment'){html='<h2>Attachment & resolved references</h2>'+['Accepted','ResolvedRefs','Programmed'].map(x=>`<div class="status"><strong>${x}</strong><span class="badge" style="float:right">Unknown · no controller read</span></div>`).join('')+'<div class="notice">No live status or grant check. A configured parent is not proof of attachment.</div>'}else if(section==='Review'){html='<h2>Review local draft</h2><div class="notice">No request will be sent. '+(kind==='ReferenceGrant'?'Grant changes expand cross-namespace access.':kind==='Gateway'?'Listener changes may interrupt traffic.':kind==='GatewayClass'?'Class configuration affects attached Gateways.':'Routing or trust changes may interrupt traffic.')+'</div><pre>'+JSON.stringify(d,null,2)+'</pre>'}else if(section==='Advanced'){html='<h2>Advanced fields</h2><div class="notice">Unmodeled fields require source-only mode. No unsupported fields are silently removed.</div><h3>Ownership</h3><div class="status">metadata.name / namespace: immutable on edit<br>status: controller-owned, never authored<br>'+ (kind==='GatewayClass'?'spec.controllerName: immutable on edit':'spec: user-authored unless managed by another owner')+'</div><button id="advancedSource">Open full source</button>'}else{html=(experimental(kind)?'<div class="notice">Experimental CRD required. Controller feature support remains unverified.</div>':'')+(kind==='GatewayClass'?'<div class="notice">Administrator authoring · controllerName is immutable after creation.</div>':'')+(kind==='ReferenceGrant'?'<div class="notice">Target namespace owns this grant. Empty target name grants every matching target.</div>':'')+(s==='References denied'||s==='Empty references'?`<div class="notice">${s==='References denied'?'Reference listing denied. Retain unresolved names; no existence claim.':'No reference fixtures available. Enter an unresolved name in source.'}</div>`:'')+'<h2>'+({Gateway:'Listener & route admission',GatewayClass:'Controller & parameters',ReferenceGrant:'Cross-namespace permission',BackendTLSPolicy:'Backend identity & trust',HTTPRoute:'Match requests & split traffic',GRPCRoute:'Match RPC calls & split traffic',TCPRoute:'TCP stream destinations',TLSRoute:'TLS passthrough destinations',UDPRoute:'UDP datagram destinations'}[kind])+'</h2><div class="grid">'+field('Name','metadata.name','text',d.metadata.name,true)+(kind==='GatewayClass'?'':field('Namespace','metadata.namespace','select','preview|preview-backend',true))+defs[kind].filter(x=>!(kind==='BackendTLSPolicy'&&x[1].includes('caCertificateRefs')&&get(d,'spec.validation.wellKnownCACertificates')!=='ConfigMap reference')).map(x=>field(...x)).join('')+'</div>'+(kind.endsWith('Route')?'<div class="actions"><button id="add">+ Add backend</button><button id="remove">Remove last backend</button></div>':'')+(kind==='Gateway'?'<div class="actions"><button id="add">+ Add listener</button><button id="remove">Remove last listener</button></div>':'')+(extra?'<div class="status">'+extra+' added row(s) · included in source review</div>':'')+'<div class="error" role="status" aria-live="polite">'+error+'</div>'}
$('content').innerHTML=html;if($('yaml')){$('yaml').value=texts[kind]??JSON.stringify(d,null,2);$('yaml').oninput=e=>{texts[kind]=e.target.value;sourceChanged[kind]=true;$('review').disabled=true}}document.querySelectorAll('[data-path]').forEach(el=>el.onchange=()=>{let p=el.dataset.path,v=el.type==='number'?+el.value:el.value;put(d,p,v);if(kind==='BackendTLSPolicy'&&p==='spec.validation.wellKnownCACertificates'){if(v==='ConfigMap reference'){delete d.spec.validation.wellKnownCACertificates;put(d,'spec.validation.caCertificateRefs',[{group:'',kind:'ConfigMap',name:'backend-ca'}])}else delete d.spec.validation.caCertificateRefs}error='';if(p.endsWith('.port')&&(v<1||v>65535))error='Port must be between 1 and 65535.';if(p==='metadata.name'&&!/^[a-z0-9][a-z0-9.-]*$/.test(v))error='Use a lowercase DNS name.';if(p.endsWith('namespace')&&v==='preview-backend')error='Cross-namespace target: ReferenceGrant required in preview-backend; not verified.';if(kind==='Gateway'&&p.endsWith('.protocol')&&['TCP','UDP','HTTP'].includes(v)){delete d.spec.listeners[0].tls;if(v!=='HTTP')delete d.spec.listeners[0].hostname}render()});if($('advancedSource'))$('advancedSource').onclick=()=>{mode='YAML';render()};if($('add'))$('add').onclick=()=>{let p=kind==='Gateway'?'spec.listeners':'spec.rules.0.backendRefs';let rows=get(d,p);rows.push(kind==='Gateway'?{name:'listener-'+rows.length,protocol:'HTTP',port:8080+rows.length}:{name:'cart',port:8080,weight:0});extra++;render()};if($('remove'))$('remove').onclick=()=>{let rows=get(d,kind==='Gateway'?'spec.listeners':'spec.rules.0.backendRefs');if(rows.length>1){rows.pop();extra=Math.max(0,extra-1);render()}}}
function field(l,p,t,v,identity=false){let value=get(drafts[kind],p)??'';let disabled=$('scenario').value==='Edit'&&(identity||p==='spec.controllerName');let control=t==='select'?`<select data-path="${p}" ${disabled?'disabled':''} aria-label="${l}">${[...new Set([String(value),...v.split('|')])].map(o=>`<option ${o===String(value)?'selected':''}>${o}</option>`).join('')}</select>`:`<input data-path="${p}" aria-label="${l}" autocomplete="off" spellcheck="false" ${disabled?'disabled':''} type="${t}" value="${String(value).replaceAll('&','&amp;').replaceAll('"','&quot;')}">`;return `<label class="field"><span>${l}${disabled?' · immutable':''}</span>${control}</label>`}fetch('model.json').then(r=>r.json()).then(x=>{defs=x;$('kind').innerHTML=Object.keys(defs).map(k=>`<option ${k===kind?'selected':''}>${k}</option>`).join('');init();render()});$('kind').onchange=()=>{kind=$('kind').value;if(!drafts[kind])init();section='Configure';mode='Form';extra=0;error='';render()};$('scenario').onchange=()=>render();$('source').onclick=()=>{mode='YAML';render()};$('form').onclick=()=>{mode='Form';render()};$('reset').onclick=()=>{init();error='';extra=0;mode='Form';render()};$('review').onclick=()=>{if(error){document.querySelector('.error')?.scrollIntoView();return}section='Review';render()};$('help').onclick=()=>$('helpDialog').showModal();$('closeHelp').onclick=()=>$('helpDialog').close();$('helpDialog').addEventListener('close',()=>$('help').focus());window.addEventListener('beforeunload',e=>{e.preventDefault();e.returnValue=''});
</script><script src="interactions.js"></script></body></html>
