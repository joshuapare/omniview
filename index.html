<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>Apps resource editor · design preview</title><style>

</style><header class="outside"><strong>OMNIVIEW</strong><span>Design fixture · No cluster connection</span><select aria-label="Component" id="kind"><option>DaemonSet</option><option>ReplicaSet</option><option>Deployment-owned ReplicaSet</option><option>ControllerRevision</option></select><select aria-label="Intent" id="intent"><option>Create</option><option>Edit</option></select><button id="reopen">Open Editor</button></header><main role="dialog" aria-modal="true" aria-labelledby="title"><header class="top"><div><h1 id="title"></h1><small>preview-cluster / preview · apps/v1</small></div><div class="actions"><button id="form">Form</button><button id="yaml">YAML</button><button aria-label="Close editor" id="close">×</button></div></header><div class="layout"><nav aria-label="Editor sections"></nav><article id="content"></article></div><footer><small id="destination">Destination · preview-cluster / preview</small><div class="actions"><button id="cancel">Cancel</button><button id="review" class="primary">Review Draft</button></div></footer></main><div class="help" role="tooltip" id="help" hidden></div><script>
const $=s=>document.querySelector(s);let kind='DaemonSet',intent='Create',section='Workload',mode='Form',raw='',manual=false,helpOwner=null,reviewing=false;let d;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const inspect=()=>kind==='ControllerRevision'||kind.startsWith('Deployment-owned');

function source(){if(manual)return raw;let k=kind.startsWith('Deployment-owned')?'ReplicaSet':kind;let t=`# Synthetic draft; no request sent\napiVersion: apps/v1\nkind: ${k}\nmetadata:\n  name: ${JSON.stringify(d.name)}\n  namespace: preview\nspec:\n  selector:\n    matchLabels:\n      app: ${JSON.stringify(d.label)}\n  template:\n    metadata:\n      labels:\n        app: ${JSON.stringify(d.label)}\n    spec:\n      containers:\n        - name: main\n          image: ${JSON.stringify(d.image)}\n`;if(d.node)t+=`      nodeSelector:\n        kubernetes.io/os: ${JSON.stringify(d.node)}\n`;if(d.ready)t+=`  minReadySeconds: ${d.ready}\n`;if(kind==='ReplicaSet'&&d.replicas)t+=`  replicas: ${d.replicas}\n`;if(kind==='DaemonSet'){if(d.history)t+=`  revisionHistoryLimit: ${d.history}\n`;if(d.strategy){t+=`  updateStrategy:\n    type: ${d.strategy}\n`;if(d.strategy==='RollingUpdate'&&(d.unavailable||d.surge)){t+='    rollingUpdate:\n';for(let [key,path]of [['unavailable','maxUnavailable'],['surge','maxSurge']])if(d[key])t+=`      ${path}: ${d[key].endsWith('%')?JSON.stringify(d[key]):d[key]}\n`}}}if(d.rows.length)t+='      # Additional container ports\n'+d.rows.map(p=>`      # ${p}`).join('\n');return t}
function showHelp(e){helpOwner=e.currentTarget;let h=$('#help');h.textContent=helpOwner.dataset.help;h.hidden=false;let r=helpOwner.getBoundingClientRect();h.style.left=Math.min(r.left,innerWidth-320)+'px';h.style.top=(r.bottom+8)+'px';helpOwner.setAttribute('aria-describedby','help')}
function render(){let boundary=inspect();$('#title').textContent=boundary?`Inspect ${kind}`:`${intent} ${kind}`;$('#review').hidden=boundary;$('#form').textContent=boundary?'Inspect':'Form';$('#form').disabled=manual;$('#yaml').disabled=reviewing;let sections=boundary?['Overview','Ownership','Status & Actions']:['Workload','Placement & Lifecycle','Advanced'];$('nav').innerHTML=sections.map(s=>`<button class="${section===s?'active':''}" data-section="${s}">${s}</button>`).join('');let c='';if(reviewing){c=`<h2>Review · ${intent} ${kind}</h2><div class="warning">Non-mutating preview. No resource was saved.</div><div class="line"><span>Destination</span><strong>preview-cluster / preview</strong></div><div class="line"><span>Resource</span><strong>${esc(d.name)}</strong></div><div class="warning">${kind==='DaemonSet'?(d.strategy==='OnDelete'?'Updated Pods require explicit deletion through existing actions.':'Pod template changes can replace Pods on eligible nodes.'):'Matching orphan Pods may be adopted. Replica changes can terminate Pods.'}</div><textarea aria-label="Review source" readonly>${esc(source())}</textarea><button id="back">Back to Draft</button>`}
else if(mode==='YAML'){c=`<h2>${boundary?'Source projection':'Advanced Source'}</h2><div class="source-note muted">${boundary?'Read-only · annotation values and revision payload withheld.':'Manual source edits stay intact. Form locks; this mock does not parse YAML.'}</div><textarea id="source" aria-label="Manifest source" ${boundary?'readonly':''}>${esc(boundary?`apiVersion: apps/v1\nkind: ${kind==='ControllerRevision'?'ControllerRevision':'ReplicaSet'}\nmetadata:\n  name: preview-revision\n  namespace: preview\n  # annotation values withheld\n${kind==='ControllerRevision'?'revision: 7\n# data withheld: opaque controller snapshot':'# ownerReferences: Deployment / preview-app\n# status is read-only'}`:source())}</textarea>${manual?'<div class="warning">Source retained verbatim. Guided editing and Review are unavailable for unparsed source.</div>':''}`}
else if(boundary){if(section==='Workload')section='Overview';if(section==='Overview')c=kind==='ControllerRevision'?`<h2>Controller Snapshot <span class="pill">Read-only</span></h2><div class="line"><span>Name</span><strong>node-agent-revision-7</strong></div><div class="line"><span>Revision · int64</span><strong>7</strong></div><div class="line"><span>Owner</span><strong>DaemonSet / node-agent</strong></div><div class="box" style="margin-top:16px"><strong>Payload withheld</strong><div class="muted" style="margin-top:8px">Opaque controller data may contain sensitive template values.</div></div><div class="warning">No ordinary Create or Edit. Snapshot data is immutable.</div>`:`<h2>Deployment-managed ReplicaSet</h2><div class="warning">Edit the owning Deployment. Direct changes may be overwritten.</div><div class="line"><span>ReplicaSet</span><strong>preview-app-7b6c9</strong></div><div class="line"><span>Controller owner</span><strong>Deployment / preview-app</strong></div><div class="line"><span>Desired / ready · fixture</span><strong>3 / 2</strong></div><button id="owner">Open Owner Context</button>`;else if(section==='Ownership')c=`<h2>Ownership</h2><div class="line"><span>controller: true</span><strong>${kind==='ControllerRevision'?'DaemonSet / node-agent':'Deployment / preview-app'}</strong></div><div class="line"><span>Scope</span><strong>preview namespace</strong></div><div class="warning">Do not detach ownership or adopt this object from this editor.</div><button id="owner">Open Owner Context</button>`;else c=`<h2>Status & Existing Actions</h2><label>Capability fixture<select id="capability"><option>Available</option><option>Denied</option><option>Unavailable</option><option>Missing</option><option>Empty</option><option>Loading</option></select></label><div id="capstate" role="status">Fixture only · permission and controller state are not verified.</div><div class="box" style="margin-top:16px">${kind==='ControllerRevision'?'ControllerRevision has no status subresource.':'status.replicas / readyReplicas / availableReplicas are read-only.'}</div><button id="action">${kind==='ControllerRevision'?'Review Revision Action Boundary':'Review Scale Boundary'}</button>`}
else if(section==='Workload'){c=`<h2>${kind==='DaemonSet'?'Run on Eligible Nodes':'Manage Standalone Replicas'} <button class="helpbtn" aria-label="Workload help" data-help="${kind==='DaemonSet'?'One Pod per eligible node. No replicas field or Scale endpoint. Node placement does not guarantee scheduling.':'Standalone only. Selectors can adopt matching orphan Pods. Prefer Deployment for managed rollouts.'}">?</button></h2>${kind==='ReplicaSet'?'<div class="warning">Standalone only. Verify no controller owner; matching orphan Pods may be adopted.</div>':''}<div class="grid">${field('Name *','name','e.g. node-agent…',intent==='Edit')}<label>Namespace<input value="preview" disabled aria-label="Namespace"></label></div>${field('Container Image *','image','registry.example/team/image:tag…')}<div class="grid">${field('Pod Label · app *','label','e.g. node-agent…',intent==='Edit')}${kind==='ReplicaSet'?field('Desired Replicas · optional','replicas','Server default if omitted…'):choice('Update Strategy','strategy',[['','Server default · omitted'],['RollingUpdate','Rolling Update'],['OnDelete','On Delete']])}</div><small>Selector and Pod label stay linked. Existing selector is locked.</small>${kind==='DaemonSet'&&d.strategy==='RollingUpdate'?`<div class="grid" style="margin-top:16px">${field('Max Unavailable · count or %','unavailable','e.g. 1 or 10%…')}${field('Max Surge · count or %','surge','e.g. 0 or 10%…')}</div>`:''}${d.strategy==='OnDelete'?'<div class="warning" style="margin-top:16px">Existing Pods remain until explicitly deleted through existing actions.</div>':''}<div id="errors" role="alert"></div>`}
else if(section==='Placement & Lifecycle'){c=`<h2>Placement & Lifecycle</h2><div class="grid">${choice('Node OS · optional','node',[['','No added constraint'],['linux','Linux'],['windows','Windows']])}${field('Minimum Ready · seconds','ready','Omitted…')}</div>${kind==='DaemonSet'?field('Revision History Limit','history','Omitted…'):''}<div class="box"><strong>Additional Pod Configuration</strong><div class="muted" style="margin-top:8px">Use Advanced Source for affinity, tolerations, volumes, resources, probes, and multiple containers.</div></div><div class="warning">Placement changes can remove Pods from nodes. No node-count or scheduling promise.</div>`}
else c=`<h2>Advanced Configuration</h2><div class="line"><span>Pod restart policy</span><strong>Always · API constraint</strong></div><div class="line"><span>Selector expressions</span><strong>Preserve existing · source only</strong></div><div class="line"><span>Unknown fields</span><strong>Source only · never normalized</strong></div><button id="advancedSource">Edit Source</button><div class="warning" style="margin-top:16px">This isolated mock locks Form after raw source edits. Production must reuse existing AST patching.</div>`;
$('#content').innerHTML=c;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});document.querySelectorAll('[data-key]').forEach(e=>e.oninput=()=>{d[e.dataset.key]=e.value;if(e.tagName==='SELECT')render()});document.querySelectorAll('[data-help]').forEach(e=>{e.onclick=showHelp;e.onmouseenter=showHelp;e.onfocus=showHelp;e.onmouseleave=()=>$('#help').hidden=true});if($('#source')&&!boundary)$('#source').oninput=e=>{raw=e.target.value;manual=true;$('#form').disabled=true;$('#review').disabled=true};if($('#back'))$('#back').onclick=()=>{reviewing=false;render()};if($('#advancedSource'))$('#advancedSource').onclick=()=>{mode='YAML';render()};if($('#owner'))$('#owner').onclick=()=>{$('#content').innerHTML='<h2>Owner Context</h2><div class="warning">Fixture navigation boundary. Open existing owner inspector in production.</div><button id="returnOwner">Return to Snapshot</button>';$('#returnOwner').onclick=render};if($('#capability'))$('#capability').onchange=e=>{$('#capstate').textContent=({Denied:'Permission denied · request access; keep existing reference.',Unavailable:'Discovery unavailable · retry lookup; do not infer absence.',Missing:'Owner not found · do not detach automatically.',Empty:'No matching revisions in fixture namespace.',Loading:'Loading fixture references…',Available:'Fixture only · permission and controller state are not verified.'})[e.target.value]};if($('#action'))$('#action').onclick=()=>{$('#content').innerHTML=`<h2>Action Boundary</h2><div class="warning">No request sent. ${kind==='ControllerRevision'?'Do not edit opaque data or invent a rollback payload. Use existing owner rollout workflow after permission checks.':'Scale owning Deployment via autoscaling/v1 Scale subresource, not this child. Check HPA and field-manager ownership first.'}</div><button id="returnAction">Return</button>`;$('#returnAction').onclick=render};$('#review').disabled=manual}
$('#kind').onchange=e=>{kind=e.target.value;reset()};$('#intent').onchange=e=>{intent=e.target.value;reset()};$('#yaml').onclick=()=>{mode='YAML';render()};$('#form').onclick=()=>{mode='Form';render()};$('#review').onclick=()=>{let errors=[];if(!d.name)errors.push(['name','Enter a resource name.']);if(!d.image)errors.push(['image','Enter a container image.']);if(!d.label)errors.push(['label','Enter a linked selector label.']);for(let k of ['replicas','ready','history'])if(d[k]&&!/^\d+$/.test(d[k]))errors.push([k,'Use a non-negative whole number.']);for(let k of ['unavailable','surge'])if(d[k]&&!/^\d+%?$/.test(d[k]))errors.push([k,'Use a non-negative count or percentage.']);if(d.strategy==='RollingUpdate'&&d.unavailable==='0'&&d.surge==='0')errors.push(['surge','Max surge and max unavailable cannot both be zero.']);if(errors.length){section='Workload';mode='Form';render();$('#errors').innerHTML=errors.map(([k,t])=>`<div class="error">${t}</div>`).join('');document.querySelector(`[data-key="${errors[0][0]}"]`)?.focus();return}reviewing=true;render()};function close(){if(!$('#help').hidden){$('#help').hidden=true;helpOwner?.focus();return}$('main').hidden=true;$('main').style.display='none';$('#reopen').focus()}$('#close').onclick=close;$('#cancel').onclick=close;$('#reopen').onclick=()=>{$('main').hidden=false;$('main').style.display='flex';render();$('#form').focus()};document.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('main').style.display!=='none'){let a=[...$('main').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(x=>x.offsetParent!==null);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}};reset();
