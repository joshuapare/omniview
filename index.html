<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>Authentication request preview</title><style>:root{color-scheme:dark;font:13px system-ui;background:#101112;color:#e5e7eb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#191b20;border:1px solid #41454f;border-radius:5px;min-height:32px;padding:6px 10px}button{cursor:pointer}button:hover{background:#343943}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #85b7ff;outline-offset:2px}header.shell{height:48px;padding:14px 24px;border-bottom:1px solid #292d33;color:#9ba4b3}.fixture{text-align:center;color:#a2aab8;font-size:12px;margin:22px}main{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 110px));margin:auto;background:#1f2125;border:1px solid #40444d;border-radius:9px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 70px #0008}header.top{padding:18px 24px;border-bottom:1px solid #383c44;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 6px}small,.muted{color:#a5adbb}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid #383c44}nav button{width:100%;text-align:left;margin-bottom:8px;border-color:transparent;background:transparent}nav button.active{background:#2e3c52;color:#b5d5ff}.content{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}h2{font-size:15px;margin:0 0 20px}.field{margin:16px 0}label{display:block;margin-bottom:7px}input,select{width:100%}.row{display:flex;gap:8px;margin-bottom:8px}.row input{flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{border-left:3px solid #d5a351;background:#372f23;padding:10px 12px;margin:16px 0;line-height:1.5}.info{border-color:#6b9dd9;background:#263144}.error{color:#ffb1b1;margin:8px 0}.primary{background:#3972bc;border-color:#5790dc;color:white}footer{padding:14px 24px;border-top:1px solid #383c44;display:flex;align-items:center;gap:10px}footer span{flex:1;color:#a5adbb}pre{white-space:pre-wrap;word-break:break-word;background:#15171b;border:1px solid #383c44;border-radius:5px;padding:16px;line-height:1.7}textarea{width:100%;height:240px;font-family:monospace}.help{width:28px;min-height:25px;padding:0;margin-left:6px}.popover{background:#303845;border:1px solid #6d829e;padding:12px;margin:8px 0;line-height:1.6}.badge{font-size:11px;color:#b6d3fa;background:#2e3c52;padding:3px 7px;border-radius:4px}dl{display:grid;grid-template-columns:170px 1fr;gap:14px}dd{margin:0}details{border-top:1px solid #3a3e46;padding-top:14px;margin-top:20px}summary{cursor:pointer}a{color:#a9cdff}@media(max-width:650px){nav{width:138px}.grid{grid-template-columns:1fr}.content{padding:16px}footer{padding:12px}header.top{padding:14px}.fixture{margin:12px}dl{grid-template-columns:1fr}}</style><header class="shell">Omniview　 /　 Kubernetes　 /　 Authentication</header><div class="fixture">INTERACTIVE DESIGN MOCK · Synthetic fixtures only · No network actions · Not shipped React</div><main aria-label="Authentication preview"><header class="top"><div><h1 id="title"></h1><small id="destination"></small></div><span class="badge">Request only · v1</span></header><div class="body"><nav aria-label="Request type"><button data-kind="TokenReview">Review a token</button><button data-kind="SelfSubjectReview">Inspect my identity</button><button data-kind="TokenRequest">Request SA token</button></nav><section class="content" id="content"></section></div><footer><span id="foot">Local draft · Nothing sent</span><button id="back">Edit request</button><button id="source">Source</button><button class="primary" id="review">Review request</button></footer></main><script>
let kind='TokenReview',mode='form',aud=[],token='',expiration='',binding='None',sa='',obj='',reviewed=false,sourceDraft='',manual=false;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function help(){return '<button class="help" aria-label="Audience help" id="help">?</button><div id="popover" class="popover" hidden>TokenReview: omitted audiences use the API server audience. Explicit audiences require a compatible returned audience. TokenRequest: each audience expands where the token may be used.</div>'}
function payload(){if(kind==='SelfSubjectReview')return 'apiVersion: authentication.k8s.io/v1\nkind: SelfSubjectReview\n';return 'apiVersion: authentication.k8s.io/v1\nkind: '+kind+'\nspec:\n'+(kind==='TokenReview'?'  token: [REDACTED — preview only]\n':'')+'  audiences: '+JSON.stringify(aud)+'\n'+(kind==='TokenRequest'?(expiration?'  expirationSeconds: '+expiration+'\n':'')+(binding!=='None'?'  boundObjectRef:\n    kind: '+binding+'\n    apiVersion: v1\n    name: '+obj+'\n    uid: fixture-object-uid\n':''):'')}
function render(){ $('#title').textContent={TokenReview:'Review a bearer token',SelfSubjectReview:'Inspect current identity',TokenRequest:'Request a ServiceAccount token'}[kind];$('#destination').textContent='preview-cluster / '+(kind==='TokenRequest'?'preview / '+(sa||'Select ServiceAccount'):'Cluster-scoped endpoint');document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));$('#source').textContent=mode==='source'?'Form':'Source';$('#back').hidden=!reviewed;$('#review').hidden=reviewed;let c='';if(mode==='source'){c='<h2>Source · '+(kind==='SelfSubjectReview'?'Request body':'Redacted projection')+'</h2><div class="note info">Preview only. Never submitted or parsed into the request.</div><pre>'+esc(payload())+'</pre><details><summary>Unsupported source preservation demo</summary><label for="raw">Non-sensitive source scratchpad</label><textarea id="raw" spellcheck="false" autocomplete="off">'+esc(sourceDraft)+'</textarea><p class="muted">Independent scratchpad. Form conversion unavailable; text remains verbatim.</p></details>'}else if(reviewed){c='<h2>Review · No request sent</h2><div class="note">'+(kind==='TokenRequest'?'Issuing a token grants credentials for the selected ServiceAccount. Issuer may change requested lifetime.':'Review POST does not save a resource. Identity results may contain sensitive attributes.')+'</div><dl><dt>Method</dt><dd>POST</dd><dt>Endpoint</dt><dd>'+esc(endpoint())+'</dd><dt>Request persistence</dt><dd>None · no create/edit resource lifecycle</dd><dt>Credentials & identity</dt><dd>Masked; never included in review exports</dd></dl><h2 style="margin-top:24px">Response preview</h2><label for="result">Fixture outcome</label><select id="result"><option>Not executed</option><option>Denied · 403</option><option>Unavailable · endpoint missing</option><option>Transport unavailable</option><option>Authenticated · audience mismatch</option><option>Unauthenticated</option><option>Result available · values masked</option></select><div id="outcome" class="note info">No server response. Preview cannot verify authorization or identity.</div>'}else if(kind==='SelfSubjectReview'){c='<h2>Current connection identity</h2><div class="note info">Uses current connection credentials. No identity input or impersonation controls.</div><dl><dt>Request fields</dt><dd>No spec; no authored username</dd><dt>Response ownership</dt><dd>Server-owned · read-only</dd><dt>Identity</dt><dd>Masked</dd><dt>Groups / extra attributes</dt><dd>Masked</dd></dl><details><summary>Connection context</summary><p class="muted">If the connection already impersonates, server returns that identity. This view does not configure impersonation.</p></details>'}else{c='<h2>'+ (kind==='TokenReview'?'Token to check':'Token purpose & destination')+'</h2>';if(kind==='TokenReview')c+='<div class="field"><label for="token">Bearer token *</label><input type="password" id="token" autocomplete="off" spellcheck="false" value="'+esc(token)+'"><div class="muted" style="margin-top:7px">Memory only · masked · never logged</div></div>';else c+='<div class="grid"><div><label for="sa">ServiceAccount *</label><select id="sa"><option value="">Choose existing account…</option><option '+(sa?'selected':'')+'>preview-runner</option></select></div><div><label for="lookup">Reference availability</label><select id="lookup"><option>Fixture references</option><option>Loading…</option><option>Empty</option><option>Denied</option><option>Unavailable</option></select></div></div><div id="lookupmsg" aria-live="polite"></div>';c+='<div class="field"><label>Audiences '+(kind==='TokenRequest'?'*':'(optional)')+help()+'</label><div id="audiences">'+aud.map((a,i)=>'<div class="row"><input aria-label="Audience '+(i+1)+'" data-a="'+i+'" value="'+esc(a)+'" autocomplete="off"><button data-remove="'+i+'" aria-label="Remove audience '+(i+1)+'">Remove</button></div>').join('')+'</div><button id="add">+ Add audience</button></div>';if(kind==='TokenRequest')c+='<div class="grid"><div><label for="expiration">Requested lifetime (seconds)</label><input id="expiration" inputmode="numeric" value="'+esc(expiration)+'" placeholder="Issuer default…" autocomplete="off"></div><div><label for="binding">Bind to existing object</label><select id="binding">'+['None','Pod','Secret','Node'].map(x=>'<option '+(binding===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div>'+(binding!=='None'?'<div class="field"><label for="object">'+binding+' reference</label><select id="object"><option value="">Choose existing object…</option><option '+(obj?'selected':'')+'>preview-bound-object</option></select><small>UID resolved from fixture reference · '+(binding==='Node'?'cluster-scoped':'same namespace')+'</small></div>':'')+'<div class="note">Multiple audiences extend credential use. No token is issued during review.</div>';c+='<div id="error" class="error" role="alert"></div>'}$('#content').innerHTML=c;bind()}
function endpoint(){return kind==='TokenRequest'?'/api/v1/namespaces/preview/serviceaccounts/'+(sa||'{name}')+'/token':'/apis/authentication.k8s.io/v1/'+(kind==='TokenReview'?'tokenreviews':'selfsubjectreviews')}
function bind(){if($('#token'))$('#token').oninput=e=>token=e.target.value;document.querySelectorAll('[data-a]').forEach(i=>i.oninput=e=>aud[+i.dataset.a]=e.target.value);document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{aud.splice(+b.dataset.remove,1);render()});if($('#add'))$('#add').onclick=()=>{aud.push('');render();document.querySelector('[data-a="'+(aud.length-1)+'"]').focus()};if($('#sa'))$('#sa').onchange=e=>{sa=e.target.value;$('#destination').textContent='preview-cluster / preview / '+(sa||'Select ServiceAccount')};if($('#expiration'))$('#expiration').oninput=e=>expiration=e.target.value;if($('#binding'))$('#binding').onchange=e=>{binding=e.target.value;render()};if($('#object'))$('#object').onchange=e=>obj=e.target.value;if($('#lookup'))$('#lookup').onchange=e=>{$('#lookupmsg').textContent=e.target.value==='Fixture references'?'':e.target.value+' · no reference selection available';$('#sa').disabled=e.target.value!=='Fixture references'};if($('#help')){const b=$('#help'),p=$('#popover');b.onclick=()=>p.hidden=!p.hidden;b.onfocus=b.onmouseenter=()=>p.hidden=false;b.onmouseleave=()=>{if(document.activeElement!==b)p.hidden=true}}if($('#raw'))$('#raw').oninput=e=>sourceDraft=e.target.value;if($('#result'))$('#result').onchange=e=>{$('#outcome').textContent=({'Denied · 403':'Denied: create permission required. Draft retained.','Unavailable · endpoint missing':'Endpoint unavailable: check discovered version. Draft retained.','Transport unavailable':'Connection unavailable. No response inferred. Draft retained.','Authenticated · audience mismatch':'Do not accept: no compatible audience returned. Authentication alone is insufficient.','Unauthenticated':'Token not authenticated. No identity inferred.','Result available · values masked':kind==='TokenRequest'?'Fixture response: token masked; expirationTimestamp server-owned. No real token issued.':'Fixture response: identity, groups and extra values masked; server-owned, not editable.'})[e.target.value]||'No server response. Preview cannot verify authorization or identity.'}}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;mode='form';reviewed=false;render()});$('#source').onclick=()=>{mode=mode==='source'?'form':'source';render()};$('#back').onclick=()=>{reviewed=false;mode='form';render()};$('#review').onclick=()=>{if(mode==='source'){mode='form';render()}let msg='',target='';if(kind==='TokenReview'&&!token){msg='Enter a token to review.';target='#token'}if(kind==='TokenRequest'&&(!sa||!aud.length||aud.some(a=>!a.trim())||(expiration&&!/^[1-9][0-9]*$/.test(expiration))||(binding!=='None'&&!obj))){msg='Select an account, enter audiences, use positive integer seconds, and resolve any bound object.';target=!sa?'#sa':aud.length?'[data-a]':'#add'}if(msg){$('#error').textContent=msg;$(target).focus();return}reviewed=true;mode='form';render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#popover')&&!$('#popover').hidden){$('#popover').hidden=true;$('#help').focus();$('#popover').hidden=true;e.preventDefault()}});render();
document.querySelector('#review').addEventListener('click',e=>{
  if(kind==='TokenRequest' && expiration && (!/^[0-9]+$/.test(expiration) || BigInt(expiration)<600n || BigInt(expiration)>4294967296n)){
    e.stopImmediatePropagation();
    mode='form';reviewed=false;render();
    $('#error').textContent='Enter lifetime from 600 to 4294967296 seconds, or leave it omitted.';
    $('#expiration').focus();
  }
},true);
</script></html>
