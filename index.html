<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACME lifecycle inspector · Mock 297</title><style>:root{color-scheme:dark;--bg:#141517;--panel:#1f2125;--line:#353840;--muted:#a2a9b5;--accent:#8bafff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e7e9ef;font:13px system-ui}button,select,input{font:inherit;color:inherit;background:#272a30;border:1px solid var(--line);border-radius:5px;height:32px;padding:0 10px}button{cursor:pointer;touch-action:manipulation}button:hover{background:#343946}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent)}.fixture{padding:15px 24px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.shell{margin:35px auto;width:min(1000px,calc(100% - 32px));height:700px;max-height:calc(100vh - 120px);background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 20px 90px #0008}header,footer{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:18px;margin:0 0 6px}h2{font-size:15px;margin:0 0 16px}small,.muted{color:var(--muted)}.workspace{display:flex;flex:1;min-height:0}nav{width:180px;padding:20px 12px;border-right:1px solid var(--line);flex-shrink:0}nav button{width:100%;text-align:left;margin-bottom:8px;background:none;border-color:transparent}nav button.active{background:#303b52;color:#b9ceff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}footer{border-top:1px solid var(--line);border-bottom:0}.badge{display:inline-block;border:1px solid #596044;color:#d7dca9;padding:3px 8px;border-radius:12px}.notice{padding:10px 12px;background:#302d23;border:1px solid #655735;border-radius:5px;margin-bottom:16px;color:#ebd6a3}.error{background:#38272c;border-color:#84515d;color:#ffb6c6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{border-bottom:1px solid var(--line);padding:8px 0 13px;overflow-wrap:anywhere}.field small{display:block;margin-bottom:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0}.card{border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}.timeline{border-left:2px solid #64779d;padding-left:18px;display:grid;gap:18px;margin:18px 4px}.help{position:fixed;z-index:3;top:175px;right:max(25px,calc((100vw - 950px)/2));width:280px;background:#323947;border:1px solid #7286b4;padding:14px;border-radius:6px;box-shadow:0 10px 30px #0008}.help[hidden]{display:none}textarea{width:100%;height:335px;background:#141619;color:#c9d9f6;border:1px solid var(--line);padding:12px;font:12px/1.6 ui-monospace;resize:vertical}.primary{background:#4164a6}.link{color:#b9ceff}#announce{min-height:20px;margin-top:10px;color:#c2d1f2}@media(max-width:700px){.shell{margin:10px auto;max-height:calc(100vh - 150px)}nav{width:130px}.grid{grid-template-columns:1fr}header,footer{padding:12px}main{padding:16px}.fixture{padding:10px}h1{font-size:16px}}</style>
<div class="fixture">INTERACTIVE DESIGN MOCK · Synthetic fixtures only · No cluster requests<label>Resource <select id="kind"><option>Order</option><option>Challenge</option></select></label><label>Fixture <select id="scenario"><option value="normal">Available</option><option value="denied">Read denied</option><option value="missing">CRD missing</option><option value="unavailable">Discovery unavailable</option><option value="empty">No related resources</option><option value="orphan">Owner unresolved</option><option value="unsupported">Unsupported version</option></select></label></div>
<section class="shell" role="dialog" aria-modal="true" aria-labelledby="title"><header><div><h1 id="title"></h1><small>preview-cluster / preview · acme.cert-manager.io/v1</small></div><span class="badge">Inspect only</span></header><div class="workspace"><nav aria-label="Inspector sections"><button data-tab="Overview" class="active">Overview</button><button data-tab="Authorization">Authorization</button><button data-tab="Solver">Solver diagnostics</button><button data-tab="Source">Source projection</button><button data-tab="Actions">Action boundary</button></nav><main id="content"></main></div><footer><small>Controller-owned · No edits or status writes</small><button id="review" class="primary">Review boundary</button></footer></section><div id="help" class="help" role="tooltip" hidden></div><script>
let tab='Overview',kind='Order',scenario='normal',solver='DNS-01';const content=document.querySelector('#content');const field=(label,value)=>`<div class="field"><small>${label}</small>${value}</div>`;const helpButton=()=>'<button id="helpButton" aria-label="Explain lifecycle ownership" aria-describedby="help">?</button>';function render(){document.querySelector('#title').textContent=`${kind} · ${kind==='Order'?'preview-cert-1':'preview-cert-1-dns'}`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let body='';if(['denied','missing','unavailable','unsupported'].includes(scenario)){body=`<h2>${tab}</h2><div class="notice error">${{denied:'Read denied · Request get permission for this namespaced resource.',missing:'ACME CRD not installed · Install cert-manager through your administrator.',unavailable:'Discovery unavailable · Retry discovery before choosing a provider.',unsupported:'Unsupported version · Keep original source intact; this v1 inspector is unavailable.'}[scenario]}</div><button id="retry">Retry fixture lookup</button>`;}else if(tab==='Overview'){body=`<div class="row"><h2>Lifecycle snapshot</h2>${helpButton()}</div><div class="notice">Generated by cert-manager. Change certificate intent at its owner, not here.</div><div class="grid">${field('Observed state','pending')}${field('Owner',scenario==='orphan'?'Unresolved · Do not infer ownership':kind==='Order'?'CertificateRequest / preview-cert-1':'Order / preview-cert-1')}${field('Issuer reference','ClusterIssuer / preview-acme')}${field(kind==='Order'?'Requested identifiers':'Identifier',kind==='Order'?'preview.example.invalid · *.preview.example.invalid':'preview.example.invalid · Wildcard: true')}${field(kind==='Order'?'Requested duration':'Processing',kind==='Order'?'2160h · requested, not issued':'true · controller scheduled')}${field(kind==='Order'?'Profile':'Presented',kind==='Order'?'Not specified':'true · self-check not proven')}</div><div class="timeline"><div>1 · ${kind==='Order'?'CertificateRequest linked':'Order linked'}</div><div>2 · Authorization pending</div><div>3 · Awaiting ${kind==='Order'?'challenge completion':'self-check'} · No success inferred</div></div>`;}else if(tab==='Authorization'){body=`<h2>${kind==='Order'?'Authorizations':'Challenge status'}</h2><div class="notice">${kind==='Order'?'An initially valid authorization may reuse validation without a Challenge.':'Presented does not mean self-check passed or certificate issued.'}</div>${scenario==='empty'?'<div class="card">No related resources returned. No Challenge is fabricated.</div>':`<div class="card"><div class="row"><strong>preview.example.invalid</strong><span class="badge">pending</span></div>${field('Wildcard','true · identifier excludes *.')}${field('Initial authorization state','pending')}${field('Offered challenge types','dns-01 · http-01')}<button id="related">Inspect related ${kind==='Order'?'Challenge':'Order'}</button></div>`}${field('Reason · sanitized fixture','Waiting for DNS propagation. Inspect DNS solver configuration.')}${field('Failure time','Not reported')}<div id="announce" role="status"></div>`;}else if(tab==='Solver'){body=`<h2>Solver diagnostics</h2><div class="row"><label>Fixture solver <select id="solver"><option ${solver==='DNS-01'?'selected':''}>DNS-01</option><option ${solver==='HTTP-01'?'selected':''}>HTTP-01</option></select></label><span class="badge">Read-only configuration</span></div>${solver==='DNS-01'?`<div class="grid">${field('Record name','_acme-challenge.preview.example.invalid')}${field('Provider','Cloudflare · fixture configuration')}${field('Secret reference','preview-dns / api-token · values never fetched')}${field('Propagation','Not verified · status reason only')}</div>`:`<div class="grid">${field('Ingress class','preview-nginx')}${field('Solver resources','Pod / Service / Ingress · fixture links only')}${field('HTTP route','Challenge path hidden · token protected')}${field('Reachability','Not tested')}</div>`}<div class="notice">No DNS queries, HTTP probes, Secret reads, or solver changes occur.</div><button id="diagnostics">Open existing diagnostics handoff</button><div id="announce" role="status"></div>`;}else if(tab==='Source'){body=`<h2>Redacted source projection</h2><div class="notice">Read-only projection. Never used as a draft or mutation payload.</div><textarea readonly aria-label="Redacted source projection" spellcheck="false">apiVersion: acme.cert-manager.io/v1
kind: ${kind}
metadata:
  name: ${kind==='Order'?'preview-cert-1':'preview-cert-1-dns'}
  namespace: preview
  annotations: "[hidden]"
spec:
  issuerRef:
    name: preview-acme
    kind: ClusterIssuer
  ${kind==='Order'?'request: "[hidden]"':'token: "[hidden]"\n  key: "[hidden]"\n  solver: "[sensitive configuration hidden]"'}
status:
  state: pending
  # Sensitive fields and endpoint URLs omitted from projection</textarea><small>Unknown fields stay in original source. Raw source editing unavailable in this mock.</small>`;}else{body=`<h2>Review ownership boundary</h2><div class="notice">Deleting lifecycle resources can interrupt issuance and trigger reconciliation. No delete or retry mutation is offered.</div><div class="grid">${field('Destination','preview-cluster / preview')}${field('Resource',kind)}${field('Create / Edit','Unavailable · controller-managed lifecycle')}${field('Status / finalizers','Read-only · never manually cleared')}</div><div class="card"><h2>Safe next step</h2><label>Find owner by name <input id="owner" name="owner" autocomplete="off" placeholder="Certificate owner name…"></label><button id="handoff">Review owner handoff</button><p id="error" role="alert"></p><div id="announce" role="status"></div></div>`;}content.innerHTML=body;wire();}function wire(){const h=document.querySelector('#helpButton');if(h){const show=()=>{document.querySelector('#help').textContent='Orders and Challenges are generated lifecycle records. The certificate owner defines intent. Observed states do not prove certificate validity. Escape closes this help and restores focus.';document.querySelector('#help').hidden=false;};h.onmouseenter=show;h.onfocus=show;h.onclick=show;h.onmouseleave=()=>document.querySelector('#help').hidden=true;}document.querySelector('#solver')?.addEventListener('change',e=>{solver=e.target.value;render()});document.querySelector('#related')?.addEventListener('click',()=>{kind=kind==='Order'?'Challenge':'Order';document.querySelector('#kind').value=kind;tab='Overview';render()});document.querySelector('#diagnostics')?.addEventListener('click',()=>document.querySelector('#announce').textContent='Handoff only: existing diagnostics panel would open here. No checks executed.');document.querySelector('#retry')?.addEventListener('click',()=>{scenario='normal';document.querySelector('#scenario').value='normal';render()});document.querySelector('#handoff')?.addEventListener('click',()=>{let input=document.querySelector('#owner');if(!input.value.trim()){document.querySelector('#error').textContent='Enter an owner name before reviewing the handoff.';input.setAttribute('aria-invalid','true');input.focus();}else{document.querySelector('#error').textContent='';input.removeAttribute('aria-invalid');document.querySelector('#announce').textContent='Review only · Owner reference is not resolved or opened. No resource changed.';}});}document.querySelector('#kind').onchange=e=>{kind=e.target.value;render()};document.querySelector('#scenario').onchange=e=>{scenario=e.target.value;render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#review').onclick=()=>{tab='Actions';render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('#help').hidden){e.preventDefault();document.querySelector('#help').hidden=true;document.querySelector('#helpButton')?.focus();document.querySelector('#help').hidden=true;}if(e.key==='Tab'){const focusable=[...document.querySelector('.shell').querySelectorAll('button,select,input,textarea')];if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focusable.at(-1)){e.preventDefault();focusable[0].focus()}}});render();</script></html>
