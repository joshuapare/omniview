</style><div class="shell">Omniview &nbsp; / &nbsp; preview-cluster &nbsp; / &nbsp; Flux</div><div class="fixture">INTERACTIVE DESIGN MOCK · Synthetic references · No cluster connection · No mutations</div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><header><div><h1 id="title">Create HelmRelease</h1><span class="muted">preview-cluster / preview &nbsp; · &nbsp; helm.toolkit.fluxcd.io/v2</span></div><div class="modes"><button id="form" class="active">Form</button><button id="yaml">YAML</button></div></header><div class="layout"><nav aria-label="Editor sections"><button data-section="release" class="active">Release & chart</button><button data-section="values">Values</button><button data-section="dependencies">Dependencies</button><button data-section="policy">Lifecycle</button><button data-section="advanced">Advanced</button><button data-section="actions">Ownership & actions</button></nav><main id="content"></main></div><footer><span class="muted" id="foot">Draft only · Nothing is sent</span><div><button id="back" class="hidden">Back to draft</button> <button id="review" class="primary">Review draft</button></div></footer></section><div id="help" class="popover hidden" role="tooltip"></div><script>
const $=s=>document.querySelector(s);const params=new URLSearchParams(location.search);const edit=params.get('intent')==='edit';let section='release',mode='form',rawEdited=false,reviewing=false;let refs=[],deps=[];const data={name:edit?'preview-release':'',namespace:'preview',interval:edit?'10m':'',branch:'template',chart:edit?'preview-chart':'',version:edit?'1.2.x':'',source:'',sourceKind:'HelmRepository',refKind:'OCIRepository',refName:'',releaseName:'',targetNamespace:'',storageNamespace:'',strategy:'',retryInterval:'',retries:'',remediation:'',crds:'',drift:'',timeout:'',serviceAccountName:'',suspend:false};let raw='';let error='';
function help(text){return `<button class="help" aria-label="Help" data-help="${text}">?</button>`}function field(label,key,placeholder=''){return `<label class="field">${label}<input name="${key}" autocomplete="off" spellcheck="false" data-key="${key}" value="${data[key]}" placeholder="${placeholder}" ${edit&&['name','namespace'].includes(key)?'readonly':''}></label>`}function choice(label,key,options){return `<label class="field">${label}<select data-key="${key}" name="${key}">${options.map(([v,t])=>`<option value="${v}" ${data[key]===v?'selected':''}>${t}</option>`).join('')}</select></label>`}function source(){let s=`# Preview draft; no credentials\napiVersion: helm.toolkit.fluxcd.io/v2\nkind: HelmRelease\nmetadata:\n  name: ${JSON.stringify(data.name)}\n  namespace: ${JSON.stringify(data.namespace)}\nspec:\n  interval: ${JSON.stringify(data.interval)}\n`;if(data.branch==='template')s+=`  chart:\n    spec:\n      chart: ${JSON.stringify(data.chart)}\n${data.version?'      version: '+JSON.stringify(data.version)+'\n':''}      sourceRef:\n        kind: ${data.sourceKind}\n        name: ${JSON.stringify(data.source)}\n`;else s+=`  chartRef:\n    kind: ${data.refKind}\n    name: ${JSON.stringify(data.refName)}\n`;for(const k of ['releaseName','targetNamespace','storageNamespace','timeout','serviceAccountName'])if(data[k])s+=`  ${k}: ${JSON.stringify(data[k])}\n`;if(data.suspend)s+='  suspend: true\n';if(refs.length)s+='  valuesFrom:\n'+refs.map(r=>`    - kind: ${r.kind}\n      name: ${JSON.stringify(r.name)}\n      valuesKey: ${JSON.stringify(r.key)}\n${r.target?'      targetPath: '+JSON.stringify(r.target)+'\n':''}${r.optional?'      optional: true\n':''}`).join('');if(deps.length)s+='  dependsOn:\n'+deps.map(r=>`    - name: ${JSON.stringify(r.name)}\n${r.namespace?'      namespace: '+JSON.stringify(r.namespace)+'\n':''}${r.expr?'      readyExpr: '+JSON.stringify(r.expr)+'\n':''}`).join('');if(data.strategy||data.retries||data.crds){s+='  upgrade:\n';if(data.strategy)s+=`    strategy:\n      name: ${data.strategy}\n${data.strategy==='RetryOnFailure'&&data.retryInterval?'      retryInterval: '+JSON.stringify(data.retryInterval)+'\n':''}`;if(data.strategy!=='RetryOnFailure'&&data.retries!=='')s+=`    remediation:\n      retries: ${data.retries}\n${data.remediation?'      strategy: '+data.remediation+'\n':''}`;if(data.crds)s+=`    crds: ${data.crds}\n`;}if(data.drift)s+=`  driftDetection:\n    mode: ${data.drift}\n`;return s}function validate(){if(!data.name)return 'Enter a release name.';if(!/^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$/.test(data.interval))return 'Enter a reconciliation interval, such as 10m.';if(data.branch==='template'&&(!data.chart||!data.source))return 'Choose a chart and source.';if(data.branch==='artifact'&&!data.refName)return 'Choose an artifact reference.';if(data.retries&&!/^-?\d+$/.test(data.retries))return 'Retries must be an integer.';if(refs.some(r=>!r.name||!r.key))return 'Complete each values reference name and key.';if(deps.some(r=>!r.name||r.name===data.name))return 'Choose a dependency other than this release.';return ''}
function render(){ $('#title').textContent=(edit?'Edit':'Create')+' HelmRelease';$('#form').classList.toggle('active',mode==='form');$('#yaml').classList.toggle('active',mode==='yaml');$('#back').classList.toggle('hidden',!reviewing);$('#review').classList.toggle('hidden',reviewing);$('#review').disabled=rawEdited;let html='';if(reviewing){html=`<h2>Review draft <span class="badge">No mutation</span></h2><div class="summary"><span>Destination</span><strong>preview-cluster / ${data.namespace}</strong><span>Resource</span><span>${data.name} · HelmRelease v2</span><span>Chart source</span><span>${data.branch==='template'?data.sourceKind+' / '+data.source:data.refKind+' / '+data.refName}</span><span>Reconcile</span><span>${data.interval}</span><span>Values</span><span>${refs.length} ordered references · Resolved values not loaded</span></div><div class="notice">Saving may install, upgrade, replace or remove chart-managed resources. No resources are created by this preview.</div>${data.crds==='CreateReplace'?'<div class="notice">CRD replacement can affect every namespace.</div>':''}${data.retries.startsWith('-')?'<div class="notice">Negative retries permit unlimited remediation attempts.</div>':''}${edit?'<div class="notice">Changing release name, target namespace or storage namespace can uninstall and reinstall the release.</div>':''}<h3>Review boundary</h3><span class="muted">No rendered chart, permissions, controller health or server validation verified.</span>`;}else if(mode==='yaml'){html=`<h2>Source draft</h2><div class="notice">Do not paste secrets. Inline values and annotation imports require a separately protected editor.</div><textarea id="source" aria-label="Manifest source" spellcheck="false"></textarea>${rawEdited?'<div class="notice">Source retained verbatim. Form and review unavailable after manual source edits in this mock.</div>':''}`;}else if(rawEdited){html='<h2>Source-only draft</h2><div class="notice">Manual source retained exactly. Return to YAML to continue; this mock does not parse arbitrary YAML.</div>';}else if(section==='release'){html=`<h2>Release & chart ${help('Choose a chart template OR an existing artifact, never both. Chart templates generate a HelmChart under source-controller ownership.')}</h2><div class="grid">${field('Name *','name','release-name…')}${field(edit?'Namespace · locked':'Namespace *','namespace')}${field('Reconcile every *','interval','10m…')}${field('Release name · optional','releaseName','Controller-derived…')}</div><h3>Chart delivery</h3>${choice('Source mode','branch',[['template','Chart from a source'],['artifact','Existing chart artifact']])}${data.branch==='template'?`<div class="grid">${choice('Source kind','sourceKind',[['HelmRepository','HelmRepository'],['GitRepository','GitRepository'],['Bucket','Bucket']])}${choice('Source · preview namespace','source',[['','Choose existing source…'],['preview-source','preview-source']])}${field('Chart name / relative path *','chart','chart-name…')}${field('Version expression','version','Omit: controller selects latest…')}</div>`:`<div class="grid">${choice('Artifact kind','refKind',[['OCIRepository','OCIRepository'],['HelmChart','HelmChart'],['ExternalArtifact','ExternalArtifact · feature gated']])}${choice('Artifact · preview namespace','refName',[['','Choose existing artifact…'],['preview-artifact','preview-artifact']])}</div>${data.refKind==='ExternalArtifact'?'<div class="notice">Requires ExternalArtifact feature support; unavailable until verified. Review does not prove support.</div>':''}`}<div class="grid">${field('Target namespace · optional','targetNamespace','Same as release namespace…')}${field('Helm storage namespace · optional','storageNamespace','Same as release namespace…')}</div>${edit?'<div class="notice">Identity locked. Destination or release-name changes can uninstall and reinstall workloads.</div>':''}`;}else if(section==='values'){html=`<h2>Values ${help('Later references override earlier references; inline values normally override references. targetPath changes merge behavior. Secret contents are never fetched here.')}</h2><div class="row"><span class="muted">Merge order · first → last</span><button id="addref">Add reference</button></div>${refs.map((r,i)=>`<div class="ref"><div class="row"><select aria-label="Values kind ${i+1}" data-ref="${i}" data-prop="kind"><option ${r.kind==='ConfigMap'?'selected':''}>ConfigMap</option><option ${r.kind==='Secret'?'selected':''}>Secret</option></select><input aria-label="Values name ${i+1}" data-ref="${i}" data-prop="name" value="${r.name}" placeholder="Existing name…"><input aria-label="Values key ${i+1}" data-ref="${i}" data-prop="key" value="${r.key}" placeholder="values.yaml…"><button data-remove-ref="${i}" aria-label="Remove values reference ${i+1}">Remove</button></div><div class="row"><input aria-label="Target path ${i+1}" data-ref="${i}" data-prop="target" value="${r.target}" placeholder="Optional targetPath…"><label><input type="checkbox" data-ref="${i}" data-prop="optional" ${r.optional?'checked':''}> Optional reference</label></div></div>`).join('')}<div class="notice">Reference names only. Secret data and resolved values are not loaded.</div><h3>Inline values</h3><button id="inline">Inspect protected-values boundary</button><p id="inline-note" class="muted hidden">Inline values require sensitive-path masking before editing. Use valuesFrom in this safe mock; existing values remain untouched in production.</p>`;}else if(section==='dependencies'){html=`<h2>Dependencies ${help('Wait for referenced HelmReleases. A custom CEL readyExpr replaces the built-in readiness check unless AdditiveCELDependencyCheck is enabled.')}</h2><button id="adddep">Add dependency</button>${deps.map((r,i)=>`<div class="row"><input aria-label="Dependency name ${i+1}" data-dep="${i}" data-prop="name" value="${r.name}" placeholder="HelmRelease name…"><input aria-label="Dependency namespace ${i+1}" data-dep="${i}" data-prop="namespace" value="${r.namespace}" placeholder="Same namespace…"><button data-remove-dep="${i}">Remove</button></div><label class="field">Custom readiness · CEL<input aria-label="Readiness expression ${i+1}" data-dep="${i}" data-prop="expr" value="${r.expr}" placeholder="Optional expression…"></label>`).join('')}<div class="notice">Custom readiness replaces built-in checks unless the additive feature gate is enabled. Cycles require controller validation.</div>`;}else if(section==='policy'){html=`<h2>Upgrade & recovery</h2><div class="grid">${choice('On upgrade failure','strategy',[['','Controller default · omit'],['RemediateOnFailure','Remediate on failure'],['RetryOnFailure','Retry on failure']])}${data.strategy==='RetryOnFailure'?field('Retry interval','retryInterval','5m controller default…'):field('Remediation retries','retries','0 controller default…')}${data.strategy!=='RetryOnFailure'?choice('Remediation action','remediation',[['','Default · rollback'],['rollback','Rollback'],['uninstall','Uninstall']]):''}${choice('Upgrade CRDs','crds',[['','Default · skip'],['Skip','Skip'],['Create','Create missing'],['CreateReplace','Create & replace']])}${choice('Drift handling','drift',[['','Controller default · omit'],['disabled','Disabled'],['warn','Warn'],['enabled','Detect & correct']])}${field('Operation timeout','timeout','5m controller default…')}</div>${data.crds==='CreateReplace'?'<div class="notice">Replacing CRDs can change APIs used across the cluster.</div>':''}${data.remediation==='uninstall'?'<div class="notice">Remediation may uninstall chart-managed resources between attempts.</div>':''}${data.drift==='enabled'?'<div class="notice">Controller may overwrite manual changes to managed resources.</div>':''}<h3>Other lifecycle settings</h3><span class="muted">Install, test, rollback, uninstall, post-renderers and drift ignore rules remain source-owned. No invented policy defaults.</span>`;}else if(section==='advanced'){html=`<h2>Advanced</h2>${field('Impersonated service account','serviceAccountName','Controller fallback…')}<div class="notice">Service account changes affect controller privileges. Selection is not an authorization check.</div><h3>Remote cluster & unsupported fields</h3><span class="muted">kubeConfig, inline values, common annotations and post-renderers need protected source handling. This mock neither imports credentials nor rewrites those fields.</span><h3>Preservation boundary</h3><button id="open-source">Open source draft</button>`;}else{html=`<h2>Ownership & actions</h2><label class="field">Editing authority<select id="owner"><option>Direct author · fixture</option><option>GitOps-managed · inspect only</option><option>Patch denied · inspect only</option><option>API unavailable</option><option>API version unsupported</option></select></label><div id="authority" aria-live="polite" class="notice">Fixture capability only. Production must discover resource verbs and field ownership.</div><h3>Controller requests</h3><div class="row"><button data-action="Reconcile">Reconcile</button><button data-action="Reset failures">Reset failures</button><button data-action="Force release">Force release</button></div><div class="row"><button data-action="Suspend">Suspend</button><button data-action="Resume">Resume</button></div><div id="action" aria-live="polite"></div><h3>References</h3><label class="field">Lookup state<select id="lookup"><option>Available · fixture references</option><option>Loading…</option><option>Empty · no matching resources</option><option>Denied · cannot list references</option><option>Unavailable · retry lookup</option></select></label><p id="lookupstate" class="muted" aria-live="polite">Only synthetic same-namespace names are offered.</p>`;}$('#content').innerHTML=html+(error?`<div role="alert" class="error">${error}</div>`:'');if(mode==='yaml'&&!reviewing)$('#source').value=rawEdited?raw:source();wire();}
function wire(){document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('change',()=>{data[el.dataset.key]=el.value;error='';if(el.tagName==='SELECT')render()}));document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>data[el.dataset.key]=el.value));document.querySelectorAll('[data-help]').forEach(el=>{let show=()=>{let b=el.getBoundingClientRect();$('#help').textContent=el.dataset.help;$('#help').style.left=Math.min(b.left,innerWidth-350)+'px';$('#help').style.top=(b.bottom+8)+'px';$('#help').classList.remove('hidden');};el.onmouseenter=show;el.onfocus=show;el.onclick=show;el.onmouseleave=()=>$('#help').classList.add('hidden');el.onblur=()=>$('#help').classList.add('hidden');});if($('#source'))$('#source').oninput=e=>{raw=e.target.value;rawEdited=true;$('#review').disabled=true};if($('#addref'))$('#addref').onclick=()=>{refs.push({kind:'ConfigMap',name:'',key:'values.yaml',target:'',optional:false});render()};if($('#adddep'))$('#adddep').onclick=()=>{deps.push({name:'',namespace:'',expr:''});render()};document.querySelectorAll('[data-ref],[data-dep]').forEach(el=>el.oninput=()=>{(el.dataset.ref!==undefined?refs[el.dataset.ref]:deps[el.dataset.dep])[el.dataset.prop]=el.type==='checkbox'?el.checked:el.value});document.querySelectorAll('[data-remove-ref]').forEach(el=>el.onclick=()=>{refs.splice(+el.dataset.removeRef,1);render()});document.querySelectorAll('[data-remove-dep]').forEach(el=>el.onclick=()=>{deps.splice(+el.dataset.removeDep,1);render()});if($('#inline'))$('#inline').onclick=()=>$('#inline-note').classList.toggle('hidden');if($('#open-source'))$('#open-source').onclick=()=>{mode='yaml';render()};if($('#lookup'))$('#lookup').onchange=e=>$('#lookupstate').textContent=e.target.value;if($('#owner'))$('#owner').onchange=e=>{let denied=e.target.selectedIndex>0;$('#authority').textContent=denied?'Inspect only. Edit the owning source or restore API access; no takeover or force-apply.':'Fixture capability only. Production must discover resource verbs and field ownership.';document.querySelectorAll('[data-action]').forEach(b=>b.disabled=denied);$('#review').disabled=denied;};document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action;$('#action').innerHTML=`<div class="notice">${a} · request preview only. ${a==='Force release'?'May replace resources; use explicit confirmation.':a==='Suspend'?'Does not stop an already running reconciliation.':a==='Reset failures'?'Resets retry counters, not release history.':''}</div><pre>${a==='Suspend'?'spec.suspend: true':a==='Resume'?'spec.suspend: false':'metadata.annotations:\n  reconcile.fluxcd.io/requestedAt: &lt;new request token&gt;'+(a==='Reset failures'?'\n  reconcile.fluxcd.io/resetAt: &lt;same request token&gt;':a==='Force release'?'\n  reconcile.fluxcd.io/forceAt: &lt;same request token&gt;':'')}</pre><span class="muted">No request sent. Controller outcome remains unknown.</span>`;});}
$('#form').onclick=()=>{mode='form';localStorage.setItem('mock311-mode','form');render()};$('#yaml').onclick=()=>{mode='yaml';localStorage.setItem('mock311-mode','yaml');render()};document.querySelectorAll('[data-section]').forEach(el=>el.onclick=()=>{section=el.dataset.section;reviewing=false;document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b===el));render()});$('#review').onclick=()=>{error=validate();if(error){render();let f=$('[data-key="'+(!data.name?'name':!data.interval?'interval':'chart')+'"]');if(f)f.focus();return;}reviewing=true;render()};$('#back').onclick=()=>{reviewing=false;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#help').classList.contains('hidden')){e.preventDefault();$('#help').classList.add('hidden');}});document.addEventListener('keydown',e=>{if(e.key==='Tab'){let a=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog select,.dialog textarea')].filter(x=>x.offsetParent);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});render();
let authorityIndex=0;const originalRender=render;function enforceAuthority(){if($('#owner'))$('#owner').selectedIndex=authorityIndex;if(authorityIndex){document.querySelectorAll('main input,main textarea,main select:not(#owner):not(#lookup),main button:not(.help)').forEach(el=>el.disabled=true);$('#review').disabled=true;}}render=()=>{originalRender();enforceAuthority()};document.addEventListener('change',e=>{if(e.target.id==='owner'){authorityIndex=e.target.selectedIndex;enforceAuthority()}});
if(localStorage.getItem('mock311-mode')==='yaml'){mode='yaml';render()}
