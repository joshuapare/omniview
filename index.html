const $=s=>document.querySelector(s);let kind='FlowSchema',scenario='create',section='Policy',mode='Form',review=false,helpTarget=null;const values={FlowSchema:{name:'',precedence:'',priority:'',dist:'',subjects:[{kind:'Group',name:'preview-engineers',namespace:'preview'}],requests:[{type:'Resource',verbs:'get, list',groups:'apps',resources:'deployments',namespaces:'preview',cluster:false,urls:'/healthz/*'}]},PriorityLevelConfiguration:{name:'',shares:'',lend:'',borrow:'',response:'Queue',queues:'',hand:'',length:''}};let raw={},dirtySource={};const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const field=(label,key,value='',type='text',hint='')=>`<label class="field">${label}${hint?`<span><button type="button" class="help" data-help="${esc(hint)}" aria-label="Help: ${label}">?</button></span>`:''}<input autocomplete="off" spellcheck="false" name="${key}" data-key="${key}" type="${type}" value="${esc(value)}"></label>`;const select=(label,key,opts,value)=>`<label class="field">${label}<select data-key="${key}" name="${key}">${opts.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select></label>`;function source(){let v=values[kind];let s=`# Synthetic APF policy — comments preserved while source-only\napiVersion: flowcontrol.apiserver.k8s.io/v1\nkind: ${kind}\nmetadata:\n  name: ${v.name||'preview-policy'}\nspec:\n`;if(kind==='FlowSchema'){s+=`  priorityLevelConfiguration:\n    name: ${v.priority||'preview-interactive'}\n`;if(v.precedence)s+=`  matchingPrecedence: ${v.precedence}\n`;if(v.dist)s+=`  distinguisherMethod:\n    type: ${v.dist}\n`;s+='  rules:\n';v.subjects.forEach((x,i)=>{});s+='  - subjects:\n';v.subjects.forEach(x=>{let branch=x.kind==='ServiceAccount'?'serviceAccount':x.kind.toLowerCase();s+=`    - kind: ${x.kind}\n      ${branch}:\n        name: ${JSON.stringify(x.name)}\n`;if(x.kind==='ServiceAccount')s+=`        namespace: ${JSON.stringify(x.namespace)}\n`});for(let n submit.'}</div><button data-section="Status">Inspect availability</button>`}else if(review){let e=errors();c=`<h2>${e.length?'Resolve draft errors':'Review policy impact'}</h2>${e.length?`<div role="alert" class="error">${e.map(esc).join('<br>')}</div>`:`<div class="warn">${kind==='FlowSchema'?'Changes redirect matching API traffic. Lower precedence wins; ties sort by name.':'Changes redistribute API-server capacity. Saturated requests may queue or receive HTTP 429.'}</div><div class="box">Destination <b>preview-cluster</b> · cluster scope<br>Object <b>${esc(v.name)}</b><br>Operation ${scenario==='create'?'Create':'Update'} · authorization must be checked at submission</div><pre>${esc(source())}</pre>`}`}else if(mode==='YAML'){c=`<h2>Source draft</h2><div class="warn">Source-only boundary: arbitrary edits stay exact. Form editing pauses until you discard source edits. No submit in this mock.</div><textarea id="source" aria-label="YAML source" spellcheck="false">${esc(raw[kind]??source())}</textarea>${dirtySource[kind]?'<button id="discard">Discard source edits & return to Form</button>':''}`}else if(section==='Ownership'){c=`<h2>Ownership & reconciliation</h2><span class="badge">${scenario==='suggested'?'Suggested bootstrap':scenario==='mandatory'||scenario==='exempt'?'Mandatory bootstrap':'Administrator policy'}</span><div class="warn" style="margin-top:16px">${scenario==='mandatory'?'Fixed bootstrap spec. Editing disabled; deleting would cause recreation.':scenario==='exempt'?'Only spec.exempt tuning is editable. Name and type remain fixed.':scenario==='suggested'?'Automatic reconciliation may overwrite spec. Explicitly opt out before editing.':'No bootstrap annotation will be added. Custom objects annotated autoupdate-spec=true may be deleted by maintenance.'}</div>${scenario==='suggested'?'<label class="check"><input id="optout" type="checkbox">Set apf.kubernetes.io/autoupdate-spec=false</label>':''}<div class="box">Name: immutable on update<br>Cluster scope: no metadata.namespace<br>Status: API-server-owned, never submitted<br>Source metadata: preserved outside owned paths</div>`}else if(section==='Status'){c='<h2>Observed status</h2><div class="box">Fixture only · no live condition result</div><table><tr><th>Type</th><th>Status</th><th>Reason</th></tr><tr><td>Not loaded</td><td>Unknown</td><td>PreviewDisconnected</td></tr></table><p class="muted">Read-only: status.conditions[].{type,status,reason,message,lastTransitionTime}</p>'}else if(section==='Matching'){c='<h2>Match API requests</h2><h3>Subjects · any match</h3>';v.subjects.forEach((s,i)=>{c+=`<div class="row"><select aria-label="Subject ${i+1} kind" data-sub="${i}" data-prop="kind">${['Group','User','ServiceAccount'].map(k=>`<option ${k===s.kind?'selected':''}>${k}</option>`).join('')}</select><input aria-label="Subject ${i+1} name" data-sub="${i}" data-prop="name" value="${esc(s.name)}" autocomplete="off">${s.kind==='ServiceAccount'?`<input aria-label="Subject ${i+1} namespace" data-sub="${i}" data-prop="namespace" value="${esc(s.namespace)}">`:''}<button data-remove-sub="${i}" aria-label="Remove subject ${i+1}">Remove</button></div>`});c+='<button id="addsub">+ Subject</button><h3 style="margin-top:20px">Requests · any match, AND a subject</h3>';v.requests.forEach((r,i)=>{c+=`<div class="box"><div class="row"><select aria-label="Request ${i+1} type" data-req="${i}" data-prop="type"><option ${r.type==='Resource'?'selected':''}>Resource</option><option ${r.type==='Non-resource'?'selected':''}>Non-resource</option></select><button data-remove-req="${i}">Remove match</button></div><div class="grid">${(r.type==='Resource'?[['verbs','Verbs *'],['groups','API groups (empty = core)'],['resources','Resources / subresources *'],['namespaces','Namespaces']]:[['verbs','Verbs *'],['urls','URL paths *']]).map(([p,l])=>`<label class="field">${l}<input autocomplete="off" data-req="${i}" data-prop="${p}" value="${esc(r[p])}"></label>`).join('')}</div>${r.type==='Resource'?`<label class="check"><input type="checkbox" data-req="${i}" data-prop="cluster" ${r.cluster?'checked':''}>Include requests without a namespace</label>`:''}<small>Comma-separated entries · * must stand alone</small></div>`});c+='<button id="addreq">+ Request match</button>'}else if(kind==='FlowSchema'){c=`<h2>Route a flow</h2><div class="grid">${field('Name *','name',v.name)}${field('Matching precedence','precedence',v.precedence,'number','Lower numbers win. Omitted defaults to 1000. Precedence 1 is reserved for exempt; valid ordinary range is 2–10000.')}</div>${select('Priority level *','priority',[['','Choose a priority level…'],...['empty','refdenied','refunavailable'].includes(scenario)?[]:[['preview-interactive','preview-interactive · Limited'],['preview-batch','preview-batch · Limited']]],v.priority)}${['empty','refdenied','refunavailable'].includes(scenario)?`<div class="warn">${scenario==='empty'?'No priority levels found.':scenario==='refdenied'?'Reference listing denied.':'Reference listing unavailable.'} Enter an exact name; unresolved references cause Dangling status and the schema is ignored.</div>${field('Exact priority level name','priority',v.priority)}`:''}${select('Separate flows by','dist',[['','No distinguisher (omit)'],['ByUser','User'],['ByNamespace','Namespace']],v.dist)}<div class="box"><b>${v.subjects.length} subjects · ${v.requests.length} request matches</b><div class="row" style="margin-top:12px"><button data-section="Matching">Edit matching rules →</button></div></div>`}else{let ex=scenario==='exempt';c=`<h2>${ex?'Tune exempt capacity':'Limit API request pressure'}</h2>${field('Name *','name',v.name)}<div class="row"><span class="badge">${ex?'Exempt · fixed type':'Limited'}</span><button class="help" data-help="Only the singleton named exempt may use Exempt. Ordinary priority levels must use Limited." aria-label="Help: priority type">?</button></div><div class="grid">${field('Nominal concurrency shares','shares',v.shares,'number','Relative we function bind(){document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;review=false;render()});document.querySelectorAll('[data-key]').forEach(x=>x.onchange=()=>{values[kind][x.dataset.key]=x.value;raw[kind]=undefined;if(x.tagName==='SELECT')render()});document.querySelectorAll('[data-sub],[data-req]').forEach(x=>x.onchange=()=>{let arr=x.hasAttribute('data-sub')?values[kind].subjects:values[kind].requests;arr[x.dataset.sub??x.dataset.req][x.dataset.prop]=x.type==='checkbox'?x.checked:x.value;raw[kind]=undefined;if(x.tagName==='SELECT')render()});document.querySelectorAll('[data-remove-sub]').forEach(x=>x.onclick=()=>{values[kind].subjects.splice(+x.dataset.removeSub,1);render()});document.querySelectorAll('[data-remove-req]').forEach(x=>x.onclick=()=>{values[kind].requests.splice(+x.dataset.removeReq,1);render()});if($('#addsub'))$('#addsub').onclick=()=>{values[kind].subjects.push({kind:'ServiceAccount',name:'preview-reader',namespace:'preview'});render()};if($('#addreq'))$('#addreq').onclick=()=>{values[kind].requests.push({type:'Non-resource',verbs:'get',urls:'/healthz/*',groups:'',resources:'',namespaces:'',cluster:false});render()};if($('#source'))$('#source').oninput=e=>{raw[kind]=e.target.value;dirtySource[kind]=true};if($('#discard'))$('#discard').onclick=()=>{raw[kind]=undefined;dirtySource[kind]=false;mode='Form';render()};if($('#returnsource'))$('#returnsource').onclick=()=>{mode='YAML';render()};if($('#optout')){$('#optout').checked=!!window.opted;$('#optout').onchange=e=>{window.opted=e.target.checked;render()}}document.querySelectorAll('[data-help]').forEach(b=>{function open(){closeHelp();helpTarget=b;let p=document.createElement('div');p.className='popover';p.id='help';p.setAttribute('role','tooltip');p.textContent=b.dataset.help;document.body.append(p);let r=b.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-336)+'px';p.style.top=Math.min(r.bottom+6,innerHeight-140)+'px';b.setAttribute('aria-d
