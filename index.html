<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APIService editor mock · 280</title><style>:root{color-scheme:dark;font:13px system-ui;background:#101112;color:#e6e7e9;--border:#34373e;--muted:#9ca3af;--accent:#84acff}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#24272d;border:1px solid var(--border);border-radius:5px}button,input,select{min-height:32px;padding:5px 10px}button{cursor:pointer}button:hover{background:#343943}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true],.primary{background:#315ea0}.shell{padding:24px;color:var(--muted)}.bar{display:flex;gap:10px;align-items:center;margin-bottom:22px}main{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 120px));margin:20px auto;background:#1f2125;border:1px solid var(--border);border-radius:10px;box-shadow:0 20px 90px #0008;display:flex;flex-direction:column;color:#e6e7e9}header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 6px}small,.muted{color:var(--muted)}.layout{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:20px 12px;background:#1a1c20;border-right:1px solid var(--border)}nav button{width:100%;text-align:left;margin-bottom:7px;background:transparent;border-color:transparent}.content{padding:20px 24px;overflow:auto;flex:1;min-width:0}h2{font-size:14px;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}label input,label select{width:100%}.span{grid-column:1/-1}.info{display:flex;align-items:center;gap:7px}.help{min-height:20px;padding:0 6px;border-radius:50%;color:var(--muted)}.note{padding:11px 12px;border:1px solid #66542b;background:#3b3220;border-radius:5px;margin:14px 0;color:#f1d593}.error{color:#ffada8;margin:8px 0}.box{border:1px solid var(--border);padding:14px;border-radius:6px;margin-bottom:16px}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);gap:12px}footer{padding:13px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}footer small{flex:1}textarea{width:100%;height:340px;padding:14px;font:12px/1.7 ui-monospace,monospace;resize:vertical}#help{position:fixed;z-index:3;background:#303640;border:1px solid #62708a;padding:14px;width:300px;border-radius:6px;box-shadow:0 8px 25px #0008;line-height:1.5}.row{display:flex;gap:8px;margin:8px 0}.row input{min-width:0;width:45%}input:disabled{color:#9ca3af;background:#1b1d21}select{max-width:100%}@media(max-width:700px){nav{width:130px;padding:12px 6px}.content{padding:16px}.grid{grid-template-columns:1fr}main{height:calc(100vh - 110px)}.shell{padding:12px}.bar{flex-wrap:wrap}header{padding:12px}footer{padding:12px}}</style><div class="shell"><div class="bar"><strong>Omniview</strong><span> / API registration</span><span style="flex:1"></span><label style="margin:0">Fixture scenario<select id="scenario"><option value="create">Create</option><option value="edit">Edit · self-managed</option><option value="managed">Inspect · auto-managed</option><option value="denied">Authorization denied</option><option value="absent">API not discovered</option><option value="unavailable">Discovery unavailable</option></select></label></div><small>SYNTHETIC FIXTURES · isolated HTML composition · no cluster connection</small><main aria-label="APIService editor"><header><div><h1 id="title">Create APIService</h1><small>preview-cluster · Cluster-scoped · apiregistration.k8s.io/v1</small></div><div><button id="form" aria-pressed="true">Form</button> <button id="yaml" aria-pressed="false">YAML</button></div></header><div class="layout"><nav aria-label="Editor sections"><button data-section="registration" aria-pressed="true">Registration</button><button data-section="connection">Service & TLS</button><button data-section="metadata">Labels</button><button data-section="status">Availability</button></nav><section class="content" id="content"></section></div><footer><small>Draft only · no request will be sent</small><button id="back">Back to draft</button><button id="review" class="primary">Review registration</button></footer></main></div><div id="help" role="tooltip" hidden></div><script>
const sizing=document.createElement('style');sizing.textContent='main{height:min(700px,calc(100vh - 180px))}@media(max-width:700px){main{height:calc(100vh - 180px)}}';document.head.append(sizing);
const $=s=>document.querySelector(s);let section='registration',mode='form',scenario='create',rawEdited=false,review=false;const draft={group:'',version:'',gp:'',vp:'',route:'remote',namespace:'',service:'',port:'',tls:'system',labels:[]};let raw='';let lastHelp;
const helpText={group:'Registers one group/version. Name must equal version + “.” + group. Only v1 may use an empty group.',priority:'Group priority: 1–20000. Version priority: 1–1000. Higher numbers rank first in discovery. No priority is chosen for you.',tls:'System roots omit caBundle. Custom CA requires explicit byte import in production. This privacy-safe mock never accepts or displays certificate material.',local:'Local handling omits spec.service and delegates to the API server handler chain. This does not install a handler.',port:'Omit to use API default 443. An explicit port must be 1–65535. Only HTTPS is supported.'};
function showHelp(e,key){lastHelp=e;$('#help').textContent=helpText[key];$('#help').hidden=false;let r=e.getBoundingClientRect();$('#help').style.left=Math.min(r.left,innerWidth-320)+'px';$('#help').style.top=Math.min(r.bottom+8,innerHeight-150)+'px'}
function label(text,key,value,type='text',extra=''){return `<label><span>${text}</span><input autocomplete="off" spellcheck="false" name="${key}" data-key="${key}" type="${type}" value="${value}" ${extra}></label>`}
function source(){return `# APIService draft — no request sent\napiVersion: apiregistration.k8s.io/v1\nkind: APIService\nmetadata:\n  name: ${draft.version}.${draft.group}\n`+(draft.labels.length?'  labels:\n'+draft.labels.map(r=>'    '+JSON.stringify(r[0])+': '+JSON.stringify(r[1])+'\n').join(''):'')+`spec:\n  group: ${JSON.stringify(draft.group)}\n  version: ${JSON.stringify(draft.version)}\n  groupPriorityMinimum: ${draft.gp||'null'}\n  versionPriority: ${draft.vp||'null'}\n`+(draft.route==='remote'?`  service:\n    namespace: "${draft.namespace}"\n    name: "${draft.service}"\n`+(draft.port?`    port: ${draft.port}\n`:'')+(draft.tls==='insecure'?'  insecureSkipTLSVerify: true\n':''):'')}
function errors(){let a=[];if(!/^[a-z][a-z0-9-]*$/.test(draft.version))a.push('Enter a DNS-label version, such as v1.');if((!draft.group&&draft.version!=='v1')||(draft.group&&!/^[a-z0-9]+([.-][a-z0-9]+)*$/.test(draft.group)))a.push('Enter a valid API group.');if(!/^\d+$/.test(draft.gp)||+draft.gp<1||+draft.gp>20000)a.push('Group priority must be 1–20000.');if(!/^\d+$/.test(draft.vp)||+draft.vp<1||+draft.vp>1000)a.push('Version priority must be 1–1000.');if(draft.route==='remote'&&(!draft.namespace||!draft.service))a.push('Select a Service namespace and name.');if(draft.port&&(!/^\d+$/.test(draft.port)||+draft.port<1||+draft.port>65535))a.push('Service port must be 1–65535.');if(draft.tls==='custom'&&draft.route==='remote')a.push('Custom CA byte import is unavailable in this mock. Keep source intact; production requires secure import.');return a}
function render(){let locked=scenario==='managed';$('#title').textContent=(scenario==='create'?'Create':locked?'Inspect':'Edit')+' APIService';$('#form').setAttribute('aria-pressed',mode==='form');$('#yaml').setAttribute('aria-pressed',mode==='yaml');document.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.section===section));let c=$('#content');$('#review').disabled=locked||['denied','absent','unavailable'].includes(scenario);if(['denied','absent','unavailable'].includes(scenario)){c.innerHTML=`<h2>${{denied:'Permission denied',absent:'API not discovered',unavailable:'Discovery unavailable'}[scenario]}</h2><div class="box">${{denied:'Fixture: APIService get/create/update denied. No object or permission inferred.',absent:'apiregistration.k8s.io/v1 is not advertised by this fixture.',unavailable:'Fixture discovery failed. This is not an empty resource list.'}[scenario]}</div><button id="retry">Retry fixture lookup</button>`;$('#retry').onclick=()=>{c.innerHTML+='<p role="status">Still unavailable in this fixture. Draft retained.</p>'};return}
if(review){c.innerHTML=`<h2>Review registration</h2><div class="box"><div class="line"><span>Destination</span><strong>preview-cluster / cluster scope</strong></div><div class="line"><span>Registration</span><strong>${draft.version}.${draft.group}</strong></div><div class="line"><span>Handling</span><strong>${draft.route==='remote'?draft.namespace+'/'+draft.service:'Local API server'}</strong></div><div class="line"><span>TLS verification</span><strong>${draft.route==='local'?'Not applicable':draft.tls==='insecure'?'DISABLED':draft.tls==='system'?'System trust roots':'Custom CA'}</strong></div></div><div class="note">Changes can redirect or interrupt API discovery and requests. No server validation or reachability check ran.</div>${draft.tls==='insecure'?'<div class="error">TLS certificate verification is disabled. Connections may be intercepted.</div>':''}<strong>Non-mutating review · no Apply action in this mock</strong>`;return}
if(mode==='yaml'){c.innerHTML='<h2>Source draft</h2><div class="note">Bounded generator. Manual source edits remain exact; Form locks rather than parsing or rewriting them.</div><textarea aria-label="YAML source" spellcheck="false"></textarea><p class="muted">Never paste credentials or certificate material. No source is persisted.</p>';c.querySelector('textarea').value=rawEdited?raw:source();c.querySelector('textarea').oninput=e=>{raw=e.target.value;rawEdited=true};return}
if(rawEdited){c.innerHTML='<h2>Form unavailable</h2><div class="note">Manual source retained verbatim. Continue in YAML; this mock has no lossless YAML parser.</div>';return}
if(section==='registration')c.innerHTML=`<h2>Register an API version</h2>${locked?'<div class="note">Auto-managed registration · inspect only. Controller may reconcile edits.</div>':''}<div class="grid">${label('API group', 'group',draft.group,'text',scenario!=='create'?'disabled':'')}${label('Version *','version',draft.version,'text',scenario!=='create'?'disabled':'')}<div class="span box"><span class="muted">Resource name</span><div id="name">${draft.version||'version'}.${draft.group||'group'}</div></div></div><h2 class="info">Discovery order <button class="help" data-help="priority" aria-label="Discovery priority help">?</button></h2><div class="grid">${label('Group priority *','gp',draft.gp,'number','min="1" max="20000"')}${label('Version priority *','vp',draft.vp,'number','min="1" max="1000"')}</div><button class="help" data-help="group" aria-label="Group and version help">?</button>${scenario==='edit'?'<p class="muted">Identity locked. Group/version match immutable metadata.name.</p>':''}`;
if(section==='connection')c.innerHTML=`<h2>API request destination</h2><label>Handling<select data-key="route"><option value="remote">Remote Service · HTTPS</option><option value="local">Local API server</option></select></label>${draft.route==='remote'?`<div class="grid"><label>Service namespace *<select data-key="namespace"><option value="">Select namespace…</option><option>preview-system</option><option>preview</option></select></label><label>Existing Service *<select data-key="service"><option value="">Select Service…</option><option>extension-api</option><option>metrics-adapter</option></select></label>${label('Service port · optional','port',draft.port,'number','placeholder="API default: 443" min="1" max="65535"')}<div class="info"><button class="help" data-help="port" aria-label="Service port help">?</button><small>Fixture references only</small></div></div><label>TLS trust<select data-key="tls"><option value="system">Use API server system roots</option><option value="custom">Custom CA · import unavailable</option><option value="insecure">Disable certificate verification</option></select></label><button class="help" data-help="tls" aria-label="TLS trust help">?</button>${draft.tls==='insecure'?'<div class="note">TLS certificate verification disabled. Connections may be intercepted.</div>':''}${draft.tls==='custom'?'<div class="error">Secure CA import unavailable in this mock. No certificate material accepted.</div>':''}`:'<div class="note">Local handling does not install an API handler. Service and TLS fields are omitted.</div><button class="help" data-help="local" aria-label="Local handling help">?</button>'}`;
if(section==='metadata')c.innerHTML='<h2>Metadata labels</h2><div id="rows">'+draft.labels.map((r,i)=>`<div class="row"><input aria-label="Label key ${i+1}" data-label="${i}:0" value="${r[0]}"><input aria-label="Label value ${i+1}" data-label="${i}:1" value="${r[1]}"><button data-remove="${i}">Remove</button></div>`).join('')+'</div><button id="add">Add label</button><p class="muted">Annotations remain source-only. Do not paste sensitive annotations.</p>';
if(section==='status')c.innerHTML='<h2>Availability · read-only</h2><div class="box"><div class="line"><span>Available</span><strong>'+ (scenario==='create'?'Not observed':'False')+'</strong></div><div class="line"><span>Reason</span><span>'+ (scenario==='create'?'No server object':'ServiceNotFound · fixture')+'</span></div><div class="line"><span>Last transition</span><span>Not available in fixture</span></div></div><p class="muted">Controller-owned status.conditions. No status edit or connection test.</p><label>Reference lookup state<select id="lookup"><option>Available fixture references</option><option>Empty list</option><option>Denied</option><option>Unavailable</option><option>Missing selected Service</option></select></label><div id="lookupresult" role="status"></div>';
c.querySelectorAll('[data-key]').forEach(e=>{if(e.tagName==='SELECT')e.value=draft[e.dataset.key];e.oninput=()=>{draft[e.dataset.key]=e.value;if(['route','tls'].includes(e.dataset.key))render();else if($('#name'))$('#name').textContent=draft.version+'.'+draft.group}});c.querySelectorAll('[data-help]').forEach(e=>{e.onmouseenter=e.onfocus=e.onclick=()=>showHelp(e,e.dataset.help);e.onmouseleave=()=>$('#help').hidden=true});if($('#add'))$('#add').onclick=()=>{draft.labels.push(['','']);render()};c.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{draft.labels.splice(+e.dataset.remove,1);render()});c.querySelectorAll('[data-label]').forEach(e=>e.oninput=()=>{let [i,j]=e.dataset.label.split(':');draft.labels[i][j]=e.value});if($('#lookup'))$('#lookup').onchange=e=>$('#lookupresult').textContent=e.target.value+' · draft and unresolved reference retained.';if(locked)c.querySelectorAll('input,select,#add,[data-remove]').forEach(e=>e.disabled=true);
}
$('#scenario').onchange=e=>{scenario=e.target.value;review=false;rawEdited=false;if(scenario!=='create')Object.assign(draft,{group:'extensions.example.test',version:'v1',gp:'2000',vp:'10',namespace:'preview-system',service:'extension-api'});render()};$('#yaml').onclick=()=>{mode='yaml';review=false;render()};$('#form').onclick=()=>{mode='form';review=false;render()};document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;review=false;render()});$('#back').onclick=()=>{review=false;render()};$('#review').onclick=()=>{let a=errors();if(rawEdited){$('#content').innerHTML='<h2>Source review unavailable</h2><div class="note">Raw source preserved. This mock cannot validate manually edited YAML; no request allowed.</div>';return}if(a.length){let node=document.createElement('div');node.className='error';node.setAttribute('role','alert');node.tabIndex=-1;node.textContent=a.join(' ');$('#content').prepend(node);node.focus();return}review=true;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#help').hidden){$('#help').hidden=true;lastHelp?.focus();e.preventDefault()}});render();
</script></html>
