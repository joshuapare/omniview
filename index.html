const $=s=>document.querySelector(s);let kind='Role',intent='create',section='Access',mode='Form',raw='',manual=false,review=false,helpOpener;let state;const binding=()=>kind.includes('Binding'),cluster=()=>kind.startsWith('Cluster');function reset(){state={name:intent==='edit'?'preview-reader':'',namespace:'preview',group:'',resources:'pods',names:'',verbs:['get','list'],target:'preview-reader',targetKind:'Role',subjects:[{kind:'ServiceAccount',name:'preview-runner',namespace:'preview'}],aggregate:false,selectors:[{key:'rbac.example.com/aggregate',value:'read'}],labelKey:'',labelValue:'',nonresource:false,urls:'/healthz'};raw='';manual=false;review=false;mode='Form';render()}
function field(label,id,value,extra=''){return `<label class="field">${label}<input id="${id}" name="${id}" autocomplete="off" spellcheck="false" value="${value}" ${extra}></label>`}function help(){return '<button id="help" aria-label="Explain privilege boundaries">?</button>'}function yaml(){if(manual)return raw;return `# RBAC draft · no request sent\napiVersion: rbac.authorization.k8s.io/v1\nkind: ${kind}\nmetadata:\n  name: ${JSON.stringify(state.name)}\n${cluster()?'':`  namespace: ${state.namespace}\n`}${state.labelKey?`  labels:\n    ${state.labelKey}: ${JSON.stringify(state.labelValue)}\n`:''}${binding()?`roleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ${cluster()?'ClusterRole':state.targetKind}\n  name: ${state.target}\nsubjects:\n`+state.subjects.map(s=>`- kind: ${s.kind}\n  apiGroup: ${s.kind==='ServiceAccount'?'""':'rbac.authorization.k8s.io'}\n  name: ${s.name}\n${s.kind==='ServiceAccount'?`  namespace: ${s.namespace}\n`:''}`).join(''):state.aggregate?`aggregationRule:\n  clusterRoleSelectors:\n`+state.selectors.map(s=>`  - matchLabels:\n      ${s.key}: ${JSON.stringify(s.value)}\n`).join(''):`rules:\n- verbs: ${JSON.stringify(state.verbs)}\n`+(state.nonresource?`  nonResourceURLs: ${JSON.stringify(state.urls.split(',').map(x=>x.trim()))}\n`:`  apiGroups: ${JSON.stringify(state.group.split(',').map(x=>x.trim()))}\n  resources: ${JSON.stringify(state.resources.split(',').map(x=>x.trim()))}\n`+(state.names?`  resourceNames: ${JSON.stringify(state.names.split(',').map(x=>x.trim()))}\n`:''))}`}
function render(){let unavailable=$('#availability').value,locked=unavailable==='system';$('#title').textContent=`${locked?'Inspect':intent==='edit'?'Edit':'Create'} ${kind}`;$('#destination').textContent=`preview-cluster / ${cluster()?'Cluster scope':state.namespace+' namespace'} · rbac.authorization.k8s.io/v1`;$('#back').classList.toggle('hide',!review);$('#review').disabled=locked||['denied','unavailable'].includes(unavailable)||manual;$('#form').disabled=manual;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));let out='';if(['denied','unavailable'].includes(unavailable))out+=`<div class="warn">${unavailable==='denied'?'Authorization denied · Draft retained. No permission inferred.':'Discovery unavailable · Draft retained. Retry discovery outside this mock.'}</div>`;if(locked)out+='<div class="warn">System-managed · Inspect only. Automatic reconciliation may restore permissions.</div>';if(review){out+=`<h2>Review ${kind} · No mutation</h2><div class="warn">${binding()?`Grant selected subjects access ${cluster()?'across the cluster':'within '+state.namespace}.`:'Permission changes affect every binding referencing this role.'} Authorization must allow ${binding()?'bind':'escalate'} or already hold the granted permissions.</div><pre>${escapeHtml(yaml())}</pre>`}else if(mode==='YAML'){out+=`<h2>Source draft</h2><div class="${manual?'warn':'muted'}">${manual?'Manual source retained verbatim · Form and review locked. No parser or lossless import is claimed.':'Generated bounded YAML · Editing source locks guided controls.'}</div><textarea id="source" aria-label="YAML source" spellcheck="false">${escapeHtml(yaml())}</textarea>`}else if(section==='Metadata'){out+=`<h2>Metadata</h2><div class="row">${field('Label key','labelKey',state.labelKey)}${field('Label value','labelValue',state.labelValue)}</div><small>Annotations and unsupported metadata stay in source; this mock does not import them.</small>`}else if(secti k}</option>`).join('')}</select><input aria-label="Subject ${i+1} name" data-sub="${i}" data-key="name" value="${s.name}" autocomplete="off"><input aria-label="Subject ${i+1} namespace" data-sub="${i}" data-key="namespace" value="${s.namespace}" ${s.kind!=='ServiceAccount'?'disabled':''}><button data-remove="${i}" aria-label="Remove subject ${i+1}">×</button></div>`).join('')+'<button id="add">+ Add subject</button><div class="warn">'+(cluster()?'Cluster-wide grant. Review every subject.':'Access is limited to this binding’s namespace, even when referencing a ClusterRole.')+'</div>'}else{if(kind==='ClusterRole')out+=`<label><input type="checkbox" id="aggregate" ${state.aggregate?'checked':''} style="width:auto;min-height:0"> Aggregate permissions from matching ClusterRoles</label>`;if(state.aggregate)out+=`<div class="warn">Rules are controller-managed. Selector changes can broaden access.</div>`+state.selectors.map((s,i)=>`<div class="row">${field('Match label key',`selectorKey${i}`,s.key)}${field('Match label value',`selectorValue${i}`,s.value)}<button data-selector-remove="${i}" aria-label="Remove selector ${i+1}">×</button></div>`).join('')+'<button id="addSelector">+ Add OR selector</button>';else{if(kind==='ClusterRole')out+=`<label class="field">Rule target<select id="nonresource"><option value="resource" ${!state.nonresource?'selected':''}>API resources</option><option value="url" ${state.nonresource?'selected':''}>Non-resource URLs</option></select></label>`;out+=`<div class="card"><h3>Rule 1</h3>`+(state.nonresource?field('URL paths · comma-separated','urls',state.urls):`<div class="row">${field('API groups · empty = core','group',state.group)}${field('Resources · comma-separated','resources',state.resources)}</div>${field('Limit to names · optional','names',state.names)}`)+`<h3 style="margin-top:16px">Allowed verbs *</h3><div class="verbs">${['get','list','watch','create','update','patch','delete','deletecollection','bind','escalate','impersonate','*'].ma function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function bind(){for(const id of ['name','namespace','group','resources','names','target','labelKey','labelValue','urls']){const e=$('#'+id);if(e)e.oninput=()=>state[id]=e.value}$('#targetKind')?.addEventListener('change',e=>{state.targetKind=e.target.value});$('#aggregate')?.addEventListener('change',e=>{state.aggregate=e.target.checked;render()});$('#nonresource')?.addEventListener('change',e=>{state.nonresource=e.target.value==='url';render()});document.querySelectorAll('[data-verb]').forEach(e=>e.onchange=()=>{state.verbs=e.checked?[...state.verbs,e.dataset.verb]:state.verbs.filter(x=>x!==e.dataset.verb);render()});document.querySelectorAll('[data-sub]').forEach(e=>e.onchange=()=>{state.subjects[+e.dataset.sub][e.dataset.key]=e.value;render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{state.subjects.splice(+e.dataset.remove,1);render()});$('#add')?.addEventListener('click',()=>{state.subjects.push({kind:'Group',name:'',namespace:''});render()});state.selectors.forEach((s,i)=>{let k=$('#selectorKey'+i),v=$('#selectorValue'+i);if(k)k.oninput=()=>s.key=k.value;if(v)v.oninput=()=>s.value=v.value});$('#addSelector')?.addEventListener('click',()=>{state.selectors.push({key:'',value:''});render()});document.querySelectorAll('[data-selector-remove]').forEach(e=>e.onclick=()=>{state.selectors.splice(+e.dataset.selectorRemove,1);render()});$('#source')?.addEventListener('input',e=>{raw=e.target.value;manual=true;$('#form').disabled=true;$('#review').disabled=true});const h=$('#help');if(h){let show=()=>{if($('#popover'))return;helpOpener=h;let p=document.createElement('div');p.className='help';p.id='popover';p.role='tooltip';p.innerHTML='<button aria-label="Close help">×</button><strong>Least privilege</strong><p>Rules add permissions; they never deny access. resourceNames cannot constrain create or deletecollection. list/watch require a matching name field selector. Non-resource URLs apply only through ClusterRoleBinding.</p>';document.body.append(p);p.querySelector('button').onclick=closeHelp};h.onclick=show;h.onfocus=show;h.onmouseenter=show}}
function closeHelp(){$('#popover')?.remove();helpOpener?.focus();$('#popover')?.remove()}document.onkeydown=e=>{if(e.key==='Escape'&&$('#popover')){e.preventDefault();closeHelp()}if(e.key==='Tab'){const list=[...document.querySelectorAll('.shell button:not(:disabled),.shell input:not(:disabled),.shell select:not(:disabled),.shell textarea:not(:disabled)')].filter(e=>e.offsetParent);if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}};$('#kind').onchange=e=>{kind=e.target.value;reset()};$('#intent').onchange=e=>{intent=e.target.value;reset()};$('#availability').onchange=()=>render();document.querySelectorAll('[data-section]').forEach(e=>e.onclick=()=>{section=e.dataset.section;review=false;render()});$('#yaml').onclick=()=>{raw=yaml();mode='YAML';review=false;render()};$('#form').onclick=()=>{mode='Form';render()};$('#back').onclick=()=>{review=false;render()};$('#review').onclick=()=>{let error=!state.name?'Enter a resource name.':!cluster()&&!state.namespace?'Enter a namespace.':binding()&&!state.target?'Choose a role reference.':binding()&&state.subjects.some(s=>!s.name||s.kind==='ServiceAccount'&&!s.namespace)?'Enter each subject name and ServiceAccount namespace.':!binding()&&!state.aggregate&&!state.verbs.length?'Choose at least one verb.':!binding()&&!state.aggregate&&!state.nonresource&&!state.resources?'Enter a resource.':!binding()&&state.aggregate&&state.selectors.some(s=>!s.key)?'Enter each selector key.':'';if(error){$('#error').textContent=error;$('#name')?.focus();return}review=true;render()};window.onbeforeunload=()=>state.name?'Unsaved draft':undefined;reset();</script></html>
