<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calico resource studio — mock 303</title><style>:root{color-scheme:dark;--bg:#11151b;--panel:#1b2029;--line:#343d4c;--text:#e3e8f0;--muted:#9caabd;--accent:#83b4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;background:#171c24;border:1px solid var(--line);border-radius:5px;min-height:32px;padding:6px 9px}button{cursor:pointer}button:hover{background:#303e53}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}label{display:block;color:var(--muted);margin-bottom:5px}h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 18px}small{color:var(--muted)}.lab{height:70px;padding:16px 26px;display:flex;gap:14px;align-items:center}.shell{width:min(1000px,96vw);height:700px;margin:20px auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;overflow:hidden}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sub{margin-top:7px;color:var(--muted)}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin-bottom:7px;border:0;background:transparent}nav button.active{background:#2b3f5e;color:#b6d1ff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.field input,.field select{width:100%}.wide{grid-column:1/-1}.row{display:flex;gap:7px;margin:6px 0;align-items:center}.row input,.row select{min-width:0;flex:1}.row button{flex:none}.warn{padding:10px 12px;border:1px solid #826338;background:#352c21;color:#f4d09b;margin-bottom:16px;border-radius:5px}.error{color:#ffb1b6;margin:10px 0}.badge{color:#9dc5ff}.path{font:11px ui-monospace;color:#8192a9;margin-top:4px}footer{border-top:1px solid var(--line);padding:13px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.primary{background:#3869aa;border-color:#5184c8}.source{width:100%;height:365px;font:12px/1.7 ui-monospace;white-space:pre;resize:vertical}.help{position:fixed;right:calc(50% - 420px);top:210px;width:300px;background:#303b4b;border:1px solid #7088aa;padding:16px;border-radius:7px;z-index:4}.help p{line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#131923;padding:15px}input:disabled{opacity:.65}@media(max-width:720px){.lab{height:auto;flex-wrap:wrap}.shell{margin:8px auto;height:760px}nav{width:130px}.grid{grid-template-columns:1fr}header{padding:14px}main{padding:16px}.help{right:20px;max-width:80vw}footer{padding:12px;flex-wrap:wrap}}</style><div class="lab"><strong>CALICO / DESIGN LAB</strong><label>Resource <select id="kind"></select></label><label>Scenario <select id="scenario"><option>Create</option><option>Edit</option><option>Managed</option><option>API unavailable</option><option>Permission denied</option><option>Capability unknown</option><option>References empty</option></select></label><small>Synthetic fixtures · HTML composition · No API calls</small></div><section class="shell" aria-label="Resource editor"><header><div><h1 id="title"></h1><div class="sub" id="destination"></div></div><div><button id="form">Form</button> <button id="yaml">YAML</button> <button id="help" aria-label="Help with resource">?</button></div></header><div class="body"><nav><button data-section="settings" class="active">Resource settings</button><button data-section="advanced">Advanced fields</button><button data-section="ownership">Ownership & status</button></nav><main id="main"></main></div><footer><small id="foot">Draft only · Nothing will be applied</small><div><button id="back">Back to draft</button> <button class="primary" id="review">Review draft</button></div></footer></section><div id="helpbox" class="help" hidden role="dialog" aria-label="Resource help"><strong>Precise, not implicit</strong><p id="helptext"></p><button id="closehelp">Close help</button></div><script>
let C,kind='NetworkPolicy',section='settings',mode='form',drafts={},sourceDrafts={},sourceOnly={},review=false;const $=s=>document.querySelector(s),ns=k=>['NetworkPolicy','NetworkSet','StagedNetworkPolicy','StagedKubernetesNetworkPolicy'].includes(k),locked=()=>['BlockAffinity','ClusterInformation'].includes(kind)||$('#scenario').value==='Managed',blocked=()=>['API unavailable','Permission denied','Capability unknown'].includes($('#scenario').value);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function get(p){return p.split('.').reduce((a,x)=>a?.[x],drafts[kind])}function set(p,v){let a=drafts[kind],ps=p.split('.');ps.slice(0,-1).forEach(x=>a=a[x]??={});if(v==='')delete a[ps.at(-1)];else a[ps.at(-1)]=v;sourceDrafts[kind]=null;review=false}function control(p,label,t){let v=get(p),disabled=locked()||($('#scenario').value==='Edit'&&kind==='IPPool'&&['cidr','blockSize'].includes(p));let h=`<div class="field ${['list','rules','filters','pairs','ports','prefix','protoports','cidrrows','k8srules'].includes(t)?'wide':''}"><label>${esc(label)}</label>`;if(t.startsWith('ref:')||t==='bool'){let opts=t==='bool'?['true','false']:t.slice(4).split(',');h+=`<select aria-label="${esc(label)}" data-path="${p}" data-type="${t}" ${disabled?'disabled':''}><option value="">Not set</option>${opts.map(x=>`<option ${String(v)===x?'selected':''}>${x}</option>`).join('')}</select>`}else if(['list','rules','filters','pairs','ports','prefix','protoports','cidrrows','k8srules'].includes(t)){let rows=Array.isArray(v)?v:[];h+=rows.map((r,i)=>`<div class="row">${rowFields(t,r).map(([key,val,opts])=>opts?`<select aria-label="${label} ${key} ${i+1}" data-row="${p}" data-index="${i}" data-key="${key}" ${disabled?'disabled':''}>${opts.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input aria-label="${label} ${key} ${i+1}" data-row="${p}" data-index="${i}" data-key="${key}" value="${esc(val)}" autocomplete="off" ${disabled?'disabled':''}>`).join('')}<button data-remove="${p}" data-index="${i}" aria-label="Remove ${label} ${i+1}" ${disabled?'disabled':''}>−</button></div>`).join('');h+=`<button data-add="${p}" data-type="${t}" ${disabled?'disabled':''}>+ Add ${esc(label.toLowerCase())}</button>`}else h+=`<input aria-label="${esc(label)}" autocomplete="off" spellcheck="false" data-path="${p}" data-type="${t}" value="${esc(v)}" ${disabled?'disabled':''}>`;return h+`<div class="path">spec.${p}</div></div>`}function rowFields(t,r){if(t==='list')return [['value',r]];if(t==='rules')return [['action',r.action,['Allow','Deny','Log','Pass']],['protocol',r.protocol,['TCP','UDP','ICMP']],['source.selector',r.source?.selector||''],['destination.ports',r.destination?.ports?.join(',')||'']];if(t==='filters')return [['action',r.action,['Accept','Reject']],['cidr',r.cidr||''],['matchOperator',r.matchOperator,['In','NotIn','Equal','NotEqual']]];if(t==='k8srules')return [['ports.0.port',r.ports?.[0]?.port||''],['ports.0.protocol',r.ports?.[0]?.protocol||'TCP',['TCP','UDP','SCTP']]];if(t==='cidrrows')return [['cidr',r.cidr||'']];if(t==='ports'||t==='protoports')return [...(t==='ports'?[['name',r.name||'']]:[]),['protocol',r.protocol||'TCP',['TCP','UDP']],['port',r.port||'']];if(t==='prefix')return [['cidr',r.cidr||''],['communities',r.communities?.join(',')||'']];return [['name',r.name||''],['value',r.value||'']]}
function render(){let s=$('#scenario').value,ro=locked();$('#title').textContent=(ro?'Inspect':s==='Edit'?'Edit':'Create')+' '+kind;$('#destination').textContent='preview-cluster / '+(ns(kind)?'preview namespace':'Cluster scope')+' · projectcalico.org/v3';$('#review').disabled=ro||blocked();$('#review').textContent=review?'Review only — no apply':'Review draft';$('#foot').textContent=sourceOnly[kind]?'Source-only draft preserved · No parser normalization':'Draft only · Nothing will be applied';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));let h='';if(blocked()){h=`<h2>${esc(s)}</h2><div class="warn">${s==='API unavailable'?'Aggregated projectcalico.org/v3 API unavailable. No create or edit.':s==='Permission denied'?'Authoring denied. Request the exact resource verb from your administrator.':'Staged policy support not verified. Registration does not prove enforcement.'}</div><button id="retry">Recheck fixture availability</button>`}else if(review){h=`<h2>Review ${kind}</h2><div class="warn">${consequence()} No request will be sent.</div><pre>${esc(yaml())}</pre><label><input type="checkbox" id="ack"> I reviewed destination and traffic consequences</label>`}else if(mode==='yaml'){h=`<h2>Source draft</h2><div class="warn">Source edits remain source-only. Form conversion is unavailable; original text stays intact.</div><textarea class="source" aria-label="YAML source" spellcheck="false" ${ro?'readonly':''}>${esc(yaml())}</textarea>`}else if(section==='ownership'){h=`<h2>Ownership & generated status</h2><div class="warn">${ro?'Managed record: authoring and deletion unavailable. Follow owning controller.':'Independent fixture ownership. Production must inspect managed fields and permissions.'}</div><dl><dt>Owner</dt><dd>${ro?'Calico controller / IPAM':'Independent operator'}</dd><dt>Status</dt><dd>${kind==='CalicoNodeStatus'?'Not observed — subscription has not run':kind==='KubeControllersConfiguration'?'runningConfig unavailable; environment overrides not loaded':'No controller health inferred'}</dd></dl><pre>${esc(JSON.stringify(drafts[kind],null,2))}</pre>`}else if(sourceOnly[kind]){h='<h2>Source-only draft</h2><div class="warn">Unsupported source stays intact. Open YAML to repair; no unsafe Form rewrite.</div>'}else if(section==='advanced'){h=`<h2>Advanced source coverage</h2><div class="warn">Unmodeled fields use source-only editing. Status and managed metadata stay inspect-only.</div><details><summary>All pinned spec paths</summary><pre>${esc(C[kind].schema.join('\n'))}</pre></details><button id="opensrc">Open source draft</button>`}else{h=`<h2>${esc(C[kind].title)}</h2>${ro?'<div class="warn">Controller-managed record. No create, edit, or delete.</div>':`<div class="warn">${consequence()}</div>`}${kind.startsWith('Staged')?'<div class="warn">Fixture capability confirmed for authoring only; enforcement not asserted.</div>':''}<div class="grid"><div class="field"><label for="name">Name *</label><input id="name" value="${esc(drafts[kind]._name)}" ${s==='Edit'||ro?'disabled':''} autocomplete="off"></div><div class="field"><label>Destination</label><input aria-label="Destination" value="${ns(kind)?'preview':'Cluster-scoped'}" disabled></div>${C[kind].fields.map(f=>control(...f)).join('')}</div><div class="error" id="error" role="alert"></div>`}$('#main').innerHTML=h;bind()}
function consequence(){return ({HostEndpoint:'Host policy can interrupt node and administrative traffic.',IPPool:'Allocation and routing changes affect workloads. CIDR and block size lock on edit.',IPReservation:'Reservation prevents new allocations; it does not evict allocated IPs.',Tier:'Tier order and fall-through can deny selected traffic.',CalicoNodeStatus:'Creates a diagnostic subscription, not generated status. Zero interval disables periodic updates.',BGPPeer:'Peer and filter changes can withdraw routes.',BGPFilter:'Filters evaluate in order and may suppress advertised routes.',FelixConfiguration:'Dataplane changes may interrupt connectivity.',KubeControllersConfiguration:'Controller changes can affect reconciliation and automatic host protection.',IPAMConfiguration:'Affinity and block limits can constrain future allocations.',Profile:'Only independently owned profiles may be authored.'})[kind]||'Traffic selection and rule order can change connectivity.'}
function yaml(){return sourceDrafts[kind]??`# Synthetic preview — no request\napiVersion: projectcalico.org/v3\nkind: ${kind}\nmetadata:\n  name: ${drafts[kind]._name||''}\n${ns(kind)?'  namespace: preview\n':''}spec: ${JSON.stringify(Object.fromEntries(Object.entries(drafts[kind]).filter(([k])=>k!=='_name')),null,2)}\n`}
function bind(){document.querySelectorAll('[data-path]').forEach(e=>e.onchange=()=>set(e.dataset.path,e.dataset.type==='bool'?(e.value===''?'':e.value==='true'):e.value));document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{let v=get(e.dataset.add)||[];v.push(e.dataset.type==='list'?'':e.dataset.type==='rules'?{action:'Allow'}:e.dataset.type==='filters'?{action:'Accept'}:{});set(e.dataset.add,v);render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{let v=get(e.dataset.remove);v.splice(+e.dataset.index,1);set(e.dataset.remove,v);render()});document.querySelectorAll('[data-row]').forEach(e=>e.onchange=()=>{let v=get(e.dataset.row),r=v[+e.dataset.index];if(e.dataset.key==='value'&&typeof r==='string')v[+e.dataset.index]=e.value;else{let a=r,ps=e.dataset.key.split('.');ps.slice(0,-1).forEach((x,i)=>a=a[x]??=(/^\d+$/.test(ps[i+1])?[]:{}));a[ps.at(-1)]=['destination.ports','communities'].includes(e.dataset.key)?e.value.split(','):e.value}set(e.dataset.row,v)});if($('#name'))$('#name').oninput=e=>drafts[kind]._name=e.target.value;if($('.source'))$('.source').oninput=e=>{sourceDrafts[kind]=e.target.value;sourceOnly[kind]=true};if($('#opensrc'))$('#opensrc').onclick=()=>{mode='yaml';render()};if($('#retry'))$('#retry').onclick=()=>{$('#scenario').value='Create';render()}}
$('#review').onclick=()=>{if(review)return;if(!drafts[kind]._name){$('#error').textContent='Enter a resource name before review.';$('#name').focus();return}review=true;render()};$('#back').onclick=()=>{review=false;render()};$('#form').onclick=()=>{mode='form';review=false;render()};$('#yaml').onclick=()=>{mode='yaml';review=false;render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{section=b.dataset.section;review=false;render()});$('#scenario').onchange=()=>{review=false;render()};$('#kind').onchange=()=>{kind=$('#kind').value;section='settings';review=false;mode='form';render()};$('#help').onclick=()=>{$('#helptext').textContent=consequence()+' Omitted values are not defaults inserted by this mock. Selectors use Calico syntax, not Kubernetes label-selector syntax. Advanced source keeps unsupported text without conversion.';$('#helpbox').hidden=false;$('#closehelp').focus()};$('#closehelp').onclick=()=>{$('#helpbox').hidden=true;$('#help').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#helpbox').hidden){e.preventDefault();$('#closehelp').click()}});fetch('components.json').then(r=>r.json()).then(c=>{C=c;Object.keys(C).forEach(k=>{drafts[k]={_name:''};$('#kind').add(new Option(k,k))});render()});
</script><script src="enhancements.js"></script></html>
