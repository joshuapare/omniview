const $=s=>document.querySelector(s);let kind='PriorityClass',intent='create',mode='form',raw='',sourceEdited=false,reviewing=false;let d;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const locked=()=>intent!=='create';function reset(){kind=$('#kind').value;intent=$('#intent').value;d={name:locked()?(kind==='PriorityClass'?'batch-low':'training-preview'):'',value:locked()?'1000':'',description:locked()?'Background processing':'',preemption:'',global:false,ref:locked()?'batch|Job|training-preview':'',groups:locked()?[{name:'workers',policy:'basic',min:'',gangDraft:''}]:[]};raw='';sourceEdited=false;reviewing=false;mode='form';render()}
function manifest(){if(sourceEdited)return raw;let s=`apiVersion: scheduling.k8s.io/${kind==='PriorityClass'?'v1':'v1alpha1'}\nkind: ${kind}\nmetadata:\n  name: ${JSON.stringify(d.name)}\n`;if(kind==='Workload')s+='  namespace: preview\n';if(kind==='PriorityClass'){s+=`value: ${d.value||'null'}\n`;if(d.description)s+=`description: ${JSON.stringify(d.description)}\n`;if(d.global)s+='globalDefault: true\n';if(d.preemption)s+=`preemptionPolicy: ${d.preemption}\n`}else{s+='spec:\n';if(d.ref){let [apiGroup,k,n]=d.ref.split('|');s+=`  controllerRef:\n    apiGroup: ${JSON.stringify(apiGroup)}\n    kind: ${k}\n    name: ${n}\n`}s+='  podGroups:'+(d.groups.length?'\n':' []\n');d.groups.forEach(g=>s+=`    - name: ${JSON.stringify(g.name)}\n      policy:\n`+(g.policy==='basic'?'        basic: {}\n':`        gang:\n          minCount: ${g.min||'null'}\n`))}return s}
function help(el,text){let p=$('#help');p.textContent=text;p.hidden=false;let b=el.getBoundingClientRect();p.style.left=Math.min(b.left,innerWidth-330)+'px';p.style.top=Math.min(b.bottom+8,innerHeight-140)+'px'}function hook(){document.querySelectorAll('[data-help]').forEach(b=>{b.onmouseenter=b.onfocus=b.onclick=()=>help(b,b.dataset.help);b.onmouseleave=()=>$('#help').hidden=true});document.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{d[e.dataset.field]=e.type==='checkbox'?e.checked:e.value;$('#status').textContent='Unsaved draft · nothing submitted'});document.querySelectorAll('[data-group]').forEach(e=>e.onchange=()=>{let g=d.groups[+e.dataset.group];if(e.dataset.key==='policy'){if(g.policy==='gang')g.gangDraft=g.min;g.policy=e.value;if(g.policy==='gang')g.min=g.gangDraft||'';render()}else g[e.dataset.key]=e.value});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{d.groups.splice(+b.dataset.remove,1);render()});if($('#add'))$('#add').onclick=()=>{d.groups.push({name:'',policy:'basic',min:'',gangDraft:''});render()}}
function field(label,key,type='text',disabled=false){return `<label>${label}<input autocomplete="off" name="${key}" data-field="${key}" id="${key}" type="${type}" value="${esc(d[key])}" ${disabled?'disabled':''}></label>`}function render(){const unavailable=$('#availability').value;$('#title').textContent=`${intent==='create'?'Create':intent==='owned'?'Inspect':'Edit'} ${kind}`;$('#destination').textContent='preview-cluster / '+(kind==='PriorityClass'?'Cluster scoped':'preview namespace');$('#version').textContent=kind==='PriorityClass'?'v1':'v1alpha1 · ALPHA';$('#back').hidden=!reviewing;$('#review').hidden=reviewing;$('#review').disabled=unavailable!=='ready'&&unavailable!=='gangoff'||intent==='owned'||sourceEdited;$('#help').hidden=true;let html='';if(reviewing){html=`<h2>Review draft · no mutation</h2><div class="notice">${kind==='PriorityClass'?'Priority can permit preemption of lower-priority Pods. Global default affects new Pods without a class. Existing Pods are not retroactively reprioritized.':'Pod groups become immutable after creation. This draft creates no Pods and does not prove scheduler support.'}</div><pre>${esc(manifest())}</pre><span class="badge">Preview only · no submit endpoint</span>`}else if(mode==='yaml'){html=`<h2>Advanced source</h2><div class="notice">Manual source stays verbatim. Form locks after any source edit; no lossless parser is claimed.</div><label>Manifest<textarea id="source" spellcheck="false" autocomplete="off">${esc(manifest())}</textarea></label>`}else if(sourceEdited){html='<h2>Source retained</h2><div class="notice">Form cannot safely represent manual source. Continue in YAML; your exact text remains intact.</div>'}else if(unavailable==='missing'||unavailable==='unavailable'){html=`<h2>${unavailable==='missing'?'API not discovered':'Discovery unavailable'}</h2><div class="notice">${unavailable==='missing'?'No authoring available. Workload requires served v1alpha1 and GenericWorkload (default off).':'Could not determine available versions or verbs. Draft retained; no mutation offered.'}</div><button id="fallback">Inspect draft source</button>`}else{html=`<h2>${kind==='PriorityClass'?'Priority & preemption':'Workload scheduling'} <button aria-label="Scheduling help" data-help="${kind==='PriorityClass'?'Higher values schedule first. User priority range: −2147483648 through 1000000000. system- names are reserved. Value and preemption policy are immutable.':'GenericWorkload and GangScheduling default off in v1.35. API discovery does not prove authorization or scheduler support. PodGroup is embedded, not a top-level resource.'}">?</button></h2>`;if(unavailable==='denied')html+='<div class="notice">Mutation denied · inspect only. Draft retained; discovery is not permission.</div>';if(intent==='owned')html+='<div class="notice">Controller-owned · inspect only. Change the owning definition, not this generated object.</div>';html+=`<div class="grid">${field('Name *','name','text',locked()||unavailable==='denied')}${kind==='PriorityClass'?field('Priority value *','value','number',locked()||unavailable==='denied'):'<label>Namespace<input value="preview" aria-label="Namespace" disabled></label>'}</div>`;let ro=intent==='owned'||unavailable==='denied';if(kind==='PriorityClass'){html+=`<label>Preemption policy ${locked()?'· immutable':''}<select id="preemption" data-field="preemption" ${locked()||ro?'disabled':''}><option value="">API default (omitted)</option><option ${d.preemption==='Never'?'selected':''}>Never</option><option ${d.preemption==='PreemptLowerPriority'?'selected':''}>PreemptLowerPriority</option></select></label><label class="check"><input type="checkbox" data-field="global" ${d.global?'checked':''} ${ro?'disabled':''}>Use as global default</label><label>Description<textarea data-field="description" ${ro?'disabled':''}>${esc(d.description)}</textarea></label><div class="notice">Preemption may evict lower-priority Pods. Global default affects new Pods without a class.</div>`}else{html+=`<label>Controller reference ${d.ref&&locked()?'· immutable once set':''}<select data-field="ref" id="ref" ${d.ref&&locked()||ro?'disabled':''}><option value="">None (omitted)</option><option value="batch|Job|training-preview" ${d.ref?'selected':''}>Job / training-preview · preview</option></select></label><div class="muted">Same-namespace fixture · reference is not metadata.ownerReferences.</div><div class="card"><strong>Pod groups</strong> <span class="muted">${d.groups.length} / 8 ${locked()?'· immutable':''}</span>`;d.groups.forEach((g,i)=>html+=`<div class="row"><input aria-label="Group ${i+1} name" data-group="${i}" data-key="name" value="${esc(g.name)}" placeholder="Group name…" ${locked()||ro?'disabled':''}><select aria-label="Group ${i+1} policy" data-group="${i}" data-key="policy" ${locked()||ro?'disabled':''}><option value="basic">Basic</option><option value="gang" ${g.policy==='gang'?'selected':''} ${unavailable==='gangoff'?'disabled':''}>Gang</option></select>${g.policy==='gang'?`<input aria-label="Group ${i+1} minimum count" type="number" min="1" data-group="${i}" data-key="min" value="${esc(g.min)}" ${locked()||ro?'disabled':''}>`:'<span class="muted">Standard</span>'}<button data-remove="${i}" aria-label="Remove group ${i+1}" ${locked()||ro?'disabled':''}>×</button></div>`);html+=`<button id="add" ${locked()||ro||d.groups.length===8?'disabled':''}>+ Add pod group</button></div><div class="notice">${unavailable==='gangoff'?'GangScheduling disabled · Basic remains available.':'Gang waits for its minimum schedulable Pod count; no scheduling success is implied.'} Pod groups lock after creation.</div>`}html+='<div id="errors" role="status" aria-live="polite"></div>'}$('#content').innerHTML=html;hook();if($('#source'))$('#source').oninput=e=>{raw=e.target.value;sourceEdited=true;$('#review').disabled=true};if($('#fallback'))$('#fallback').onclick=()=>{mode='yaml';render()}}
$('#kind').onchange=$('#intent').onchange=reset;$('#availability').onchange=()=>{reviewing=false;render()};$('#yaml').onclick=$('#advanced').onclick=()=>{mode='yaml';reviewing=false;render()};$('#form').onclick=$('#settings').onclick=()=>{mode='form';reviewing=false;render()};$('#back').onclick=()=>{reviewing=false;render()};$('#review').onclick=()=>{let errs=[];if(!/^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$/.test(d.name)||d.name.length>253||d.name.startsWith('system-'))errs.push('Name: enter a valid non-system DNS name.');if(kind==='PriorityClass'&&(!/^-?\d+$/.test(d.value)||Number(d.value)<-2147483648||Number(d.value)>1000000000))errs.push('Priority: enter an integer from −2147483648 to 1000000000.');if(kind==='Workload'){if(!d.groups.length)errs.push('Pod groups: add at least one group.');let names=new Set;d.groups.forEach(g=>{if(!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(g.name)||g.name.length>63||names.has(g.name))errs.push('Group name: use unique DNS labels, at most 63 characters.');names.add(g.name);if(g.policy==='gang'&&(!/^\d+$/.test(g.min)||Number(g.min)<1||Number(g.min)>2147483647))errs.push('Minimum count: enter a positive int32 integer.')})}if(errs.length){$('#errors').innerHTML=errs.map(e=>`<div class="error">${e}</div>`).join('');$('#name').focus()}else{reviewing=true;render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#help').hidden){$('#help').hidden=true;document.querySelector('[data-help]')?.focus();$('#help').hidden=true}});reset();
