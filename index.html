<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101112"><title>Istio security editor • design preview</title><style>:root{color-scheme:dark;--bg:#101112;--panel:#1f2125;--field:#141517;--line:#383c44;--text:#e7e9ed;--muted:#a3aab5;--accent:#88b5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:5px;min-height:32px;padding:5px 9px}button{cursor:pointer;touch-action:manipulation}button:hover{background:#303744}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}header.shell{height:48px;border-bottom:1px solid var(--line);padding:14px 24px;color:var(--muted)}.fixture{position:absolute;top:65px;left:24px;color:var(--muted)}dialog{display:flex;flex-direction:column;position:relative;margin:100px auto 0;width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 120px));padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);overflow:hidden}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 16px}.head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sub{color:var(--muted);margin-top:7px}.toolbar{display:flex;gap:8px}.layout{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;border-right:1px solid var(--line);padding:20px 12px}nav button{width:100%;text-align:left;margin-bottom:6px;border:0;background:transparent}button.active{background:#2c3b54;color:#b6d2ff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#bfc6d0;marg const $=s=>document.querySelector(s);let kind='AuthorizationPolicy',section='Policy',mode='Form',edit=false,raw=null,pop=null,helpOwner=null;const drafts={};const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');function fresh(k){return {name:'',ns:'preview',target:'labels',key:'app',value:'',runtime:'Sidecar',action:'ALLOW',provider:'',rules:[],mtls:'',ports:[],jwt:[],refs:'preview-api',availability:'Available'}}function d(){return drafts[kind]??(drafts[kind]=fresh(kind))}function input(id,label,value,extra=''){return `<div class="field"><label for="${id}">${label}</label><input autocomplete="off" spellcheck="false" id="${id}" value="${esc(value)}" ${extra}></div>`}function select(id,label,values,value){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${values.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select></div>`}function help(text){return `<button class="help" type="button" aria-label="Help" data-help="${esc(text)}">?</button>`}function bind(id,key){const e=$('#'+id);if(e)e.oninput=()=>{d()[key]=e.value;if(id==='name')$('.error')?.remove()};}function manifest(){let x=d(),s=`# Synthetic draft; no request is sent\napiVersion: security.istio.io/v1\nkind: ${kind}\nmetadata:\n  name: ${JSON.stringify(x.name)}\n  namespace: ${JSON.stringify(x.ns)}\nspec:\n`;if(x.target==='labels')s+=`  selector:\n    matchLabels:\n      ${x.key}: ${JSON.stringify(x.value)}\n`;if(x.target==='Service (waypoint)')s+=`  targetRefs:\n    - group: ""\n      kind: Service\n      name: ${JSON.stringify(x.refs)}\n`;if(kind==='AuthorizationPolicy'){s+=`  action: ${x.action}\n`;if(x.action==='CUSTOM')s+=`  provider:\n    name: ${JSON.stringify(x.provider)}\n`;if(x.rules.length)s+='  rules:\n'+x.rules.map(r=>`    - from:\n        - source:\n            namespaces: ${JSON.stringify(r.ns.split(',').filter(Boolean))}\n      to:\n        - operation:\n            methods: ${JSON.stringify(r.method.split(',').filter(Boolean))}\n            paths: ${JSON.stringify(r.path.split(',').filter(Boolean))}\n            ports: ${JSON.stringify(r.port.split(',').filter(Boolean))}\n`).join('')}if(kind==='PeerAuthentication'){if(x.mtls)s+=`  mtls:\n    mode: ${x.mtls}\n`;if(x.ports.length)s+='  portLevelMtls:\n'+x.ports.map(p=>`    "${p.port}":\n      mode: ${p.mode}\n`).join('')}if(kind==='RequestAuthentication'&&x.jwt.length)s+='  jwtRules:\n'+x.jwt.map(j=>`    - issuer: ${JSON.stringify(j.issuer)}\n      audiences: ${JSON.stringify(j.aud.split(',').filter(Boolean))}\n${j.uri?`      jwksUri: ${JSON.stringify(j.uri)}\n`:''}`).join('');return s}function render(){let x=d();$('#title').textContent=(edit?'Edit ':'Create ')+kind;$('#dest').textContent=x.ns;$('#form').className=mode==='Form'?'active':'';$('#yaml').className=mode==='YAML'?'active':'';document.querySelectorAll('nav button').forEach(b=>b.className=b.dataset.section===section?'active':'');$('#kind').value=kind;$('#review').disabled=raw!==null;let html='';if(mode==='YAML'){html=`<h2>Source draft</h2>${raw!==null?'<div class="warning">Manual source retained verbatim. Guided editing and review unavailable; no lossless parser is claimed.</div>':''}<textarea id="source" aria-label="YAML source" spellcheck="false">${esc(raw??manifest())}</textarea>`}else if(raw!==null){html='<h2>Guided editing unavailable</h2><div class="warning">Source changed manually. Return to YAML; your exact draft remains intact.</div>'}else if(section==='Policy'){html=`<div class="grid">${input('name','Name *',x.name,edit?'readonly aria-readonly="true"':'')}${input('ns','Namespace *',x.ns,edit?'readonly aria-readonly="true"':'')}</div>`;if(kind==='AuthorizationPolicy'){html+=select('action','Action',['ALLOW','DENY','AUDIT','CUSTOM'],x.action);if(x.action==='CUSTOM')html+=input('provider','Existing MeshConfig provider name *',x.provider);html+=`<div class="warning">${x.action==='ALLOW'?'No rules means this policy allows nothing. Other matching policies still affect access.':x.action==='DENY'?'DENY matches reject traffic. Missing HTTP attributes also match TCP; constrain destination ports.':x.action==='AUDIT'?'AUDIT needs an enabled audit plugin; this draft does not enable one.':'CUSTOM cannot bypass DENY or ALLOW. Provider availability is not verified.'}</div><h2>Allow / deny matching requests ${help('Rules combine with OR. Within a rule: source AND operation AND all conditions. Empty rule matches everything. CUSTOM → DENY → ALLOW; not list order.')}</h2>`;x.rules.forEach((r,i)=>html+=`<div class="card"><div class="row"><b>Rule ${i+1}</b><button data-remove="${i}">Remove rule</button></div><div class="grid">${input('rns'+i,'From namespaces · comma-separated',r.ns)}${input('rm'+i,'HTTP methods · comma-separated',r.method)}${input('rp'+i,'Paths · comma-separated',r.path)}${input('rport'+i,'Destination ports · comma-separated',r.port)}</div></div>`);html+='<button id="add">+ Add matching rule</button>'}if(kind==='PeerAuthentication'){html+=select('mtls','Inbound mTLS mode',['','UNSET','STRICT','PERMISSIVE','DISABLE'],x.mtls)+`<div class="warning">${x.mtls==='STRICT'?'STRICT rejects connections without mTLS.':x.mtls==='DISABLE'?'DISABLE permits plaintext in sidecar mode. Unsupported in ambient.':'Inherit leaves parent policy effective. PERMISSIVE accepts plaintext and mTLS.'}</div><h2>Workload port overrides ${help('Use workload port, not Service port. Overrides require a nonempty workload selector. Workload policy overrides namespace, then mesh; UNSET inherits.')}</h2>`;x.ports.forEach((p,i)=>html+=`<div class="row">${input('pp'+i,'Workload port',p.port)}${select('pm'+i,'Mode',['STRICT','PERMISSIVE','DISABLE','UNSET'],p.mode)}<button data-remove="${i}">Remove</button></div>`);html+='<button id="add">+ Add port override</button>'}if(kind==='RequestAuthentication'){html+='<div class="warning">Missing JWT remains accepted. Requiring JWT needs a separate AuthorizationPolicy; none is created here.</div><h2>Trusted onal operations, and conditions remain YAML-owned. Service accounts cannot combine with namespace/principal matches.':kind==='PeerAuthentication'?'UNSET is explicit inheritance. An omitted mtls field stays omitted. Port overrides require workload labels.':'Header/prefix, cookie/query extraction, inline public JWKS, claim/header forwarding, timeout, and additional JWT rules remain YAML-owned. No JWT token is collected.'}</div></details><button id="open-source">Open exact source</button><div class="warning">Manual YAML edits retain raw text and lock the guided form. This mock does not implement an AST parser.</div>`}else{html=`<h2>Inspect scope & availability</h2>${select('availability','Capability fixture',['Available','RBAC denied','CRD missing','Discovery unavailable','Empty references','GitOps owned'],x.availability)}<div class="card"><b>${esc(x.availability)}</b><div class="sub">${x.availability==='Available'?'Fixture only: schema and verbs available; controller support remains unverified.':x.availability==='GitOps owned'?'Managed by sample GitOps owner. Direct editing blocked; open owning source in production.':x.availability==='Empty references'?'Lookup succeeded with zero references. Keep existing unresolved reference unchanged.':x.availability==='RBAC denied'?'Authorization denied. Draft retained; request permission, not retry as Create.':x.availability==='CRD missing'?'API not installed. No create or update offered.':'Discovery failed. Do not infer an empty list or controller absence.'}</div></div><h2>Effective policy</h2><div class="warning">Unavailable in this offline mock. Draft scope is not effective access, enforcement, or controller health.</div><button id="scope">Inspect draft target</button><div id="scope-result" class="sub"></div>`}$('#main').innerHTML=html;['name','ns','action','provider','mtls','runtime','target','key','value','refs','availability'].forEach(k=>bind(k,k));['action','runtime','target','availability'].forEach(k=>{if($('#'+k))$('#'+k).onchange=()=>{x[k]=$('#'+k).value;render()}});if($('#source'))$('#source').oninput=()=>{raw=$('#source').value;$('#review').disabled=true};if($('#add'))$('#add').onclick=()=>{kind==='AuthorizationPolicy'?x.rules.push({ns:'',method:'',path:'',port:''}):kind==='PeerAuthentication'?x.ports.push({port:'',mode:'STRICT'}):x.jwt.push({issuer:'',aud:'',uri:''});render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{(kind==='AuthorizationPolicy'?x.rules:kind==='PeerAuthentication'?x.ports:x.jwt).splice(+b.dataset.remove,1);render()});x.rules.forEach((r,i)=>[['rns','ns'],['rm','method'],['rp','path'],['rport','port']].forEach(([id,k])=>{if($('#'+id+i))$('#'+id+i).oninput=e=>r[k]=e.target.value}));x.ports.forEach((p,i)=>[['pp','port'],['pm','mode']].forEach(([id,k])=>{if($('#'+id+i))$('#'+id+i).oninput=e=>p[k]=e.target.value}));x.jwt.forEach((j,i)=>[['ji','issuer'],['ja','aud'],['ju','uri']].forEach(([id,k])=>{if($('#'+id+i))$('#'+id+i).oninput=e=>j[k]=e.target.value}));if($('#open-source'))$('#open-source').onclick=()=>{mode='YAML';render()};if($('#scope'))$('#scope').onclick=()=>$('#scope-result').textContent='Draft target: '+(x.target==='All workloads'?x.ns+' / all workloads':x.target==='labels'?x.ns+' / '+x.key+'='+x.value:x.ns+' / Service '+x.refs);document.querySelectorAll('[data-help]').forEach(b=>{const show=()=>{closeHelp();helpOwner=b;pop=document.createElement('div');pop.className='popover';pop.role='tooltip';pop.id='help-content';pop.textContent=b.dataset.help;document.body.append(pop);let r=b.getBoundingClientRect();pop.style.left=Math.min(r.left,innerWidth-330)+'px';pop.style.top=Math.min(r.bottom+8,innerHeight-130)+'px';b.setAttribute('aria-describedby','help-content')};b.onfocus=show;b.onmouseenter=show;b.onclick=show;b.onblur=closeHelp;b.onmouseleave=closeHelp});$('#edit').textContent=edit?'Edit fixture · identity locked':'Switch to edit fixture'}function closeHelp(){pop?.remove();pop=null;helpOwner?.removeAttribute('aria-describedby')}$('#form').onclick=()=>{mode='Form';render()};$('#yaml').onclick=()=>{mode='YAML';render()};$('#kind').onchange=()=>{if(raw!==null){$('#kind').value=kind;return}kind=$('#kind').value;section='Policy';render()};document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});$('#edit').onclick=()=>{edit=true;if(!d().name)d().name='preview-policy';render()};$('#review').onclick=()=>{let x=d(),error=!x.name?'Enter a resource name.':!x.ns?'Enter a namespace.':x.target==='labels'&&!x.value?'Add a target label value.':x.action==='CUSTOM'&&!x.provider&&kind==='AuthorizationPolicy'?'Choose an existing extension provider.':kind==='PeerAuthentication'&&x.ports.some(p=>!/^\d+$/.test(p.port)||+p.port<1||+p.port>65535||x.target!=='labels'||!x.value)?'Port overrides require labels and ports 1–65535.':kind==='PeerAuthentication'&&x.runtime==='Ambient / waypoint'&&(x.mtls==='DISABLE'||x.ports.some(p=>p.mode==='DISABLE'))?'Ambient does not support DISABLE.':kind==='RequestAuthentication'&&x.jwt.some(j=>!j.issuer||(j.uri&&!/^https?:\/\//.test(j.uri)))?'Enter issuer and an HTTP(S) public JWKS URL.':x.availability!=='Available'?'Review blocked by capability or ownership state.':'';if(error){const e=document.createElement('div');e.className='error';e.role='alert';e.textContent=error;$('#main').prepend(e);$('#main').scrollTop=0;($('#name')||$('#main input')||$('#main select'))?.focus();return}$('#main').innerHTML=`<h2>Review ${edit?'edit':'creation'}</h2><div class="card summary"><b>${esc(kind)} / ${esc(x.name)}</b><br>Destination: preview-cluster / ${esc(x.ns)}<br>Target: ${esc(x.target)}<br>Intent: ${edit?'Update existing identity':'Create one policy'}</div><div class="warning">${kind==='AuthorizationPolicy'?'Access may be denied or broadened. Evaluate CUSTOM → DENY → ALLOW with all installed policies.':kind==='PeerAuthentication'?'mTLS changes can interrupt traffic; inheritance and workload-port overrides affect the result.':'Invalid JWT is r
