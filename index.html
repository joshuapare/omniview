<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>Calico operator · Editor proposal</title><style>
:root{color-scheme:dark;font:13px system-ui;background:#101112;color:#e6e7eb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select,input{height:32px;border:1px solid #42454e;border-radius:5px;background:#272a30;color:inherit;padding:0 10px}button{cursor:pointer;touch-action:manipulation}button:hover{background:#373b45}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #8daeff;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}header{height:52px;border-bottom:1px solid #292b30;padding:15px 24px;color:#b5b8c2}.outside{padding:20px 24px;color:#a5a9b4;display:flex;align-items:center;gap:12px}.outside label{display:flex;align-items:center;gap:8px}.frame{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 130px));margin:0 auto;background:#1f2125;border:1px solid #3b3e46;border-radius:9px;display:flex;flex-direction:column;box-shadow:0 20px 70px #0007}.top{padding:18px 24px;border-bottom:1px solid #383b42;display:flex;justify-content:space-between;gap:10px}h1{font-size:17px;margin:0 0 6px}small,.muted{color:#a6acb8}.seg{display:flex;gap:4px;align-items:center}button.active{background:#35496c;border-color:#7599dc}.middle{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;background:#1a1c20;padding:20px 12px;display:flex;flex-direction:column;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent}main{flex:1;min-width:0;overflow:auto;padding:20px 24px;overscroll-behavior:contain}h2{font-size:14px;margin:0 0 18px}h3{font-size:13px;margin:20px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}label.field small{font:11px ui-monospace;overflow-wrap:anywhere}input,select{width:100%}.notice{border-left:3px solid #d7a455;background:#3d3223;padding:10px 12px;margin:0 0 18px;color:#f4d4a2;line-height:1.5}.note{background:#262e3a;border-left:3px solid #799edb;padding:10px 12px;margin-bottom:16px}.row{display:flex;gap:8px;align-items:end;margin:8px 0}.row label{flex:1;margin:0}.row button{flex-shrink:0}.error{color:#ffb2b6;line-height:1.5;margin:10px 0}footer{padding:14px 24px;border-top:1px solid #383b42;display:flex;align-items:center;gap:10px}footer span{flex:1;color:#b1b5c0}.primary{background:#5078bf;border-color:#7097dc;color:white}textarea{width:100%;height:350px;resize:vertical;background:#15171b;color:#c4d8ff;border:1px solid #414651;border-radius:5px;padding:12px;font:12px/1.7 ui-monospace;tab-size:2}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 ui-monospace;background:#16181d;padding:14px;border-radius:5px}.help{width:26px;height:26px;padding:0;border-radius:50%}#helpbox{position:fixed;max-width:320px;background:#303640;border:1px solid #727b8c;padding:14px;border-radius:7px;z-index:5;box-shadow:0 8px 28px #0009;line-height:1.6}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #373b43}th{color:#a7adba;font-weight:500}.badge{color:#ecc683}.inline{display:flex;gap:8px;align-items:center}.inline h2{margin-bottom:0}.sectionhead{margin-bottom:18px}a{color:#9dbbff}@media(max-width:700px){.outside{flex-wrap:wrap;padding:10px}.frame{height:calc(100vh - 170px)}nav{width:120px;padding:12px 6px}.top{padding:14px}.grid{grid-template-columns:1fr}main{padding:16px}footer{padding:10px}.outside small{display:none}} </style>
<header>◈ Omniview <span class="muted"> / preview-cluster / Operator resources</span></header><div class="outside"><label>Fixture <select id="kind"></select></label><label>Intent <select id="intent"><option>Create</option><option>Edit</option></select></label><label>Access <select id="access"><option>Allowed</option><option>Denied</option><option>API missing</option><option>Unavailable</option><option>GitOps owned</option></select></label><small>Interactive HTML proposal · Synthetic fixtures only · No cluster requests</small></div>
<section class="frame" role="dialog" aria-modal="true" aria-labelledby="title"><div class="top"><div><h1 id="title"></h1><small>preview-cluster · Cluster scoped · operator.tigera.io/v1</small></div><div class="seg"><button id="form">Form</button><button id="yaml">YAML</button></div></div><div class="middle"><nav aria-label="Editor sections"><button data-section="Configuration">Configuration</button><button data-section="Advanced">Advanced</button><button data-section="Ownership">Ownership</button></nav><main id="main"></main></div><footer><span id="dest">Destination: preview-cluster</span><button id="back">Back to Draft</button><button class="primary" id="review">Review Draft</button></footer></section><div id="helpbox" role="tooltip" hidden></div>
<script>
const kinds=['Installation','APIServer','ImageSet','Goldmane','Whisker','GatewayAPI','TigeraStatus'];const $=s=>document.querySelector(s);const states={};let kind=new URLSearchParams(location.search).get('kind')||'Installation',section='Configuration',mode='Form',review=false,helpOpener;
$('#kind').innerHTML=kinds.map(k=>`<option>${k}</option>`).join('');$('#kind').value=kind;
try { mode=localStorage.getItem('mock-305-mode')==='YAML'?'YAML':'Form'; } catch {}
document.addEventListener('click',e=>{if(e.target.id==='form'||e.target.id==='yaml'){try{localStorage.setItem('mock-305-mode',e.target.id==='yaml'?'YAML':'Form');}catch{}}});
const fields={Installation:[['Platform','kubernetesProvider',['','EKS','GKE','AKS','OpenShift','RKE2','TKG','DockerEnterprise']],['Linux dataplane','calicoNetwork.linuxDataplane',['','Iptables','BPF']],['BGP','calicoNetwork.bgp',['','Enabled','Disabled']],['MTU (bytes)','calicoNetwork.mtu','number'],['Registry','registry','text'],['Control plane replicas','controlPlaneReplicas','number']],APIServer:[['Minimum ready time (seconds)','apiServerDeployment.spec.minReadySeconds','number'],['API logging level','logging.apiServer.logSeverity',['','Fatal','Error','Warn','Info','Debug','Trace']],['Priority class','apiServerDeployment.spec.template.spec.priorityClassName',['','preview-critical']]],Goldmane:[['Minimum ready time (seconds)','goldmaneDeployment.spec.minReadySeconds','number'],['Priority class','goldmaneDeployment.spec.template.spec.priorityClassName',['','preview-critical']]],Whisker:[['Notifications','notifications',['','Enabled','Disabled']],['Minimum ready time (seconds)','whiskerDeployment.spec.minReadySeconds','number'],['Priority class','whiskerDeployment.spec.template.spec.priorityClassName',['','preview-critical']]],GatewayAPI:[['CRD management','crdManagement',['','PreferExisting','Reconcile']]],ImageSet:[],TigeraStatus:[]};
function state(){return states[kind]??=( {values:{},rows:[],source:null,locked:false,name:kind==='ImageSet'?'':'default'});}
function control(label,path,type,value='',disabled=false){return `<label class="field">${label}${Array.isArray(type)?`<select data-path="${path}" ${disabled?'disabled':''}>${type.map(x=>`<option value="${x}" ${x===value?'selected':''}>${x||'Use operator default (omit)'}</option>`).join('')}</select>`:`<input name="${path}" autocomplete="off" spellcheck="false" data-path="${path}" type="${type}" value="${value}" ${disabled?'disabled':''}>`}<small>${path==='metadata.name'?path:'spec.'+path}</small></label>`;}
function source(){let s=state();if(s.source!==null)return s.source;let t='# Local design draft; no request is sent\napiVersion: operator.tigera.io/v1\nkind: '+kind+'\nmetadata:\n  name: '+(s.name||'""')+'\nspec:';let obj={};for(let [p,v]of Object.entries(s.values)){if(v==='')continue;let a=p.split('.'),o=obj;while(a.length>1){let x=a.shift();o=o[x]??={};}o[a[0]]=fields[kind].find(f=>f[1]===p)?.[2]==='number'?v+'__NUMBER__':v;}
if(kind==='ImageSet')obj.images=s.rows.filter(r=>r.a).map(r=>({image:r.a,digest:r.b}));if(kind==='Installation'&&s.rows.length){obj.calicoNetwork??={};obj.calicoNetwork.ipPools=s.rows.filter(r=>r.a).map(r=>({cidr:r.a,encapsulation:r.b||'VXLAN'}));}
function emit(o,n){return Object.entries(o).map(([k,v])=>' '.repeat(n)+k+':'+(Array.isArray(v)?'\n'+v.map(x=>' '.repeat(n+2)+'- '+Object.entries(x).map(([a,b],i)=>(i?' '.repeat(n+4):'')+a+': '+JSON.stringify(b)).join('\n')).join('\n'):typeof v==='object'?'\n'+emit(v,n+2):' '+(v.endsWith('__NUMBER__')?v.replace('__NUMBER__',''):JSON.stringify(v)))).join('\n');}return t+(Object.keys(obj).length?'\n'+emit(obj,2):' {}');}
function help(){return `<button class="help" aria-label="Configuration help" id="help">?</button>`;}
function render(){let s=state(),access=$('#access').value,edit=$('#intent').value==='Edit',inspect=kind==='TigeraStatus';$('#title').textContent=(inspect?'Inspect':edit?'Edit':'Create')+' '+kind;$('#form').classList.toggle('active',mode==='Form');$('#yaml').classList.toggle('active',mode==='YAML');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('#review').disabled=inspect||access!=='Allowed';$('#review').textContent='Review Draft';$('#back').hidden=!review;
let html='';if(review){html=`<h2>Review ${kind} · No mutation</h2><div class="notice">${kind==='GatewayAPI'?'Reconcile may overwrite shared Gateway API CRDs. Removing this CR leaves those CRDs behind.':kind==='Installation'?'Network changes may disrupt Pod connectivity.':kind==='ImageSet'?'Incomplete image coverage prevents reconciliation.':'Configuration changes may roll operator-managed components.'}</div><p>Destination: preview-cluster · Cluster scope</p><pre></pre><div class="note">Draft only. Admission, reconciliation and compatibility remain unverified.</div>`;}
else if(access!=='Allowed'){html=`<h2>${access}</h2><div class="notice">${({'Denied':'Write permission denied. Ask an administrator for the required verb.','API missing':'This CRD is not discovered. No create action is available.','Unavailable':'Discovery failed. Retry outside this editor; draft remains in memory.','GitOps owned':'Managed by preview-gitops. Change the owning repository, not this live object.'})[access]}</div><p>Draft retained. No permission or controller health inferred.</p>`;}
else if(mode==='YAML'){html=`<h2>Source draft</h2><div class="note">Manual source edits stay exact. Form locks after any source edit; no lossy conversion.</div><textarea id="source" aria-label="YAML source" spellcheck="false"></textarea>`;}
else if(s.locked){html='<h2>Source-only draft</h2><div class="notice">Manual source is preserved. Continue in YAML; Form cannot safely patch this draft.</div>';}
else if(section==='Ownership'){html=`<h2>Ownership &amp; Boundaries</h2><table><tr><th>Identity</th><td>${kind==='ImageSet'?'calico-&lt;release&gt;':inspect?'Component name': 'default singleton'}</td></tr><tr><th>Desired configuration</th><td>${inspect?'No user-owned spec':'User-authored operator custom resource'}</td></tr><tr><th>Generated workloads</th><td>Operator owned · inspect only here</td></tr><tr><th>Status</th><td>Controller owned · never submitted</td></tr><tr><th>Permissions</th><td>Fixture only · evaluate actual verbs in production</td></tr></table>`;}
else if(inspect){html='<h2>Component reconciliation</h2><div class="note">Synthetic observation · Not live controller health</div><table><tr><th>Component</th><td>calico</td></tr><tr><th>Condition</th><td class="badge">Progressing = True</td></tr><tr><th>Reason</th><td>PreviewReconciliation</td></tr><tr><th>Observed generation</th><td>3</td></tr><tr><th>Message</th><td>Sample rollout pending</td></tr></table><h3>Inspect related configuration</h3><button id="installation">Open Installation Draft</button>';}
else if(section==='Advanced'){html=`<h2>Advanced configuration</h2><div class="note">Full source retains unsupported fields. Manual edits use safe source-only mode.</div><table><tr><th>Installation</th><td>Placement, CNI, autodetection, pools, component overrides</td></tr><tr><th>Components</th><td>Pod templates, tolerations, resources, rollout strategy</td></tr><tr><th>Sensitive settings</th><td>Credential-bearing proxy/certificate imports excluded from this mock</td></tr></table><p><button id="open-source">Edit Full Source</button></p>`;}
else{let warning=kind==='GatewayAPI'?'Requires a supported operator and resolved Installation. Reconcile can overwrite shared Gateway API CRDs.':kind==='Installation'?'Network changes may disrupt Pod connectivity. Review before applying.':kind==='ImageSet'?'Supply every operator-deployed image for the matching Calico release.':kind==='Whisker'?'Requires Installation and Goldmane. Notification calls may contact an external API.':kind==='Goldmane'?'Requires an installed Calico operator. Creating this resource does not prove flow collection.':'Requires Installation. Operator owns generated API server workloads.';
html=`<div class="inline sectionhead"><h2>${({Installation:'Installation & Network',APIServer:'Calico API Server',ImageSet:'Pinned Component Images',Goldmane:'Flow Aggregation',Whisker:'Flow Explorer',GatewayAPI:'Gateway API Integration'})[kind]}</h2>${help()}</div><div class="notice">${warning}</div>`+control(kind==='ImageSet'?'ImageSet name *':'Singleton name','metadata.name','text',s.name,edit||kind!=='ImageSet')+`<div class="grid">`+fields[kind].map(f=>control(...f,s.values[f[1]]||'')).join('')+'</div>';
if(kind==='Installation'||kind==='ImageSet'){html+=`<h3>${kind==='Installation'?'Explicit IP pools':'Image digests'}</h3>`+(s.rows.length?'':'<p class="muted">'+(kind==='Installation'?'Unspecified: operator selects pool defaults. No CIDR guessed.':'No image overrides entered.')+'</p>')+s.rows.map((r,i)=>`<div class="row"><label class="field">${kind==='Installation'?'CIDR':'Original image'}<input autocomplete="off" aria-label="Row ${i+1} primary" data-row="${i}" data-key="a" value="${r.a}"></label><label class="field">${kind==='Installation'?'Encapsulation':'sha256 digest'}<input autocomplete="off" aria-label="Row ${i+1} value" data-row="${i}" data-key="b" value="${r.b}"></label><button data-remove="${i}" aria-label="Remove row ${i+1}">Remove</button></div>`).join('')+'<button id="add">Add '+(kind==='Installation'?'Pool':'Image')+'</button>';}}
$('#main').innerHTML=html+'<div id="error" class="error" role="status" aria-live="polite"></div>';if(review)$('#main pre').textContent=source();if($('#source')){$('#source').value=source();$('#source').oninput=e=>{s.source=e.target.value;s.locked=true;};}
document.querySelectorAll('[data-path]').forEach(el=>el.oninput=()=>{if(el.dataset.path==='metadata.name')s.name=el.value;else s.values[el.dataset.path]=el.value;});document.querySelectorAll('[data-row]').forEach(el=>el.oninput=()=>s.rows[+el.dataset.row][el.dataset.key]=el.value);document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{s.rows.splice(+el.dataset.remove,1);render();});if($('#add'))$('#add').onclick=()=>{s.rows.push({a:'',b:''});render();document.querySelector('[data-row="'+(s.rows.length-1)+'"]').focus();};if($('#open-source'))$('#open-source').onclick=()=>{mode='YAML';render();};if($('#installation'))$('#installation').onclick=()=>{$('#kind').value=kind='Installation';section='Configuration';render();};if($('#help')){let b=$('#help');let show=()=>{helpOpener=b;$('#helpbox').textContent=kind==='ImageSet'?'Use original image names without registry, tag or digest. A digest starts with sha256:, without @. Match the installed Calico release.':'Blank controls omit the field. Operator defaults are not inserted into this draft. Existing object identity stays locked. Full source is available for advanced fields.';let r=b.getBoundingClientRect();$('#helpbox').style.left=Math.min(r.left,innerWidth-340)+'px';$('#helpbox').style.top=r.bottom+8+'px';$('#helpbox').hidden=false;};b.onmouseenter=show;b.onfocus=show;b.onclick=show;b.onmouseleave=()=>$('#helpbox').hidden=true;b.onblur=()=>$('#helpbox').hidden=true;}}
$('#kind').onchange=e=>{kind=e.target.value;section='Configuration';review=false;mode='Form';history.replaceState(null,'','?kind='+kind);render();};$('#intent').onchange=()=>{review=false;render();};$('#access').onchange=()=>{review=false;render();};$('#form').onclick=()=>{mode='Form';review=false;render();};$('#yaml').onclick=()=>{mode='YAML';review=false;render();};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{section=b.dataset.section;review=false;render();});$('#back').onclick=()=>{review=false;render();};$('#review').onclick=()=>{let s=state();let err='';if(s.locked)err='Source-only draft: local schema validation unavailable. Preserve source; production must validate before review.';if(kind==='ImageSet'&&(!/^calico-.+/.test(s.name)||!s.rows.length))err='Enter a calico-<release> name and all required images.';if(kind==='ImageSet'&&s.rows.some(r=>!r.a||!/^sha256:[a-f0-9]{64}$/.test(r.b)))err='Enter an original image name and a sha256 digest with 64 hex digits.';if(kind==='Installation'&&s.rows.some(r=>!/^\d+\.\d+\.\d+\.\d+\/\d+$/.test(r.a)))err='Enter an IPv4 CIDR for each pool; IPv6 remains source-only in this mock.';if(Object.entries(s.values).some(([p,v])=>v&&fields[kind].find(f=>f[1]===p)?.[2]==='number'&&!/^\d+$/.test(v)))err='Use a nonnegative whole number.';if(err){$('#error').textContent=err;document.querySelector('main input:not(:disabled),textarea')?.focus();return;}review=true;render();};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#helpbox').hidden){$('#helpbox').hidden=true;helpOpener?.focus();$('#helpbox').hidden=true;e.preventDefault();}});window.addEventListener('beforeunload',e=>{if(Object.values(states).some(s=>s.source||Object.keys(s.values).length||s.rows.length)){e.preventDefault();e.returnValue='';}});render();
</script></html>
