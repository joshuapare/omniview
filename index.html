<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor providers · Design 263</title><style>:root{color-scheme:dark;font:13px system-ui;background:#101112;color:#e5e7eb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#272a30;border:1px solid #454951;border-radius:5px}button,input,select{min-height:32px;padding:5px 10px}button{cursor:pointer}button:hover{background:#373c46}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #91b6ff;outline-offset:2px}button[aria-current=true]{background:#304462;color:#c9ddff;border-color:#7195cf}header.shell{height:52px;padding:16px 24px;border-bottom:1px solid #303338;color:#aeb5c2}.fixture{text-align:center;color:#929ba9;padding:12px}main{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 110px));margin:auto;background:#1f2125;border:1px solid #41454e;border-radius:9px;display:flex;flex-direction:column;box-shadow:0 20px 70px #0007}.head{padding:16px 24px;border-bottom:1px solid #393d45;display:flex;align-items:center;justify-content:space-between}h1{font-size:17px;margin:0 0 4px}h2{font-size:15px;margin:0 0 16px}small,.muted{color:#a6adba}.toolbar{padding:12px 24px;display:flex;justify-content:space-between;border-bottom:1px solid #393d45;gap:16px}.layout{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;border-right:1px solid #393d45;padding:16px 12px}nav button{display:block;width:100%;text-align:left;margin-bottom:6px;background:transparent;border-color:transparent}.content{padding:20px 24px;overflow:auto;flex:1;min-width:0}footer{padding:12px 24px;border-top:1px solid #393d45;display:flex;align-items:center;gap:10px}footer span{flex:1}.primary{background:#426daf;border-color:#7195cf}.row{display:flex;gap:16px;margin-bottom:16px}.row>*{flex:1;min-width:0}label{display:block;margin-bottom:7px;color:#bfc6d2}input,select{width:100%}.card{border:1px solid #41454e;border-radius:6px;padding:14px;margin-bottom:12px}.card.selected{border-color:#7da5e4;background:#253247}.card button{float:right}.badge{display:inline-block;font-size:11px;padding:3px 6px;border:1px solid #596372;border-radius:4px;margin-left:6px}.notice{padding:10px 12px;background:#3d3421;border:1px solid #75603a;border-radius:5px;margin-bottom:16px;color:#f2d49a}.error{color:#ffb2b2}.code,textarea{font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;height:270px;padding:12px;resize:vertical}.help{width:32px;padding:0}.popover{position:absolute;right:calc((100vw - min(1000px,100vw - 32px))/2 + 24px);top:190px;max-width:330px;background:#303640;border:1px solid #6d7c90;padding:14px;z-index:2;border-radius:6px;box-shadow:0 12px 40px #0008}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid #3b414b;font-size:12px}th{color:#aeb9ca}a{color:#9bbdff}@media(max-width:650px){nav{width:130px}.row{flex-direction:column;gap:8px}.toolbar{flex-wrap:wrap}.head{padding:12px}main{height:calc(100vh - 100px)}.content{padding:16px}}</style><header class="shell">OMNIVIEW　 /　 Kubernetes　 /　 Resource Editor</header><div class="fixture">DESIGN PROTOTYPE · Synthetic providers and preview-cluster fixtures · No cluster requests</div><main aria-label="Resource editor"><div class="head"><div><h1 id="title">Edit Widget</h1><small>widgets.preview.example / v1 · Namespaced</small></div><div><button id="help" class="help" aria-label="Provider help" aria-expanded="false">?</button></div></div><div class="toolbar"><span>preview-cluster / preview / sample-widget <span id="dirty" class="badge">Saved baseline</span></span><div><button id="form">Form</button> <button id="yaml">YAML</button></div></div><div class="layout"><nav aria-label="Editor sections"><button data-page="resource">Configuration</button><button data-page="providers">Editor Providers</button><button data-page="author">Plugin Author</button><button data-page="availability">Availability</button><button data-page="lifecycle">Recovery</button><button data-page="security">Sensitive Fields</button></nav><section class="content" id="content"></section></div><footer><span id="status" aria-live="polite">Host owns draft · Revision 1</span><button id="cancel">Cancel Local Fields</button><button id="review" class="primary">Review Draft</button></footer></main><script>
const $=s=>document.querySelector(s);let page='resource',mode='form',provider='acme',state='ready',source='# Retain this comment\napiVersion: widgets.preview.example/v1\nkind: Widget\nmetadata:\n  name: sample-widget\n  namespace: preview\nspec:\n  replicas: 2\n  extensionCounter: 9007199254740993\n  opaque: "false"\n',revision=1,pending='',changed=false;const base=source;
const providers=[['acme','Acme Operator','acme.widgets','Add-on · exact GVK'],['north','Northstar Studio','northstar.widgets','Add-on · exact GVK'],['builtin','Kubernetes schema','kubernetes.schema','Built-in fallback']];
function escapeHTML(s){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page));$('#dirty').textContent=changed?'Unsaved draft':'Saved baseline';$('#status').textContent='Host owns draft · Revision '+revision;$('#form').setAttribute('aria-current',mode==='form');$('#yaml').setAttribute('aria-current',mode==='yaml');let h='';if(mode==='yaml'){h='<h2>Host Source Draft</h2><div class="notice">Manual source edits remain verbatim. This mock disables Form after raw edits.</div><label for="source">YAML · non-sensitive fixture</label><textarea id="source" spellcheck="false">'+escapeHTML(source)+'</textarea>';}else if(page==='resource'){h='<h2>Widget Configuration <span class="badge">'+providers.find(p=>p[0]===provider)[1]+'</span></h2><div class="row"><div><label for="name">Name · Immutable</label><input id="name" value="sample-widget" readonly autocomplete="off"></div><div><label for="namespace">Namespace · Immutable</label><input id="namespace" value="preview" readonly autocomplete="off"></div></div><div class="row"><div><label for="replicas">Replicas *</label><input id="replicas" inputmode="numeric" autocomplete="off" value="'+(pending||source.match(/replicas: (.*)/)?.[1]||'')+'"><div id="validation" class="error" role="alert"></div></div><div><label>Owned path</label><div class="card code">/spec/replicas</div></div></div><div class="card">Unknown fields, exact integer and comments remain in host source.</div><button id="apply">Apply Local Field</button>';if(state!=='ready')h='<h2>Form Unavailable</h2><div class="notice">'+state+' · Source retained. Use YAML or choose another editor.</div><button id="choose">Choose Editor</button>';}else if(page==='providers'){h='<h2>Choose Editor</h2><div class="notice">Two exact add-on matches. Choose explicitly; no silent add-on override.</div>'+providers.map(p=>'<div class="card '+(provider===p[0]?'selected':'')+'"><button data-provider="'+p[0]+'">'+(provider===p[0]?'Selected':'Use Editor')+'</button><strong>'+p[1]+'</strong><span class="badge">'+p[3]+'</span><p class="muted code">'+p[2]+'</p></div>').join('')+'<label><input style="width:auto" id="remember" type="checkbox"> Remember editor ID for this GVK and intent</label><small>No drafts or credentials stored. Selection applies only while compatible.</small>';}else if(page==='author'){h='<h2>Register Editor Contribution</h2><div class="row"><div><label for="plugin">Synthetic Provider</label><select id="plugin"><option>Acme Operator</option><option>Northstar Studio</option></select></div><div><label for="contract">Contract</label><select id="contract"><option>v1 · Supported cohort</option><option>v2 · Incompatible contract</option></select></div></div><div class="card code">extensionPointId: "kubernetes/resource/editor/v1"<br>value: { contractVersion: 1,<br>　gvk: { group: "widgets.preview.example", version: "v1", kind: "Widget" },<br>　resource: "widgets", scope: "Namespaced",<br>　intents: ["create", "edit"], ownedPaths: ["/spec/replicas"] }</div><button id="validate">Validate Registration</button><p id="registration" role="status"></p>';}else if(page==='availability'){h='<h2>Applicability & Access</h2><label for="availability">Fixture discovery state</label><select id="availability">'+['ready','No provider installed','CRD missing','Controller availability unknown','Lookup denied','Lookup unavailable','Lookup empty','Version incompatible','Shape unsupported','API removed','Feature gate unknown','Create verb denied'].map(x=>'<option '+(x===state?'selected':'')+'>'+x+'</option>').join('')+'</select><div class="card" style="margin-top:16px" id="availabilityResult">'+(state==='ready'?'Exact v1 schema matched · Fixture edit allowed':escapeHTML(state)+' · No mutation available. Draft retained; no permission or controller-health inference.')+'</div><button id="fallback">Open Preserved YAML</button>';}else if(page==='lifecycle'){h='<h2>Provider Recovery</h2><div class="notice">Provider changes never discard host source. Pending local fields require a decision.</div><div class="row"><button data-event="Provider crashed · quarantined">Simulate Crash</button><button data-event="Provider unloaded">Simulate Unload</button><button data-event="Provider reloaded · HMR">Simulate HMR</button></div><div class="row"><button data-event="Connection changed · old draft retained">Change Connection</button><button data-event="Resource changed · old draft retained">Change Resource</button></div><div class="card" id="recovery">'+escapeHTML(state)+'</div><button id="retry">Retry Provider</button> <button id="recoverSource">Recover in YAML</button>';}else if(page==='security'){h='<h2>Sensitive Projection</h2><div class="notice">Read-only redacted preview · Never a writeback source</div><label for="sensitive">Credential field · Keep existing</label><input id="sensitive" type="password" value="" placeholder="Existing value retained…" readonly autocomplete="off"><div class="card code" style="margin-top:16px">data: [REDACTED]<br>stringData: [REDACTED]<br>metadata.annotations: [REDACTED]</div><button id="rawAccess">Request Raw Access</button><div id="rawNotice" role="status"></div>';}$('#content').innerHTML=h;bind();}
function bind(){
  $('#status').textContent='';
  $('#cancel').textContent='Reset Local Input';
  if(page==='resource'&&mode==='form'){
    const apply=$('#apply');
    if(apply){apply.previousElementSibling.remove();apply.remove();$('#replicas').closest('.row').lastElementChild.remove();}
  }
  if(page==='author'){
    const diagnostics=document.createElement('div');diagnostics.className='card code';
    diagnostics.textContent='Host draft revision '+revision+' · Owned path /spec/replicas · Unknown fields, comments and exact scalar siblings retained.';
    $('#content').append(diagnostics);
  }
  document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{if(pending){$('#status').textContent='Fix or reset invalid input before switching.';return}provider=b.dataset.provider;render()});
  $('#replicas')?.addEventListener('input',e=>{
    pending=e.target.value;
    if(!/^\d+$/.test(pending)||BigInt(pending)>2147483647n){
      $('#validation').textContent='Enter a whole number from 0 to 2147483647.';
      e.target.setAttribute('aria-invalid','true');return;
    }
    source=source.replace(/replicas: .*/, 'replicas: '+pending);
    pending='';revision++;changed=source!==base;
    $('#validation').textContent='';e.target.removeAttribute('aria-invalid');
    $('#dirty').textContent=changed?'Unsaved draft':'Saved baseline';
  });
  $('#source')?.addEventListener('input',e=>{source=e.target.value;state='Raw source requires validation';changed=source!==base;revision++;$('#dirty').textContent='Unsaved draft'});
  $('#choose')?.addEventListener('click',()=>{page='providers';render()});
  $('#validate')?.addEventListener('click',()=>{$('#registration').textContent=$('#contract').selectedIndex?'Incompatible contract. Registration rejected; host draft unchanged.':'Descriptor valid · Host assigns plugin owner; registration preview only.'});
  $('#availability')?.addEventListener('change',e=>{state=e.target.value;render()});
  $('#fallback')?.addEventListener('click',()=>{mode='yaml';render()});
  document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{state=b.dataset.event;render();$('#status').textContent=pending?'Fix or reset invalid input before recovery.':''});
  $('#retry')?.addEventListener('click',()=>{state='ready';render()});
  $('#recoverSource')?.addEventListener('click',()=>{mode='yaml';render()});
  $('#rawAccess')?.addEventListener('click',()=>{$('#rawNotice').innerHTML='<div class="notice" style="margin-top:16px">Raw access exposes credentials. This privacy-safe prototype does not load or reveal raw values.</div>'});
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;mode='form';render()});$('#form').onclick=()=>{mode='form';render()};$('#yaml').onclick=()=>{if(pending){$('#status').textContent='Apply or cancel pending local fields before switching.';return}mode='yaml';render()};$('#cancel').onclick=()=>{pending='';render()};$('#review').onclick=()=>{if(pending){$('#status').textContent='Apply or cancel pending local fields before review.';return}$('#content').innerHTML='<h2>Review Draft</h2><div class="notice">Non-mutating preview · No create or update request sent</div><table><tr><th>Destination</th><td>preview-cluster / preview / sample-widget</td></tr><tr><th>Provider</th><td>'+providers.find(p=>p[0]===provider)[1]+'</td></tr><tr><th>Revision</th><td>'+revision+'</td></tr><tr><th>Owned patch</th><td>/spec/replicas only</td></tr><tr><th>Identity</th><td>Locked for edit</td></tr></table><p class="muted">Host admission, RBAC and revision checks remain required.</p>'};function help(){if($('#popover'))return;let p=document.createElement('div');p.id='popover';p.className='popover';p.setAttribute('role','tooltip');p.textContent='Editors receive scoped host capabilities. Trusted in-process plugins are not a security sandbox. Provider choice never grants cluster permission.';document.body.append(p);$('#help').setAttribute('aria-expanded','true')}$('#help').onclick=help;$('#help').onmouseenter=help;$('#help').onfocus=help;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#popover')){$('#popover').remove();$('#help').setAttribute('aria-expanded','false');$('#help').focus();$('#help').onfocus=null}});window.addEventListener('beforeunload',e=>{if(changed||pending){e.preventDefault();e.returnValue=''}});render();
document.addEventListener('keyup',e=>{if(e.key==='Escape'&&$('#popover')){$('#popover').remove();$('#help').setAttribute('aria-expanded','false')}});
</script></html>
