margin-bottom:8px;align-items:center}.row input,.row select{min-width:0;flex:1}.bar{display:flex;gap:6px;align-items:center}.help{border-radius:50%;padding:0;width:24px;min-height:24px}.popover{position:fixed;z-index:2;background:#292e38;border:1px solid #60718d;padding:14px;max-width:340px;box-shadow:0 10px 40px #0009;border-radius:6px;right:calc(50% - 440px);top:165px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#bfcee8;font:12px/1.7 monospace}hr{border:0;border-top:1px solid #303238;margin:20px 0}[hidden]{display:none!important}@media(max-width:720px){nav{width:135px}.grid{grid-template-columns:1fr}.popover{right:20px}.fixture{padding:10px}.dialog{height:calc(100vh - 75px)}header{padding:12px}main{padding:16px}footer{padding:10px}}</style><div class="fixture">DESIGN MOCK · Synthetic fixture references · No cluster connection or mutation</div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><header><div><h1 id="title">Create WasmPlugin</h1><small>extensions.istio.io/v1alpha1 · Istio 1.27.0</small></div><div class="bar"><button id="form" class="active">Form</button><button id="yaml">YAML</button></div></header><div class="body"><nav aria-label="Editor sections"><button data-section="module" class="active">Module</button><button data-section="targets">Workload targets</button><button data-section="execution">Execution</button><button data-section="config">Configuration & VM</button><button data-section="access">Access & ownership</button></nav><main id="main"></main></div><footer><span id="destination">preview-cluster / preview</span><button id="edit">Edit fixture</button><button id="back" hidden>Back to draft</button><button id="review" class="primary">Review draft</button></footer></section><div id="help" class="popover" role="tooltip" hidden></div><script>
const $=s=>document.querySelector(s);let section='module',mode='form',edited=false,rawDirty=false,reviewing=false,helpOrigin;let d={name:'',namespace:'preview',url:'',sha256:'',imagePullPolicy:'',imagePullSecret:'',phase:'',priority:'',failStrategy:'',type:'',pluginName:'',targetMode:'labels',labels:[['app','']],refs:[],match:[],env:[],pluginConfig:'',access:'allowed'};let source='';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function field(key,label,type='text',hint=''){return `<label for="${key}">${label}${hint?` <button type="button" class="help" aria-label="Help: ${label}" data-help="${esc(hint)}">?</button>`:''}<input aria-label="${label}" autocomplete="off" spellcheck="false" id="${key}" name="${key}" type="${type}" value="${esc(d[key])}" ${edited&&['name','namespace'].includes(key)?'disabled':''}></label>`}

function manifest(){let s=`apiVersion: extensions.istio.io/v1alpha1\nkind: WasmPlugin\nmetadata:\n  name: ${JSON.stringify(d.name)}\n  namespace: ${JSON.stringify(d.namespace)}\nspec:\n  url: ${JSON.stringify(d.url)}\n`;for(let k of ['sha256','imagePullPolicy','imagePullSecret','phase','priority','failStrategy','type','pluginName'])if(d[k]!=='')s+=`  ${k}: ${k==='priority'?d[k]:JSON.stringify(d[k])}\n`;if(d.targetMode==='labels')s+='  selector:\n    matchLabels:\n'+d.labels.map(([k,v])=>`      ${JSON.stringify(k)}: ${JSON.stringify(v)}\n`).join('');if(d.targetMode==='refs'&&d.refs.length)s+='  targetRefs:\n'+d.refs.map(r=>`    - group: ${JSON.stringify(r[0])}\n      kind: ${r[1]}\n      name: ${JSON.stringify(r[2])}\n`).join('');if(d.pluginConfig.trim())s+='  pluginConfig: '+d.pluginConfig+'\n';if(d.env.length)s+='  vmConfig:\n    env:\n'+d.env.map(e=>`      - name: ${JSON.stringify(e[0])}\n        valueFrom: ${e[1]}\n`+(e[1]==='INLINE'?`        value: ${JSON.stringify(e[2])}\n`:'')).join('');if(d.match.length)s+='  match:\n'+d.match.map(m=>`    - mode: ${m[0]}\n      ports:\n        - number: ${m[1]}\n`).join('');return s}
function render(){let m=$('#main');$('#title').textContent=(edited?'Edit':'Create')+' WasmPlugin';$('#destination').textContent='preview-cluster / '+d.namespace;$('#back').hidden=!reviewing;$('#review').hidden=reviewing;$('#edit').hidden=reviewing;$('#form').classList.toggle('active',mode==='form');$('#yaml').classList.toggle('active',mode==='yaml');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===section));if(reviewing){m.innerHTML='<h2>Review only · no request sent</h2><div class="warning">Untrusted modules run inside proxies. Compatibility and module integrity are unverified. Changes can interrupt traffic.</div><div class="warning">'+(d.failStrategy==='FAIL_OPEN'?'FAIL_OPEN bypasses the plugin on fatal errors. Do not use for authentication or authorization.':'Fatal pull or execution errors can fail requests with 5xx.')+'</div><p>Destination: preview-cluster / '+esc(d.namespace)+'</p><p>Operation: '+(edited?'Update existing resource; identity locked':'Create namespaced resource')+'</p><pre>'+esc(rawDirty?source:manifest())+'</pre>';return}if(mode==='yaml'){if(!rawDirty)source=manifest();m.innerHTML='<h2>Source draft</h2><div class="warning">Manual source edits remain exact. Form editing and review lock until source is restored; this mock does not parse arbitrary YAML.</div><label>Manifest<textarea id="source" style="height:330px">'+esc(source)+'</textarea></label><button id="restore">Restore generated source (discard source edits)</button>';return}if(rawDirty){m.innerHTML='<h2>Source-only draft</h2><div class="warning">Unsupported or invalid source is preserved unchanged. Return to YAML to repair or restore generated source.</div>';return}let html='';if(section==='module')html='<h2>Load a WebAssembly module</h2><div class="warning">Alpha API · Trust the module publisher. Proxy compatibility is not verified.</div><div class="grid">'+field('name','Name *')+field('namespace','Namespace *')+'</div>'+field('url','Module URL *','text','OCI reference, http(s) download, or file path inside each proxy. Scheme omission means OCI. Nothing is pulled in this mock.')+field('sha256','SHA-256','text','64 lowercase hex characters. Must match an @sha256 digest in the URL.')+'<div class="grid">'+select('imagePullPolicy','Pull policy',[['','Omit · use API behavior'],['IfNotPresent','If not present'],['Always','Always']])+select('imagePullSecret','Registry pull Secret',[['','None · omit'],['preview-pull','preview-pull · fixture'],['unresolved-pull','unresolved-pull · not found']])+'</div><small>Secret reference only. Resolved values are never read.</small>';
if(section==='targets')html='<h2>Choose workload attachment</h2>'+select('targetMode','Apply to',[['labels','Matching workload labels'],['refs','Resource references · waypoint compatible'],['all','All applicable workloads']])+(d.targetMode==='all'?'<div class="warning">No selector: all workloads in this namespace. A config-root namespace can expand scope across namespaces.</div>':d.targetMode==='labels'?'<div class="warning">Waypoint proxies ignore label selectors.</div>'+d.labels.map((r,i)=>`<div class="row"><input aria-label="Label key ${i+1}" data-array="labels" data-i="${i}" data-j="0" value="${esc(r[0])}"><input aria-label="Label value ${i+1}" data-array="labels" data-i="${i}" data-j="1" value="${esc(r[1])}"><button data-remove="labels" data-i="${i}">Remove</button></div>`).join('')+'<button data-add="labels">Add label</button>':'<div class="warning">Mixed revisions: pin istio.io/rev to 1.22+ before using targetRefs. GatewayClass requires config-root namespace.</div>'+d.refs.map((r,i)=>`<div class="row"><select aria-label="Target kind ${i+1}" data-ref="${i}">${[['gateway.networking.k8s.io','Gateway'],['gateway.networking.k8s.io','GatewayClass'],['','Service'],['networking.istio.io','ServiceEntry']].map(([g,k])=>`<option value="${g}|${k}" ${r[1]===k?'selected':''}>${k}</option>`).join('')}</select><input aria-label="Target name ${i+1}" data-array="refs" data-i="${i}" data-j="2" value="${esc(r[2])}"><button data-remove="refs" data-i="${i}">Remove</button></div>`).join('')+'<button data-add="refs">Add target</button><p class="muted">Same namespace · Service attachments require waypoints · maximum 16</p>');
if(section==='execution')html='<h2>Filter order & failure behavior</h2><div class="grid">'+select('type','Extension type',[['','Omit · HTTP default'],['HTTP','HTTP'],['NETWORK','Network · layer 4']])+select('phase','Filter phase',[['','Omit · control plane decides'],['AUTHN','Before authentication'],['AUTHZ','Before authorization'],['STATS','Before statistics']])+field('priority','Priority','number','Signed int32. Higher priority runs first within the phase; omitted means API default 0.')+select('failStrategy','Fatal error behavior',[['','Omit · fail closed'],['FAIL_CLOSE','Fail closed'],['FAIL_OPEN','Fail open · bypass plugin'],['FAIL_RELOAD','Reload · runtime errors only']])+'</div>'+(d.failStrategy==='FAIL_OPEN'?'<div class="warning">Fail open bypasses the plugin on fatal errors. Not recommended for authentication or authorization.</div>':'')+'<hr><h2>Traffic matches</h2>'+d.match.map((r,i)=>`<div class="row"><select aria-label="Traffic direction ${i+1}" data-array="match" data-i="${i}" data-j="0">${['CLIENT_AND_SERVER','CLIENT','SERVER'].map(x=>`<option ${r[0]===x?'selected':''}>${x}</option>`).join('')}</select><input type="number" aria-label="Destination port ${i+1}" data-array="match" data-i="${i}" data-j="1" value="${r[1]}"><button data-remove="match" data-i="${i}">Remove</button></div>`).join('')+'<button data-add="match">Add traffic match</button>';
if(section==='config')html='<h2>Plugin-specific configuration</h2>'+field('pluginName','Plugin name','text','Module root ID, only if required by module author.')+'<label>Plugin configuration · JSON object<textarea id="pluginConfig" spellcheck="false">'+esc(d.pluginConfig)+'</textarea></label><small>Module-specific schema is unavailable. Do not put credentials here.</small><hr><h2>VM environment</h2>'+d.env.map((r,i)=>`<div class="row"><input aria-label="Environment name ${i+1}" data-array="env" data-i="${i}" data-j="0" value="${esc(r[0])}"><select aria-label="Environment source ${i+1}" data-array="env" data-i="${i}" data-j="1"><option ${r[1]==='INLINE'?'selected':''}>INLINE</option><option ${r[1]==='HOST'?'selected':''}>HOST</option></select>${r[1]==='INLINE'?`<input type="password" autocomplete="off" aria-label="Environment value ${i+1}" data-array="env" data-i="${i}" data-j="2" value="${esc(r[2])}">`:'<small>Read proxy environment</small>'}<button data-remove="env" data-i="${i}">Remove</button></div>`).join('')+'<button data-add="env">Add environment variable</button>';
if(section==='access')html='<h2>Capability & ownership boundaries</h2>'+select('access','Fixture availability',[['allowed','Authoring permission · fixture only'],['denied','RBAC denied'],['missing','CRD not installed'],['unavailable','Discovery unavailable'],['managed','Managed by GitOps'],['empty','Reference list empty'],['pull','Module pull/load failure']])+'<div class="warning">'+({allowed:'Discovery is not permission or proof of controller support. Review never submits.',denied:'Create/update denied. Draft stays local. Ask an administrator for access.',missing:'WasmPlugin API missing. Install compatible Istio CRDs before authoring.',unavailable:'Discovery unavailable. Retry discovery outside this editor; draft retained.',managed:'GitOps owns desired state. Inspect only; edit the source repository instead.',empty:'No reference fixtures found. Do not fabricate successful resolution.',pull:'Runtime diagnostics unavailable in this mock. Open existing proxy diagnostics; do not infer health from resource presence.'}[d.access])+'</div><p class="muted">Status is controller-owned. verificationKey is unimplemented upstream. Legacy targetRef remains source-only.</p>';
m.innerHTML='<div id="errors" class="error" role="status" aria-live="polite"></div>'+html;}
document.addEventListener('input',e=>{let t=e.target;if(t.id==='source'){source=t.value;rawDirty=true;return}if(t.dataset.array){d[t.dataset.array][+t.dataset.i][+t.dataset.j]=t.value;return}if(t.id in d){d[t.id]=t.value;$('#destination').textContent='preview-cluster / '+d.namespace}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.ref){d.refs[+t.dataset.ref]=t.value.split('|').concat(d.refs[+t.dataset.ref][2]);render()}else if(t.tagName==='SELECT'){if(t.dataset.array){d[t.dataset.array][+t.dataset.i][+t.dataset.j]=t.value;if(t.dataset.array==='env'&&t.value==='HOST')d.env[+t.dataset.i][2]=''}else d[t.id]=t.value;render()}});
document.addEventListener('click',e=>{let t=e.target;if(t.dataset.section){section=t.dataset.section;reviewing=false;render()}if(t.dataset.add){let a=t.dataset.add;if(a==='refs'&&d.refs.length>=16)return;d[a].push({labels:['',''],refs:['gateway.networking.k8s.io','Gateway',''],match:['CLIENT_AND_SERVER',''],env:['','HOST','']}[a]);render()}if(t.dataset.remove){d[t.dataset.remove].splice(+t.dataset.i,1);render()}if(t.dataset.help)showHelp(t);if(t.id==='yaml'||t.id==='form'){mode=t.id;reviewing=false;render()}if(t.id==='restore'&&confirm('Discard manual source changes?')){rawDirty=false;render()}if(t.id==='edit'){edited=!edited;if(edited){d.name=d.name||'preview-filter';d.url=d.url||'oci://registry.example.invalid/filters/audit:v1'}render()}if(t.id==='back'){reviewing=false;render()}if(t.id==='review')review()});
function review(){if(rawDirty){mode='form';render();return}let errors=[];if(!/^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$/.test(d.name))errors.push(['name','Enter a valid resource name.']);if(!d.namespace)errors.push(['namespace','Choose a namespace.']);if(!d.url||(/^[a-z]+:\/\//.test(d.url)&&! /^(oci|https?|file):\/\//.test(d.url)))errors.push(['url','Enter an OCI, HTTP(S), or file module URL.']);if(d.sha256&&!/^[a-f0-9]{64}$/.test(d.sha256))errors.push(['sha256','Use 64 lowercase hex characters.']);if(d.priority!==''&&(!/^-?\d+$/.test(d.priority)||Number(d.priority)<-2147483648||Number(d.priority)>2147483647))errors.push(['priority','Use a signed 32-bit integer priority.']);if(d.pluginConfig){try{let c=JSON.parse(d.pluginConfig);if(!c||Array.isArray(c)||typeof c!=='object')throw 0}catch{errors.push(['pluginConfig','Enter a JSON object.'])}}if(d.targetMode==='labels'&&d.labels.some(r=>!r[0]||!r[1]))errors.push(['targets','Complete workload labels.']);if(d.targetMode==='refs'&&(!d.refs.length||d.refs.some(r=>!r[2]||r[1]==='GatewayClass')))errors.push(['targets','Choose a named same-namespace target; GatewayClass needs verified config-root namespace.']);if(d.match.some(r=>!/^\d+$/.test(r[1])||+r[1]<1||+r[1]>65535))errors.push(['execution','Use destination ports 1–65535.']);if(d.env.some(r=>! /^[A-Za-z_][A-Za-z0-9_]*$/.test(r[0])))errors.push(['config','Use valid environment names.']);if(d.access!=='allowed')errors.push(['access','Authoring blocked by capability or ownership fixture.']);if(errors.length){let [key,msg]=errors[0];section=['targets','execution','config','access'].includes(key)?key:key==='priority'?'execution':key==='pluginConfig'?'config':'module';mode='form';render();$('#errors').textContent=msg;($('#'+key)||$('#main')).focus();return}reviewing=true;render()}
function showHelp(t){helpOrigin=t;$('#help').textContent=t.dataset.help;$('#help').hidden=false}document.addEventListener('mouseover',e=>{if(e.target.dataset.help)showHelp(e.target)});document.addEventListener('focusin',e=>{if(e.target.dataset.help)showHelp(e.target)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#help').hidden){e.preventDefault();$('#help').hidden=true;helpOrigin.focus()}if(e.key==='Tab'){let c=[...document.querySelectorAll('.dialog button:not([hidden]),.dialog input:not(:disabled),.dialog select,.dialog textarea')].filter(x=>x.offsetParent!==null);if(e.shiftKey&&document.activeElement===c[0]){e.preventDefault();c.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===c.at(-1)){e.preventDefault();c[0].focus()}}});render();
// Source preview is a separate projection, never a mutation payload.
const buildManifest=manifest;
manifest=function(){let text=buildManifest();if(d.env.some(e=>e[1]==='INLINE')||d.pluginConfig.trim())return '# Redacted preview only. Not a submission source.\n'+text.split('\n').filter(line=>!line.startsWith('        value:')&&!line.startsWith('  pluginConfig:')).join('\n');return text};
