<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flux notification editor · Design preview</title><style>
:root{color-scheme:dark;--bg:#101112;--panel:#191a1c;--line:#33363b;--text:#e6e8eb;--muted:#969da8;--accent:#80aaff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;background:#202226;border:1px solid var(--line);border-radius:5px}button,input,select{height:32px;padding:0 10px}button{cursor:pointer}button:hover{background:#30343b}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.active{background:#293b58;color:#b9d0ff;border-color:#496a9d}.top{height:54px;border-bottom:1px solid var(--line);padding:16px 24px}.preview{color:var(--muted);text-align:center;margin:24px}.frame{width:min(1000px,calc(100vw - 32px));height:700px;max-height:calc(100vh - 130px);margin:auto;background:var(--panel);border:1px solid #3a3d43;border-radius:9px;display:flex;flex-direction:column;box-shadow:0 24px 70px #0008}header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 5px}small,.muted{color:var(--muted)}.modes{display:flex;gap:5px}.body{display:flex;min-height:0;flex:1}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin-bottom:8px}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}h2{font-size:14px;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field input,.field select{width:100%}.row{display:grid;grid-template-columns:1fr 1fr 1fr 32px;gap:8px;margin-bottom:10px}.row input,.row select{width:100%;min-width:0}.hint{background:#242b37;border:1px solid #3d506f;padding:12px;border-radius:5px;margin:12px 0}.warning{background:#332a1c;border:1px solid #6d5630;color:#e7c58b;padding:12px;bord </style><div class="top">Omniview <span class="muted"> / Resources / Flux notifications</span></div><div class="preview">Interactive design mock · Synthetic fixtures only · No cluster connection or mutations</div><section class="frame" role="dialog" aria-label="Flux resource editor"><header><div><h1 id="title"></h1><small>preview-cluster / preview · <span id="version"></span></small></div><div class="modes"><button id="form">Form</button><button id="yaml">YAML</button></div></header><div class="body"><nav><label class="field">Resource<select id="kind"><option>Alert</option><option>Provider</option><option>Receiver</option></select></label><button data-page="Configure" class="active">Configure</button><button data-page="Advanced">Advanced</button><button data-page="Inspect">Inspect</button><label class="field">Scenario<select id="scenario"><option>Create</option><option>Edit</option><option>GitOps owned</option><option>Denied</option><option>Missing API</option><option>Lookup unavailable</option><option>Empty references</option></select></label></nav><main id="content"></main></div><footer><span id="destination">Destination: preview-cluster / preview</span><div class="stack"><button id="back">Back to Draft</button><button id="review" class="primary">Review Draft</button></div></footer></section><script>
const $=s=>document.querySelector(s);let kind='Alert',page='Configure',mode='Form',scenario='Create',manual=false,raw='',review=false,helpOpen=false;const drafts={Alert:{name:'',provider:'',severity:'',rows:[],inclusion:'',exclusion:'',metadata:'',summary:'',suspend:false},Provider:{name:'',type:'',address:'',channel:'',secret:'',timeout:'',proxySecret:'',certSecret:'',serviceAccount:'',commit:'',suspend:false},Receiver:{name:'',type:'',secret:'',events:'',interval:'',filter:'',rows:[],suspend:false}};let d=drafts[kind];
const providerTypes='slack discord msteams rocket generic generic-hmac github gitlab gitea bitbucketserver bitbucket azuredevops googlechat googlepubsub webex sentry azureeventhub telegram lark matrix opsgenie alertmanager grafana githubdispatch pagerduty datadog nats zulip otel'.split(' '), receiverTypes='generic generic-hmac github gitlab bitbucket harbor dockerhub quay gcr nexus acr cdevents'.split(' '), kinds='Bucket GitRepository Kustomization HelmRelease HelmChart HelmRepository ImageRepository ImagePolicy ImageUpdateAutomation OCIRepository'.split(' ');const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function input(key,label,type='text'){return `<label class="field">${label}<input autocomplete="off" name="${key}" data-key="${key}" type="${type}" value="${esc(d[key])}" ${key==='name'&&scenario!=='Create'?'disabled':''}></label>`}function select(key,label,opts){return `<label class="field">${label}<select data-key="${key}" name="${key}"><option value="">Choose…</option>${opts.map(x=>`<option ${d[key]===x?'selected':''}>${x}</option>`).join('')}</select></label>`}function ref(key,label){let opts=scenario==='Empty references'?[]:['preview-notifications','preview-webhook','preview-tls'];return select(key,label,opts)}function help(){return '<button class="help" aria-label="Help with resource targeting" id="help">?</button>'}function rows(){return `<h2>${kind==='Alert'?'Event Sources':'Reconcile Targets'} ${help()}</h2><div id="helptext"></div>${d.rows.map((r,i)=>`<div class="row">${['kind','name','namespace'].map((k,j)=>j===0?`<select aria-label="Target kind ${i+1}" data-row="${i}" data-rkey="kind">${kinds.map(v=>`<option ${r.kind===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input autocomplete="off" aria-label="Target ${k} ${i+1}" data-row="${i}" data-rkey="${k}" value="${esc(r[k])}">`).join('')}<button data-remove="${i}" aria-label="Remove target ${i+1}">×</button></div>`).join('')}<button id="add">+ Add Target</button>`}function manifest(){let spec={};if(kind==='Alert'){spec={providerRef:{name:d.provider},...(d.severity?{eventSeverity:d.severity}:{}),eventSources:d.rows};if(d.inclusion)spec.inclusionList=d.inclusion.split('\n');if(d.exclusion)spec.exclusionList=d.exclusion.split('\n');if(d.metadata)spec.eventMetadata=Object.fromEntries(d.metadata.split('\n').filter(x=>x.includes('=')).map(x=>{let i=x.indexOf('=');return [x.slice(0,i),x.slice(i+1)]}));if(d.summary)spec.summary=d.summary}else{spec={type:d.type};for(const [key,path]of Object.entries(kind==='Provider'?{address:'address',channel:'channel',timeout:'timeout',commit:'commitStatusExpr',serviceAccount:'serviceAccountName'}:{interval:'interval',filter:'resourceFilter'})){if(d[key])spec[path]=d[key]}for(const [key,path]of Object.entries(kind==='Provider'?{secret:'secretRef',proxySecret:'proxySecretRef',certSecret:'certSecretRef'}:{secret:'secretRef'})){if(d[key])spec[path]={name:d[key]}}if(kind==='Receiver'){spec.resources=d.rows;if(d.events)spec.events=d.events.split(',').map(x=>x.trim())}}if(d.suspend)spec.suspend=true;return '# Draft preview — JSON is valid YAML 1.2\n'+JSON.stringify({apiVersion:'notification.toolkit.fluxcd.io/'+(kind==='Receiver'?'v1':'v1beta3'),kind,metadata:{name:d.name,namespace:'preview'},spec},null,2)}
function render(){d=drafts[kind];$('#title').textContent=(scenario==='Create'?'Create ':scenario==='Edit'?'Edit ':'Inspect ')+kind;$('#version').textContent=kind==='Receiver'?'v1':'v1beta3';$('#form').className=mode==='Form'?'active':'';$('#yaml').className=mode==='YAML'?'active':'';$('#review').disabled=['Denied','Missing API','GitOps owned'].includes(scenario);let html='';if(['Denied','Missing API','GitOps owned'].includes(scenario)){html=`<h2>${scenario==='GitOps owned'?'Managed by Flux Kustomization':scenario==='Denied'?'Access Denied':'API Not Installed'}</h2><div class="warning">${scenario==='GitOps owned'?'Edit the Git source of truth. Direct changes may be reverted.':scenario==='Denied'?'Create / patch not permitted. Request access; your draft stays in memory.':'Required served version is unavailable. Install or enable the matching API before authoring.'}</div><p class="muted">${kind} · preview-cluster / preview</p><button id="inspectOwned">Inspect Draft Source</button>`}else if(review){html=`<h2>Review ${kind}</h2><span class="badge">Non-mutating preview</span><dl><dt>Destination</dt><dd>preview-cluster / preview</dd><dt>Operation</dt><dd>${scenario==='Edit'?'Patch existing identity':'Create draft'} · ${esc(d.name)}</dd><dt>Effect</dt><dd>${kind==='Alert'?'Route matching events to selected Provider.':kind==='Provider'?'Change outbound notification destination and authentication.':'Incoming webhooks can request reconciliation for selected targets.'}</dd></dl><div class="warning">${d.suspend?'Suspended: subsequent event handling stops. ':''}${d.rows?.some(r=>r.name==='*')?'Wildcard targets can affect multiple resources. ':''}${kind==='Receiver'?'Changing the Secret token can change the generated webhook path. ':''}No request is sent. Controller behavior and reference access are unverified.</div><pre class="hint">${esc(kind==='Provider'?'Credentials: references only; resolved values never loaded.':'Review selectors and cross-namespace targets before applying.')}</pre>`}else if(mode==='YAML'){html=`<h2>Draft Source</h2><div class="hint">${manual?'Source changed. Form is locked; original text remains authoritative.':'Editable safe draft. Manual source edits lock Form; no lossy round-trip claim.'}</div><textarea id="source" class="source" spellcheck="false" aria-label="Draft YAML source"></textarea>`}else if(manual){html='<h2>Source-Only Draft</h2><div class="warning">Manual YAML may contain unsupported or invalid content. Return to YAML to keep editing. Form cannot overwrite this draft.</div>'}else if(page==='Inspect'){html=`<h2>${kind==='Receiver'?'Receiver Readiness':'Delivery Inspection'}</h2><dl><dt>Observation</dt><dd>Unavailable — offline mock</dd><dt>Controller health</dt><dd>Not verified</dd><dt>${kind==='Receiver'?'Webhook path':'Delivery history'}</dt><dd>${kind==='Receiver'?'Controller generated · masked · not editable':'No status endpoint in this API version'}</dd><dt>Next connection</dt><dd>Open existing resource diagnostics when authorized</dd></dl><div class="hint">No test webhook or delivery request is sent.</div>`}else if(page==='Advanced'){html=`<h2>Advanced ${kind} Options</h2>`;if(kind==='Alert'){html+=input('inclusion','Include Message Patterns · one Go regex per line')+input('exclusion','Exclude Message Patterns · one Go regex per line')+input('metadata','Event Metadata · key=value')+`<details><summary>Legacy Summary · deprecated</summary>${input('summary','Summary · maximum 255 characters')}</details>`}else if(kind==='Provider'){html+=`<div class="grid">${ref('proxySecret','Proxy Secret')}${ref('certSecret','TLS Secret')}${input('timeout','Delivery Timeout · ms / s / m')}${input('serviceAccount','Workload Identity ServiceAccount')}</div><div class="warning">Workload identity requires ObjectLevelWorkloadIdentity and a supported provider type. Feature availability is unverified.</div>${input('commit','Commit Status CEL Expression')}<small>Available for GitHub, GitLab, Gitea, Bitbucket & Azure DevOps types only.</small>`}else html+=input('interval','Secret Reconcile Interval · ms / s / m / h')+input('filter','Target Filter · CEL boolean');html+=`<label class="check"><input type="checkbox" data-key="suspend" ${d.suspend?'checked':''}>Suspend Event Handling</label>${d.suspend?'<div class="warning">Subsequent event handling stops while suspended.</div>':''}<details><summary>Source-only precision</summary><p class="muted">Reference apiVersion and matchLabels, metadata, unknown fields and deprecated fields remain available in YAML. Manual edits lock Form.</p></details>`}else{html=`<h2>${kind==='Alert'?'Route Flux Events':kind==='Provider'?'Notification Destination':'Incoming Webhook'}</h2><div class="grid">${input('name','Name *')}<label class="field">Namespace<input aria-label="Namespace" value="preview" disabled></label></div>`;if(scenario==='Lookup unavailable')html+='<div class="warning">Reference lookup unavailable. Not an empty list. Draft is preserved; retry lookup before applying.</div>';if(scenario==='Empty references')html+='<div class="hint">No matching references. Create dependencies separately; nothing is created implicitly.</div>';if(kind==='Alert')html+=`<div class="grid">${select('provider','Provider *',['preview-chat','preview-audit'])}${select('severity','Severity',['info','error'])}</div>`+rows();if(kind==='Provider')html+=`<div class="grid">${select('type','Provider Type *',providerTypes)}${ref('secret','Authentication Secret')}</div>`+input('address','Destination Address')+input('channel','Channel')+'<small>Resolved credentials, endpoint credentials and posting identity stay out of this mock.</small>';if(kind==='Receiver')html+=`<div class="grid">${select('type','Webhook Sender *',receiverTypes)}${ref('secret','Validation Secret *')}</div>`+input('events','Accepted Event Types · comma separated')+rows();html+='<div id="errors" class="error" role="status" aria-live="polite"></div>'}$('#content').innerHTML=html;if($('#source')){$('#source').value=manual?raw:manifest();$('#source').oninput=e=>{raw=e.target.value;manual=true}}document.querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{d[el.dataset.key]=el.type==='checkbox'?el.checked:el.value;if(el.type==='checkbox')render()});document.querySelectorAll('[data-row]').forEach(el=>el.onchange=()=>d.rows[+el.dataset.row][el.dataset.rkey]=el.value);document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{d.rows.splice(+el.dataset.remove,1);render()});if($('#add'))$('#add').onclick=()=>{d.rows.push({kind:'GitRepository',name:'',namespace:''});render()};if($('#help')){const show=()=>{$('#helptext').innerHTML='<div class="popover" role="tooltip">Choose a Flux kind and resource name. Use * for multiple names. Namespace omission uses the resource namespace. Cross-namespace access depends on controller policy. matchLabels requires name *; use YAML for exact selectors.</div>';helpOpen=true};$('#help').onclick=show;$('#help').onfocus=show;$('#help').onmouseenter=show}if($('#inspectOwned'))$('#inspectOwned').onclick=()=>{scenario='Edit';$('#scenario').value=scenario;mode='YAML';render()}}
$('#kind').onchange=e=>{kind=e.target.value;manual=false;raw='';review=false;page='Configure';mode='Form';render()};$('#scenario').onchange=e=>{scenario=e.target.value;review=false;if(scenario==='Edit'&&!d.name)d.name='preview-'+kind.toLowerCase();render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;review=false;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#form').onclick=()=>{mode='Form';review=false;render()};$('#yaml').onclick=()=>{mode='YAML';review=false;render()};$('#back').onclick=()=>{review=false;render()};$('#review').onclick=()=>{if(manual){review=true;render();return}let errors=[];if(!d.name||! /^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(d.name))errors.push('Enter a valid resource name.');if(kind==='Alert'&&!d.provider)errors.push('Choose a Provider.');if(kind!=='Alert'&&!d.type)errors.push('Choose a type.');if(kind==='Receiver'&&!d.secret)errors.push('Choose a validation Secret.');if(d.rows&&(!d.rows.length||d.rows.some(r=>!r.name)))errors.push('Add a target and enter its name.');if(kind==='Provider'&&d.commit&&!['github','gitlab','gitea','bitbucketserver','bitbucket','azuredevops'].includes(d.type))errors.push('Commit status expression requires a supported Git provider.');if(d.serviceAccount&&(!['azureeventhub','azuredevops','googlepubsub'].includes(d.type)||d.secret))errors.push('Use a supported workload identity type without static credentials.');if(errors.length){mode='Form';page='Configure';render();$('#errors').textContent=errors.join(' ');$('[data-key="name"]').focus()}else{review=true;render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&helpOpen){$('#helptext').innerHTML='';helpOpen=false;$('#help').focus();$('#help').onfocus=null}});render();
</script><script>
document.addEventListener('click',event=>{if(event.target.id!=='inspectOwned')return;event.stopImmediatePropagation();$('#content').innerHTML='<h2>Read-Only Draft Source</h2><div class="warning">Ownership and permission restrictions remain active. No edit or mutation is available.</div><pre class="source" style="overflow:auto"></pre>';$('#content pre').textContent=manual?raw:manifest();},true);
