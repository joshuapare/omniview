<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Flux Kustomization · Design</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0e0f11;color:#e4e6eb;font:13px system-ui;margin:0}aside{padding:25px;color:#9da4af}dialog{display:flex;flex-direction:column;position:relative;margin:30px auto;width:min(1000px,96vw);height:min(700px,90vh);background:#1f2125;color:inherit;border:1px solid #383b42;border-radius:9px;padding:0;overflow:hidden}header,footer{padding:16px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #383b42;flex-shrink:0}h1{font-size:16px;flex:1;margin:0}h2{font-size:15px;margin:0 0 20px}button,input,select,textarea{font:inherit;background:#131416;color:inherit;border:1px solid #41454e;border-radius:5px;min-height:32px;padding:5px 9px}button{cursor:pointer;touch-action:manipulation}button:hover{background:#343b4d}:focus-visible{outline:2px solid #94b0ff;outline-offset:2px}.context{padding:10px 24px;background:#191b1f;display:flex;align-items:center;gap:14px}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:16px 12px;border-right:1px solid #383b42}nav button{display:block;width:100%;text-align:left;margin-bottom:5px;border:0;background:transparent}nav button.active{background:#30394e;color:#b9caff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;color:#bfc5d0}input,select{width:100%}.row{display:flex;gap:8px;margin:8px 0}.row input{min-width:0}.warn,.error{padding:10px;background:#3c3121;color:#f3d08e;border:1px solid #66532f;border-radius:5px;margin:12px 0}.error{background:#3b2329;color:#ffc0c7}.note{font-size:12px;color:#9da4af}footer{border-top:1px solid #383b42;border-bottom:0;justify-content:space-between}.primary{background:#4d65aa}textarea{width:100%;height:3 const $=s=>document.querySelector(s),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');let section=0,mode='form',manual=false,raw='',dirty=false;const values={},rows={dependencies:[],health:[],substitutions:[],references:[]};const titles=['Source & destination','Reconciliation','Dependencies & health','Values & decryption','Advanced','Inventory & actions'];const defs=[[['Name *','metadata.name'],['Source kind *','spec.sourceRef.kind',['','GitRepository','OCIRepository','Bucket','ExternalArtifact']],['Existing source *','spec.sourceRef.name',['','platform-source','Unresolved reference']],['Source directory','spec.path'],['Reconcile every * · duration','spec.interval'],['Managed resources namespace','spec.targetNamespace']],[['Prune removed resources *','spec.prune',['','false','true']],['Deletion policy','spec.deletionPolicy',['','MirrorPrune','Delete','WaitForTermination','Orphan']],['Wait for all managed resources','spec.wait',['','true','false']],['Recreate on immutable field failure','spec.force',['','true','false']],['Suspend future runs','spec.suspend',['','true','false']],['Timeout · duration','spec.timeout'],['Retry interval · duration','spec.retryInterval']],[],[['Decrypt with','spec.decryption.provider',['','sops']],['Existing decryption Secret','spec.decryption.secretRef.name',['','preview-sops']],['Decryption cloud ServiceAccount','spec.decryption.serviceAccountName']], [['Apply as ServiceAccount','spec.serviceAccountName']]];

function source(){if(manual)return raw;let obj={apiVersion:'kustomize.toolkit.fluxcd.io/v1',kind:'Kustomization',metadata:{namespace:'preview'},spec:{}};for(let[k,v]of Object.entries(values)){if(v==='')continue;let parts=k.split('.'),o=obj;parts.slice(0,-1).forEach(p=>o=o[p]??={});o[parts.at(-1)]=v==='true'?true:v==='false'?false:v}if(rows.dependencies.length)obj.spec.dependsOn=rows.dependencies.map(r=>({name:r[0],namespace:r[1]}));if(rows.health.length)obj.spec.healthChecks=rows.health.map(r=>({name:r[0],kind:r[1]}));if(rows.substitutions.length||rows.references.length){obj.spec.postBuild={};if(rows.substitutions.length)obj.spec.postBuild.substitute=Object.fromEntries(rows.substitutions);if(rows.references.length)obj.spec.postBuild.substituteFrom=rows.references.map(r=>({kind:r[0],name:r[1]}))}return '# YAML accepts JSON flow documents below.\n'+JSON.stringify(obj,null,2)}
function render(){let scenario=$('#scenario').selectedIndex;$('h1').textContent=(scenario?'Edit':'Create')+' Kustomization';$('nav').innerHTML=titles.map((t,i)=>`<button data-section="${i}" class="${section===i?'active':''}">${t}</button>`).join('');let html=scenario===2?'<div class="warn">Git owns this object. Edit its source repository; direct changes may be reverted.</div>':scenario===3?'<div class="error">Update denied. Request permission; draft retained.</div>':scenario===4?'<div class="error">Kustomization v1 CRD missing. No mutation available.</div>':'';if(mode==='yaml')html+='<h2>Source draft</h2><div class="note">Manual edits remain exact. Guided form then becomes unavailable.</div><textarea aria-label="YAML source" spellcheck="false">'+esc(source())+'</textarea>';else if(manual)html+='<h2>Guided form unavailable</h2><div class="warn">Manual source retained unchanged. Continue in YAML; no automatic conversion.</div>';else {html+=`<h2>${titles[section]}</h2><div class="grid">${(defs[section]||[]).map(field).join('')}</div>`;if(section===0)html+='<details><summary>Source reference availability · fixture</summary><select aria-label="Reference availability"><option>Available</option><option>Loading…</option><option>Empty · no sources</option><option>Denied · cannot list</option><option>Unavailable · discovery failed</option></select><p class="note">Existing references remain intact. No source or namespace is created.</p></details>';if(section===1)html+='<div class="warn">Prune deletes removed managed resources. Force can recreate resources and interrupt workloads.</div>';if(section===2)html+=list('dependencies','Kustomization name','Namespace')+list('health','Resource name','Kind')+'<p class="note">Wait enabled ignores explicit health checks. CEL stays in advanced source.</p>';if(section===3)html+=list('substitutions','Non-sensitive variable','String value')+list('references','Secret or ConfigMap kind','Existing reference name')+'<p class="note">Reference names only. Never fetch Secret data. Use references for confidential values.</p>';if(section===4)html+='<table><tr><td>Transforms</td><td>images, patches, components, namePrefix, nameSuffix</td></tr><tr><td>Metadata</td><td>commonMetadata labels & annotations</td></tr><tr><td>Remote apply</td><td>kubeConfig: exclusive ConfigMap / Secret reference</td></tr><tr><td>CEL readiness</td><td>dependsOn.readyExpr, healthCheckExprs</td></tr></table><p class="note">Advanced fields use source editing. No credential/configuration import.</p><button id="advanced">Edit advanced source</button>';if(section===5)html+='<table><tr><th>Synthetic inventory entry</th><th>Version</th></tr><tr><td>preview_app_apps_Deployment</td><td>v1</td></tr></table><p class="note">Read-only status.inventory.entries · live drift unavailable</p><div class="row"><button data-action="Reconcile">Review reconcile request</button><button data-action="Suspend">Review suspend request</button><button data-action="Resume">Review resume request</button></div><div id="action" aria-live="polite"></div>'} $('main').innerHTML=html;$('#review').disabled=blocked();document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=+b.dataset.section;render()});document.querySelectorAll('[data-k]').forEach(e=>{e.disabled=blocked()||(e.dataset.k==='metadata.name'&&scenario>0);e.oninput=()=>{values[e.dataset.k]=e.value;dirty=true}});document.querySelectorAll('[data-add]').forEach(b=>{b.disabled=blocked();b.onclick=()=>{rows[b.dataset.add].push(['','']);render()}});document.querySelectorAll('[data-remove]').forEach(b=>{b.disabled=blocked();b.onclick=()=>{rows[b.dataset.remove].splice(+b.dataset.i,1);render()}});document.querySelectorAll('[data-row]').forEach(e=>{e.disabled=blocked();e.oninput=()=>rows[e.dataset.row][+e.dataset.i][+e.dataset.j]=e.value});if($('textarea')){$('textarea').readOnly=scenario>1;$('textarea').oninput=e=>{raw=e.target.value;manual=true;dirty=true}}if($('#advanced'))$('#advanced').onclick=()=>{mode='yaml';render()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>$('#action').innerHTML=`<div class="warn">${b.dataset.action} request review · preview-cluster / preview<br>${b.dataset.action==='Reconcile'?'metadata.annotations[reconcile.fluxcd.io/requestedAt]':`spec.suspend: ${b.dataset.action==='Suspend'}`}<br>Ownership and permission checks required. Nothing sent.</div>`)}
$('#form').onclick=()=>{mode='form';render()};$('#yaml').onclick=()=>{mode='yaml';render()};$('#scenario').onchange=render;$('#review').onclick=()=>{let v=values;if(!v['metadata.name']||!v['spec.sourceRef.kind']||!v['spec.sourceRef.name']||!/^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$/.test(v['spec.interval']||'')||!v['spec.prune']){$('main').insertAdjacentHTML('afterbegin','<div class="error" role="alert">Enter name, source kind/name, valid interval, and explicit prune choice.</div>');document.querySelector('[data-k="metadata.name"]')?.focus();return}$('main').innerHTML='<h2>Review draft · no request sent</h2><table><tr><td>Destination</td><td>preview-cluster / preview</td></tr><tr><td>Source</td><td>'+esc(v['spec.sourceRef.kind']+'/'+v['spec.sourceRef.name'])+'</td></tr><tr><td>Prune</td><td>'+esc(v['spec.prune'])+'</td></tr></table><div class="warn">Apply can change workloads. Pruning and deletion policy can delete resources. Source and target changes redirect reconciliation.</div><button id="back">Back to draft</button>';$('#back').onclick=render};function help(){if($('.help'))return;let e=document.createElement('div');e.className='help';e.setAttribute('role','tooltip');e.textContent='Flux Kustomization reconciles source artifacts. This is not local kustomization.yaml. Target namespace overrides source namespaces but creates no namespace.';$('dialog').append(e)}$('#help').onmouseenter=help;$('#help').onfocus=help;$('#help').onclick=help;document.onkeydown=e=>{if(e.key==='Escape'&&$('.help')){e.preventDefault();$('.help').remove();$('#help').focus();$('.help')?.remove()}};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();</script></html>
