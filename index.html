<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101112"><title>Kyverno CEL policy editor · design preview</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#1f2125;--field:#131416;--line:#363941;--text:#e6e8ec;--muted:#a4aab6;--accent:#8aa8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit}button,select,input{height:32px}button{cursor:pointer;background:#282c33;border:1px solid var(--line);border-radius:5px;padding:0 12px;touch-action:manipulation}button:hover{background:#373d48}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 9px;width:100%;min-width:0}textarea{resize:vertical;min-height:78px;font:12px/1.6 ui-monospace,monospace;tab-size:2}label{display:block;color:#c5cad3;margin:0 0 6px}.field{margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}h1{font-size:16px;margin:0}h2{font-size:14px;margin:0 0 18px}.sub{color:var(--muted);font-size:12px}.shell{padding:20px 28px;color:#777f8c}.shell strong{color:#d0d6df}.fixture{text-align:center;color:#9199a7;margin:18px 10px 12px;font-size:12px}dialog{padding:0;border:1px solid #42464e;border-radius:9px;background:var(--panel);color:var(--text);width:1000px;height:700px;max-width:calc(100vw - 28px);max-height:calc(100dvh - 100px);box-shadow:0 20px 90px #0009;overflow:hidden}dialog::backdrop{background:#080a0d88}.frame{height:100%;display:grid;grid-template-rows:70px 48px 1fr 62px}header{padding:15px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}header .sub{margin-top:4px}.toolbar{padding:8px 24px;display:flex;gap:8px;border-bottom:1px solid var(--line);align-items:center}.toolbar select{width:auto;max-width:270px}.spacer{flex:1}.selected{background:#344265;color:#dbe6ff;border-color:#6987cd}.body{display:grid;grid-template-columns:180px 1fr;min-height:0}nav{padding:18px 12px;border-right:1px solid var(--line)}nav button{width:100%;text-align:left;margin-bottom:6px;border-color:transparent;background:transparent;color:#b7bfcc}nav .selected{background:#303949;color:#e0e9ff}main{padding:20px 24px;overflow:auto;overscroll-behavior:contain;min-width:0}footer{border-top:1px solid var(--line);display:flex;gap:8px;padding:14px 24px;align-items:center}.primary{background:#7794ea;border-color:#8ba8ff;color:#0b1430;font-weight:600}.badge{font-size:11px;color:#c4d1f4;background:#2c3549;border:1px solid #424f6a;border-radius:4px;padding:3px 7px}.notice{padding:10px 12px;border:1px solid #6c5937;background:#352d20;color:#ebcf99;border-radius:5px;margin-bottom:16px;line-height:1.5}.error{color:#ffb3b3;margin:6px 0;font-size:12px}.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row>*{min-width:0}.row input{flex:1}.row button{flex:none}.help{width:22px;height:22px;padding:0;border-radius:50%;font-size:12px;margin-left:6px}.helpbox{background:#303641;border:1px solid #6d7b92;border-radius:5px;padding:12px;line-height:1.5;margin-bottom:16px;max-width:560px}.code{height:325px;white-space:pre}.review{white-space:pre-wrap;background:#15171a;padding:16px;border:1px solid var(--line);border-radius:5px;font:12px/1.7 ui-monospace,monospace;overflow-wrap:anywhere}.check{display:flex;align-items:center;gap:8px;margin:9px 0}.check input{width:16px;height:16px}.rule{border:1px solid var(--line);padding:12px;border-radius:5px;margin-bottom:12px}.rule strong{font-size:12px}.tiny{font-size:11px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:740px){.body{grid-template-columns:140px 1fr}.grid{grid-template-columns:1fr}.toolbar{padding:8px 12px}.toolbar select{max-width:160px}header,main,footer{padding-left:14px;padding-right:14px}.fixture{margin-top:8px}.frame{grid-template-rows:70px 48px 1fr 62px}footer .sub{max-width:200px}dialog{max-height:calc(100dvh - 48px)}}
</style>
<div class="shell"><strong>omniview</strong>　 /　 preview-cluster　 /　 Kyverno policies <button id="open" style="float:right">Open policy editor</button></div><div class="fixture">INTERACTIVE DESIGN MOCK · Synthetic fixtures only · No cluster connection or mutations · HTML composition, not shipped React</div>
<dialog id="modal" aria-labelledby="title"><div class="frame"><header><div><h1 id="title">Create ValidatingPolicy</h1><div class="sub" id="destination"></div></div><span class="badge">v1alpha1 · Kyverno 1.15.2</span></header><div class="toolbar"><select id="kind" aria-label="Policy kind"></select><select id="intent" aria-label="Editing intent"><option value="create">Create</option><option value="edit">Edit fixture</option><option value="managed">GitOps-owned fixture</option></select><span class="spacer"></span><button id="form">Form</button><button id="yaml">YAML</button></div><div class="body"><nav aria-label="Policy sections"><button data-section="policy">Policy</button><button data-section="match">Target matching</button><button data-section="variables">Variables</button><button data-section="advanced">Advanced</button><button data-section="access">Availability</button></nav><main id="content"></main></div><footer><span class="sub" id="foot">preview-cluster · Cluster-scoped</span><span class="spacer"></span><button id="cancel">Cancel</button><button id="review" class="primary">Review draft</button></footer></div></dialog>
<script>
const kinds=['ValidatingPolicy','MutatingPolicy','GeneratingPolicy','DeletingPolicy','ImageValidatingPolicy','PolicyException'];let kind='ValidatingPolicy',section='policy',mode=localStorage.getItem('mock328-mode')||'form',intent='create',raw='',locked=false,reviewing=false,help=false,helpOrigin=null,availability='available';const drafts={};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const warnings={ValidatingPolicy:'Deny can reject matching API requests. Review target breadth before saving.',MutatingPolicy:'Mutations change matching resources. Existing-resource evaluation can rewrite stored objects.',GeneratingPolicy:'Generation can create resources. Synchronization can overwrite generated resources.',DeletingPolicy:'Scheduled deletion can permanently remove matching resources and dependents.',ImageValidatingPolicy:'Verification can deny matching images. Digest mutation can change submitted image references.',PolicyException:'Exceptions bypass referenced policies when all conditions match. Empty conditions broaden the bypass.'};
function fresh(){return {name:'',namespace:'preview',expression:'',message:'',action:'Audit',patch:'ApplyConfiguration',schedule:'',propagation:'Background',glob:'',attestor:'',issuer:'',subject:'',refKind:'ValidatingPolicy',refName:'',group:'',version:'',resource:'',operation:'CREATE',rules:[],variables:[],conditions:[],synchronize:false,existing:false,orphan:false}}
function d(){return drafts[kind]??(drafts[kind]=fresh())}
function field(label,key,type='input',options){
 const val=d()[key];
 const control=type==='select'
  ?`<select id="${key}" name="${key}" data-key="${key}">${options.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`
  :type==='textarea'
  ?`<textarea id="${key}" name="${key}" data-key="${key}" spellcheck="false" autocomplete="off">${esc(val)}</textarea>`
  :`<input id="${key}" name="${key}" data-key="${key}" autocomplete="off" spellcheck="false" value="${esc(val)}" ${['name','namespace'].includes(key)&&intent!=='create'?'readonly':''}>`;
 return `<div class="field"><label for="${key}">${label}</label>${control}</div>`;
}
function check(label,key){return `<label class="check"><input type="checkbox" data-key="${key}" ${d()[key]?'checked':''}>${label}</label>`}
function helpButton(){return '<button class="help" id="help" aria-label="CEL context help" aria-expanded="false">?</button>'}
function effect(){
 if(kind==='ValidatingPolicy')return `<h2>Validation ${helpButton()}</h2>${field('Validation expression *','expression','textarea')}${field('Failure message','message')}<div class="grid">${field('Violation action','action','select',['Audit','Warn','Deny'])}</div>`;
 if(kind==='MutatingPolicy')return `<h2>Mutation ${helpButton()}</h2>${field('Patch strategy','patch','select',['ApplyConfiguration','JSONPatch'])}${field('CEL patch expression *','expression','textarea')}${check('Evaluate existing resources','existing')}`;
 if(kind==='GeneratingPolicy')return `<h2>Resource generation ${helpButton()}</h2>${field('CEL resource-list expression *','expression','textarea')}${check('Trigger for existing resources','existing')}${check('Synchronize generated resources','synchronize')}${check('Orphan downstream on policy deletion','orphan')}`;
 if(kind==='DeletingPolicy')return `<h2>Scheduled deletion ${helpButton()}</h2><div class="grid">${field('Cron schedule *','schedule')}${field('Dependent handling','propagation','select',['Background','Foreground','Orphan'])}</div>${field('Deletion condition · CEL boolean *','expression','textarea')}<div class="tiny">No matching-object count or execution is simulated.</div>`;
 if(kind==='ImageValidatingPolicy')return `<h2>Image verification ${helpButton()}</h2><div class="grid">${field('Image glob *','glob')}${field('Attestor name *','attestor')}</div><div class="rule"><strong>Cosign · keyless identity</strong><div class="grid" style="margin-top:12px">${field('OIDC issuer *','issuer')}${field('Certificate subject *','subject')}</div></div>${field('Verification expression *','expression','textarea')}${field('Violation action','action','select',['Audit','Warn','Deny'])}<div class="tiny">Secret references belong to the Kyverno namespace. No credential values are fetched.</div>`;
 return `<h2>Policy exception ${helpButton()}</h2><div class="grid">${field('Referenced policy kind','refKind','select',['ValidatingPolicy','ImageValidatingPolicy'])}${field('Existing policy name *','refName')}</div>${field('Exception condition · CEL boolean *','expression','textarea')}<div class="tiny">This is policies.kyverno.io, not kyverno.io PolicyException.</div>`;
}
function render(){let x=d();$('#kind').value=kind;$('#intent').value=intent;$('#title').textContent=(intent==='create'?'Create ':'Inspect / edit ')+kind;$('#destination').textContent='preview-cluster · '+(kind==='PolicyException'?'Namespace: '+x.namespace:'Cluster-scoped');$('#foot').textContent=$('#destination').textContent;$('#form').classList.toggle('selected',mode==='form');$('#yaml').classList.toggle('selected',mode==='yaml');document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('selected',section===b.dataset.section));$('#review').disabled=locked||intent==='managed'||availability!=='available';let html='';if(reviewing){html=`<h2>Review · no mutation</h2><div class="notice">${warnings[kind]}</div><div class="review">${esc(JSON.stringify(manifest(),null,2))}</div><button id="back">Back to draft</button>`}else if(mode==='yaml'){html=`<h2>Source draft <span class="badge">${locked?'Raw source retained':'Generated supported subset'}</span></h2><div class="notice">Manual source edits remain exact. Form and Review lock until restored; no lossless parser is claimed.</div><label for="source">YAML source</label><textarea id="source" class="code" spellcheck="false" autocomplete="off">${esc(raw||source())}</textarea>${locked?'<button id="restore">Restore form-generated source</button>':''}`}else if(locked){html='<h2>Form unavailable</h2><div class="notice">Source was edited. Return to YAML; the exact draft remains intact.</div>'}else if(section==='policy'){html=`<div class="grid">${field('Name *','name')}${kind==='PolicyException'?field('Namespace *','namespace'):'<div class="field"><label>Scope</label><input readonly aria-label="Resource scope" value="Cluster"></div>'}</div><div class="notice">${warnings[kind]}</div>${effect()}`}else if(section==='match'){html=kind==='PolicyException'?'<h2>Exception scope</h2><div class="notice">Use Policy condition to constrain the bypass. Namespace alone is not an expiry or approval mechanism.</div>':`<h2>Target matching</h2><div class="grid">${field('API group · empty = core','group')}${field('API version *','version')}${field('Resource plural *','resource')}${field('Operation','operation','select',['CREATE','UPDATE','DELETE','CONNECT','*'])}</div><button id="addRule">Add target rule</button><div id="rules" style="margin-top:16px">${x.rules.map((r,i)=>`<div class="row rule"><span style="flex:1">${esc(r.apiGroups[0]||'core')} / ${esc(r.apiVersions[0])} / ${esc(r.resources[0])} · ${esc(r.operations[0])}</span><button data-remove="${i}" aria-label="Remove target rule ${i+1}">Remove</button></div>`).join('')||'<div class="sub">No target rules. Review requires an explicit target.</div>'}</div><div class="tiny">Namespace/object selectors and exclude rules remain in Advanced source.</div>`}else if(section==='variables'){html=`<h2>CEL variables ${helpButton()}</h2><div class="grid">${field('Variable name','varName')}${field('CEL expression','varExpression')}</div><button id="addVariable">Add variable</button>${x.variables.map((v,i)=>`<div class="row rule"><code style="flex:1">${esc(v.name)} = ${esc(v.expression)}</code><button data-rmvar="${i}">Remove</button></div>`).join('')}`}else if(section==='advanced'){html=`<h2>Advanced & ownership</h2><div class="notice">${intent==='managed'?'GitOps field ownership detected in fixture. Edit upstream; this editor is read-only.':'Identity locks on edit. Status, generated policies and managedFields stay read-only.'}</div><div class="rule"><strong>Source-only in this bounded prototype</strong><p class="sub">Selectors · exclusions · match conditions · audit annotations · autogen · webhook configuration · additional mutations/validations · image attestations and trust branches</p><button id="advancedSource">Open source</button></div><div class="tiny">Preserve unsupported fields in production through owned-path source patches. This mock does not claim those round trips.</div>`}else{html=`<h2>Authoring availability</h2><label for="availability">Simulated discovery / permission result</label><select id="availability">${['available','missing','denied','unavailable','empty','unsupported'].map(a=>`<option ${a===availability?'selected':''}>${a}</option>`).join('')}</select><div class="notice" style="margin-top:16px">${{available:'Fixture only: installed alpha schema and authoring verbs are assumed. Controller support still needs separate verification.',missing:'API not installed. Keep draft; no Create request is offered.',denied:'Permission denied. Keep draft; do not treat this as an empty list.',unavailable:'Discovery unavailable. Keep draft; retry capability lookup before authoring.',empty:'Lookup succeeded with no policy references. No reference is invented.',unsupported:'Installed API version differs. Keep source; provider is not applicable.'}[availability]}</div>`}$('#content').innerHTML=html;bind();if(intent==='managed')$('#content').querySelectorAll('[data-key],#addRule,#addVariable,[data-remove],[data-rmvar]').forEach(e=>e.disabled=true)}
function manifest(){
 const x=d(),spec={};
 if(kind==='PolicyException'){
  spec.policyRefs=[{name:x.refName,kind:x.refKind}];
  if(x.expression)spec.matchConditions=[{name:'exception-scope',expression:x.expression}];
 }else{
  if(x.rules.length)spec.matchConstraints={resourceRules:x.rules};
  if(x.variables.length)spec.variables=x.variables;
  if(kind==='ValidatingPolicy'){spec.validations=[{expression:x.expression,...(x.message?{message:x.message}:{})}];spec.validationActions=[x.action];}
  if(kind==='MutatingPolicy'){spec.mutations=[{patchType:x.patch,[x.patch==='JSONPatch'?'jsonPatch':'applyConfiguration']:{expression:x.expression}}];if(x.existing)spec.evaluation={mutateExisting:{enabled:true}};}
  if(kind==='GeneratingPolicy'){spec.generate=[{expression:x.expression}];spec.evaluation={generateExisting:{enabled:x.existing},synchronize:{enabled:x.synchronize},orphanDownstreamOnPolicyDelete:{enabled:x.orphan}};}
  if(kind==='DeletingPolicy'){spec.schedule=x.schedule;spec.deletionPropagationPolicy=x.propagation;spec.conditions=[{name:'delete-scope',expression:x.expression}];}
  if(kind==='ImageValidatingPolicy'){spec.matchImageReferences=[{glob:x.glob}];spec.attestors=[{name:x.attestor,cosign:{keyless:{identities:[{issuer:x.issuer,subject:x.subject}]}}}];spec.validations=[{expression:x.expression}];spec.validationActions=[x.action];}
 }
 return{apiVersion:'policies.kyverno.io/v1alpha1',kind,metadata:{name:x.name,...(kind==='PolicyException'?{namespace:x.namespace}:{})},spec};
}
function toYaml(o,n=0){if(Array.isArray(o))return o.map(v=>' '.repeat(n)+'- '+(typeof v==='object'?'\n'+toYaml(v,n+2):JSON.stringify(v))).join('\n');return Object.entries(o).map(([k,v])=>' '.repeat(n)+k+':'+(v&&typeof v==='object'?'\n'+toYaml(v,n+2):' '+JSON.stringify(v))).join('\n')}
function source(){if(locked)return raw;return '# Synthetic design draft; not submitted\n'+toYaml(manifest())+'\n'}
function bind(){$('#content').querySelectorAll('[data-key]').forEach(e=>e.oninput=()=>{d()[e.dataset.key]=e.type==='checkbox'?e.checked:e.value;raw='';if(e.dataset.key==='patch')render()});let a=$('#help');if(a){a.onmouseenter=()=>showHelp(a);a.onfocus=()=>showHelp(a);a.onclick=()=>showHelp(a)}if($('#addRule'))$('#addRule').onclick=()=>{if(!d().version||!d().resource){error('Enter API version and resource plural.','#version');return}d().rules.push({apiGroups:[d().group],apiVersions:[d().version],resources:[d().resource],operations:[d().operation]});render()};document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{d().rules.splice(+e.dataset.remove,1);render()});document.querySelectorAll('[data-rmvar]').forEach(e=>e.onclick=()=>{d().variables.splice(+e.dataset.rmvar,1);render()});if($('#addVariable'))$('#addVariable').onclick=()=>{if(!d().varName||!d().varExpression){error('Enter a variable name and expression.','#varName');return}d().variables.push({name:d().varName,expression:d().varExpression});render()};if($('#source'))$('#source').oninput=e=>{raw=e.target.value;locked=true;$('#review').disabled=true};if($('#restore'))$('#restore').onclick=()=>{if(confirm('Discard manual source edits and restore the form draft?')){raw='';locked=false;render()}};if($('#advancedSource'))$('#advancedSource').onclick=()=>setMode('yaml');if($('#availability'))$('#availability').onchange=e=>{availability=e.target.value;render()};if($('#back'))$('#back').onclick=()=>{reviewing=false;render()}}
function showHelp(a){if(help)return;help=true;helpOrigin=a;a.setAttribute('aria-expanded','true');let p=document.createElement('div');p.className='helpbox';p.id='helpbox';p.setAttribute('role','status');p.textContent='CEL context depends on policy kind and evaluation mode. Admission expressions can use object, oldObject and request. Background evaluation cannot assume request identity. Expressions are not executed or type-checked here.';a.closest('h2').after(p)}function error(t,sel){$('#content').querySelectorAll('.error').forEach(e=>e.remove());let e=document.createElement('div');e.className='error';e.setAttribute('role','alert');e.textContent=t;let input=$(sel);if(input){input.after(e);input.setAttribute('aria-invalid','true');input.focus()}else $('#content').prepend(e)}
function setMode(m){mode=m;localStorage.setItem('mock328-mode',m);reviewing=false;help=false;render()}
const sourceDrafts={};
$('#kind').innerHTML=kinds.map(k=>`<option>${k}</option>`).join('');
$('#kind').onchange=e=>{
 sourceDrafts[kind]={raw,locked};
 kind=e.target.value;
 ({raw,locked}=sourceDrafts[kind]||{raw:'',locked:false});
 reviewing=false;help=false;render();
};
$('#intent').onchange=e=>{intent=e.target.value;if(intent!=='create'&&!d().name)d().name='preview-policy';render()};
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;reviewing=false;help=false;render()});
$('#form').onclick=()=>setMode('form');
$('#yaml').onclick=()=>setMode('yaml');
$('#review').onclick=()=>{
 section='policy';mode='form';render();
 if(!d().name){error('Enter a policy name.','#name');return}
 if(!d().expression){error('Enter the required CEL expression.','#expression');return}
 if(kind==='DeletingPolicy'&&!d().schedule){error('Enter a Cron schedule.','#schedule');return}
 if(kind==='ImageValidatingPolicy'){for(let k of ['glob','attestor','issuer','subject'])if(!d()[k]){error('Complete this verification field.','#'+k);return}}
 if(kind==='PolicyException'&&!d().refName){error('Select a referenced policy name.','#refName');return}
 if(kind!=='PolicyException'&&!d().rules.length){section='match';render();error('Add at least one explicit target rule.','#version');return}
 reviewing=true;render();
};
function close(){
 if(confirm('Discard all in-memory drafts and close?')){
  for(let k of kinds){delete drafts[k];delete sourceDrafts[k]}
  raw='';locked=false;reviewing=false;$('#modal').close();$('#open').focus();
 }
}
$('#cancel').onclick=close;
$('#modal').addEventListener('cancel',e=>{
 e.preventDefault();
 if(help){$('#helpbox')?.remove();help=false;helpOrigin?.setAttribute('aria-expanded','false');helpOrigin?.focus()}
 else close();
});
$('#open').onclick=()=>{render();$('#modal').showModal()};
render();$('#modal').showModal();
</script></html>
