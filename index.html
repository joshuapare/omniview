<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><title>Batch resource editor • Design preview</title><style>
:root{color-scheme:dark;--bg:#101112;--panel:#1f2125;--field:#141517;--border:#383c43;--text:#e5e7eb;--muted:#9da5b1;--accent:#82b5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--border);background:var(--field);border-radius:5px}button,input,select{min-height:32px;padding:5px 10px}button{cursor:pointer;touch-action:manipulation}button:hover{border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.active{background:#293d58;color:#b9d7ff;border-color:#5479a7}button:disabled{opacity:.5;cursor:not-allowed}.top{padding:20px 28px;display:flex;align-items:center;gap:16px;color:var(--muted)}.badge{font-size:11px;letter-spacing:.08em;color:#acb6c4}.frame{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 112px));margin:16px auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 22px 90px #0008}header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0 0 6px}small,.muted{color:var(--muted)}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--border)}nav button{display:block;width:100%;text-align:left;margin-bottom:7px;background:transparent;border-color:transparent}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}h2{font-size:14px;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#bfc5ce;margin-bottom:16px}input,select{display:block;width:100%;margin-top:7px}input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0}input:disabled{color:#8d97a6}footer{padding:14px 24px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border)}footer small{flex:1}.primary </style><div class="top"><b>omniview</b><span>/ Workloads / Batch</span><span class="badge">INTERACTIVE DESIGN · SYNTHETIC FIXTURES</span><select id="kind" aria-label="Resource kind" style="width:120px;margin:0"><option>Job</option><option>CronJob</option></select><select id="intent" aria-label="Editor scenario" style="width:190px;margin:0"><option value="create">Create</option><option value="edit">Edit standalone</option><option value="owned">CronJob-owned Job</option><option value="denied">Update denied</option><option value="unavailable">Discovery unavailable</option></select></div><div class="frame" role="dialog" aria-modal="true" aria-labelledby="title"><header><div><h1 id="title"></h1><small>preview-cluster <span aria-hidden="true"> / </span> preview · batch/v1</small></div><div><button id="form">Form</button> <button id="yaml">YAML</button></div></header><div class="body"><nav id="nav" aria-label="Editor sections"></nav><main id="main"></main></div><footer><small id="destination">Namespaced · No cluster requests</small><button id="back" hidden>Back to draft</button><button id="review" class="primary">Review draft</button></footer></div><div class="fixture">Isolated HTML composition, not shipped React. Reference lists and status are sample data.</div><script>
const $=s=>document.querySelector(s);let section='Basics',mode='form',review=false,help=false,helpOpener=null,manual=false,raw='',rows=[],d={};const fields={};function reset(){d={name:'',image:'',schedule:'',zone:'',concurrency:'',parallelism:'',completions:'',backoff:'',deadline:'',ttl:'',successful:'',failed:'',starting:'',completion:'',restart:'',suspend:false};rows=[];manual=false;raw='';review=false;section='Basics';if($('#intent').value!=='create'){Object.assign(d,{name:kind()==='Job'?'report-run':'nightly-report',image:'example.invalid/report:fixture',schedule:'0 2 * * *',zone:'Etc/UTC',concurrency:'Forbid',restart:'Never',parallelism:'1',backoff:'3'});}render()}function kind(){return $('#kind').value}function editing(){return $('#intent').value!=='create'}function owned(){return $('#intent').value==='owned'}function locked(key){return editing()&&(key==='name'||(kind()==='Job'&&['image','completion','restart','completions'].includes(key)))}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function input(key,label,type='text'){return `<label>${label}<input name="${key}" autocomplete="off" spellcheck="false" id="${key}" type="${type}" value="${esc(d[key])}" ${locked(key)?'disabled':''}></label>`}function select(key,label,options){return `<label>${label}<select id="${key}" name="${key}" ${locked(key)?'disabled':''}>${options.map(([v,t])=>`<option value="${v}" ${d[key]===v?'selected':''}>${t}</option>`).join('')}</select></label>`}function doc(){let p=kind()==='CronJob'?'    ':'';let a=['# Synthetic draft. No request will be sent.','apiVersion: batch/v1','kind: '+kind(),'metadata:','  name: '+JSON.stringify(d.name),'  namespace: preview','spec:'];if(kind()==='CronJob'){a.push('  schedule: '+JSON.stringify(d.schedule));for(let [k,v]of Object.entries({timeZone:d.zone,concurrencyPolicy:d.concurrency,successfulJobsHistoryLimit:d.successful,failedJobsHistoryLimit:d.failed,startingDeadlineSeconds:d.starting}))if(v!=='')a.push('  '+k+': '+(k==='timeZone'||k==='concurrencyPolicy'?JSON.stringify(v):v));a.push('  suspend: '+d.suspend,'  jobTemplate:','    spec:')}let prefix=kind()==='CronJob'?'      ':'  ';for(let[k,v]of Object.entries({parallelism:d.parallelism,completions:d.completions,backoffLimit:d.backoff,activeDeadlineSeconds:d.deadline,ttlSecondsAfterFinished:d.ttl,completionMode:d.completion}))if(v!=='')a.push(prefix+k+': '+(k==='completionMode'?JSON.stringify(v):v));if(kind()==='Job')a.push(prefix+'suspend: '+d.suspend);a.push(prefix+'template:',prefix+'  spec:',prefix+'    restartPolicy: '+JSON.stringify(d.restart),prefix+'    containers:',prefix+'      - name: worker',prefix+'        image: '+JSON.stringify(d.image));if(rows.length){a.push(prefix+'        args:');rows.forEach(v=>a.push(prefix+'          - '+JSON.stringify(v)))}return a.join('\n')+'\n'}function render(){let deny=['denied','unavailable'].includes($('#intent').value);$('#title').textContent=(owned()?'Inspect ':editing()?'Edit ':'Create ')+kind();$('#form').className=mode==='form'?'active':'';$('#yaml').className=mode==='yaml'?'active':'';let tabs=['Basics',...(kind()==='CronJob'?['Schedule']:[]),'Pod template','Execution','Advanced','Status'];$('#nav').innerHTML=tabs.map(s=>`<button class="${s===section?'active':''}" data-section="${s}">${s}</button>`).join('');$('#back').hidden=!review;$('#review').disabled=deny||owned()||manual;$('#review').textContent='Review draft';let html='';if(deny){html=`<h2>${$('#intent').value==='denied'?'Update permission denied':'API discovery unavailable'}</h2><div class="note">${$('#intent').value==='denied'?'Cannot update batch/v1 '+kind()+' in preview. Draft retained.':'Cannot confirm batch/v1 availability. Draft retained; review blocked.'}</div><button id="retry">Return to draft fixture</button>`}else if(review){html=`<h2>Review ${kind()} · No mutation</h2><div class="note">${kind()==='Job'?(d.suspend?'New Job starts suspended. Resuming allows Pods to start.':'Applying this draft can start executable Pods. Suspending an active Job deletes its active Pods and resets its deadline timer.'):'Changes affect future Jobs only. '+(d.concurrency==='Replace'?'Replace cancels the prior active Job. ':'')+(d.suspend?'Suspension stops future schedules, not running Jobs. Resuming may start missed executions.':'Scheduled executions can start Pods.')}${d.ttl!==''?' Finished Jobs become eligible for deletion after '+esc(d.ttl)+' seconds.':''}</div><b>preview-cluster / preview</b><pre>${esc(manual?raw:doc())}</pre><small>Local review only. No Create or Save endpoint is connected.</small>`}else if(mode==='yaml'){html=`<h2>Source draft</h2>${manual?'<div class="note">Manual source retained verbatim. Guided editing and review are unavailable; this mock has no lossless YAML parser.</div>':''}<textarea id="source" aria-label="YAML source" spellcheck="false">${esc(manual?raw:doc())}</textarea>`}else if(manual){html='<h2>Source-only draft</h2><div class="note">Return to YAML to keep editing your exact source. No conversion or reset was performed.</div>'}else{html=`<h2>${section}</h2>`;if(owned())html+='<div class="note">Owned by CronJob nightly-report. Edit its template for future runs; this generated Job is inspect-only here.</div><button id="owner">Open CronJob fixture</button> ';if(section==='Basics')html+=`<div class="grid">${input('name','Name *')}<label>Namespace *<select disabled aria-label="Namespace"><option>preview</option></select></label></div><button class="help" aria-label="Identity help">?</button><details><summary>Metadata & ownership</summary><p class="muted">Object labels, Pod-template labels, annotations and ownerReferences stay separate. Expert source only in this bounded mock.</p></details>${editing()?'<div class="note">Identity is locked. Existing Job template fields are immutable here; no delete/recreate shortcut.</div>':''}`;if(section==='Schedule')html+=`<div class="grid">${input('schedule','Cron schedule *')}${select('zone','Time zone',[['','Controller local (omit)'],['Etc/UTC','Etc/UTC'],['America/New_York','America/New_York'],['Europe/London','Europe/London']])}${select('concurrency','When runs overlap',[['','API default (omit)'],['Allow','Allow concurrent runs'],['Forbid','Skip while prior run active'],['Replace','Replace prior active run']])}${input('starting','Missed-start deadline · seconds','number')}</div><button class="help" aria-label="Schedule help">?</button>${d.concurrency==='Replace'?'<div class="note">Replace cancels the prior active Job when a new run starts.</div>':''}<div class="grid">${input('successful','Successful Jobs to retain','number')}${input('failed','Failed Jobs to retain','number')}</div><label><input id="suspend" type="checkbox" ${d.suspend?'checked':''}>Suspend future scheduled runs</label><button id="run">Run now…</button>`;if(section==='Pod template')html+=`${input('image','Container image *')}${select('restart','On container failure *',[['','Choose policy…'],['Never','Never — Job creates replacement Pods'],['OnFailure','OnFailure — restart in same Pod']])}<label>Arguments</label><div id="args">${rows.map((v,i)=>`<div class="row"><input aria-label="Argument ${i+1}" data-arg="${i}" value="${esc(v)}"><button data-remove="${i}" aria-label="Remove argument ${i+1}">Remove</button></div>`).join('')}</div><button id="add" ${editing()&&kind()==='Job'?'disabled':''}>Add argument</button><details><summary>Containers, resources & placement</summary><p class="muted">Use source for multiple containers, requests/limits, references, volumes and placement. No companions are created.</p></details>`;if(section==='Execution')html+=`<div class="grid">${input('parallelism','Maximum concurrent Pods','number')}${input('completions','Successful completions','number')}${input('backoff','Retry limit','number')}${input('deadline','Active deadline · seconds','number')}${input('ttl','Delete finished Job after · seconds','number')}${select('completion','Completion tracking',[['','API default (omit)'],['NonIndexed','Non-indexed'],['Indexed','Indexed — one success per index']])}</div>${kind()==='Job'?`<label><input id="suspend" type="checkbox" ${d.suspend?'checked':''}>Suspend Job</label><div class="note">Suspending an active Job deletes active Pods and resets its deadline timer.</div>`:''}<button class="help" aria-label="Execution help">?</button>`;if(section==='Advanced')html+='<details open><summary>Expert source boundary</summary><p class="muted">Manual selectors, per-index backoff, success/failure policies, replacement policy and external controllers require source. Existing values must be preserved by production AST patching.</p></details><div class="note">Custom managedBy is immutable. Discovery alone does not establish controller support.</div><button id="advancedSource">Open YAML source</button>';if(section==='Status')html+='<div class="status"><div>Active Pods<br><b>Unavailable</b></div><div>Completed<br><b>Unavailable</b></div><div>Conditions<br><b>Not fetched</b></div><div>Last schedule<br><b>Not fetched</b></div></div><p class="muted">Status is read-only. No controller health or future run time is inferred.</p>';if(owned())html+='<style>main input,main select{pointer-events:none;opacity:.65}</style>'}$('#main').innerHTML=html;bind();}
function bind(){document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;review=false;render()});for(let k of Object.keys(d)){let el=$('#'+k);if(el)el.oninput=()=>{d[k]=el.type==='checkbox'?el.checked:el.value;if(k==='concurrency')render()}}document.querySelectorAll('[data-arg]').forEach(el=>el.oninput=()=>rows[+el.dataset.arg]=el.value);document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{rows.splice(+el.dataset.remove,1);render()});if($('#add'))$('#add').onclick=()=>{rows.push('');render();document.querySelector('[data-arg="'+(rows.length-1)+'"]').focus()};if($('#source'))$('#source').oninput=e=>{raw=e.target.value;manual=true;$('#review').disabled=true};document.querySelectorAll('.help').forEach(el=>{const show=()=>{if($('.popover'))return;helpOpener=el;help=true;let box=document.createElement('div');box.className='popover';box.id='helptext';box.setAttribute('role','tooltip');box.textContent=section==='Schedule'?'Five-field cron or supported macro. TZ/CRON_TZ prefixes are not accepted; choose timeZone separately. Forbid skips overlaps; timezone omission uses controller local time.':section==='Execution'?'Blank numeric fields remain omitted. Zero TTL permits immediate deletion. Indexed mode requires completions; advanced policies need schema-aware source validation.':'Names and namespaces identify the resource. Generated Jobs belong to their CronJob; changing a CronJob template does not rewrite existing Jobs.';el.setAttribute('aria-describedby','helptext');el.after(box)};el.onclick=show;el.onfocus=show;el.onmouseenter=show});if($('#retry'))$('#retry').onclick=()=>{$('#intent').value='create';render()};if($('#owner'))$('#owner').onclick=()=>{$('#kind').value='CronJob';$('#intent').value='edit';reset()};if($('#advancedSource'))$('#advancedSource').onclick=()=>{mode='yaml';render()};if($('#run'))$('#run').onclick=()=>{review=true;$('#main').innerHTML='<h2>Run CronJob now · Create Job workflow</h2><div class="note">Creates a separate Job from the current saved CronJob template. This is not a run endpoint and does not bypass Job creation RBAC.</div><label>New Job name *<input id="runName" autocomplete="off" name="runName"></label><p>Destination: preview-cluster / preview</p><div class="note">The Job can start Pods immediately, even while the CronJob is suspended. Schedule concurrency policy does not guard this manual workflow.</div><small>Local action review only. No Job was created. Source snapshot, ownerReference policy and revision must be reviewed before a production POST.</small>';$('#back').hidden=false;$('#review').disabled=true};}
$('#kind').onchange=reset;$('#intent').onchange=reset;$('#form').onclick=()=>{mode='form';localStorage.setItem('mock267-mode','form');review=false;render()};$('#yaml').onclick=()=>{mode='yaml';localStorage.setItem('mock267-mode','yaml');review=false;render()};$('#back').onclick=()=>{review=false;render()};$('#review').onclick=()=>{let errs=[];if(!d.name||! /^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(d.name))errs.push(['name','Enter a DNS-compatible resource name.']);if(!d.image)errs.push(['image','Enter a container image.']);if(!d.restart)errs.push(['restart','Choose Never or OnFailure.']);if(kind()==='CronJob'&&!(d.schedule.trim().split(/\s+/).length===5||['@hourly','@daily','@weekly','@monthly','@yearly','@annually','@midnight'].includes(d.schedule)))errs.push(['schedule','Enter five cron fields or a supported macro; server validation still required.']);for(let k of ['parallelism','completions','backoff','deadline','ttl','successful','failed','starting'])if(d[k]!==''&&(!/^\d+$/.test(d[k])||((k==='deadline')&&d[k]==='0')))errs.push([k,'Use a non-negative whole number; active deadline must be positive.']);if(d.completion==='Indexed'&&!d.completions)errs.push(['completions','Indexed tracking requires completions.']);if(errs.length){section=['name'].includes(errs[0][0])?'Basics':['image','restart'].includes(errs[0][0])?'Pod template':['schedule','starting','successful','failed'].includes(errs[0][0])?'Schedule':'Execution';render();let e=document.createElement('div');e.className='error';e.setAttribute('role','alert');e.textContent=errs.map(v=>v[1]).join(' ');$('#main').prepend(e);$('#'+errs[0][0])?.focus();}else{review=true;render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&help){$('.popover')?.remove();help=false;helpOpener?.focus()}if(e.key==='Tab'){let all=[...document.querySelectorAll('.frame button:not(:disabled),.frame input:not(:disabled),.frame select:not(:disabled),.frame textarea')].filter(x=>x.offsetParent!==null);if(e.shiftKey&&document.activeElement===all[0]){all.at(-1).focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){all[0].focus();e.preventDefault()}}});mode=localStorage.getItem('mock267-mode')||'form';reset();
// Enforce inspection boundaries for pointer and keyboard input alike.
const bindControls = bind;
bind = function () {
  bindControls();
  if (owned()) document.querySelectorAll('main input, main select, main textarea, #add, [data-remove]').forEach(el => el.disabled = true);

  }
};
