<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101112"><title>KEDA resource editor mock</title><style>
:root{color-scheme:dark;--bg:#101112;--panel:#1f2125;--input:#131416;--line:#363940;--text:#e6e8ec;--muted:#a4abb7;--accent:#89aaff;--warning:#e8bc73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--input);border-radius:5px;min-height:32px;padding:5px 9px}button{cursor:pointer;touch-action:manipulation}button:hover{border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled,input:disabled{opacity:.55}header.shell{height:48px;padding:14px 24px;border-bottom:1px solid var(--line);color:var(--muted)}.fixture{text-align:center;color:var(--muted);margin:20px}.dialog{width:min(1000px,calc(100vw - 32px));height:min(700px,calc(100vh - 130px));margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 24px 90px #0009}.top{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:17px;margin:0 0 5px}h2{font-size:15px;margin:0 0 16px}h3{font-size:13px;margin:0 0 12px}.muted,small{color:var(--muted)}.body{display:flex;flex:1;min-height:0}nav{width:180px;flex-shrink:0;padding:20px 12px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin-bottom:6px;background:transparent;border-color:transparent}nav button.active{background:#303947;color:#b7ccff}main{padding:20px 24px;overflow:auto;flex:1;min-width:0;overscroll-behavior:contain}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.field input,.field select{width:100%}.card{padding:14px;border:1px solid var(--line);border-radius:6px;margin:0 0 16px}.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.row>*{min-width:0;flex:1}.row button{flex:0 0 auto}.warning{color:var(--warning);border-left:2px solid var(--warning);padding:8px 12px;background:#e8bc7309;margin:12px 0}.error{color:#ff9c9c;margin:8px 0}.pill{font-size:11px;color:#b8c8e8;border:1px solid #45516a;border-radius:4px;padding:3px 6px}.help{min-height:22px;padding:0 6px;margin-left:5px;border-radius:50%}#popover{position:fixed;background:#30343c;border:1px solid #67748a;border-radius:6px;padding:12px;max-width:320px;z-index:10;box-shadow:0 8px 24px #0008}footer{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.primary{background:#3457a3;border-color:#557ac9}textarea{width:100%;height:340px;resize:vertical;font:12px/1.65 ui-monospace,monospace;white-space:pre;tab-size:2}.seg button.selected{background:#3a4353}.wide{grid-column:1/-1}pre{white-space:pre-wrap;word-break:break-word;background:var(--input);padding:12px;border-radius:5px}.links button{margin-right:8px}@media(max-width:720px){nav{width:138px}.grid{grid-template-columns:1fr}.top{padding:12px}.row{flex-wrap:wrap}main{padding:16px}footer{padding:12px}.fixture{margin:12px}}
@media(max-width:900px){.top{flex-wrap:wrap}.top>.row{width:100%;flex-wrap:wrap}.top>.row select{max-width:100%}.top>.row .seg{display:flex}nav{width:145px}}
</style><header class="shell">Omniview　 /　 Resources　 /　 keda.sh</header><div class="fixture">INTERACTIVE DESIGN MOCK · Synthetic preview-cluster / preview fixtures · No cluster requests</div><section class="dialog" role="dialog" aria-modal="true" aria-label="KEDA resource editor"><div class="top"><div><h1 id="title"></h1><small id="destination"></small></div><div class="row" style="margin:0"><select id="kind" aria-label="Resource kind"><option>ScaledObject</option><option>ScaledJob</option><option>TriggerAuthentication</option><option>ClusterTriggerAuthentication</option></select><select id="intent" aria-label="Intent"><option value="create">Create</option><option value="edit">Edit fixture</option></select><div class="seg"><button id="formBtn">Form</button><button id="yamlBtn">YAML</button></div></div></div><div class="body"><nav id="nav" aria-label="Editor sections"></nav><main id="main"></main></div><footer><span id="foot" class="muted">Draft only · Nothing will be applied</span><div><button id="back" hidden>Back to draft</button> <button id="review" class="primary">Review draft</button></div></footer></section><div id="popover" role="tooltip" hidden></div><script>
const $=s=>document.querySelector(s);let kind='ScaledObject',intent='create',section='Basics',mode='form',locked=false,reviewing=false,raw='',rows=1;const drafts={};let d;const auth=()=>kind.includes('Authentication');const job=()=>kind==='ScaledJob';const cluster=()=>kind==='ClusterTriggerAuthentication';const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');function init(){d=drafts[kind+intent]??={name:intent==='edit'?'queue-workers':'',target:intent==='edit'?'queue-worker':'',image:intent==='edit'?'example.invalid/preview/worker:fixture':'',queue:intent==='edit'?'preview-queue':'',value:intent==='edit'?'20':'',activation:'',min:'',max:'',poll:'',cool:'',fallback:'',failures:'',rollout:'',pause:false,provider:'',parameter:'',secret:'',key:'',lookup:'available',authRef:'',authKind:'TriggerAuthentication'};section='Basics';rows=1;raw='';locked=false;reviewing=false;render()}
function field(label,key,type='text',help=''){return `<label class="field"> <span>${label}${help?`<button type="button" class="help" data-help="${esc(help)}" aria-label="Help: ${label}">?</button>`:''}</span><input autocomplete="off" spellcheck="false" name="${key}" data-key="${key}" type="${type}" value="${esc(d[key])}" ${intent==='edit'&&key==='name'?'disabled':''}></label>`}function select(label,key,options){return `<label class="field">${label}<select data-key="${key}" name="${key}">${options.map(([v,t])=>`<option value="${v}" ${d[key]===v?'selected':''}>${t}</option>`).join('')}</select></label>`}function source(){let a=`apiVersion: keda.sh/v1alpha1\nkind: ${kind}\nmetadata:\n  name: ${d.name||'""'}\n${cluster()?'':'  namespace: preview\n'}${d.pause?'  annotations:\n    autoscaling.keda.sh/paused: "true"\n':''}spec:\n`;if(auth()){a+=d.provider?`  podIdentity:\n    provider: ${d.provider}\n`:'';if(d.secret)a+=`  secretTargetRef:\n  - parameter: ${d.parameter||'""'}\n    name: ${d.secret}\n    key: ${d.key||'""'}\n`;return a+'# Read-only safe projection; credential/annotation values never rendered.\n'}if(job())a+=`  jobTargetRef:\n    template:\n      spec:\n        restartPolicy: Never\n        containers:\n        - name: worker\n          image: ${d.image||'""'}\n${d.rollout?'  rollout:\n    strategy: '+d.rollout+'\n':''}`;else a+=`  scaleTargetRef:\n    name: ${d.target||'""'}\n`;for(let [k,p]of [['min','minReplicaCount'],['max','maxReplicaCount'],['poll','pollingInterval'],...(!job()?[['cool','cooldownPeriod']]:[])])if(d[k]!=='')a+=`  ${p}: ${d[k]}\n`;if(!job()&&d.fallback)a+=`  fallback:\n    failureThreshold: ${d.failures||'0'}\n    replicas: ${d.fallback}\n`;a+='  triggers:\n';for(let i=0;i<rows;i++)a+=`  - type: rabbitmq\n    metadata:\n      queueName: ${JSON.stringify(d.queue)}\n      mode: QueueLength\n      value: ${JSON.stringify(d.value)}\n${d.activation?'      activationValue: '+JSON.stringify(d.activation)+'\n':''}${d.authRef?'    authenticationRef:\n      name: '+d.authRef+'\n      kind: '+d.authKind+'\n':''}`;return a}
function render(){ $('#title').textContent=(intent==='edit'?'Edit ':'Create ')+kind;$('#destination').textContent='preview-cluster / '+(cluster()?'Cluster scope':'preview')+' · keda.sh/v1alpha1 · KEDA 2.18';$('#formBtn').className=mode==='form'?'selected':'';$('#yamlBtn').className=mode==='yaml'?'selected':'';let sections=['Basics',...(auth()?['Parameter sources','Identity & providers']:['Triggers','Scaling']), 'Ownership & access'];$('#nav').innerHTML=sections.map(s=>`<button class="${s===section?'active':''}" data-section="${s}">${s}</button>`).join('');$('#back').hidden=!reviewing;$('#review').hidden=reviewing;let html='';if(reviewing){html=`<h2>Review ${kind}</h2><span class="pill">Non-mutating preview</span><div class="warning">${auth()?(cluster()?'Shared authentication can affect scalers across namespaces.':'Authentication changes affect every scaler using this reference.'):(job()?(d.rollout==='gradual'?'Gradual rollout retains existing Jobs. New Jobs use updated template.':'Default rollout can terminate existing Jobs when updated.'):'KEDA controls target replicas and generated HPA. Scaling can reach zero.')}${d.pause?' Scaling will pause; resume requires removing the pause annotation.':''}</div><p>Destination: preview-cluster / ${cluster()?'cluster scope':'preview'}</p><pre>${esc(locked?raw:source())}</pre>`}
else if(mode==='yaml'){html=`<h2>${auth()?'Safe source projection':'YAML draft'}</h2>${auth()?'<div class="warning">Read-only projection. Credential and annotation values are never editable here.</div>':'<small>Manual source edits stay exact; guided Form locks rather than rebuilding unsupported source.</small>'}<textarea id="source" aria-label="Manifest source" spellcheck="false" ${auth()?'readonly':''}>${esc(locked?raw:source())}</textarea>${locked?'<div class="warning">Manual source retained. Form and review unavailable until source editing is resolved outside this bounded mock.</div>':''}`}
else if(locked){html='<h2>Source editing active</h2><div class="warning">Your exact YAML remains intact. Continue in YAML; this mock cannot safely parse arbitrary source.</div>'}
else if(section==='Basics'){html=`<h2>${auth()?'Authentication identity':job()?'Job workload':'Scale target'}</h2><div class="grid">${field('Name *','name')}${cluster()?'<div class="warning">Cluster-wide reference. Secret namespace depends on operator configuration.</div>':'<label class="field">Namespace<input value="preview" aria-label="Namespace" disabled></label>'}${auth()?'<div class="wide muted">Values stay in existing secret stores.</div>':job()?field('Container image *','image','text','Explicit image required. This creates a Job template, not a reference to an existing Job.'):`${field('Deployment name *','target','text','Same namespace only. StatefulSet and custom /scale targets remain source-owned in this mock.')}`}</div>${intent==='edit'?'<div class="muted">Identity locked · Existing siblings retained by design; no delete/recreate shortcut.</div>':''}`}
else if(section==='Triggers'){html=`<h2>Queue triggers <span class="pill">RabbitMQ</span></h2>`;for(let i=0;i<rows;i++)html+=`<div class="card"><div class="row"><h3>Trigger ${i+1} · Queue length</h3>${i?'<button id="remove">Remove trigger</button>':''}</div><div class="grid">${field('Queue name *','queue')}${field('Messages per replica *','value','text','Stored as a string in trigger metadata; decimal precision is not coerced.')}${field('Activation threshold','activation','text','Optional string. Activation differs from the scaling threshold.')}${select('Authentication scope','authKind',[['TriggerAuthentication','Same namespace'],['ClusterTriggerAuthentication','Cluster-wide']])}${field('Authentication reference *','authRef','text','Select an existing authentication. This mock never resolves credentials.')}</div></div>`;html+='<button id="add">Add queue trigger</button><div class="muted" style="margin-top:12px">Other scalers and per-trigger advanced settings remain source-owned.</div>'}
else if(section==='Scaling'){html=`<h2>${job()?'Job scaling & rollout':'Replica bounds & timing'}</h2><div class="grid">${field('Minimum '+(job()?'Jobs':'replicas'),'min','number')}${field('Maximum '+(job()?'Jobs':'replicas'),'max','number')}${field('Polling interval · seconds','poll','number')}${job()?select('Rollout strategy','rollout',[['','Omit · controller default'],['default','Default · replace existing Jobs'],['gradual','Gradual · retain existing Jobs']]):field('Cooldown · seconds','cool','number','Only applies when scaling to zero. HPA handles scaling between one and many.')}${!job()?field('Fallback replicas','fallback','number')+field('Consecutive failures','failures','number'):''}</div>${job()?'<div class="warning">Default rollout may terminate existing Jobs on update.</div>':'<div class="muted">Blank optional fields remain omitted. Fallback applies only to supported triggers.</div>'}`}
else if(section==='Parameter sources'){html=`<h2>Secret parameter mappings</h2><div class="card"><div class="grid">${field('Scaler parameter *','parameter')}${field('Existing Secret name *','secret')}${field('Secret key *','key')}</div><span class="pill">Reference only · Values never fetched</span></div>${cluster()?'<div class="warning">Secret lookup namespace is KEDA’s configured cluster-object namespace, not a consuming workload namespace.</div>':''}<button id="clearMapping">Remove mapping</button>`}
else if(section==='Identity & providers'){html=`<h2>Workload identity</h2>${select('Pod identity provider','provider',[['','Omit'],['azure-workload','Azure workload identity'],['aws','AWS'],['aws-eks','AWS EKS'],['gcp','GCP'],['none','None']])}<div class="warning">Provider installation and permissions are not verified.</div><details><summary>External stores & advanced source</summary><p class="muted">Vault, Azure Key Vault, AWS Secrets Manager, GCP Secret Manager, environment and bound service-account token mappings remain source-owned. Existing credentials stay hidden; no raw credential editing in this mock.</p></details>`}
else{html=`<h2>Ownership & availability</h2>${select('Fixture capability state','lookup',[['available','Available · sample references'],['empty','Empty · no matching references'],['denied','Denied · list permission missing'],['unavailable','Unavailable · discovery failed'],['missing','Missing · API not installed'],['managed','Managed · GitOps owner']])}<div class="warning" role="status">${({available:'Fixture only. Discovery does not prove controller support or write permission.',empty:'No references found. Enter an unresolved reference without inventing one.',denied:'Reference list denied. Keep draft; request list permission.',unavailable:'Reference service unavailable. Keep draft and retry outside this mock.',missing:'KEDA API missing. No authoring or install action is available.',managed:'Managed by another controller. Inspect source; change the owning repository.'})[d.lookup]}</div>${!auth()?`<label class="row"><input id="pause" type="checkbox" ${d.pause?'checked':''}>Pause scaling</label><div class="links"><button id="generated">Inspect generated ${job()?'Jobs':'HPA'}</button></div><div id="generatedNote" class="muted"></div>`:''}`}
$('#main').innerHTML=html;$('#review').disabled=locked||['missing','managed','denied','unavailable'].includes(d.lookup);bind()}
function bind(){document.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{d[el.dataset.key]=el.value;if(el.tagName==='SELECT'&&['lookup'].includes(el.dataset.key))render()});document.querySelectorAll('[data-section]').forEach(el=>el.onclick=()=>{section=el.dataset.section;reviewing=false;render()});document.querySelectorAll('[data-help]').forEach(el=>{let open=()=>{let p=$('#popover');p.textContent=el.dataset.help;p.hidden=false;let r=el.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-340)+'px';p.style.top=(r.bottom+8)+'px';window.helpOpener=el};el.onclick=e=>{e.preventDefault();open()};el.onfocus=open;el.onmouseenter=open;el.onmouseleave=()=>{if(document.activeElement!==el)$('#popover').hidden=true}});if($('#source'))$('#source').oninput=e=>{raw=e.target.value;locked=true;$('#review').disabled=true};if($('#add'))$('#add').onclick=()=>{rows++;render()};if($('#remove'))$('#remove').onclick=()=>{rows--;render()};if($('#clearMapping'))$('#clearMapping').onclick=()=>{d.secret=d.key=d.parameter='';render()};if($('#pause'))$('#pause').onchange=e=>{d.pause=e.target.checked};if($('#generated'))$('#generated').onclick=()=>{$('#generatedNote').textContent='Generated resource lookup unavailable in isolated mock. Open related resource inspector in production; do not edit generated spec here.'}}
$('#kind').onchange=e=>{kind=e.target.value;init()};$('#intent').onchange=e=>{intent=e.target.value;init()};$('#yamlBtn').onclick=()=>{mode='yaml';localStorage.setItem('mock315-mode',mode);render()};$('#formBtn').onclick=()=>{mode='form';localStorage.setItem('mock315-mode',mode);render()};$('#back').onclick=()=>{reviewing=false;render()};$('#review').onclick=()=>{let required=auth()?['name',...(!d.provider?['parameter','secret','key']:[])]:['name',job()?'image':'target','queue','value','authRef'];let missing=required.find(k=>!d[k]);let bad=d.min!==''&&d.max!==''&&+d.min>+d.max;if(missing||bad||(d.fallback&&!d.failures)){section=missing==='name'||missing==='image'||missing==='target'?'Basics':auth()?'Parameter sources':missing?'Triggers':'Scaling';render();let e=document.createElement('div');e.className='error';e.setAttribute('role','alert');e.textContent=bad?'Minimum must not exceed maximum.':d.fallback&&!d.failures?'Set consecutive failures for fallback.':'Complete required fields before review.';$('#main').prepend(e);document.querySelector(`[data-key="${missing||'min'}"]`)?.focus();return}reviewing=true;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#popover').hidden){$('#popover').hidden=true;window.helpOpener?.focus();$('#popover').hidden=true;e.preventDefault()}});init();
const originalBind=bind;
bind=function(){originalBind();document.querySelectorAll('input[data-key]').forEach(el=>el.setAttribute('aria-label',el.name));if($('#add')){$('#add').textContent='Add trigger in YAML';$('#add').onclick=()=>{mode='yaml';render();$('#source').focus()}}};
mode=localStorage.getItem('mock315-mode')||'form';render();
</script></html>
