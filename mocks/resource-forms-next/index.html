listen('secret-type','change',e=>{const type=e.target.value,entered=mapEntries(['data']).length||mapEntries(['stringData']).length||secretRows.some(r=>r.value||r.key);if(entered){state.pendingType=type;render()}else changeSecretType(type)});listen('cancel-type-change','click',()=>{state.pendingType=null;render()});listen('confirm-type-change','click',()=>changeSecretType(state.pendingType));listen('add-secret','click',()=>{secretRows.push({key:'',old:null,value:'',existing:false});render()});document.querySelectorAll('[data-secret-index]').forEach(row=>{const i=+row.dataset.secretIndex,r=secretRows[i];row.querySelector('.secret-key')?.addEventListener('input',e=>{r.key=e.target.value;syncSecret(i)});row.querySelector('.secret-value')?.addEventListener('input',e=>{r.value=e.target.value;syncSecret(i)});row.querySelectorAll('[data-secret-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.secretAction;if(action==='reveal'){state.revealed.has(i)?state.revealed.delete(i):state.revealed.add(i);render();return}state.revealed.delete(i);if(action==='replace'){state.secretIntents[r.key]='replace';r.value='';syncSecret(i)}if(action==='cancel'){restoreSecret(r.key);r.value=''}if(action==='remove'){if(r.old){doc.deleteIn(['data',r.old]);doc.deleteIn(['stringData',r.old]);state.secretIntents[r.key]='remove';save()}if(!r.existing)secretRows.splice(i,1)}render()})});for(const[id,key]of [['tls-certificate-upload','tls.crt'],['tls-private-key-upload','tls.key']])listen(id,'change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{doc.deleteIn(['stringData',key]);patch(['data',key],encodeBytes(new Uint8Array(reader.result)));state.files[key]=file.name;state.secretIntents[key]=edit?'replace':'add';render()};reader.readAsArrayBuffer(file)});for(const[id,key]of [['docker-server','dockerServer'],['docker-username','dockerUsername'],['docker-password','dockerPassword'],['docker-email','dockerEmail']])listen(id,'input',e=>{state.draft[ listen('storage-class','change',e=>{state.draft.storageClass=e.target.value;e.target.value==='default'?remove(['spec','storageClassName']):patch(['spec','storageClassName'],e.target.value==='none'?'':e.target.value);render()});listen('capacity','input',e=>{state.draft.capacity=e.target.value;const err=capacityError();state.errors.capacity=err;const label=document.getElementById('capacity-error');if(label)label.textContent=err;if(!err)patch(['spec','resources','requests','storage'],e.target.value+state.draft.capacityUnit)});listen('capacity-unit','change',e=>{const d=state.draft,b=exactBytes(d.capacity,d.capacityUnit),newAmount=b===null?null:decimalRatio(b,units[e.target.value]);if(newAmount===null){e.target.value=d.capacityUnit;state.errors.capacity='Cannot switch units until the quantity is valid.'}else{d.capacity=newAmount;d.capacityUnit=e.target.value;const err=capacityError();state.errors.capacity=err;if(!err)patch(['spec','resources','requests','storage'],newAmount+d.capacityUnit)}render()});listen('volume-mode','change',e=>{state.draft.volumeMode=e.target.value;e.target.value==='default'?remove(['spec','volumeMode']):patch(['spec','volumeMode'],e.target.value);render()});document.querySelectorAll('[data-access-mode]').forEach(el=>el.onchange=()=>{state.draft.access=[...document.querySelectorAll('[data-access-mode]:checked')].map(x=>x.value);patch(['spec','accessModes'],state.draft.access);if(state.draft.access.includes('ReadWriteOncePod')&&state.draft.access.length>1){state.errors.access='ReadWriteOncePod cannot combine with other access modes.';render()}});
listen('yaml-editor','input',e=>{if(kind==='Secret')return;state.source=e.target.value;state.dirty=true;parse();const form=document.querySelector('[data-mode="form"]');form.disabled=!!(state.parseError||state.shapeError);const area=document.querySelector('.editor');let error=area.querySelector('.error');if(state.parseError||state.shapeError){if(!error){error=document.createElement('div');error.className='error';area.append(error)}error.textContent=(state.parseError||state.shapeError)+' Form unavailable; raw source is retained.'}else error?.remove();document.querySelector('#review').disabled=!!(state.parseError||state.shapeError)});

function validate(){state.errors={};const d=state.draft;if(!d.name)state.errors.name='Enter a resource name.';else if(!/^[a-z0-9](?:[-a-z0-9.]*[a-z0-9])?$/.test(d.name)||d.name.length>253)state.errors.name='Use a valid lowercase Kubernetes resource name.';if(kind==='Service'&&(!/^[a-z](?:[-a-z0-9]*[a-z0-9])?$/.test(d.name)||d.name.length>63))state.errors.name='Service names start with a letter and use lowercase letters, digits, or hyphens; 63 characters maximum.';if(!d.namespace)state.errors.namespace='Choose a namespace.';

if(kind==='Ingress'){if(!d.allHosts&&(!d.host||/[:/\s]/.test(d.host)))state.errors['route-host']='Enter a host without scheme, path, or port, or explicitly choose All hosts.';if(!routeRows.length||routeRows.some(r=>!r.service||!r.path||(r.type!=='ImplementationSpecific'&&!r.path.startsWith('/'))))state.errors.routes='Choose a Service and valid path for each route.';const keys=routeRows.map(r=>r.ri+'|'+r.path+'|'+r.type);if(new Set(keys).size!==keys.length)state.errors.routes='Duplicate host/path/type routes overlap. Change or remove the duplicate.';if(d.tlsEnabled&&!d.tlsSecret&&!edit)state.errors['tls-secret']='Choose an existing same-namespace TLS Secret.'}
if(kind==='ConfigMap'){const filled=entryRows.filter(r=>r.key);if(entryRows.some(r=>!r.key&&(r.old||r.value))||new Set(filled.map(r=>r.key)).size!==filled.length||filled.some(r=>!/^[A-Za-z0-9._-]+$/.test(r.key)))state.errors.entries='Use unique valid keys across data and binaryData. Name populated entries before review.';const cross=mapEntries(['data']).map(x=>x[0]).filter(k=>at(['binaryData',k]));if(cross.length)state.errors.entries='A key cannot exist in both data and binaryData.';if(entryRows.reduce((n,r)=>n+(r.kind==='binary'?Math.floor(r.value.length*3/4):new TextEncoder().encode(r.value).length),0)>1048576)state.errors.entries='Payload exceeds the 1 MiB resource data limit.'}

if(kind==='PersistentVolumeClaim'){const err=capacityError();if(err)state.errors.capacity=err;if(!d.access.length)state.errors.access='Choose at least one access mode.';if(d.access.includes('ReadWriteOncePod')&&d.access.length>1)state.errors.access='ReadWriteOncePod cannot combine with other access modes.'}return !Object.keys(state.errors).length}
