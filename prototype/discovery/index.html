<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native terminal discovery — interactive proposal</title>
<style>
:root{--surface:#101112;--raised:#1d1e20;--fg:#e6e6e7;--muted:#8b8d90;--border:#34363a;--focus:#6387ff}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--fg);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.caption{position:absolute;top:19px;left:30px;color:var(--muted);font-size:12px}.frame{position:relative;width:1215px;height:755px;margin:72px auto 0;background:url(settings-background.png) center/contain no-repeat}.picker{position:absolute;left:859px;top:401px;width:236px;background:var(--surface)}button{color:var(--fg);font:inherit;cursor:pointer}#trigger{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:4px 9px;background:var(--surface);border:1px solid var(--border);border-radius:5px;text-align:left}#trigger:focus-visible,[role=option]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}img{width:20px;height:20px;object-fit:contain}.arrow{margin-left:auto}#options{position:absolute;top:35px;width:100%;padding:4px;background:var(--raised);border:1px solid var(--border);border-radius:7px;box-shadow:0 6px 22px #0008;z-index:4}[role=option]{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:4px;background:transparent;text-align:left;padding:8px}[role=option]:hover{background:#34363b}#status{font-size:11px;color:var(--muted);margin-top:5px;min-height:15px}#save{position:absolute;left:930px;top:602px;height:30px;padding:4px 12px;border:1px solid var(--border);border-radius:5px;background:var(--raised)}#saved{position:absolute;left:290px;top:602px;padding:5px 0;background:var(--surface);min-width:230px}#notice{position:absolute;left:290px;top:548px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}
.frame{width:1171px;height:751px}#saved{left:290px;top:640px;height:32px;display:flex;align-items:center;padding:0}#save{left:990px;top:640px;width:104px}
</style>
<div class="caption">INTERACTIVE PROPOSAL · Actual v0.19 Settings backdrop · Device-read app names and icons · Only this picker and Save are interactive</div>
<main class="frame"><div class="picker"><button id="trigger" aria-label="Native Terminal Application" aria-haspopup="listbox" aria-expanded="false"><img id="selected-icon" alt=""><span id="selected-name"></span><span class="arrow">⌄</span></button><div id="options" role="listbox" aria-label="Installed supported terminal applications" hidden></div><div id="status" role="status"></div></div><div id="notice"></div><div id="saved">All changes saved</div><button id="save" hidden>Save Changes</button></main>
<script>
(async()=>{const device=await(await fetch('device-apps.json')).json();const missing=new URLSearchParams(location.search).has('missing');const apps=missing?device.filter(a=>a.id!=='iterm2'):device;let selected='iterm2',saved=selected;const trigger=document.querySelector('#trigger'),list=document.querySelector('#options');window.__mock={state:{apps:apps.map(a=>a.id),selected,saved,open:false},freezeAt(){}};
function render(){const app=apps.find(a=>a.id===selected);document.querySelector('#selected-name').textContent=app?.name||'Unavailable application (iterm2)';const icon=document.querySelector('#selected-icon');icon.hidden=!app;if(app)icon.src=app.iconDataURL;document.querySelector('#status').textContent=app?'Discovered on this Mac':'Selected application is no longer available';document.querySelector('#notice').textContent=missing?'Simulated removal: selection stays unchanged until another app is chosen.':'';document.querySelector('#save').hidden=selected===saved;document.querySelector('#saved').textContent=selected===saved?'All changes saved':'Unsaved changes';Object.assign(__mock.state,{selected,saved});}
function close(){list.hidden=true;trigger.setAttribute('aria-expanded','false');__mock.state.open=false;}
function open(){list.replaceChildren(...apps.map(app=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.setAttribute('aria-selected',String(app.id===selected));const icon=document.createElement('img');icon.alt='';icon.src=app.iconDataURL;const name=document.createElement('span');name.textContent=app.name;b.append(icon,name);b.onclick=()=>{selected=app.id;close();render();trigger.focus()};b.onkeydown=e=>{if(e.key==='Escape'){close();trigger.focus()}};return b}));list.hidden=false;trigger.setAttribute('aria-expanded','true');__mock.state.open=true;}
trigger.onclick=()=>list.hidden?open():close();trigger.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();open();list.querySelector('button')?.focus()}if(e.key==='Escape')close()};document.querySelector('#save').onclick=()=>{saved=selected;render()};document.addEventListener('click',e=>{if(!e.target.closest('.picker'))close()});render();})();
</script></html>
