const points=[
{id:'omniview/resource/sidebar/infopanel',label:'Resource detail panel',mode:'single',regs:[reg('kubernetes/sidebar/core::v1::Pod','Pod detail panel','kubernetes','legacy sidebar',{pluginId:'kubernetes',resourceKey:'core::v1::Pod'}),reg('kubernetes/sidebar/apps::v1::Deployment','Deployment detail panel','kubernetes','legacy sidebar',{pluginId:'kubernetes',resourceKey:'apps::v1::Deployment'}),reg('kubernetes/sidebar/core::v1::Service','Service detail panel','kubernetes','legacy sidebar',{pluginId:'kubernetes',resourceKey:'core::v1::Service'})]},
{id:'omniview/resource/sidebar/action',label:'Resource actions',mode:'multiple',regs:[]},
{id:'omniview/resource/sidebar/widget',label:'Sidebar widgets',mode:'multiple',regs:[]},
{id:'omniview/resource/drawer',label:'Resource drawer',mode:'single',regs:[reg('kubernetes/drawer/core::v1::Pod','Pod drawer','kubernetes','legacy drawer',{pluginId:'kubernetes',resourceKey:'core::v1::Pod'}),reg('kubernetes/drawer/apps::v1::Deployment','Deployment drawer','kubernetes','legacy drawer',{pluginId:'kubernetes',resourceKey:'apps::v1::Deployment'})]},
{id:'omniview/resource/icons',label:'Resource icons',mode:'multiple',regs:[reg('kubernetes/resource-icons','Kubernetes icons')]},

const pod=points[0].regs[0];const pending={id:'kubernetes/cluster-summary',label:'Cluster summary',plugin:'kubernetes',source:'modern',target:'kubernetes/cluster/summary'};
const state={point:points[0].id,contribution:pod.id,plugin:'all',query:'',issuesOnly:false,collapsed:new Set(points.filter(p=>p.id!==points[0].id).map(p=>p.id)),tab:'registration',problem:'crash',pending:false,paused:false,resource:'core::v1::Pod',evaluated:false};
function filteredRegs(p){return p.regs.filter(r=>(state.plugin==='all'||r.plugin===state.plugin)&&(!state.issuesOnly||r.id===pod.id)&&(!state.query||[p.id,p.label,r.id,r.label,r.plugin].join(' ').toLowerCase().includes(state.query.toLowerCase())))}

function selectPoint(id,contribution){state.point=id;state.pending=false;id.split('/').forEach((_,i,a)=>state.collapsed.delete(a.slice(0,i+1).join('/')));const p=point();state.contribution=contribution||filteredRegs(p)[0]?.id||null;state.evaluated=false;state.tab='registration';if(state.contribution===pod.id)state.problem='crash'}

function shell(focus){reconcile();const ps=visiblePoints();const regs=ps.reduce((n,p)=>n+filteredRegs(p).length,0);document.querySelector('#main').innerHTML=`<div class="titlebar"><span><span class="traffic">● ● ●</span>Omniview</span><span class="muted">extension-registry-design — Developer workspace</span><span class="muted">⌘ K</span></div><div class="app"><div class="rail"><span>${icon('home')}</span><span>${icon('plug')}</span><span class="active">${icon('tool')}</span><span style="flex:1"></span><span>${icon('settings')}</span></div><main><div class="tabbar"><div class="app-tab">${icon('tool','accent')}Extension Inspector <span class="muted">×</span></div><span class="tabtrail">Developer Tools / Extensions</span></div><div class="toolbar">${icon('search','muted')}<input id="search" aria-label="Search extension registry" placeholder="Filter points, contributions…" value="${esc(state.query)}"><span class="separator"></span><label for="plugin">Plugin</label><select id="plugin" aria-label="Plugin filter"><option value="all">All contributors</option><option value="kubernetes" ${state.plugin==='kubernetes'?'selected':''}>Kubernetes</option><option value="core" ${state.plugin==='core'?'selected':''}>Core</option></select><button id="issues" class="${state.issuesOnly?'outline amber':''}" aria-pressed="${state.issuesOnly}">${icon('warn',state.issuesOnly?'amber':'muted')}Issues only</button><span class="push"></span><span class="live">● ${state.paused?'Paused #42':'Live'}</span><button id="pause" title="Pause snapshot">${state.paused?'Resume':'Pause'}</button><button id="export" class="outline">Export…</button></div><div class="workspace"><section class="explorer"><div class="panehead"><span>Extension points</span><button id="collapse" title="Collapse all namespaces" aria-label="Collapse all namespaces">${icon('chevrons')}</button></div><div class="tree" role="tree" aria-label="Extension point namespaces">${tree()}</div><div class="treefoot">${ps.length} points · ${regs} registrations${state.plugin!=='all'?' · '+esc(state.plugin):''}</div></section><section class="editor">${editor()}</section><section class="inspector"><div class="panehead"><span>${state.pending?'Registration diagnostic':'Contribution inspector'}</span><span class="mono">#42</span></div>${inspector()}</section><section class="problems">${problems()}</section></div></main></div><div class="foot"><span>● DEV · extension-registry-design <span class="muted">　|　Snapshot #42 · 14:32:08${state.paused?' · paused':''}</span></span><span>Synthetic data · design mock　|　Registration ≠ successful render</span></div>`;bind();if(focus){const el=document.querySelector(focus);el?.focus()}const first=document.querySelector('.tree [role=treeitem][aria-selected=true]')||document.querySelector('.tree [role=treeitem]');if(first)first.tabIndex=0}
function editor(){if(state.pending)return `<div class="crumb"><span>Pending</span> / <strong>kubernetes</strong> / cluster-summary</div><div class="pointbar">${icon('warn','amber')}<strong>Target point not registered</strong></div><div class="codewrap"><div class="codehead"><span>QUEUED REGISTRATION</span><span>modern export</span></div>${code({id:pending.id,plugin:pending.plugin,extensionPointId:pending.target,label:pending.label,value:'[Function: ClusterSummary]'})}<div class="notice warn">Plugin module loaded. The registration remains queued until its requested point exists; it is not part of registry inventory.</div><div class="minihead">Next checks</div><p style="line-height:1.8;color:var(--muted)">Check the target ID and extension-point provider. Loading a module does not prove its contributions registered.</p></div>`;if(!visiblePoints().length)return '<div class="empty">No matching points.<br>Clear the filter to inspect registrations.</div>';const p=point();const r=current();const rows=filteredRegs(p);return `<div class="crumb">${p.id.split('/').map((s,i,a)=>i===a.length-1?`<strong>${s}</strong>`:`<span>${s}</span><span>›</span>`).join('')}</div><div class="pointbar"><strong>${p.label}</strong><span class="tag">${p.mode}</span><span class="muted">Owner: core</span><span class="muted">v7</span></div><div class="sectionhead">Contributions <span class="muted">${rows.length}${state.plugin!=='all'?' / '+p.regs.length:''}</span><span class="push muted">listAll() · includes quarantined</span></div>${rows.length?`<table class="contribs"><thead><tr><th>Registration ID</th><th>Plugin</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr class="data ${r.id===state.contribution?'selected':''}" tabindex="0" data-select="${r.id}" aria-label="${esc(r.label)}"><td><span class="id" title="${esc(r.id)}">${esc(r.id)}</span></td><td>${esc(r.plugin)}</td><td class="${r.id===pod.id?'red':'muted'}">${r.id===pod.id?'⊗ Quarantined':'Registered'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No registrations. An empty point is not an error.</div>'}<div class="table-note">${p.mode==='single'?'Single mode chooses one matching registration. Inventory shows all.':'Values are descriptors, not component previews.'}</div><div class="editor-tabs"><button data-tab="registration" class="${state.tab==='registration'?'active':''}">Registration</button><button data-tab="lookup" class="${state.tab==='lookup'?'active':''}">Context lookup</button></div>${state.tab==='lookup'?lookup():`<div class="codewrap"><div class="codehead"><span>${r?esc(r.id):'POINT METADATA'}</span><span>read-only descriptor</span></div>${code(r?{id:r.id,label:r.label,plugin:r.plugin,source:r.source,extensionPointId:p.id,value:r.plugin==='core'?'[Search descriptor]':'[Function: '+r.label.replace(/\s/g,'')+']',meta:r.meta}:{id:p.id,owner:'core',mode:p.mode,version:7,registrations:0})}<div class="notice">${r?'Descriptor inspection never mounts the component.':'No registered values to inspect.'} Matcher execution requires explicit context lookup.</div></div>`}`}
function code(value){return `<pre class="code linenumbers">${esc(JSON.stringify(value,null,2)).split('\n').map(line=>`<span class="line">${line.replace(/(&quot;[^&]*?&quot;)(:)/g,'<span class="key">$1</span>$2')}</span>`).join('')}</pre>`}
function inspector(){const r=current();if(!r)return '<div class="empty">Select a contribution to inspect its metadata and captured evidence.</div>';if(state.pending)return `<div class="inspectbody"><h2 class="inspect-title">Cluster summary</h2><div class="longid">${pending.id}</div><dl class="kv"><div><dt>State</dt><dd class="amber">Pending target point</dd></div><div><dt>Plugin</dt><dd>kubernetes</dd></div><div><dt>Module</dt><dd>Loaded</dd></div><div><dt>Target</dt><dd class="mono">${pending.target}</dd></div><div><dt>Source</dt><dd>Modern export</dd></div><div><dt>Render</dt><dd class="muted">Not observed</dd></div></dl><div class="notice warn">This contribution is queued in PluginService, not registered in an extension-point store.</div><div class="minihead">Evidence coverage</div><p class="muted" style="font-size:11px;line-height:1.7">Registration state is observed. No matcher evaluation or successful rendering is claimed.</p></div>`;const crash=r.id===pod.id;return `<div class="inspectbody"><h2 class="inspect-title">${esc(r.label)}</h2><div class="longid">${esc(r.id)}</div><dl class="kv"><div><dt>State</dt><dd class="${crash?'red':'muted'}">${crash?'Quarantined':'Registered'}</dd></div><div><dt>Plugin</dt><dd>${esc(r.plugin)} <span class="muted">${r.plugin==='core'?'· built-in':'· module loaded'}</span></dd></div><div><dt>Source</dt><dd>${esc(r.source)}</dd></div><div><dt>Render</dt><dd class="muted">${crash?'Excluded by quarantine':'Not observed'}</dd></div><div><dt>Crashes</dt><dd>${crash?'3 captured · threshold 3':'None captured'}</dd></div></dl>${crash?`<div class="minihead">Latest exception <span class="muted">· 14:31:56</span></div><div class="errorbox"><span class="red">TypeError: Cannot read properties
of undefined (reading 'containers')</span>

at PodSidebar (plugin module)
at ExtensionPointRenderer
   (host boundary)</div><dl class="kv"><div><dt>Boundary</dt><dd class="mono">extension-contribution</dd></div><div><dt>Resource</dt><dd class="muted">Not captured</dd></div><div><dt>Retention</dt><dd>10 records / contribution</dd></div></dl><div class="actionrow"><button class="outline" id="copy">Copy diagnostic</button><button class="outline" id="reenable">Re-enable…</button></div><div class="notice error">Registered, but excluded from generic rendering. Reload and re-enable may clear crash evidence.</div>`:`<div class="minihead">Captured evidence</div><div class="notice">No captured crashes does not prove a successful render. This tool does not execute the value to inspect it.</div>`}<div class="minihead">Metadata</div><pre class="code" style="font-size:10px">${esc(JSON.stringify(r.meta,null,2))}</pre><p class="muted" style="font-size:10px;line-height:1.6">Synthetic fixture and exception. No real plugin is running in this mock.</p></div>`}
function lookup(){const supported=point().id===points[0].id;if(!supported)return '<div class="empty">No context adapter in this mock for this point.<br>Production must disclose unsupported context types.</div>';const isPod=state.resource==='core::v1::Pod';return `<div class="lookup"><div class="lookupbar"><label>Resource context</label><select id="resource" aria-label="Resource context"><option value="core::v1::Pod" ${isPod?'selected':''}>core::v1::Pod</option><option value="apps::v1::Deployment" ${!isPod?'selected':''}>apps::v1::Deployment</option></select><button class="primary" id="run">Run lookup</button></div><div class="longid">{ pluginId: "kubernetes", resourceKey: "${state.resource}" }</div><div class="notice warn">Explicit lookup may execute plugin matcher code. It does not mount contributed components.</div>${state.evaluated?`<div class="result"><div><span>1　Inventory · listAll()</span><span>3 registrations</span></div><div><span>2　Selection · list(context)</span><span>1 returned</span></div><div><span>3　Generic renderer eligibility</span><span class="${isPod?'red':'green'}">${isPod?'Quarantined':'Eligible, unproven'}</span></div><p class="mono">${isPod?pod.id:points[0].regs[1].id}</p><p>${isPod?'Matching succeeds; quarantine explains exclusion.':'No quarantine recorded. Successful rendering remains unknown.'} Per-candidate rejection reasons are unavailable.</p></div>`:'<div class="empty">No lookup run. Registry inspection remains passive.</div>'}</div>`}
function problems(){const showCrash=state.plugin!=='core'&&(!state.query||[pod.id,pod.label,points[0].id].join(' ').toLowerCase().includes(state.query.toLowerCase()));const showPending=pendingMatches();const total=+showCrash+ +showPending;return `<div class="problemshead"><button class="active">Problems <span class="tag">${total}</span></button><span class="muted" style="font-size:10px">${state.plugin==='all'?'All contributors':esc(state.plugin)} · session evidence</span><span class="push muted" style="font-size:10px">Bounded history · no success instrumentation</span></div>${showCrash?`<button class="problem ${state.problem==='crash'&&!state.pending?'selected':''}" data-problem="crash">${icon('error','red')}<span><span class="red">Contribution quarantined</span> <span class="mono muted">— ${pod.id}</span></span><span>kubernetes</span><span>render · 3</span></button>`:''}${showPending?`<button class="problem ${state.pending?'selected':''}" data-problem="pending">${icon('warn','amber')}<span><span class="amber">Target point not registered</span> <span class="mono muted">— ${pending.target}</span></span><span>kubernetes</span><span>register</span></button>`:''}${total?'<div class="problem-message">Select a problem to reveal its contribution and diagnostic without leaving the tree. Export before recovery.</div>':'<div class="empty">No captured problems match the current filter. This is not proof of successful rendering.</div>'}`}
function toast(s){document.querySelector('#layer').innerHTML=`<div role="status" class="toast">${s}</div>`;setTimeout(()=>document.querySelector('#layer').innerHTML='',2500)}
function recovery(){const layer=document.querySelector('#layer');layer.innerHTML='<div class="dialogback"><section class="dialog" role="dialog" aria-modal="true" aria-label="Re-enable contribution"><h2>Re-enable contribution?</h2><p>This clears crash evidence. Export the snapshot before retrying.</p><p>Mock only. No real plugin action runs.</p><div class="actionrow"><button class="outline" id="cancel">Cancel</button><button class="primary" id="confirm">Simulate re-enable</button></div></section></div>';document.querySelector('#cancel').onclick=closeDialog;document.querySelector('#confirm').onclick=()=>toast('Simulation only · no plugin state changed');document.querySelector('#cancel').focus()}
function closeDialog(){document.querySelector('#layer').innerHTML='';document.querySelector('#reenable')?.focus()}
function bind(){document.querySelector('#main').onclick=e=>{const toggle=e.target.closest('[data-toggle]');if(toggle){const path=toggle.dataset.toggle;state.collapsed.has(path)?state.collapsed.delete(path):state.collapsed.add(path);shell();return}const node=e.target.closest('[data-point]');if(node){selectPoint(node.dataset.point,node.dataset.reg);shell();return}const reg=e.target.closest('[data-select]');if(reg){state.contribution=reg.dataset.select;shell();return}const pend=e.target.closest('[data-pending]');if(pend){state.pending=true;state.problem='pending';shell();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;shell();return}if(b.dataset.problem){state.problem=b.dataset.problem;if(state.problem==='pending')state.pending=true;else{selectPoint(points[0].id,pod.id);state.collapsed.delete('omniview');state.collapsed.delete('omniview/resource');state.collapsed.delete('omniview/resource/sidebar');state.collapsed.delete(points[0].id)}shell();return}if(b.id==='issues'){state.issuesOnly=!state.issuesOnly;shell();return}if(b.id==='pause'){state.paused=!state.paused;shell();return}if(b.id==='collapse'){state.collapsed=state.collapsed.has('omniview')?new Set():new Set(points.flatMap(p=>p.id.split('/').map((_,i,a)=>a.slice(0,i+1).join('/'))));shell();return}if(b.id==='run'){state.resource=document.querySelector('#resource').value;state.evaluated=true;shell();return}if(b.id==='reenable'){recovery();return}if(b.id==='copy'){navigator.clipboard?.writeText('Synthetic diagnostic: '+pod.id+'; quarantined; 3 captured crashes.');toast('Synthetic diagnostic copied');return}if(b.id==='export'){const payload={schemaVersion:1,synthetic:true,capture:42,plugin:state.plugin,points:visiblePoints().map(p=>({id:p.id,mode:p.mode,contributions:filteredRegs(p).map(r=>({id:r.id,plugin:r.plugin,source:r.source}))})),coverage:'Render success not observed; values not serialized'};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='synthetic-extension-snapshot.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Synthetic safe-descriptor snapshot exported')}};
document.querySelector('#plugin').onchange=e=>{state.plugin=e.target.value;shell()};document.querySelector('#search').oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;shell('#search');document.querySelector('#search').setSelectionRange(pos,pos)};
const treeEl=document.querySelector('.tree');treeEl.onkeydown=e=>{const items=[...treeEl.querySelectorAll('[role=treeitem]')];const el=e.target.closest('[role=treeitem]');if(!el)return;const i=items.indexOf(el);let target;if(e.key==='ArrowDown')target=items[Math.min(i+1,items.length-1)];if(e.key==='ArrowUp')target=items[Math.max(i-1,0)];if(e.key==='Home')target=items[0];if(e.key==='End')target=items.at(-1);if(target){e.preventDefault();items.forEach(n=>n.tabIndex=-1);target.tabIndex=0;target.focus();return}if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();document.querySelector(`[data-reg="${el.dataset.reg}"]`)?.focus();return}if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&el.dataset.path&&el.hasAttribute('aria-expanded')){e.preventDefault();if(e.key==='ArrowLeft')state.collapsed.add(el.dataset.path);else state.collapsed.delete(el.dataset.path);const path=el.dataset.path;shell();document.querySelector(`[data-path="${path}"]`)?.focus()}};document.querySelectorAll('[data-select]').forEach(row=>row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click()}})}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog()}if((e.metaKey||e.ctrlKey)&&e.key==='f'){e.preventDefault();document.querySelector('#search').focus()}if(e.key==='Tab'&&document.querySelector('[role=dialog]')){const a=[...document.querySelectorAll('[role=dialog] button')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
window.__mock={state,freezeAt(ms){for(const a of document.getAnimations()){a.pause();a.currentTime=ms}}};shell();
