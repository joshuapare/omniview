<style>
:root{color-scheme:dark;--bg:#0e0f11;--surface:#141517;--raised:#1b1d21;--border:#30333a;--fg:#d6d8de;--muted:#949aa6;--accent:#89a7ee;--green:#90c6a3;--amber:#d8b276;--red:#e18f91;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:1px solid transparent;border-radius:5px;padding:7px 10px}button:hover{background:var(--raised)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.outline,select{border:1px solid var(--border);background:var(--surface)}button.primary{background:var(--accent);color:#111827}header{height:38px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px}.traffic{letter-spacing:5px;color:var(--muted)}.shell{display:flex;height:calc(100vh - 62px)}aside{width:48px;background:var(--surface);border-right:1px solid var(--border);display:flex;align-items:center;flex-direction:column;gap:12px;padding-top:12px}aside button{font-size:19px;padding:5px}.rail-active{color:var(--accent);border-left:2px solid var(--accent)}main{flex:1;min-width:0}.tabbar{height:38px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:var(--surface)}.tab{padding:11px 20px;border-right:1px solid var(--border);border-top:2px solid var(--accent);font-size:12px}.workspace{margin-left:auto;margin-right:18px;color:var(--muted);font-size:11px}.heading{padding:25px 28px 17px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}h1{margin:0 0 8px;font-size:23px;font-weight:600;letter-spacing:-.5px}h2{font-size:17px;font-weight:600;margin:0 0 8px}h3{font-size:13px;margin:0 0 13px;font-weight:600}p{color:var(--muted);margin:0;line-height:1.6}.actions{display:flex;gap:8px;align-items:center}.live{color:var(--green);font-size:12px;padding:0 10px}.stats{display:flex;gap:1px;margin:0 28px 18px;border:1px solid var(--border);border-radius:7px;background:var(--border);overflow:hidden}.stat{flex:1;background:var(--surface);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.stat span{color:var(--muted);font-size:12px}.stat strong{font-size:23px;font-weight:500}.amber{color:var(--amber)}.red{color:var(--red)}.green{color:var(--green)}.nav{margin:0 28px;display:flex;gap:22px;border-bottom:1px solid var(--border)}.nav button{border-radius:0;padding:9px 0 12px;color:var(--muted)}.nav button.active{color:var(--fg);border-bottom:2px solid var(--accent)}.count{padding:1px 5px;background:var(--raised);font-size:11px;border-radius:4px;margin-left:5px}.toolbar{display:flex;align-items:center;gap:10px;padding:16px 28px}input{background:var(--surface);border:1px solid var(--border);padding:8px 12px;border-radius:5px;width:330px}select{padding:7px;border-radius:5px}.hint{margin-left:auto;color:var(--muted);font-size:11px}.split{display:grid;grid-template-columns:minmax(440px,1.15fr) minmax(420px,1fr);margin:0 28px;border:1px solid var(--border);border-radius:7px;overflow:hidden;height:calc(100vh - 371px);min-height:390px}.list{overflow:auto;border-right:1px solid var(--border)}.tablehead{display:grid;grid-template-columns:1fr 90px 64px;padding:11px 15px;background:var(--surface);font-size:10px;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}.row{display:grid;grid-template-columns:1fr 90px 64px;align-items:center;width:100%;text-align:left;padding:15px;border-bottom:1px solid var(--border);border-radius:0;min-height:68px}.row.selected{background:color-mix(in srgb,var(--accent) 11%,var(--bg));box-shadow:inset 2px 0 var(--accent)}.mono{font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.row small{display:block;color:var(--muted);margin-top:6px;font-size:11px}.pill{display:inline-block;border:1px solid var(--border);padding:3px 7px;border-radius:4px;font-size:10px;width:fit-content}.pill.good{color:var(--green);border-color:#364d3c}.pill.warn{color:var(--amber);border-color:#514636}.pill.bad{color:var(--red);border-color:#54393c}.detail{background:var(--surface);overflow:auto;padding:22px}.detail-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.identifier{color:var(--muted);line-height:1.6;overflow-wrap:anywhere}.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:17px 0;margin:18px 0}.meta dt{font-size:10px;color:var(--muted);margin-bottom:7px}.meta dd{margin:0;font-size:12px}.callout{border:1px solid var(--border);border-left:2px solid var(--accent);padding:12px 14px;border-radius:5px;margin:16px 0;font-size:12px;line-height:1.6;color:var(--muted)}.callout.warning{border-left-color:var(--amber)}.callout.error{border-left-color:var(--red)}.contribution{border:1px solid var(--border);padding:13px;border-radius:5px;margin-top:9px}.contribution strong{font-size:12px}.contribution .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.subnav{display:flex;gap:8px;margin:18px 0 12px}.subnav button{font-size:11px;color:var(--muted);padding:6px 10px}.subnav .active{background:var(--raised);color:var(--fg)}pre{font:11px/1.8 ui-monospace,monospace;margin:0;padding:13px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.footnote{padding:11px 28px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between}footer{height:24px;background:var(--surface);border-top:1px solid var(--border);font-size:10px;padding:5px 14px;display:flex;justify-content:space-between}.empty{padding:38px;text-align:center;color:var(--muted)}.event{display:grid;grid-template-columns:65px 1fr;gap:12px;border-bottom:1px solid var(--border);padding:14px 0;font-size:12px}.event time{color:var(--muted);font:10px ui-monospace,monospace}.event p{font-size:11px;margin-top:5px}.banner{color:var(--amber);font-size:11px}.wide{margin:0 28px}.contextbar{display:flex;gap:10px;align-items:end;margin-bottom:16px}.contextbar label{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:11px}.contextbar select{min-width:150px}.result{border:1px solid var(--border);border-radius:7px;padding:22px;background:var(--surface)}.step{display:grid;grid-template-columns:28px 1fr 130px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)}.step:last-child{border:0}.step p{font-size:11px}.n{border:1px solid var(--border);border-radius:50%;width:19px;height:19px;text-align:center;padding-top:2px;font-size:10px}.note{margin-top:15px}.toast{position:fixed;bottom:45px;right:28px;background:var(--raised);border:1px solid var(--border);padding:14px;border-radius:6px}.light{--bg:#fafafa;--surface:#f3f4f6;--raised:#e8eaef;--border:#d4d7dd;--fg:#222730;--muted:#616b79;--accent:#426ac0;--green:#35764b;--amber:#956a20;--red:#b3474b;color-scheme:light}@media(max-width:1100px){.split{grid-template-columns:1fr 1fr}.heading{padding-top:18px}.stats{margin-bottom:12px}.hint{display:none}}
/* Keep both panes and evidence footer within the application viewport. */
.split{height:calc(100vh - 448px);min-height:350px}
/* Sampled from the live host's Void theme. Light values remain illustrative. */
:root{--raised:#1a1b1e;--border:#2e3035;--fg:#e6e7ea;--muted:#898c94;--accent:#6b9bff;font-family:-apple-system,BlinkMacSystemFont,"Segoe WPC","Segoe UI",sans-serif}
body{color:var(--fg)}

<body><div id="main"></div><div id="layer"></div><script>
'use strict';
const params=new URLSearchParams(location.search);if(params.get('theme')==='light')document.body.classList.add('light');
const points=[['omniview/resource/sidebar/infopanel','Resource detail panel','single',3],['omniview/resource/drawer','Resource drawer','single',2],['omniview/home/card','Homepage cards','multiple',2],['omniview/global-search','Global search providers','multiple',3],['omniview/theme','Theme contributions','multiple',1],['omniview/resource/icons','Resource icons','multiple',1],['omniview/dashboard/widget','Dashboard widgets','multiple',0],['omniview/dashboard/tab','Dashboard tabs','multiple',0],['omniview/logs/filters','Log filters','multiple',0],['omniview/resource/sidebar/action','Resource actions','multiple',0],['omniview/resource/sidebar/widget','Sidebar widgets','multiple',0]];
const state={view:'points',selected:0,search:'',owner:'all',sub:'registrations',paused:false,issue:'pending',context:'Pod',evaluated:false};
const synthetic='Synthetic plugin data · design proposal';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shell(){document.querySelector('#main').innerHTML=`<header><span><span class="traffic">● ● ●</span>　 Omniview</span><span>extension-registry-design　 /　 Developer workspace</span><span>⌘ K</span></header><div class="shell"><aside><button aria-label="Home">⌂</button><button aria-label="Plugins">◇</button><button class="rail-active" aria-label="Developer Tools">⌘</button><div style="flex:1"></div><button aria-label="Settings">⚙</button></aside><main><div class="tabbar"><div class="tab">⌘　 Extension Inspector　 ×</div><span class="workspace">Developer Tools / Extensions</span></div><div class="heading"><div><div class="eyebrow">Developer Tools</div><h1>Extension Inspector</h1><p>See what registered, where it resolves, and what needs attention.</p></div><div class="actions"><span class="live">● ${state.paused?'Snapshot paused':'Live snapshot'}</span><button class="outline" id="pause">${state.paused?'Resume':'Pause'}</button><button class="outline" id="export">Export snapshot ↗</button></div></div><div class="stats"><div class="stat"><span>Extension points</span><strong>11</strong></div><div class="stat"><span>Registered contributions</span><strong>12</strong></div><div class="stat"><span>Contributors incl. core</span><strong>2</strong></div><div class="stat"><span>Pending target</span><strong class="amber">1</strong></div><div class="stat"><span>Quarantined</span><strong class="red">1</strong></div></div><nav class="nav">${[['points','Extension points','11'],['plugins','By plugin','2'],['issues','Issues','2'],['context','Context lookup','']].map(([id,label,n])=>`<button data-view="${id}" class="${state.view===id?'active':''}">${label}${n?`<span class="count">${n}</span>`:''}</button>`).join('')}</nav><div id="content"></div></main></div><footer><span>●　Development　 /　 extension-registry-design</span><span>${synthetic}　 •　 No plugin code executes in this mock</span></footer>`;renderContent();bind();}
function renderContent(){const c=document.querySelector('#content');if(state.view==='context'){c.innerHTML=context();return}c.innerHTML=`<div class="toolbar"><input id="search" aria-label="Search registry" placeholder="Search IDs, labels, plugins…" value="${esc(state.search)}"><select id="owner" aria-label="Filter owner"><option value="all">All contributors</option><option value="kubernetes" ${state.owner==='kubernetes'?'selected':''}>Kubernetes</option><option value="core" ${state.owner==='core'?'selected':''}>Core</option></select><span class="hint">${state.view==='issues'?'Session evidence only':'Registration ≠ successful render'}</span></div><div class="split"><div class="list">${list()}</div><section class="detail">${detail()}</section></div><div class="footnote"><span>Snapshot #42 · captured 14:32:08 · ${state.paused?'paused':'live updates enabled'}</span><span>No captured errors does not prove successful rendering.</span></div>`;}
function list(){if(state.view==='plugins')return `<div class="tablehead"><span>Contributor</span><span>Registered</span><span>Issues</span></div><button class="row selected" data-plugin="kubernetes"><span>Kubernetes<small class="mono">kubernetes · 0.7.4 · module loaded</small></span><span>9</span><span class="amber">2</span></button><button class="row" data-plugin="core"><span>Core<small>Built-in contributions</small></span><span>3</span><span>—</span></button>`;if(state.view==='issues')return `<div class="tablehead"><span>Diagnostic</span><span>Stage</span><span>Count</span></div><button class="row ${state.issue==='pending'?'selected':''}" data-issue="pending"><span><span class="amber">Pending target point</span><small class="mono">kubernetes/cluster-summary</small></span><span>Register</span><span>1</span></button><button class="row ${state.issue==='crash'?'selected':''}" data-issue="crash"><span><span class="red">Contribution quarantined</span><small class="mono">kubernetes/sidebar/core::v1::Pod</small></span><span>Render</span><span>3</span></button>`;const filtered=points.map((p,i)=>({p,i})).filter(({p})=>(p.join(' ').toLowerCase().includes(state.search.toLowerCase()))&&(state.owner!=='core'||p[0]==='omniview/global-search')&&(state.owner!=='kubernetes'||['omniview/resource/sidebar/infopanel','omniview/resource/drawer','omniview/home/card','omniview/theme','omniview/resource/icons'].includes(p[0])));return `<div class="tablehead"><span>Point / owner</span><span>Mode</span><span>All</span></div>`+(filtered.length?filtered.map(({p,i})=>`<button class="row ${i===state.selected?'selected':''}" data-point="${i}"><span class="mono">${p[0]}<small>${p[1]}　·　Core-owned point</small></span><span class="pill">${p[2]}</span><span>${p[3]}</span></button>`).join(''):'<div class="empty">No extension points match.<br><br>Change search or contributor filter.</div>');}
function detail(){if(state.view==='issues')return issue();if(state.view==='plugins')return plugin();const p=points[state.selected];return `<div class="eyebrow">Extension point</div><div class="detail-title"><h2>${p[1]}</h2><span class="pill">${p[2]}</span></div><div class="identifier mono">${p[0]}</div><dl class="meta"><div><dt>POINT OWNER</dt><dd>Core</dd></div><div><dt>STORE VERSION</dt><dd>7</dd></div><div><dt>ALL REGISTRATIONS</dt><dd>${p[3]}</dd></div><div><dt>CONTEXT</dt><dd>Not evaluated</dd></div></dl><div class="subnav"><button class="${state.sub==='registrations'?'active':''}" data-sub="registrations">Registrations</button><button class="${state.sub==='metadata'?'active':''}" data-sub="metadata">Metadata</button></div>${state.sub==='metadata'?`<pre>${esc(JSON.stringify({id:p[0],pluginId:null,mode:p[2],version:7,contributions:p[3]},null,2))}</pre><div class="callout">Values are described, never rendered. Functions and components are not executed by inspection.</div>`:p[3]===0?'<div class="empty">No registrations yet.<br><br>An empty point is not an error.</div>':state.selected===0?`<p style="font-size:11px">All registrations, including non-selected and quarantined contributions.</p><div class="contribution"><div class="top"><strong>Pod detail panel</strong><span class="pill bad">Quarantined</span></div><div class="mono identifier">kubernetes/sidebar/core::v1::Pod</div><p style="font-size:11px;margin-top:7px">Kubernetes · legacy sidebar · 3 captured crashes</p><button data-crash style="color:var(--accent);padding-left:0;margin-top:7px">Inspect error →</button></div><div class="contribution"><div class="top"><strong>Deployment detail panel</strong><span class="pill good">Registered</span></div><div class="mono identifier">kubernetes/sidebar/apps::v1::Deployment</div><p style="font-size:11px;margin-top:7px">Kubernetes · legacy sidebar · No captured crashes</p></div><div class="contribution"><div class="top"><strong>Service detail panel</strong><span class="pill good">Registered</span></div><div class="mono identifier">kubernetes/sidebar/core::v1::Service</div><p style="font-size:11px;margin-top:7px">Kubernetes · legacy sidebar · No captured crashes</p></div><div class="callout">Single mode selects one matching registration. Use context lookup to inspect the returned match; registry membership alone proves no rendering.</div>`:state.selected===3?`<div class="contribution"><strong>Home</strong><p class="mono">core/global-search/catalogue/0</p></div><div class="contribution"><strong>Plugins</strong><p class="mono">core/global-search/catalogue/1</p></div><div class="contribution"><strong>Extensions</strong><p class="mono">core/global-search/catalogue/2</p></div><div class="callout">Core search descriptors; these values are not components.</div>`:`<div class="callout">${p[3]} illustrative registrations. Inspect plugin ownership and value descriptors here; use context lookup for resolution.</div>`}`;}
function plugin(){return `<div class="eyebrow">Contributor</div><div class="detail-title"><h2>${state.owner==='core'?'Core':'Kubernetes'}</h2><span class="pill good">${state.owner==='core'?'Built-in':'Module loaded'}</span></div><p class="mono">${state.owner==='core'?'core':'kubernetes · 0.7.4'}</p><dl class="meta"><div><dt>REGISTERED</dt><dd>${state.owner==='core'?'3':'9'} contributions</dd></div><div><dt>PENDING TARGET</dt><dd>${state.owner==='core'?'0':'1'} contribution</dd></div><div><dt>MODULE STATE</dt><dd>Loaded, not render proof</dd></div><div><dt>REGISTRATION SOURCE</dt><dd>Modern + legacy adapters</dd></div></dl><h3>Registration coverage</h3><div class="contribution"><div class="top"><strong>Resource detail panel</strong><span>3 registered</span></div><p>Includes 1 quarantined contribution</p></div><div class="contribution"><div class="top"><strong>Resource drawer</strong><span>2 registered</span></div><p>Context-dependent, single selection</p></div><div class="callout warning">One registration awaits an unknown target point. Module loading can succeed while a contribution remains pending.</div><button class="outline" data-pending>Inspect pending registration →</button><div class="callout">Plugin counts refer to contributors, not extension-point ownership. Core owns the target points above.</div>`;}
function issue(){if(state.issue==='pending')return `<div class="eyebrow">Registration diagnostic</div><div class="detail-title"><h2>Pending target point</h2><span class="pill warn">Needs attention</span></div><p class="mono">kubernetes/cluster-summary</p><div class="callout warning">Plugin module loaded, but the target extension point does not exist. Contribution is queued, not registered.</div><dl class="meta"><div><dt>CONTRIBUTOR</dt><dd>Kubernetes</dd></div><div><dt>STAGE</dt><dd>Registration</dd></div><div style="grid-column:1/-1"><dt>REQUESTED TARGET</dt><dd class="mono">kubernetes/cluster/summary</dd></div><div><dt>QUEUE STATE</dt><dd>Pending target point</dd></div><div><dt>RENDER STATE</dt><dd>Not observed</dd></div></dl><h3>What to check</h3><p>Confirm the target ID and point owner. Ensure its provider registers the point before expecting this contribution to resolve.</p><div class="subnav"><button class="active">Registration descriptor</button></div><pre>${esc(JSON.stringify({id:'kubernetes/cluster-summary',plugin:'kubernetes',extensionPointId:'kubernetes/cluster/summary',source:'modern',value:'[Function: ClusterSummary]'},null,2))}</pre><p class="note" style="font-size:11px">Proposed diagnostic text derives from the pending queue. No matcher or render execution occurs.</p>`;return `<div class="eyebrow">Render diagnostic</div><div class="detail-title"><h2>Pod detail panel</h2><span class="pill bad">Quarantined</span></div><p class="mono">kubernetes/sidebar/core::v1::Pod</p><div class="callout error">3 captured crashes reached the configured quarantine threshold. Contribution remains registered but generic renderer excludes it.</div><dl class="meta"><div><dt>CONTRIBUTOR</dt><dd>Kubernetes</dd></div><div><dt>BOUNDARY</dt><dd>extension-contribution</dd></div><div><dt>LAST CAPTURED</dt><dd>14:31:56 · this session</dd></div><div><dt>RESOURCE CONTEXT</dt><dd>Not captured</dd></div></dl><h3>Latest captured exception <span class="banner">Illustrative</span></h3><pre>TypeError: Cannot read properties of undefined
(reading 'containers')

at PodSidebar (plugin module)
at ExtensionPointRenderer (host boundary)

Stack text is synthetic; no source-map link inferred.</pre><div class="actions" style="margin-top:16px"><button class="outline" id="copy">Copy diagnostic</button><button class="outline" id="reenable">Re-enable…</button></div><div class="callout">Captured errors are bounded session history, not durable telemetry. Reload and re-enable can clear crash evidence.</div>`;}
function context(){return `<div class="toolbar"><span class="banner">Explicit lookup · does not mount contribution components</span><span class="hint">Matching can execute plugin-provided matcher code.</span></div><div class="wide"><div class="contextbar"><label>Extension point<select><option>Resource detail panel</option></select></label><label>Plugin<select><option>kubernetes</option></select></label><label>Resource key<select id="resource"><option ${state.context==='Pod'?'selected':''}>Pod</option><option ${state.context==='Deployment'?'selected':''}>Deployment</option></select></label><button class="primary" id="evaluate">Run lookup</button></div><div class="result"><div class="detail-title"><div><div class="eyebrow">${state.evaluated?'Lookup result':'Context lookup'}</div><h2>${state.evaluated?(state.context==='Pod'?'Matched, but quarantined':'Registration selected'):'Choose a context to inspect resolution'}</h2></div><span class="pill">Synthetic context</span></div><p class="mono">{ pluginId: "kubernetes", resourceKey: "${state.context==='Pod'?'core::v1::Pod':'apps::v1::Deployment'}" }</p>${state.evaluated?`<div class="step"><span class="n">1</span><div>Registry inventory<p>listAll() includes all registrations for this point.</p></div><span>3 registrations</span></div><div class="step"><span class="n">2</span><div>Context-aware lookup<p>list(context) returns selected registration. Per-candidate rejection reasons are unavailable.</p></div><span>1 returned</span></div><div class="step"><span class="n">3</span><div>Renderer eligibility<p>${state.context==='Pod'?'Quarantine removes this registration from generic rendering.':'No quarantine recorded. Actual render outcome remains unobserved.'}</p></div><span class="${state.context==='Pod'?'red':'green'}">${state.context==='Pod'?'Excluded':'Eligible, unproven'}</span></div><div class="callout ${state.context==='Pod'?'error':''}"><span class="mono">kubernetes/sidebar/${state.context==='Pod'?'core::v1::Pod':'apps::v1::Deployment'}</span><br>${state.context==='Pod'?'Registration and matching succeeded; quarantine explains its absence from the generic renderer.':'Selection is not evidence that the component mounted or rendered successfully.'}</div>`:'<div class="empty">No lookup has run.<br>Viewing registry inventory stays passive.</div>'}</div><p class="note">Lookup requires a point-specific context adapter. Arbitrary JSON cannot reconstruct class-based resource contexts.</p></div>`;}
function toast(text){const l=document.querySelector('#layer');l.innerHTML=`<div class="toast" role="status">${text}</div>`;setTimeout(()=>l.innerHTML='',3500)}
function bind(){document.querySelector('#main').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;state.search='';shell()}if(b.dataset.point!==undefined){state.selected=+b.dataset.point;shell()}if(b.dataset.sub){state.sub=b.dataset.sub;shell()}if(b.dataset.issue){state.issue=b.dataset.issue;shell()}if(b.dataset.plugin){state.owner=b.dataset.plugin;shell()}if(b.hasAttribute('data-crash')){state.view='issues';state.issue='crash';shell()}if(b.hasAttribute('data-pending')){state.view='issues';state.issue='pending';shell()}if(b.id==='pause'){state.paused=!state.paused;shell()}if(b.id==='evaluate'){state.context=document.querySelector('#resource').value;state.evaluated=true;shell()}if(b.id==='copy'){navigator.clipboard?.writeText('Synthetic diagnostic: kubernetes/sidebar/core::v1::Pod; quarantined; 3 crashes.');toast('Synthetic diagnostic copied')}if(b.id==='reenable'){document.querySelector('#layer').innerHTML='<div style="position:fixed;inset:0;background:#0008;display:grid;place-items:center"><section role="dialog" aria-modal="true" aria-label="Re-enable contribution" style="background:var(--surface);border:1px solid var(--border);padding:26px;border-radius:8px;width:450px"><h2>Re-enable contribution?</h2><p>This clears crash evidence in the current service. Export the snapshot before retrying.</p><p class="note">Design mock only. No plugin action will run.</p><button class="outline" id="cancel" style="margin-top:20px">Cancel</button><button class="primary" id="confirm">Simulate re-enable</button></section></div>';document.querySelector('#cancel').onclick=()=>{document.querySelector('#layer').innerHTML='';document.querySelector('#reenable').focus()};document.querySelector('#confirm').onclick=()=>toast('Simulation only: contribution re-enabled');document.querySelector('#cancel').focus()}if(b.id==='export'){const payload={schemaVersion:1,synthetic:true,workspace:'extension-registry-design',capture:'illustrative',points:points.map(p=>({id:p[0],mode:p[2],registrations:p[3]})),issues:[{kind:'pending-target',plugin:'kubernetes'},{kind:'quarantined',count:3}],coverage:'No render-success instrumentation; no arbitrary values serialized'};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='synthetic-extension-snapshot.json';a.click();URL.revokeObjectURL(a.href);toast('Synthetic snapshot exported · safe descriptors only')}};const input=document.querySelector('#search');if(input)input.oninput=e=>{state.search=e.target.value;const pos=e.target.selectionStart;renderContent();bind();document.querySelector('#search').focus();document.querySelector('#search').setSelectionRange(pos,pos)};const owner=document.querySelector('#owner');if(owner)owner.onchange=e=>{state.owner=e.target.value;renderContent();bind()};}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('#layer').innerHTML='';document.querySelector('#reenable')?.focus()}if((e.metaKey||e.ctrlKey)&&e.key==='f'){e.preventDefault();document.querySelector('#search')?.focus()}});window.__mock={state,freezeAt(ms){document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms})}};shell();
</script></body></html>
