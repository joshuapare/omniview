<!doctype html><html lang="en"><meta charset="utf-8"><title>Omniview · Rich activity design</title><script src="icons.js"></script><style>
:root{color-scheme:dark;--bg:#181a1c;--surface:#1f2125;--raised:#272a30;--border:#353941;--fg:#e3e6ed;--muted:#9da5b4;--accent:#89a7ee;--green:#69d6a4;--amber:#edc477;font:13px -apple-system,BlinkMacSystemFont,Inter,sans-serif;color:var(--fg)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--border);border-radius:6px;padding:7px 11px}button:hover{background:#343943}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.ic{display:inline-flex;width:17px;height:17px;vertical-align:middle}.ic svg{width:100%;height:100%}.primary{background:#819ee1!important;color:#111825!important;border-color:transparent}.quiet{border:0;color:var(--muted)}.muted,small{color:var(--muted)}header{height:38px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.tab{margin-left:44px;border-bottom:2px solid var(--accent);height:38px;display:inline-flex;align-items:center;gap:10px;padding:0 20px}.search{color:var(--muted);background:var(--bg);padding:4px 100px 4px 12px;border:1px solid var(--border);border-radius:5px}.rail{position:absolute;top:38px;bottom:24px;width:48px;border-right:1px solid var(--border);display:flex;align-items:center;flex-direction:column;gap:28px;padding-top:24px;color:var(--muted)}aside{position:absolute;left:48px;top:38px;bottom:24px;width:214px;border-right:1px solid var(--border);padding:24px 16px;background:#1b1d20}aside div{padding:11px 10px;color:var(--muted)}aside .selected{color:var(--accent);background:#283146;border-radius:6px}main{margin:40px 30px 0 290px}h1{font-size:23px;letter-spacing:-.5px;margin:0 0 12px}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0}p{line-height:1.6}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 18px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500}td,th{padding:14px 12px;border-bottom:1px solid #2b2e35}tr.active{background:#232c3c}td:first-child{color:var(--accent)}.pill{font-size:11px;border:1px solid #365544;color:var(--green);padding:3px 7px;border-radius:5px}.pill.warn{color:var(--amber);border-color:#64563b}.label{font-size:10px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}.demo{position:absolute;bottom:54px;left:290px;border:1px solid var(--border);border-radius:9px;padding:16px 20px;background:var(--surface);width:510px}.demo p{margin:8px 0 15px}.demo button{margin-right:6px}.badge{background:#364264;border-radius:10px;font-size:11px;padding:2px 6px;margin-left:6px}.footer{position:fixed;bottom:0;height:24px;left:0;right:0;border-top:1px solid var(--border);padding:4px 14px;font-size:11px;color:var(--muted);background:var(--surface);display:flex;justify-content:space-between}.toast{position:fixed;right:24px;bottom:46px;width:422px;background:var(--surface);border:1px solid #424a5b;border-radius:11px;box-shadow:0 12px 45px #0006;overflow:hidden;animation:enter .24s cubic-bezier(.2,0,0,1)}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.provider{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.content{padding:20px}.titleline{display:flex;gap:12px;align-items:flex-start}.statusicon{color:var(--accent);padding-top:1px}.titleline p{margin:5px 0 0;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:21px 0 16px}.stat strong{display:block;font-size:21px;letter-spacing:-.5px;font-weight:550;margin-bottom:5px}.stat span{font-size:11px;color:var(--muted)}.progress{height:5px;border-radius:5px;background:#343945;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .7s}.phase{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:9px}.actions{display:flex;gap:8px;border-top:1px solid var(--border);padding:12px 18px;background:#22252a;align-items:center}.actions .link{margin-left:auto;border:0;color:var(--accent);padding-right:0}.hint{font-size:11px;color:var(--muted);margin-top:14px}.center{position:fixed;top:38px;right:0;bottom:24px;width:466px;background:var(--surface);border-left:1px solid var(--border);box-shadow:-20px 0 60px #0003;padding:22px;overflow:auto;animation:enter .18s}.center .toast{position:static;width:100%;box-shadow:none;margin:18px 0}.centerhead{display:flex;justify-content:space-between;align-items:center}.filters{display:flex;gap:10px;margin:22px 0 25px}.filters span{padding:6px 10px;border-radius:5px;color:var(--muted)}.filters span:first-child{background:#343d51;color:var(--accent)}.timeline{margin-top:22px;border-left:1px solid var(--border);padding-left:17px;font-size:12px;line-height:2.3;color:var(--muted)}.timeline b{color:var(--fg);font-weight:400}.veil{position:fixed;inset:38px 0 24px;background:#0007;display:grid;place-items:center}.dialog{width:530px;border:1px solid #485162;background:var(--surface);border-radius:12px;box-shadow:0 24px 100px #0009;padding:26px}.dialog h2{font-size:20px}.field{display:block;margin:23px 0 8px}.dialog input,.dialog select{background:var(--bg);color:var(--fg);border:1px solid #4a5161;border-radius:6px;padding:10px;width:100%}.notice{background:#373125;border:1px solid #64563b;color:#edcf94;padding:13px;border-radius:6px;font-size:12px;line-height:1.65;margin:20px 0}.summary{display:flex;justify-content:space-between;padding:13px 0;color:var(--muted);border-bottom:1px solid var(--border)}.dialog .buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.success .statusicon,.success .stat strong{color:var(--green)}.success .progress i{background:var(--green)}.warning .statusicon{color:var(--amber)}.warning .progress i{background:var(--amber)}.failure .statusicon{color:#ef9393}.indeterminate i{width:35%!important;animation:pulse 1.7s ease-in-out infinite}.detail{position:fixed;top:110px;left:320px;width:590px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:25px}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes pulse{50%{transform:translateX(150%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><body><div id="main"></div><div id="layer"></div><script>
const I=n=>`<span class="ic">${ICONS[n]||''}</span>`;const params=new URLSearchParams(location.search);const state={task:null,count:4,center:false,form:false,alert:true,hidden:false,detail:false,tab:'deployments',timer:null,seconds:42};const $=s=>document.querySelector(s);
function shell(){
 const running=state.task&&!['success','resized','failed'].includes(state.task);
 $('#main').innerHTML=`<header><div><span style="font-weight:650">omniview</span><span class="tab">${I('SiKubernetes')} Kubernetes <span class="muted">×</span></span></div><div class="search">${I('LuSearch')} Search resources…</div><button class="quiet" id="bell" aria-label="Open notifications">${I('LuBell')}<span class="badge">${Number(!!state.task)+Number(state.alert)}</span></button></header><div class="rail">${I('LuLayers')}${I('SiKubernetes')}${I('LuServer')}<span style="margin-top:auto;margin-bottom:18px">${I('LuSettings')}</span></div><aside><h3 style="padding:0 10px 18px">production-eu</h3><div>Overview</div><div>Nodes</div><div style="color:var(--fg)">Workloads</div><div class="selected">Deployments <span style="float:right">12</span></div><div>StatefulSets</div><div>DaemonSets</div><div>Pods</div><div>Networking</div><div>Storage</div></aside><main><div class="muted" style="margin-bottom:18px">Kubernetes / production-eu / Workloads</div><h1>Deployments</h1><span class="muted">Manage deployment health across your cluster.</span><div class="toolbar"><button style="width:260px;text-align:left;color:var(--muted)">${I('LuSearch')} Filter deployments…</button><span class="muted">Namespace: payments　⌄　　12 resources</span></div><table><thead><tr><th>Name</th><th>Namespace</th><th>Ready</th><th>Status</th><th>Age</th></tr></thead><tbody>${['checkout-api','billing-worker','payment-gateway','receipt-service','fraud-detector','webhook-dispatcher'].map((x,i)=>`<tr class="${i===0?'active':''}"><td>${x}</td><td>payments</td><td>${i===0?(state.task==='success'?'6/6':state.task==='rollout'||state.task==='failed'?state.count+'/6':'3/3'):'3/3'}</td><td><span class="pill ${i===0&&(state.task==='rollout'||state.task==='failed')?'warn':''}">${i===0&&state.task==='rollout'?'Rolling out':i===0&&state.task==='failed'?'Paused':'Available'}</span></td><td>${14+i*7}d</td></tr>`).join('')}</tbody></table><div class="demo"><div class="label">Interactive design proposal · simulated data</div><p>Leave the table. Keep the outcome in view.</p><button id="start" class="primary">${I('LuActivity')} Roll out deployment</button><button id="alert">${I('LuCircleAlert')} Low disk alert</button><button id="aws">AWS scaling</button></div></main><div class="footer"><span>● Connected　 production-eu　 /　 payments</span><span>${running?'◌ 1 active operation　 ·　 ':''}Design prototype · No infrastructure changes</span></div>`;
 $('#bell').onclick=()=>{state.center=!state.center;render()};
 $('#start').onclick=()=>start('rollout');
 $('#alert').onclick=()=>{stop();state.task=null;state.hidden=false;state.center=false;state.alert=true;state.showAlert=true;render()};
 $('#aws').onclick=()=>start('aws');
}
function stop(){clearInterval(state.timer)}function start(kind){stop();Object.assign(state,{task:kind,count:kind==='rollout'?4:0,seconds:42,hidden:false,center:false,form:false,showAlert:false});render();if(params.get('motion')==='live'){state.timer=setInterval(()=>{state.seconds+=3;if(state.task==='rollout'){state.count++;if(state.count>=6){state.task='success';stop()}}else if(state.task==='resize'){state.count++;if(state.count>=3){state.task='resized';state.alert=false;stop()}}render()},3000)}}
function card(){
 const t=state.task, warning=!t, done=t==='success'||t==='resized', resize=t==='resize'||t==='resized', aws=t==='aws', paused=t==='failed';
 const capacity=state.capacity||120;
 const title=warning?'VM disk space is running low':resize?(done?'Disk expanded successfully':'Expanding VM disk'):aws?'Scaling application capacity':paused?'Rollout paused':done?'Deployment rolled out':'Rolling out checkout-api';
 const provider=warning||resize?'Proxmox · homelab / pve-02':aws?'AWS · production / eu-west-1':'Kubernetes · production-eu';
 const sub=warning||resize?'ubuntu-worker-03 · scsi0':aws?'api-workers · Auto Scaling group':'payments / checkout-api';
 const stat=warning?['9.4%','7.5 GiB','80 GiB']:resize?[done?capacity+' GiB':'80 → '+capacity,done?Math.round((capacity-72.5)/capacity*100)+'%':'scsi0',done?'Verified':'Running']:aws?['8 → 12','9 healthy','3 pending']:[`${done?6:state.count} / 6`,done?'0':'2',`${state.seconds}s`];
 const labels=warning?['Free space','Available','Disk capacity']:resize?['Disk capacity',done?'Free space':'Target disk',done?'Guest status':'Provider task']:aws?['Desired capacity','In service','Launching']:['Pods updated','Old replicas','Elapsed'];
 return `<article class="toast ${warning||paused?'warning':done?'success':''}"><div class="content"><div class="topline"><div class="provider">${I(warning||resize?'SiProxmox':aws?'LuServer':'SiKubernetes')} ${provider}</div><button class="quiet" id="dismiss" aria-label="Dismiss toast" style="padding:0">${I('LuX')}</button></div><div class="titleline"><div class="statusicon">${I(warning||paused?'LuCircleAlert':done?'LuCircleCheck':'LuActivity')}</div><div><h3>${title}</h3><p class="muted">${sub}</p></div></div><div class="stats">${stat.map((s,i)=>`<div class="stat"><strong>${s}</strong><span>${labels[i]}</span></div>`).join('')}</div><div class="progress ${aws?'indeterminate':''}"><i style="width:${warning?90.6:done?100:resize?20+state.count*25:state.count/6*100}%"></i></div><div class="phase"><span>${warning?'Warning below 10% free':paused?'Further rollout changes paused':done?'All health checks passed':resize?['Resizing virtual disk…','Waiting for provider task…','Verifying guest capacity…'][Math.min(state.count,2)]:aws?'Waiting for instance health checks…':'Waiting for 2 pods to become ready'}</span><span>${warning?'Observed now':done?'Complete':paused?'Paused':aws?'In progress':resize?'Step '+(state.count+1)+' / 3':Math.round(state.count/6*100)+'%'}</span></div>${warning?'<div class="hint">Rule: Disk capacity · Checked every 60 seconds</div>':paused?'<div class="hint">Existing workloads continue. No changes were rolled back.</div>':''}</div><div class="actions">${warning?'<button class="primary" id="resize">Expand disk…</button><button id="snooze">Snooze 1h</button>':done?'<span class="muted">'+I('LuCheck')+' Finished just now</span>':paused?'<span class="muted">Pause confirmed by provider</span>':resize?'<span class="muted">Provider does not support cancel</span>':aws?'<span class="muted">Provider operation continues</span>':'<button id="pause">Pause rollout…</button>'}<button class="link" id="resource">View ${warning||resize?'VM':'resource'} ${I('LuArrowUpRight')}</button></div></article>`;
}
function render(){
 shell();
 let html='';
 const active=state.task&& !['success','resized','failed'].includes(state.task);
 if(state.center){
  html=`<section class="center"><div class="centerhead"><h2>Notifications</h2><button id="closecenter" class="quiet" aria-label="Close notifications">${I('LuX')}</button></div><p class="muted">Activity stays here when you leave the table.</p><div class="filters"><span>All</span><span>In progress ${active?1:0}</span><span>Needs attention</span></div><div class="label">${active?'In progress':state.task?'Recent activity':'Needs attention'}</div>${state.task?card():''}${state.alert?`<div class="label" style="margin-top:24px">${state.task?'Needs attention':''}</div><div style="padding:17px 0"><div style="color:var(--amber)">${I('LuCircleAlert')} VM disk space is running low</div><p class="muted">ubuntu-worker-03 · 9.4% free · Proxmox</p><button id="resize">Expand disk…</button></div>`:''}<div class="label" style="margin-top:24px">Earlier today</div><div class="timeline"><b>${I('LuCircleCheck')} Snapshot created</b><br>database-01 · Proxmox · 12 minutes ago<br><b>${I('LuCircleCheck')} Node drain completed</b><br>worker-eu-04 · Kubernetes · 38 minutes ago</div></section>`;
 }else if(!state.hidden&&(state.task||state.showAlert)) html=card();
 if(state.detail) html+=`<section class="detail"><div class="topline"><h2>${['resize','resized'].includes(state.task)||!state.task?'ubuntu-worker-03':'checkout-api'}</h2><button id="closedetail">Close</button></div><p class="muted">Resource detail destination · proposed typed resource link</p><div class="timeline"><b>Latest observation</b><br>${state.task==='resize'?'Virtual disk expansion in progress':'Resource status and related operation history'}<br>Connection and resource identity preserved.</div></section>`;
 if(state.form) html+=`<div class="veil"><form class="dialog" id="resizeform"><div class="label">Proxmox · homelab / pve-02</div><h2 style="margin-top:12px">Expand disk</h2><p class="muted">ubuntu-worker-03 · scsi0 · Current capacity 80 GiB</p><label class="field" for="capacity">New capacity (GiB)</label><input id="capacity" name="capacity" type="number" min="81" max="2048" value="120" required><div class="summary"><span>Capacity change</span><strong id="delta">+40 GiB</strong></div><label class="field" for="guest">Guest filesystem</label><select id="guest"><option value="expand">Expand filesystem after disk resize</option><option value="disk">Resize virtual disk only</option></select><div class="notice">Disk growth cannot be undone. Filesystem expansion requires a supported guest agent. Permissions and current capacity are checked again before execution.</div><div class="muted" style="font-size:12px">This prototype simulates the operation. It never contacts a VM.</div><div class="buttons"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Expand to <span id="target">120</span> GiB</button></div></form></div>`;
 if(state.confirm) html+=`<div class="veil"><div class="dialog"><h2>Pause rollout?</h2><p>Pausing stops further rollout changes. It does not undo updated pods or stop existing workloads.</p><div class="buttons"><button id="cancelpause">Keep rolling out</button><button id="confirmpause" class="primary">Pause rollout</button></div></div></div>`;
 $('#layer').innerHTML=html;
 const on=(id,fn)=>{if($('#'+id))$('#'+id).onclick=fn};
 on('dismiss',()=>{state.hidden=true;render()});
 on('closecenter',()=>{state.center=false;render()});
 on('resize',()=>{state.form=true;render();$('#capacity').focus()});
 on('cancel',()=>{state.form=false;render();$('#resize')?.focus()});
 on('snooze',()=>{state.hidden=true;state.snoozedUntil=Date.now()+3600000;render()});
 on('resource',()=>{state.detail=true;render()});
 on('closedetail',()=>{state.detail=false;render()});
 on('pause',()=>{state.confirm=true;render()});
 on('cancelpause',()=>{state.confirm=false;render()});
 on('confirmpause',()=>{stop();state.confirm=false;state.task='failed';render()});
 if($('#resizeform')){
  $('#capacity').oninput=e=>{$('#delta').textContent='+'+(Number(e.target.value)-80)+' GiB';$('#target').textContent=e.target.value};
  $('#resizeform').onsubmit=e=>{e.preventDefault();if($('#resizeform').reportValidity()){state.capacity=Number($('#capacity').value);state.guest=$('#guest').value;start('resize')}};
 }
}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){state.form=false;state.center=false;state.confirm=false;state.detail=false;render()}if((e.metaKey||e.ctrlKey)&&e.key==='j'){e.preventDefault();state.center=!state.center;render()}});window.__mock={state,freezeAt(ms){for(const a of document.getAnimations()){a.pause();a.currentTime=ms}}};render();
</script></body></html>
