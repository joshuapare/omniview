<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Omniview mock: fresh native exec</title><script src="icons.js"></script><style>
:root{--base:#0e0f11;--surface:#141517;--raised:#1a1b1e;--border:#292c31;--fg:#dedee3;--muted:#93969f;--accent:#8eacf1;font:13px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:var(--fg)}*{box-sizing:border-box}body{margin:0;background:var(--base)}button,select{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--border);border-radius:4px;padding:7px 10px;cursor:pointer}button:hover{background:#292d36}.icon{display:inline-flex;width:16px;height:16px;vertical-align:middle;align-items:center}.icon svg{width:16px;height:16px}.header{height:38px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--surface);gap:10px}.search{width:560px;background:var(--raised);padding:6px 12px;color:var(--muted);border-radius:5px}.tabs{height:36px;border-bottom:1px solid var(--border);display:flex;gap:5px;padding:3px}.tabs button{padding:4px 14px;border:0}.tabs .active{background:#252831}.main{display:flex;height:calc(100vh - 98px)}aside{width:300px;background:var(--surface);border-right:1px solid var(--border);padding:18px 10px;flex-shrink:0}aside small{color:var(--muted);display:block;margin:0 6px 8px}.nav{padding:8px 12px}.nav.active{background:#202d45;border-radius:4px}.content{padding:30px;flex:1}.title{font-size:16px;font-weight:600;margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.setting{display:grid;grid-template-columns:270px 1fr;gap:12px;padding:24px 0;border-top:1px solid var(--border);margin-top:20px}.setting strong{font-size:13px}.setting code{display:block;margin-top:8px;font-size:10px;color:var(--muted)}select{width:100%;height:30px}.note{margin-top:24px;border-left:2px solid var(--accent);padding:12px 16px;background:var(--surface);line-height:1.7}.footer{height:24px;border-top:1px solid var(--border);padding:4px 10px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:400}.ok{color:#83c6ac}.menu{position:absolute;top:190px;right:40px;width:300px;background:var(--raised);border:1px solid var(--border);border-radius:6px;box-shadow:0 10px 40px #0007;padding:5px;z-index:2}.menu button{width:100%;text-align:left;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:9px}.menu button:hover,.menu button:focus{background:#29364e}.menu small{display:block;padding:8px 10px;color:var(--muted);font-size:11px}.menu hr{border:0;border-top:1px solid var(--border);margin:5px}.toast{position:absolute;right:25px;bottom:42px;background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:15px;max-width:420px;line-height:1.6}.error{border-color:#a86565}.badge{background:#24344f;border-radius:4px;padding:3px 7px;font-size:10px;color:#b6cafa}.help{font-size:12px;color:var(--muted)}[hidden]{display:none!important}</style></head><body><div id="main"></div><div id="layer"></div><script>
const params=new URLSearchParams(location.search);const state={view:params.get('view')||'pods',application:'Terminal',menu:false,launched:false,error:params.get('failure')==='automation',current:params.get('layout')==='current'};const icon=n=>`<span class="icon">${ICONS[n]||''}</span>`;
function render(){document.getElementById('main').innerHTML=`<div class="header"><button aria-label="New tab">+</button><div class="search">Search anything…</div></div><div class="tabs"><button id="pods" class="${state.view==='pods'?'active':''}">${icon('SiKubernetes')} Kubernetes</button><button id="settings" class="${state.view==='settings'?'active':''}">${icon('LuSettings')} Settings</button><span style="margin:auto 16px auto auto" class="badge">INTERACTIVE PROPOSAL · LOCAL FIXTURE</span></div><div class="main"><aside><small>${state.view==='settings'?'Core':'local-demo'}</small>${(state.view==='settings'?['Appearance','Developer Settings','Editor','General','Telemetry','Terminal']:['Overview','Nodes','Namespaces','Pods','Deployments','Services']).map(x=>`<div class="nav ${x===(state.view==='settings'?'Terminal':'Pods')?'active':''}">${x}</div>`).join('')}</aside><section class="content">${state.view==='settings'?settings():pods()}</section></div><div class="footer"><span>DEV · native-terminal-research-20261101 · Mock</span><span>Fresh shell only · Built-in behavior unchanged</span></div>`;document.getElementById('pods').onclick=()=>{state.view='pods';state.menu=false;render()};document.getElementById('settings').onclick=()=>{state.view='settings';state.menu=false;render()};if(state.view==='settings'){document.getElementById('application').onchange=e=>{state.application=e.target.value;state.launched=false;render()}}else{document.getElementById('actions').onclick=()=>{state.menu=!state.menu;renderLayer()}}renderLayer()}
function settings(){return `<p class="title">${icon('LuSquareTerminal')} Terminal</p><div class="muted">Customize the behavior of the terminal</div><div class="setting"><div><strong>Default Shell</strong><div class="muted">The default shell to use when opening a terminal</div><code>terminal.defaultShell</code></div><input readonly value="/bin/zsh" style="height:30px;background:var(--raised);border:0;color:var(--fg);padding:8px"></div><div class="setting"><div><strong>Native Terminal Application</strong><div class="muted">macOS application for a fresh external resource shell. Built-in terminals are unchanged.</div><code>terminal.nativeApplication</code></div><select id="application"><option ${state.application==='Terminal'?'selected':''}>Terminal</option><option ${state.application==='iTerm2'?'selected':''}>iTerm2</option></select></div><div class="note">Only explicit native exec actions use this preference.<br>No existing shell state transfers. No modifier shortcut in this feature.</div>`}
function pods(){return `<div class="toolbar"><div><p class="title">Pods</p><span class="muted">default · local-demo</span></div><button id="actions">demo-web · Actions ${icon('LuChevronRight')}</button></div><table><thead><tr><th>Name</th><th>Namespace</th><th>Status</th><th>Containers</th><th>Age</th></tr></thead><tbody><tr><td>demo-web</td><td>default</td><td class="ok">Running</td><td>app</td><td>12m</td></tr></tbody></table><p class="help">Proposal shows the Exec submenu for one ordinary Pod container. Attach, debug and node workflows remain built-in.</p>`}
function renderLayer(){const layer=document.getElementById('layer');layer.innerHTML=(state.menu?`<div class="menu" role="menu" aria-label="Exec"><small>EXEC · demo-web</small><button id="builtin" role="menuitem">${icon('LuSquareTerminal')} app <span style="margin-left:auto;color:var(--muted)">Built-in</span></button>${state.current?'':`<hr><button id="native" role="menuitem">${icon('LuExternalLink')} app — Open in Native Terminal</button><small>New shell in ${state.application}. Existing sessions stay unchanged.</small>`}</div>`:'')+(state.launched?`<div class="toast ${state.error?'error':''}" role="status">${state.error?'<strong>macOS denied Automation access</strong><br>Allow Omniview to control your selected terminal in Privacy & Security → Automation, then retry.':'<strong>Opened a fresh shell in '+state.application+'</strong><br>local-demo / default / demo-web / app<br>No integrated terminal tab was created.'}</div>`:'');if(state.menu){document.getElementById('builtin').onclick=()=>{state.menu=false;state.launched=false;renderLayer()};if(!state.current)document.getElementById('native').onclick=()=>{state.menu=false;state.launched=true;renderLayer()}}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){state.menu=false;renderLayer();return}if(state.menu&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const items=[...document.querySelectorAll('[role=menuitem]')];const i=items.indexOf(document.activeElement);items[(i+(e.key==='ArrowDown'?1:items.length-1)+items.length)%items.length].focus()}});window.__mock={state,freezeAt(ms){for(const a of document.getAnimations()){a.pause();a.currentTime=ms}}};render();
</script></body></html>
