<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Omniview · Compact notification design mock</title><script src="icons.js"></script>
<style>
:root{color-scheme:dark;--bg:#181a1c;--surface:#1f2125;--raised:#272a30;--border:#353941;--fg:#e3e6ed;--muted:#9da5b4;--accent:#89a7ee;--green:#69d6a4;--amber:#edc477;font:13px -apple-system,BlinkMacSystemFont,Inter,sans-serif;color:var(--fg)}*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--border);border-radius:4px;padding:5px 9px}button:hover{background:#343943}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.ic{display:inline-flex;width:14px;height:14px;vertical-align:middle;flex:none}.ic svg{width:100%;height:100%}.primary{background:#819ee1!important;color:#111825!important;border-color:transparent}.quiet{border:0;color:var(--muted);padding:3px}.muted{color:var(--muted)}header{height:38px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.tab{margin-left:44px;border-bottom:2px solid var(--accent);height:38px;display:inline-flex;align-items:center;gap:10px;padding:0 20px}.search{color:var(--muted);background:var(--bg);padding:4px 70px 4px 12px;border:1px solid var(--border);border-radius:4px}.rail{position:absolute;top:38px;bottom:24px;width:48px;border-right:1px solid var(--border);display:flex;align-items:center;flex-direction:column;gap:28px;padding-top:24px;color:var(--muted)}aside{position:absolute;left:48px;top:38px;bottom:24px;width:214px;border-right:1px solid var(--border);padding:24px 16px;background:#1b1d20}aside div{padding:11px 10px;color:var(--muted)}aside .selected{color:var(--accent);background:#283146;border-radius:4px}main{margin:40px 30px 0 290px}h1{font-size:23px;letter-spacing:-.5px;margin:0 0 12px}h2,h3{font-size:13px;margin:0}p{line-height:1.5}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 18px}.toolbar .right{display:flex;align-items:center;gap:10px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500}td,th{padding:14px 12px;border-bottom:1px solid #2b2e35}tr.active{background:#232c3c}td:first-child{color:var(--accent)}.pill{font-size:11px;border:1px solid #365544;color:var(--green);padding:3px 7px;border-radius:4px}.pill.warn{color:var(--amber);border-color:#64563b}.footer{position:fixed;bottom:0;height:24px;left:0;right:0;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);z-index:5}.footer .side{height:100%;display:flex;align-items:center;gap:10px;padding:0 8px}.footer button{height:100%;border:0;border-radius:0;padding:0 6px;font-size:11px;display:inline-flex;align-items:center;gap:5px}.footer .chip{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:#89a7ee;color:#17213a}.footer .chip.done{background:#3c4b43;color:#a3ddbe}.footer .ic{width:11px;height:11px}.footer .divider{height:12px;border-left:1px solid var(--border)}.toast,.center{position:fixed;right:12px;bottom:36px;background:var(--surface);border:1px solid #414650;border-radius:6px;box-shadow:0 6px 24px #0005;overflow:hidden;max-width:calc(100vw - 24px)}.toast{width:360px}.center{width:480px;max-height:min(560px,calc(100dvh - 64px));display:flex;flex-direction:column}.centerhead{display:flex;align-items:center;gap:7px;height:30px;min-height:30px;padding:0 8px 0 12px;background:var(--raised);border-bottom:1px solid var(--border);font-size:12px}.centerhead .tools{display:flex;gap:4px;margin-left:auto}.centerhead .count{font-size:11px;color:var(--muted)}.list{overflow:auto;min-height:0}.row{display:flex;align-items:center;gap:7px;min-height:37px;padding:7px 9px 7px 12px}.row .status{color:var(--accent)}.row .name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left;border:0;padding:0;background:none;min-width:0}.row .metric{font-size:11px;color:var(--muted);white-space:nowrap}.chevron{font-size:13px;line-height:14px;display:inline-block;width:14px;text-align:center}.progress{height:3px;background:#343945;border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.compactbar{margin:0 12px 10px 33px}.body{padding:0 12px 10px 33px}.context{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--muted);margin:0 0 9px}.context .ic{width:11px;height:11px}.metrics{display:flex;gap:13px;align-items:center;font-size:11px;margin:9px 0 8px;color:var(--muted)}.metrics b{font-weight:550;color:var(--fg)}.phase{margin-top:7px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:8px}.actions{display:flex;gap:7px;align-items:center;margin-top:10px}.actions button{font-size:11px;padding:3px 7px}.actions .link{color:var(--accent);border:0;margin-left:auto;padding-right:0}.success .status{color:var(--green)}.success .progress i{background:var(--green)}.warning .status{color:var(--amber)}.warning .progress i{background:var(--amber)}.historyrow{border-top:1px solid var(--border);padding:9px 12px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.historyrow .ic{color:var(--green);width:12px;height:12px}.historyrow time{margin-left:auto}.empty{font-size:12px;color:var(--muted);padding:17px 12px}.indeterminate i{width:30%!important;animation:sweep 1.7s ease-in-out infinite}.scenario-menu{position:absolute;right:30px;top:196px;background:var(--raised);padding:6px;border:1px solid var(--border);border-radius:6px;z-index:10;display:flex;flex-direction:column;gap:4px}.scenario-menu button{text-align:left}.veil{position:fixed;inset:38px 0 24px;background:#0006;display:grid;place-items:center;z-index:10}.dialog{width:420px;max-width:calc(100vw - 32px);border:1px solid #485162;background:var(--surface);border-radius:8px;box-shadow:0 20px 70px #0008;padding:20px}.dialog h2{font-size:17px;margin-bottom:10px}.dialog .field{display:block;margin:17px 0 7px;font-size:12px}.dialog input,.dialog select{background:var(--bg);color:var(--fg);border:1px solid #4a5161;border-radius:4px;padding:7px;width:100%}.dialog .summary{display:flex;justify-content:space-between;padding:10px 0;font-size:12px;color:var(--muted)}details{font-size:11px;color:var(--muted);margin-top:10px}summary{cursor:pointer}.notice{background:#373125;border:1px solid #64563b;color:#edcf94;padding:10px;border-radius:4px;font-size:12px;margin:15px 0}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.detail{position:fixed;right:12px;top:65px;width:420px;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:6px}.detail .heading{display:flex;justify-content:space-between;align-items:center}@keyframes sweep{50%{transform:translateX(180%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.footer .chip:not(.done) .ic{animation:activity-pulse 1.4s ease-in-out infinite}@keyframes activity-pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){.footer .chip:not(.done) .ic{animation:none}}
</style><body><div id="main"></div><div id="layer"></div><script>
const I=n=>`<span class="ic">${ICONS[n]||''}</span>`;
const params=new URLSearchParams(location.search), $=s=>document.querySelector(s);
const state={task:null,count:4,seconds:42,center:false,expanded:true,centerExpanded:false,hidden:false,alert:false,showAlert:false,form:false,confirm:false,detail:false,scenarioMenu:false,filter:'all',capacity:120,guest:'expand',timer:null};
const active=()=>!!state.task&&!['success','resized','paused'].includes(state.task);
function shell(){
 const rolling=state.task==='rollout'||state.task==='paused', ready=state.task==='success'?'6/6':rolling?state.count+'/6':'3/3';
 const count=Number(!!state.task)+Number(state.alert);
 $('#main').innerHTML=`<header><div><b>omniview</b><span class="tab">${I('SiKubernetes')} Kubernetes <span class="muted">×</span></span></div><div class="search">${I('LuSearch')} Search resources…</div><span class="muted">production-eu</span></header><div class="rail">${I('LuLayers')}${I('SiKubernetes')}${I('LuServer')}<span style="margin-top:auto;margin-bottom:18px">${I('LuSettings')}</span></div><aside><h3 style="padding:0 10px 18px">production-eu</h3><div>Overview</div><div>Nodes</div><div style="color:var(--fg)">Workloads</div><div class="selected">Deployments <span style="float:right">12</span></div><div>StatefulSets</div><div>DaemonSets</div><div>Pods</div><div>Networking</div><div>Storage</div></aside><main><div class="muted" style="margin-bottom:18px">Kubernetes / production-eu / Workloads</div><h1>Deployments</h1><div class="toolbar"><button style="width:260px;text-align:left;color:var(--muted)">${I('LuSearch')} Filter deployments…</button><div class="right"><span class="muted">Namespace: payments　⌄</span><button id="start">Roll out</button><button id="scenarios" aria-label="Mock scenarios" title="Mock scenarios">•••</button></div></div><table><thead><tr><th>Name</th><th>Namespace</th><th>Ready</th><th>Status</th><th>Age</th></tr></thead><tbody>${['checkout-api','billing-worker','payment-gateway','receipt-service','fraud-detector','webhook-dispatcher','currency-service','ledger-writer','payment-router','invoice-api'].map((name,i)=>`<tr class="${i===0?'active':''}"><td>${name}</td><td>payments</td><td>${i===0?ready:'3/3'}</td><td><span class="pill ${i===0&&rolling?'warn':''}">${i===0&&state.task==='rollout'?'Rolling out':i===0&&state.task==='paused'?'Paused':'Available'}</span></td><td>${14+i*7}d</td></tr>`).join('')}</tbody></table></main><div class="footer"><div class="side"><span title="Design mock · simulated data">main</span><span class="divider"></span>${state.task?`<button id="operations" class="chip ${active()?'':'done'}" title="${active()?'Open active operations':'Open recent operations'}">${I(active()?'LuActivity':'LuCheck')}${active()?'1 operation':'1 recent'}</button>`:''}</div><div class="side"><span>● Connected</span><span class="divider"></span><button id="bell" aria-label="Notifications (${count})" title="Notifications">${I('LuBell')}${count||''}</button></div></div>`;
 $('#start').onclick=()=>start('rollout');
 $('#scenarios').onclick=()=>{state.scenarioMenu=!state.scenarioMenu;render()};
 $('#bell').onclick=()=>{state.center=!state.center;state.filter='all';render()};
 if($('#operations'))$('#operations').onclick=()=>{state.center=true;state.filter=active()?'active':'all';render()};
}
function stop(){clearInterval(state.timer)}
function start(kind){
 stop();Object.assign(state,{task:kind,count:kind==='rollout'?4:0,seconds:42,center:false,expanded:true,centerExpanded:false,hidden:false,form:false,showAlert:false,scenarioMenu:false});render();
 if(params.get('motion')==='live')state.timer=setInterval(()=>{
  state.seconds+=3;
  if(state.task==='rollout'&&++state.count>=6){state.task='success';stop()}
  else if(state.task==='resize'&&++state.count>=3){state.task='resized';if(state.guest==='expand')state.alert=false;stop()}
  render();
 },3000);
}
function model(){
 const t=state.task,warning=!t,done=t==='success'||t==='resized',resize=t==='resize'||t==='resized',aws=t==='aws',paused=t==='paused';
 const title=warning?'VM disk space low':resize?(done?'Disk expanded':'Expanding VM disk'):aws?'Scaling api-workers':paused?'checkout-api · Paused':done?'checkout-api · Rolled out':'Rolling out checkout-api';
 const context=warning||resize?'homelab / pve-02 · ubuntu-worker-03':aws?'production / eu-west-1':'production-eu · payments';
 const metric=warning?'9.4% free':resize?(done?state.capacity+' GiB':'80 → '+state.capacity+' GiB'):aws?'9 / 12':(done?6:state.count)+' / 6';
 const phase=warning?'Below 10% free':paused?'Rollout paused':done?(resize&&state.guest==='disk'?'Guest filesystem unchanged':'Health checks passed'):resize?['Resizing virtual disk…','Waiting for provider task…','Verifying guest capacity…'][Math.min(state.count,2)]:aws?'Waiting for instance health checks…':`Waiting for ${6-state.count} pods`;
 const percent=warning?90.6:done?100:resize?(state.count+1)/3*100:state.count/6*100;
 return {warning,done,resize,aws,paused,title,context,metric,phase,percent,icon:warning||resize?'SiProxmox':aws?'LuServer':'SiKubernetes'};
}
function card(inCenter=false){
 const m=model(),expanded=inCenter?state.centerExpanded:state.expanded;
 const actions=m.warning?'<button class="primary" id="resize">Expand disk…</button><button id="snooze">Snooze 1h</button>':!m.done&&!m.resize&&!m.aws&&!m.paused?'<button id="pause">Pause rollout…</button>':'';
 const metrics=m.warning?'<span><b>7.5 GiB</b> free</span><span><b>80 GiB</b> capacity</span>':m.resize?`<span><b>scsi0</b></span><span>${m.done&&state.guest==='expand'?'<b>'+Math.round((state.capacity-72.5)/state.capacity*100)+'%</b> free':m.done?'Guest unchanged':'Step <b>'+(state.count+1)+'/3</b>'}</span>`:m.aws?'<span><b>9</b> in service</span><span><b>3</b> launching</span>':`<span><b>${m.done?0:6-state.count}</b> old replicas</span><span><b>${state.seconds}s</b> elapsed</span>`;
 return `<article class="${inCenter?'record':'toast'} ${m.warning||m.paused?'warning':m.done?'success':''}" data-expanded="${expanded}"><div class="row"><span class="status">${I(m.warning?'LuCircleAlert':m.done?'LuCircleCheck':'LuActivity')}</span><button class="name" id="rowtoggle" aria-expanded="${expanded}">${m.title}</button><span class="metric">${m.metric}</span><button class="quiet" id="collapse" aria-label="${expanded?'Collapse notification':'Expand notification'}" title="${expanded?'Collapse':'Expand'}"><span class="chevron">${expanded?'⌃':'⌄'}</span></button>${inCenter?'':`<button class="quiet" id="dismiss" aria-label="Dismiss toast" title="Dismiss">${I('LuX')}</button>`}</div>${expanded?`<div class="body"><div class="context">${I(m.icon)}${m.context}</div><div class="progress ${m.aws?'indeterminate':''}"><i style="width:${m.percent}%"></i></div><div class="phase"><span>${m.phase}</span><span>${m.done?'Complete':m.warning?'Now':m.resize?'':m.aws?'':Math.round(m.percent)+'%'}</span></div><div class="metrics">${metrics}</div><div class="actions">${actions}<button class="link" id="resource">View ${m.warning||m.resize?'VM':'resource'} ${I('LuArrowUpRight')}</button></div>${m.warning?'<details><summary>Rule details</summary><p>Disk capacity · Checked every 60 seconds.</p></details>':''}</div>`:`<div class="progress compactbar ${m.aws?'indeterminate':''}"><i style="width:${m.percent}%"></i></div>`}</article>`;
}
function render(){
 const focused=document.activeElement?.id;
 shell();let html='';
 if(state.center){
  const show=state.task||state.alert;
  html=`<section class="center" aria-label="Notifications"><div class="centerhead"><b>Notifications</b><span class="count">${show?1:0}</span><div class="tools"><button id="filter" class="quiet" title="${state.filter==='all'?'Show active operations':'Show all notifications'}" aria-label="${state.filter==='all'?'Show active operations':'Show all notifications'}">${I(state.filter==='all'?'LuLayers':'LuActivity')}</button><button id="closecenter" class="quiet" aria-label="Minimize notification center" title="Minimize"><span class="chevron">⌄</span></button></div></div><div class="list">${show&&(state.filter==='all'||state.task)?card(true):'<div class="empty">No notifications</div>'}${params.get('history')==='1'&&state.filter==='all'?`<div class="historyrow">${I('LuCircleCheck')} Snapshot created <time>12m</time></div><div class="historyrow">${I('LuCircleCheck')} Node drain completed <time>38m</time></div>`:''}</div></section>`;
 }else if(!state.hidden&&(state.task||state.showAlert))html=card();
 if(state.scenarioMenu)html+='<div class="scenario-menu"><button id="alert">Low disk alert</button><button id="aws">AWS scaling</button></div>';
 if(state.detail)html+=`<section class="detail"><div class="heading"><h2>${model().warning||model().resize?'ubuntu-worker-03':'checkout-api'}</h2><button id="closedetail" class="quiet" aria-label="Close resource">${I('LuX')}</button></div><p class="muted">${model().phase}</p></section>`;
 if(state.form)html+=`<div class="veil"><form class="dialog" id="resizeform"><h2>Expand disk</h2><p class="muted" style="font-size:12px">ubuntu-worker-03 · scsi0 · 80 GiB</p><label class="field" for="capacity">New capacity (GiB)</label><input id="capacity" type="number" min="81" max="2048" value="120" required><div class="summary"><span>Capacity change</span><b id="delta">+40 GiB</b></div><label class="field" for="guest">Guest filesystem</label><select id="guest"><option value="expand">Expand filesystem after disk resize</option><option value="disk">Resize virtual disk only</option></select><details><summary>Requirements</summary><p>Filesystem expansion requires a supported guest agent.</p></details><div class="notice">Disk growth cannot be undone.</div><div class="buttons"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Expand to <span id="target">120</span> GiB</button></div></form></div>`;
 if(state.confirm)html+='<div class="veil"><div class="dialog"><h2>Pause rollout?</h2><p>Existing workloads keep running. Updated pods will not be rolled back.</p><div class="buttons"><button id="cancelpause">Keep rolling out</button><button id="confirmpause" class="primary">Pause rollout</button></div></div></div>';
 $('#layer').innerHTML=html;
 const on=(id,fn)=>{if($('#'+id))$('#'+id).onclick=fn};
 const toggle=()=>{if(state.center)state.centerExpanded=!state.centerExpanded;else state.expanded=!state.expanded;render()};
 on('collapse',toggle);on('rowtoggle',toggle);
 on('dismiss',()=>{state.hidden=true;render();$('#bell').focus()});
 on('closecenter',()=>{state.center=false;state.hidden=true;render();$('#bell').focus()});
 on('filter',()=>{state.filter=state.filter==='all'?'active':'all';render()});
 on('alert',()=>{stop();Object.assign(state,{task:null,alert:true,showAlert:true,hidden:false,center:false,expanded:true,scenarioMenu:false});render()});
 on('aws',()=>start('aws'));
 on('resize',()=>{state.form=true;render();$('#capacity').focus()});
 on('cancel',()=>{state.form=false;render();$('#resize')?.focus()});
 on('snooze',()=>{state.hidden=true;state.snoozedUntil=Date.now()+3600000;render()});
 on('resource',()=>{state.detail=true;render()});on('closedetail',()=>{state.detail=false;render()});
 on('pause',()=>{state.confirm=true;render()});on('cancelpause',()=>{state.confirm=false;render()});
 on('confirmpause',()=>{stop();state.confirm=false;state.task='paused';render()});
 if($('#resizeform')){
  $('#capacity').oninput=e=>{$('#delta').textContent='+'+(Number(e.target.value)-80)+' GiB';$('#target').textContent=e.target.value};
  $('#resizeform').onsubmit=e=>{e.preventDefault();if($('#resizeform').reportValidity()){state.capacity=Number($('#capacity').value);state.guest=$('#guest').value;start('resize')}};
 }
 if(focused&&$('#'+focused))$('#'+focused).focus({preventScroll:true});
}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){state.form=false;state.center=false;state.hidden=true;state.confirm=false;state.detail=false;state.scenarioMenu=false;render();$('#bell').focus()}if((e.metaKey||e.ctrlKey)&&e.key==='j'){e.preventDefault();state.center=!state.center;render()}});
window.__mock={state,freezeAt(ms){for(const a of document.getAnimations()){a.pause();a.currentTime=ms}}};render();
</script></html>
