<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omniview · Resource creation design</title><script src="icons.js"></script><style>
:root{color-scheme:dark;--base:#181a1c;--surface:#1f2125;--raised:#272a30;--inset:#131416;--border:#343840;--muted:#9d9d9d;--fg:#ccc;--accent:#7092e8;--success:#3aad74;--error:#e18b8b;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--fg)}*{box-sizing:border-box}body{margin:0;background:var(--base)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:1px solid var(--border);border-radius:6px;background:var(--raised);padding:7px 12px;display:inline-flex;gap:7px;align-items:center;justify-content:center}button:hover{background:#30343c}.ic{display:inline-flex;width:16px;height:16px;flex-shrink:0}.ic svg{width:100%;height:100%}.chrome{height:38px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:22px;padding:0 18px;background:var(--surface)}.chrome .tab{height:38px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:8px;padding:0 15px}.chrome small{margin-left:auto;color:var(--muted)}.shell{display:flex;height:calc(100vh - 62px)}.sidebar{width:224px;padding:22px 15px;border-right:1px solid var(--border);background:var(--surface)}.sidebar strong{display:block;margin:0 10px 23px}.sidebar p{padding:9px 12px;margin:3px 0;color:var(--muted)}.sidebar .selected{background:#7092e81c;color:var(--accent);border-radius:5px}.table{flex:1;padding:26px}.table h1{font-size:22px;margin:0 0 22px}.table header{display:flex;gap:12px;align-items:center;margin-bottom:18px}.table header button:last-child{margin-left:auto}.data{width:100%;border-collapse:collapse}.data td,.data th{text-align:left;border-bottom:1px solid var(--border);padding:14px;font-weight:400}.data th{color:var(--muted);font-size:12px}.dot{display:inline-block;border-radius:50%;width:6px;height:6px;background:var(--success);margin-right:8px}.status{height:24px;display:flex;align-items:center;padding:0 12px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.veil{position:fixed;inset:38px 0 24px;background:#0008;backdrop-filter:blur(2px)}.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1080px,calc(100vw - 48px));height:min(738px,calc(100vh - 96px));background:var(--surface);border:1px solid #454a55;border-radius:10px;box-shadow:0 30px 100px #0009;display:flex;flex-direction:column;overflow:hidden}.dialog-head{padding:21px 25px 18px;border-bottom:1px solid var(--border);display:flex;gap:13px;align-items:center}.kind-icon{width:36px;height:36px;border:1px solid #7092e84d;border-radius:9px;color:var(--accent);display:grid;place-items:center;background:#7092e812}.dialog-head h2{font-size:18px;font-weight:600;margin:0 0 5px;color:#eee}.context{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.context b{font-weight:400;color:var(--fg)}.head-actions{margin-left:auto;display:flex;gap:18px;align-items:center}.segments{padding:3px;background:var(--inset);border:1px solid #34384080;border-radius:7px;display:flex}.segments button{border:0;background:none;color:var(--muted);padding:6px 14px;min-width:79px}.segments button[aria-checked=true]{background:#383d47;color:#f3f3f3;box-shadow:0 1px 4px #0005}.icon-btn{padding:6px;background:transparent;border:0;color:var(--muted)}.dialog-body{display:flex;flex:1;min-height:0}.section-nav{width:194px;flex-shrink:0;padding:21px 13px;background:#1b1d21;border-right:1px solid var(--border)}.section-nav button{background:none;border:0;justify-content:flex-start;width:100%;padding:10px 12px;margin-bottom:5px;color:var(--muted)}.section-nav button.active{color:#b0c4ff;background:#7092e817;box-shadow:inset 2px 0 var(--accent)}.section-nav .count{margin-left:auto;border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#7b8494;padding:0 12px 15px}.nav-foot{border-top:1px solid var(--border);margin:20px 12px 0;padding-top:17px;font-size:11px;line-height:1.9;color:var(--muted)}.nav-foot strong{color:var(--fg);font-weight:400}.content{flex:1;min-width:0;padding:25px 31px;overflow:auto}.section-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.section-top h3{font-size:16px;margin:0;color:#e6e7ea;font-weight:600}.step{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{min-width:0;margin-bottom:19px}.grid .field{margin-bottom:0}.label{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:#c7cbd2;font-size:12px}.required{color:#8fa8ed;font-size:10px}.help{border:0;background:none;padding:0;color:#7b8494;width:15px;height:15px;border-radius:50%;font-size:10px;line-height:1}.help:hover{color:#b8c9f6;background:#7092e82a}.field input,.field select,.kv input{width:100%;height:36px;padding:0 11px;background:var(--inset);border:1px solid #454c59;border-radius:6px;color:#e0e2e7}.field input::placeholder,.kv input::placeholder{color:#636d7c}.field input.mono,.kv input{font-family:'SF Mono',Menlo,monospace;font-size:12px}.field select{appearance:auto}.field input.invalid{border-color:var(--error)}.error{font-size:11px;color:var(--error);margin-top:6px}.divider{height:1px;background:var(--border);margin:24px 0}.subhead{display:flex;align-items:center;gap:9px;margin-bottom:17px;font-weight:600;color:#e0e2e7}.subhead small{font-weight:400;color:var(--muted);font-size:11px;margin-left:auto}.container-card{border:1px solid #3b414d;border-radius:8px;overflow:hidden;background:#202328}.card-title{padding:12px 16px;background:#272a30;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);color:#e0e2e7}.badge{font-size:10px;border-radius:4px;padding:3px 6px;background:#7092e81a;color:#9db7ff;font-weight:400}.card-title small{margin-left:auto;color:var(--muted);font-size:11px}.card-body{padding:18px}.card-body .grid{gap:17px}.image-row{display:grid;grid-template-columns:1fr 110px;gap:12px}.quiet{background:transparent;color:#a9bce9;border-color:#454c59;font-size:12px}.text-button{background:none;border:0;padding:5px 0;color:#9db7ff;font-size:12px}.details-row{display:flex;gap:16px;align-items:center;padding-top:15px;font-size:11px;color:var(--muted)}.details-row span{display:flex;align-items:center;gap:6px}.details-row button{margin-left:auto}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid var(--border);border-radius:5px;padding:6px 9px;background:#272a30;font-size:11px}.pill b{font-weight:400;color:var(--muted);margin-right:5px}.footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;background:var(--surface)}.footer-note{font-size:11px;color:var(--muted);margin-right:auto;display:flex;gap:7px;align-items:center}.primary{background:#5a7fe2;color:white;border-color:#7092e8}.primary:hover{background:#688bef}.footer .primary{min-width:127px}.disclosure{display:block;width:100%;background:transparent;border:1px solid var(--border);padding:12px;text-align:left;justify-content:space-between;margin-top:18px;font-size:12px}.resource-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:center}.resource-grid .label{margin:0}.quantity{display:flex;border:1px solid #454c59;border-radius:6px;overflow:hidden;background:var(--inset)}.quantity input{border:0;border-radius:0;height:34px}.quantity select{border:0;border-left:1px solid var(--border);border-radius:0;max-width:70px;height:34px;font-size:11px}.col-label{color:var(--muted);font-size:11px;margin-bottom:9px}.kv{display:grid;grid-template-columns:1fr 1fr 30px;gap:9px;margin-bottom:10px}.kv button{padding:4px;border:0;background:none}.compact-card{border:1px solid var(--border);border-radius:7px;padding:16px;margin-bottom:17px}.checkrow{display:flex;align-items:center;gap:9px;font-size:12px}.checkrow input{accent-color:#7092e8}.hint-chip{display:inline-flex;background:#7092e812;color:#9db7ff;padding:5px 8px;border-radius:4px;font-size:11px;gap:7px;align-items:center}.editor{padding:0;background:var(--inset);display:flex;flex-direction:column}.editor-bar{height:40px;padding:0 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);color:var(--muted);font-size:11px}.editor-bar small{margin-left:auto}.editor textarea{resize:none;width:100%;flex:1;background:transparent;border:0;padding:20px 25px;color:#b7c9e8;font:12px/1.8 'SF Mono',Menlo,monospace;tab-size:2;white-space:pre;outline-offset:-3px}.editor-warning{padding:10px 20px;background:#cf903015;border-top:1px solid #cf90304d;color:#e0b976;font-size:12px}.tooltip{position:fixed;max-width:290px;padding:13px 15px;border:1px solid #50586a;border-radius:8px;background:#2c3038;color:#d4d8df;font-size:12px;line-height:1.6;box-shadow:0 8px 30px #0006;z-index:20}.tooltip strong{display:block;color:#f2f3f5;margin-bottom:5px;font-size:12px}.review{max-width:610px;margin:auto}.review h3{font-size:20px;color:#eee;margin:8px 0 24px}.review dl{display:grid;grid-template-columns:150px 1fr;gap:16px;font-size:13px}.review dt{color:var(--muted)}.review dd{margin:0;color:#e1e4eb}.review .notice{margin-top:24px;padding:14px;background:#7092e812;border:1px solid #7092e833;border-radius:7px;font-size:12px;line-height:1.6}.mock-label{position:fixed;right:16px;bottom:31px;font-size:10px;color:#a4adbd;background:#252a33;border:1px solid #454c59;border-radius:4px;padding:5px 8px;z-index:3}.empty-create{display:grid;place-items:center;height:100%;color:var(--muted)}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media(max-width:900px){.section-nav{width:155px}.content{padding:20px}.dialog{width:calc(100vw - 24px)}.head-actions{gap:6px}}

</style></head><body><main id="main"></main><div id="layer"></div><script>
'use strict';
const params=new URLSearchParams(location.search),kind=params.get('kind')||'Pod';
const state={kind,mode:'form',section:'Basics',open:true,review:false,resources:false,advanced:false,help:null,yamlEdited:false,yaml:'',errors:{},draft:{name:'',namespace:'payments',container:'main',image:'',port:'',replicas:'3',service:'',claim:'data',storage:'20',storageClass:'standard',mount:'/var/lib/postgresql/data',cpuRequest:'100',cpuLimit:'500',memRequest:'128',memLimit:'512',env:[],labels:[],strategy:'RollingUpdate'}};
const icons={Basics:'LuBox',Containers:'LuLayers',Networking:'LuNetwork',Storage:'LuHardDrive',Scheduling:'LuSlidersHorizontal',Advanced:'LuSettings2'};
const icon=(name,size=16)=>`<span class="ic" style="width:${size}px;height:${size}px">${window.ICONS?.[name]||''}</span>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const helpData={namespace:['Namespace','Where this resource will be created. A single namespace selected in the table is preselected here. Always confirm the destination before creating.'],image:['Container image','Use an image name and tag, such as nginx:1.27.3. Omniview does not verify image availability in this proposal. Pin a version for repeatable deployments.'],port:['Container port','The port your process listens on inside this container. This does not expose the workload outside the cluster or create a Service.'],resources:['Requests and limits','Requests reserve capacity for scheduling. CPU limits cap CPU use; exceeding a memory limit can terminate the container. Values here are examples, not recommendations.'],service:['Governing Service','Select an existing headless Service in this namespace. StatefulSet uses it for stable network identities. This form does not create the Service.'],storage:['Storage per replica','Each replica gets its own PersistentVolumeClaim. Claims can remain after you delete or scale down the StatefulSet.'],labels:['Labels and selectors','For controllers, the app selector must match the Pod-template label. Keep these linked by default; use Advanced for deliberate selector changes.'],replicas:['Replicas','Number of Pods maintained by this controller. This form does not create an autoscaler.'],policy:['Update strategy','RollingUpdate replaces Pods gradually. Recreate stops existing Deployment Pods before starting replacements.']};
function help(key){return `<button class="help" type="button" data-help="${key}" aria-label="Help: ${esc(helpData[key][0])}">${icon('LuCircleHelp',14)}</button>`}
function field(label,key,placeholder='',opts={}){return `<div class="field"><label class="label" for="${key}">${label}${opts.required?'<span class="required">*</span>':''}${opts.help?help(opts.help):''}</label>${opts.options?`<select id="${key}" data-key="${key}">${opts.options.map(x=>`<option ${state.draft[key]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id="${key}" class="${opts.mono?'mono ':''}${state.errors[key]?'invalid':''}" data-key="${key}" value="${esc(state.draft[key])}" placeholder="${esc(placeholder)}" ${opts.type?`type="${opts.type}"`:''} ${opts.type==='number'?'min="0"':''} ${opts.required?'required':''} ${state.errors[key]?`aria-invalid="true" aria-describedby="${key}-error"`:''}>`}${state.errors[key]?`<div class="error" id="${key}-error">${state.errors[key]}</div>`:''}</div>`}
function shell(){document.querySelector('#main').innerHTML=`<div class="chrome"><span style="color:#626a76">● ● ●</span><div class="tab">${icon('SiKubernetes')} Kubernetes <span style="color:#737c8b">×</span></div><span style="color:#737c8b">＋</span><small>Search Omniview　⌘ K</small></div><div class="shell"><aside class="sidebar"><strong>${icon('SiKubernetes')}　Kubernetes</strong><p>⌄　dev-us-east</p><p>Overview</p><p>⌄　Workloads</p>${['Pods','Deployments','StatefulSets','DaemonSets','Jobs','CronJobs'].map(x=>`<p class="${x===state.kind+'s'?'selected':''}" style="padding-left:31px">${x}</p>`).join('')}<p>⌄　Networking</p><p>⌄　Storage</p><p>⌄　Configuration</p></aside><section class="table"><h1>${esc(state.kind)}s</h1><header><button>payments　⌄</button><button style="color:#737c8b;width:270px;justify-content:flex-start">${icon('LuSearch')} Filter resources…</button><button id="launch" class="primary">${icon('LuPlus')} Create ${esc(state.kind)}</button></header><table class="data"><thead><tr><th>Name</th><th>Namespace</th><th>Status</th><th>Ready</th><th>Age</th></tr></thead><tbody>${['api-gateway-7cf85c','billing-worker-84bd2','checkout-6d9c7','payments-api-79bc8','redis-0'].map((x,i)=>`<tr><td>${x}</td><td>payments</td><td><span class="dot"></span>Running</td><td>1 / 1</td><td>${i+2}d</td></tr>`).join('')}</tbody></table></section></div><div class="status">${icon('SiKubernetes',12)}　dev-us-east　 /　 payments <span style="margin-left:auto">Design proposal · sample data</span></div>`;document.querySelector('#launch').onclick=()=>{state.open=true;render()}}
function basics(){return `<div class="section-top"><h3>Basics</h3><span class="step">${state.kind==='Pod'?'v1':'apps/v1'} · ${esc(state.kind)}</span></div><div class="grid">${field('Name','name',state.kind==='StatefulSet'?'postgres':state.kind==='Deployment'?'payments-api':'debug-shell',{required:true,mono:true})}${field('Namespace','namespace','',{required:true,help:'namespace',options:['payments','default','staging']})}</div><div class="divider"></div><div class="subhead">${icon('LuBox')} Container <small>1 container</small></div><div class="container-card"><div class="card-title">${icon('LuBox')} main <span class="badge">Container</span><small>Required</small></div><div class="card-body">${field('Container image','image',state.kind==='StatefulSet'?'postgres:17.2':'nginx:1.27.3',{required:true,mono:true,help:'image'})}<div class="grid">${field('Container port','port','e.g. 8080',{type:'number',help:'port'})}<div class="field"><span class="label">Protocol</span><select aria-label="Protocol"><option>TCP</option></select></div></div><div class="details-row"><span>${icon('LuSlidersHorizontal',13)} ${state.resourcesConfigured?'Resources configured':'Resources not set'}</span><span>${icon('LuKeyRound',13)} ${state.draft.env.length?state.draft.env.length+' environment variables':'No environment variables'}</span><button class="text-button" data-section="Containers">Configure ${icon('LuArrowRight',13)}</button></div></div></div>${state.kind!=='Pod'?`<div class="divider"></div><div class="grid">${field('Replicas','replicas','3',{type:'number',help:'replicas'})}${state.kind==='StatefulSet'?field('Governing Service','service','',{required:true,help:'service',options:['','postgres-headless','redis-headless']}):field('Update strategy','strategy','',{help:'policy',options:['RollingUpdate','Recreate']})}</div>`:''}<div style="display:flex;align-items:center;gap:10px"><button class="disclosure" id="labels-toggle"><span>Labels</span><span>${state.advanced?'−':'＋'}</span></button><span style="padding-top:18px">${help('labels')}</span></div>${state.advanced?`<div style="padding-top:13px"><span class="hint-chip">app = ${esc(state.draft.name||'resource-name')}　·　${state.kind==='Pod'?'Resource label':'Selector + Pod label linked'}</span></div>`:''}`}
function quantities(){return `<div class="compact-card"><div class="subhead">Resources ${help('resources')}<small>Optional</small></div><div class="resource-grid"><span></span><span class="col-label">Request</span><span class="col-label">Limit</span>${[['CPU','cpuRequest','cpuLimit','mCPU'],['Memory','memRequest','memLimit','Mi']].map(([label,r,l,u])=>`<span class="label">${label}</span>${[r,l].map(k=>`<div class="field" style="margin:0"><div class="quantity"><input aria-label="${label} ${k===r?'request':'limit'}" data-key="${k}" value="${esc(state.draft[k])}" type="number" min="0"><select aria-label="${label} unit"><option>${u}</option></select></div></div>`).join('')}`).join('')}</div></div>`}
function containers(){return `<div class="section-top"><h3>Containers</h3><span class="step">Pod specification</span></div><div class="container-card" style="margin-bottom:18px"><div class="card-title">${icon('LuBox')} ${esc(state.draft.container)} <span class="badge">Container 1</span><small>Primary</small></div><div class="card-body"><div class="grid">${field('Container name','container','main',{required:true,mono:true})}${field('Container image','image','nginx:1.27.3',{required:true,mono:true,help:'image'})}</div></div></div>${quantities()}<div class="subhead">Environment variables <small>${state.draft.env.length} configured</small></div>${state.draft.env.map((row,i)=>`<div class="kv"><input aria-label="Variable name ${i+1}" placeholder="Variable name" data-env="${i}:key" value="${esc(row.key)}"><input aria-label="Variable value ${i+1}" placeholder="Value" data-env="${i}:value" value="${esc(row.value)}"><button data-remove-env="${i}" aria-label="Remove variable ${i+1}">${icon('LuX',14)}</button></div>`).join('')}<button class="text-button" id="add-env">${icon('LuPlus',14)} Add variable</button><button class="disclosure" id="probe-toggle"><span>Health checks</span><span>${state.resources?'−':'＋'}</span></button>${state.resources?`<div class="compact-card" style="margin-top:10px"><label class="checkrow"><input type="checkbox"> Enable readiness probe</label></div>`:''}`}
function storage(){return `<div class="section-top"><h3>Storage</h3><span class="step">${state.kind==='StatefulSet'?'Per-replica volumes':'Pod volumes'}</span></div>${state.kind==='StatefulSet'?`<div class="container-card"><div class="card-title">${icon('LuHardDrive')} Persistent volume <span class="badge">Claim template</span><small>Per replica</small></div><div class="card-body"><div class="grid">${field('Volume name','claim','data',{required:true,mono:true})}${field('Storage class','storageClass','',{options:['standard','fast-ssd','Use cluster default']})}</div><div style="margin-top:20px" class="grid"><div class="field"><label class="label" for="storage">Capacity per replica ${help('storage')}</label><div class="quantity"><input id="storage" data-key="storage" value="${esc(state.draft.storage)}" type="number" min="1"><select aria-label="Capacity unit"><option>Gi</option></select></div></div><div class="field"><label class="label" for="access">Access mode</label><select id="access"><option>ReadWriteOnce</option></select></div></div><div class="divider"></div><div class="grid">${field('Mount path','mount','/var/lib/postgresql/data',{required:true,mono:true})}<div class="field"><label class="label" for="mount-container">Container</label><select id="mount-container"><option>main</option></select></div></div><div class="hint-chip">${icon('LuHardDrive',13)} ${esc(state.draft.replicas)} claims × ${esc(state.draft.storage)} Gi = ${Number(state.draft.replicas)*Number(state.draft.storage)} Gi requested</div></div></div>`:`<div class="compact-card"><div class="subhead">Volumes</div><label class="label" for="existing-volume">Existing claim</label><select id="existing-volume" style="width:100%;padding:10px;background:var(--inset);border:1px solid var(--border);border-radius:6px"><option>Select a PersistentVolumeClaim…</option><option>shared-assets</option></select></div>`}`}
function other(){if(state.section==='Networking')return `<div class="section-top"><h3>Networking</h3><span class="step">Container ports</span></div><div class="compact-card"><div class="subhead">main</div><div class="grid">${field('Container port','port','8080',{type:'number',help:'port'})}<div class="field"><label class="label">Protocol</label><select aria-label="Network protocol"><option>TCP</option></select></div></div></div>`;if(state.section==='Scheduling')return `<div class="section-top"><h3>Scheduling</h3><span class="step">Optional</span></div><div class="compact-card"><div class="subhead">Node placement</div><label class="checkrow"><input type="radio" name="node" checked> Let Kubernetes choose a node</label><div class="divider"></div><label class="label" for="node-selector">Node selector</label><input id="node-selector" placeholder="e.g. disktype = ssd" style="width:100%;padding:10px;background:var(--inset);border:1px solid var(--border);border-radius:6px"></div>`;return `<div class="section-top"><h3>Advanced</h3><span class="step">Pod settings</span></div><div class="compact-card"><div class="subhead">Security context</div><label class="checkrow"><input type="checkbox"> Run as non-root</label></div><div class="compact-card"><div class="subhead">Service account</div><select aria-label="Service account" style="width:100%;padding:10px;background:var(--inset);border:1px solid var(--border);border-radius:6px"><option>default</option></select></div><span class="hint-chip">Additional manifest fields remain available in YAML</span>`}
function yaml(){const d=state.draft,name=d.name||'resource-name',image=d.image||'image:tag';let y=`apiVersion: ${state.kind==='Pod'?'v1':'apps/v1'}\nkind: ${state.kind}\nmetadata:\n  name: ${name}\n  namespace: ${d.namespace}\n  labels:\n    app: ${name}\nspec:\n`;if(state.kind!=='Pod')y+=`  replicas: ${d.replicas}\n${state.kind==='Deployment'?`  strategy:\n    type: ${d.strategy}\n`:''}${state.kind==='StatefulSet'?`  serviceName: ${d.service||'select-headless-service'}\n`:''}  selector:\n    matchLabels:\n      app: ${name}\n  template:\n    metadata:\n      labels:\n        app: ${name}\n    spec:\n`;const p=state.kind==='Pod'?'  ':'      ';y+=`${p}containers:\n${p}  - name: ${d.container}\n${p}    image: ${image}\n`;if(d.port)y+=`${p}    ports:\n${p}      - containerPort: ${d.port}\n`;if(state.resourcesConfigured)y+=`${p}    resources:\n${p}      requests:\n${p}        cpu: ${d.cpuRequest}m\n${p}        memory: ${d.memRequest}Mi\n${p}      limits:\n${p}        cpu: ${d.cpuLimit}m\n${p}        memory: ${d.memLimit}Mi\n`;if(d.env.length)y+=`${p}    env:\n`+d.env.map(e=>`${p}      - name: ${e.key}\n${p}        value: ${JSON.stringify(e.value)}\n`).join('');if(state.kind==='StatefulSet'&&state.storageConfigured)y+=`${p}    volumeMounts:\n${p}      - name: ${d.claim}\n${p}        mountPath: ${d.mount}\n  volumeClaimTemplates:\n    - metadata:\n        name: ${d.claim}\n      spec:\n        accessModes: [ReadWriteOnce]\n${d.storageClass==='Use cluster default'?'':`        storageClassName: ${d.storageClass}\n`}        resources:\n          requests:\n            storage: ${d.storage}Gi\n`;return y}
function validate(){state.errors={};if(!state.draft.name)state.errors.name='Enter a resource name.';else if(!/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/.test(state.draft.name))state.errors.name='Use lowercase letters, numbers, and hyphens.';if(!state.draft.image)state.errors.image='Enter a container image.';if(state.kind==='StatefulSet'&&!state.draft.service)state.errors.service='Select an existing headless Service.';return !Object.keys(state.errors).length}
function review(){return `<div class="content review"><span class="hint-chip">${icon('LuEye',13)} Review draft</span><h3>${esc(state.draft.name)}</h3><dl><dt>Resource</dt><dd>${esc(state.kind)}</dd><dt>Destination</dt><dd>dev-us-east / ${esc(state.draft.namespace)}</dd><dt>Image</dt><dd>${esc(state.draft.image)}</dd>${state.kind!=='Pod'?`<dt>Replicas</dt><dd>${esc(state.draft.replicas)}</dd>`:''}${state.kind==='StatefulSet'?`<dt>Governing Service</dt><dd>${esc(state.draft.service)}</dd>`:''}</dl><div class="notice">Design preview only. No Kubernetes API request is sent. Production review must validate the final manifest and show server errors without discarding the draft.</div></div>`}
function render(){shell();const layer=document.querySelector('#layer');layer.innerHTML=state.open?`<div class="veil"></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><div class="kind-icon">${icon('SiKubernetes',23)}</div><div><h2 id="dialog-title">Create ${esc(state.kind)}</h2><div class="context"><span class="dot" style="margin:0"></span><b>dev-us-east</b><span>/</span>${esc(state.draft.namespace)}</div></div><div class="head-actions"><div class="segments" role="radiogroup" aria-label="Editing mode"><button role="radio" aria-checked="${state.mode==='form'}" data-mode="form">${icon('LuListChecks',14)} Form</button><button role="radio" aria-checked="${state.mode==='yaml'}" data-mode="yaml">${icon('LuCode',14)} YAML</button></div><button class="icon-btn" id="close" aria-label="Close dialog">${icon('LuX',19)}</button></div></header><div class="dialog-body">${state.review?review():state.mode==='yaml'?`<div class="content editor"><div class="editor-bar">${icon('LuFileCode',14)} ${state.kind.toLowerCase()}.yaml <small>${state.yamlEdited?'Edited in YAML':'Generated from form'}　·　${state.kind==='Pod'?'v1':'apps/v1'}</small></div><textarea aria-label="YAML manifest" spellcheck="false">${esc(state.yaml)}</textarea>${state.yamlEdited?'<div class="editor-warning">YAML draft preserved. Prototype cannot safely map edited YAML back to fields; Form is read-only until YAML edits are reverted.</div>':''}</div>`:`<nav class="section-nav" aria-label="Form sections"><div class="nav-label">Configuration</div>${Object.keys(icons).map(s=>`<button data-section="${s}" class="${state.section===s?'active':''}" ${state.section===s?'aria-current="step"':''}>${icon(icons[s],15)} ${s}${s==='Containers'?'<span class="count">1</span>':''}</button>`).join('')}<div class="nav-foot">Destination<br><strong>dev-us-east</strong><br>${esc(state.draft.namespace)}</div></nav><div class="content">${state.yamlEdited?'<div class="editor-warning">Form preview is read-only while edited YAML is preserved. Return to YAML to continue.</div>':''}<fieldset style="border:0;padding:0;margin:0;min-width:0" ${state.yamlEdited?'disabled':''}>${state.section==='Basics'?basics():state.section==='Containers'?containers():state.section==='Storage'?storage():other()}</fieldset></div>`}</div><footer class="footer"><span class="footer-note">${icon('LuFileCode',13)} ${state.mode==='yaml'?'YAML is the manifest source':state.review?'No resources created':'Changes stay in this draft'}</span>${state.review?'<button id="back">Back to form</button>':'<button id="cancel">Cancel</button>'}<button class="primary" id="review" ${state.mode==='yaml'?'disabled':''}>${state.review?'Close preview':`Review ${esc(state.kind)}`} ${icon('LuArrowRight',14)}</button></footer></section><span class="mock-label">Interactive mock · sample cluster · no API calls</span>`:'';
if(!state.open)return;document.querySelector('#close').onclick=close;document.querySelector('#cancel')?.addEventListener('click',close);document.querySelector('#back')?.addEventListener('click',()=>{state.review=false;render()});document.querySelector('#review').onclick=()=>{if(state.review){state.review=false;render();return}if(validate()){state.review=true;render()}else{state.section='Basics';render();document.querySelector('.invalid')?.focus()}};
layer.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='yaml'&&state.mode!=='yaml'&&!state.yamlEdited)state.yaml=yaml();state.mode=b.dataset.mode;state.review=false;render()});layer.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;render()});layer.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{state.draft[el.dataset.key]=el.value;if(['cpuRequest','cpuLimit','memRequest','memLimit'].includes(el.dataset.key))state.resourcesConfigured=true;if(['storage','storageClass','mount','claim'].includes(el.dataset.key))state.storageConfigured=true;delete state.errors[el.dataset.key]}));layer.querySelectorAll('[data-env]').forEach(el=>el.oninput=()=>{const[i,k]=el.dataset.env.split(':');state.draft.env[+i][k]=el.value});layer.querySelectorAll('[data-remove-env]').forEach(el=>el.onclick=()=>{state.draft.env.splice(+el.dataset.removeEnv,1);render()});document.querySelector('#add-env')?.addEventListener('click',()=>{state.draft.env.push({key:'',value:''});render();layer.querySelectorAll('[data-env]')[state.draft.env.length*2-2].focus()});document.querySelector('#labels-toggle')?.addEventListener('click',e=>{if(e.target.closest('[data-help]'))return;state.advanced=!state.advanced;render()});document.querySelector('#probe-toggle')?.addEventListener('click',()=>{state.resources=!state.resources;render()});layer.querySelector('textarea')?.addEventListener('input',e=>{state.yaml=e.target.value;state.yamlEdited=true});layer.querySelectorAll('[data-help]').forEach(b=>{b.onmouseenter=()=>showHelp(b);b.onfocus=()=>showHelp(b);b.onclick=e=>{e.stopPropagation();showHelp(b)};b.onmouseleave=hideHelp;b.onblur=hideHelp});}
function close(){state.open=false;hideHelp();render();document.querySelector('#launch').focus()}
function hideHelp(){document.querySelector('.tooltip')?.remove();state.help=null}
function showHelp(b){hideHelp();const key=b.dataset.help,[title,text]=helpData[key],box=b.getBoundingClientRect(),t=document.createElement('div');t.className='tooltip';t.role='tooltip';t.id='help-popup';t.innerHTML=`<strong>${esc(title)}</strong>${esc(text)}`;t.style.left=Math.min(box.left-20,innerWidth-315)+'px';t.style.top=Math.min(box.bottom+10,innerHeight-180)+'px';document.querySelector('#layer').append(t);b.setAttribute('aria-describedby','help-popup');state.help=key}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.help)hideHelp();else close()}if(e.key==='Tab'&&state.open){const a=[...document.querySelector('.dialog').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(x=>x.offsetParent);const first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.__mock={state,freezeAt(ms){for(const a of document.getAnimations()){a.pause();a.currentTime=ms}}};render();
</script></body></html>
