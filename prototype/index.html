function syntax(text){const re=/(\{\{[^}]*\}\}|"(?:\\.|[^"\\])*"|\b(?:sum|by|rate|avg|max|min|histogram_quantile|increase)\b|\b\d+(?:\.\d+)?(?:ms|[smhd])?\b)/g;let out='',last=0;for(const m of text.matchAll(re)){out+=E(text.slice(last,m.index));const token=m[0];if(token.startsWith('"'))out+='<span class="tok-string">'+E(token).replace(/\{\{[^}]*\}\}/g,v=>'<span class="tok-var">'+v+'</span>')+'</span>';else out+='<span class="'+(token.startsWith('{{')?'tok-var':/^\d/.test(token)?'tok-number':'tok-fn')+'">'+E(token)+'</span>';last=m.index+token.length}return out+E(text.slice(last))}
function nav(){document.getElementById('nav').innerHTML='<div class="group">Core</div>'+[['Appearance','palette'],['Developer Settings','settings'],['Editor','code'],['General','settings'],['Telemetry','settings'],['Terminal','terminal'],['AI Tools','bot']].map(([n,i])=>`<button data-nav="${n}">${icon(i)}${n}</button>`).join('')+'<div class="group">Plugins</div>'+[['Kubernetes','cube'],['Grafana','grafana']].map(([n,i])=>`<button data-nav="${n}" class="${n===state.selectedNav?'selected':''}">${icon(i)}${n}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav==='Kubernetes'){setClusterView();return}state.selectedNav='Grafana';state.tab='connections';render()})}
function footer(){if(state.view==='cluster')return;const count=document.querySelector('[data-tab="connections"] .count');if(count)count.textContent=providerCatalog.length+connectionState.added.length;document.getElementById('saveStatus').textContent=state.dirty?'Unsaved changes':'All changes saved';document.getElementById('discard').hidden=!state.dirty;const s=document.getElementById('saveAll');s.textContent=state.dirty?'Save Changes':'Done';s.className=state.dirty?'primary':''}
function render(){
  initializeClusters();
  if(state.view==='cluster'){renderCluster();return}
  applyGlobalChrome();nav();
  document.querySelector('h1').innerHTML='<span>Plugins / </span>'+E(state.selectedNav);
  document.getElementById('tabs').innerHTML=[['connections','Connections',providerCatalog.length+connectionState.added.length],['datasources','Data sources',availableProviders().reduce((n,p)=>n+p.sources.length,0)],['mappings','Global mappings',metrics.length]].map(([id,n,c])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${n}<span class="count">${c}</span></button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
  document.getElementById('top').innerHTML=state.tab==='mappings'?`<div class="toolbar"><input id="filter" class="find" placeholder="Search metrics or queries…" aria-label="Search metric mappings" value="${E(state.filter)}"><select id="kind" aria-label="Resource type">${['All resources','Pod','Node','Deployment','StatefulSet'].map(v=>`<option ${state.kind===v?'selected':''}>${v}</option>`).join('')}</select><select id="statusFilter" aria-label="Mapping status">${['All mappings','Modified','Custom','Disabled'].map(v=>`<option ${state.status===v?'selected':''}>${v}</option>`).join('')}</select><span class="spacer"></span><button id="add">${icon('plus')}Add metric</button></div>`:'';
  renderBody();footer();
  if(state.tab==='mappings'){
    document.getElementById('filter').oninput=e=>{state.filter=e.target.value;renderBody()};
    document.getElementById('kind').onchange=e=>{state.kind=e.target.value;renderBody()};
    document.getElementById('statusFilter').onchange=e=>{state.status=e.target.value;renderBody()};
    document.getElementById('add').onclick=()=>{metrics.push({id:metrics.length,name:'Custom metric',resource:'Pod',unit:'req/s',metric:'http_requests_total',query:query('http_requests_total',true),preset:false,enabled:true,changed:true});state.open=metrics.length-1;state.filter='';state.status='All mappings';state.dirty=true;render()};
  }
}
function filtered(){return metrics.filter(m=>(state.kind==='All resources'||m.resource===state.kind)&&(`${m.name} ${m.query}`.toLowerCase().includes(state.filter.toLowerCase()))&&(state.status==='All mappings'||state.status==='Modified'&&m.changed||state.status==='Custom'&&!m.preset||state.status==='Disabled'&&!m.enabled))}
function renderBody(){const body=document.getElementById('body');if(state.view==='cluster'){renderClusterBody();return}if(state.tab==='connections'){body.innerHTML=connections();bindSettings();return}if(state.tab==='datasources'){body.innerHTML=globalDataSources();return}const list=filtered();body.innerHTML=list.map(m=>`<article class="mapping ${state.open===m.id?'expanded':''}" data-id="${m.id}"><div class="row"><button class="toggle" data-expand="${m.id}" aria-label="${state.open===m.id?'Collapse':'Edit'} ${E(m.name)} ${m.resource}" aria-expanded="${state.open===m.id}">${icon(state.open===m.id?'down':'chevron')}</button><span class="ref">${String.fromCharCode(65+m.id)}</span><button class="name" data-expand="${m.id}">${E(m.name)}</button><span class="resource">${m.resource}</span><span class="badge">${m.unit}</span>${m.changed?'<span class="badge changed">Modified</span>':!m.preset?'<span class="badge">Custom</span>':''}<span class="spacer"></span><span class="source">Global default</span><button class="toggle-enabled ${m.enabled?'':'off'}" data-enabled="${m.id}" aria-label="${m.enabled?'Disable':'Enable'} ${E(m.name)} ${m.resource}"><i></i></button></div>${state.open===m.id?editor(m):`<div class="query-preview" title="${E(m.query)}">${syntax(m.query)}</div>`}</article>`).join('')+(list.length?`<div class="summary">${list.length} global mappings</div>`:'<div class="empty">No matching metrics</div>');document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{const id=+b.dataset.expand;state.open=state.open===id?null:id;state.result=false;state.valid=false;state.bindings=false;state.picker=false;renderBody()});document.querySelectorAll('[data-enabled]').forEach(b=>b.onclick=()=>{metrics[+b.dataset.enabled].enabled=!metrics[+b.dataset.enabled].enabled;state.dirty=true;renderBody();footer()});bindEditor()}
function editor(m){return `<section class="editor"><div class="editorbar"><span class="quiet">Data source</span><select aria-label="Query data source"><option>grafanacloud-eu / Prometheus</option></select><span class="spacer"></span><span class="quiet">PromQL</span><span class="seg"><button class="selected" disabled>Code</button></span><button id="reset" class="ghost">Reset</button></div><div class="codebox"><span class="ln">1<br>2<br>3<br>4</span><pre id="highlight" aria-hidden="true">${syntax(m.query)}</pre><textarea id="code" spellcheck="false" aria-label="PromQL query">${E(m.query)}</textarea></div><div class="options"><label>Type <select aria-label="Query type"><option>Range</option><option>Instant</option></select></label><label>Min step <select><option>15s</option><option>30s</option><option>1m</option></select></label><span>Unit <b>${m.unit}</b></span><span class="spacer"></span><span class="quiet">Batch by cluster / namespace / ${m.resource.toLowerCase()}</span></div><div class="editor-actions"><button id="run" class="primary">${icon('play')}Run query</button><button id="variables" class="ghost">${icon('code')}Variables <span class="count">3</span></button><button id="inspect" class="ghost">Query inspector</button><span class="spacer"></span><span class="result-status ${state.message.startsWith('Missing')?'error':''}" id="queryStatus">${E(state.message)}</span></div>${state.bindings?variablePanel():''}${state.result?chart(m):''}</section>`}
function variablePanel(){return `<div class="binding"><div class="binding-head"><b>Variables & identity</b><span class="quiet">Sample: api-7c9d-0</span></div><table><tr><th>Variable</th><th>Source field</th><th>Sample</th></tr><tr><td><code>connection.metricsCluster</code></td><td>/metrics/cluster</td><td>prod-eu-01</td></tr><tr><td><code>resource.metadata.namespace</code></td><td>/metadata/namespace</td><td>checkout</td></tr><tr><td><code>resource.metadata.name</code></td><td><button class="ghost" id="pickField">${E(state.identityPath)} ▾</button></td><td>api-7c9d-0</td></tr></table>${state.picker?`<div class="field-picker">${['/metadata/name','/metadata/uid','/spec/nodeName'].map(p=>`<button data-path="${p}">${p}<small>string</small></button>`).join('')}</div>`:''}<div class="options"><label>Join label <input id="identityLabel" value="${E(state.identityLabel)}" style="width:100px;height:25px"></label><span class="quiet">cluster + namespace + ${E(state.identityLabel)}</span><span class="spacer"></span><span>Literal-safe interpolation</span></div></div>`}
function chart(m){return `<div class="chart"><div class="chart-top"><b>${E(m.name)}</b><span>Last 15 minutes</span><span class="spacer"></span><span>24 series · 1 expression · fixture</span></div><svg viewBox="0 0 800 82" preserveAspectRatio="none"><path d="M0 15H800M0 40H800M0 65H800" stroke="#25272c" fill="none"/><path d="M0 62 25 60 50 54 75 58 100 41 125 45 150 39 175 47 200 33 225 37 250 27 275 35 300 30 325 18 350 25 375 32 400 26 425 15 450 20 475 28 500 14 525 19 550 10 575 17 600 26 625 18 650 23 675 12 700 20 725 13 750 17 775 10 800 15" fill="none" stroke="#73bf69" stroke-width="1.5"/><path d="M0 72 25 69 50 65 75 70 100 60 125 61 150 56 175 64 200 53 225 59 250 51 275 54 300 53 325 43 350 50 375 55 400 47 425 42 450 48 475 50 500 43 525 47 550 36 575 45 600 51 625 46 650 49 675 39 700 45 725 36 750 46 775 39 800 44" fill="none" stroke="#89a7ee" stroke-width="1.5"/></svg><div class="legend"><span style="color:#73bf69">— api-7c9d-0</span><span style="color:#89a7ee">— api-7c9d-1</span><span>+22 series</span></div></div>`}
function bindEditor(){if(state.open===null||!document.getElementById('code'))return;const m=metrics[state.open],code=document.getElementById('code');code.oninput=()=>{m.query=code.value;m.changed=true;state.dirty=true;state.valid=false;state.result=false;state.message='';document.getElementById('highlight').innerHTML=syntax(code.value);document.getElementById('queryStatus').textContent='';document.querySelector('.chart')?.remove();footer()};code.onscroll=()=>{document.getElementById('highlight').scrollTop=code.scrollTop};document.getElementById('variables').onclick=()=>{state.bindings=!state.bindings;renderBody()};document.getElementById('reset').onclick=()=>{const original=JSON.parse(initial).find(v=>v.id===m.id);if(original)m.query=original.query;else m.query=query(m.metric,true);m.changed=false;state.dirty=true;state.valid=false;state.message='';renderBody();footer()};document.getElementById('run').onclick=()=>{state.valid=m.query.includes('{{connection.metricsCluster}}')&&m.query.includes('{{resource.metadata.name}}')&&state.identityPath==='/metadata/name'&&state.identityLabel==='pod'&&m.query.trim().length>0;state.result=state.valid;state.message=state.valid?'24 / 24 matched · sample data':'Missing or unmatched identity variable';renderBody()};document.getElementById('inspect').onclick=()=>{state.bindings=true;state.message='Plan preview · cluster / namespace / pod · 24 identities';renderBody()};document.getElementById('pickField')?.addEventListener('click',()=>{state.picker=!state.picker;renderBody()});document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{state.identityPath=b.dataset.path;state.picker=false;state.valid=false;state.dirty=true;renderBody();footer()});const label=document.getElementById('identityLabel');if(label)label.oninput=e=>{state.identityLabel=e.target.value;state.valid=false;state.dirty=true;footer()}}
function connections(){const count=document.querySelector('[data-tab="connections"] .count');if(count)count.textContent=providerCatalog.length+connectionState.added.length;if(connectionState.setup)return connectionSetup();return `<div class="connection-toolbar"><strong>Connections</strong><button id="connectGrafana">${icon('plus')}Connect Grafana</button></div><div class="connection-grid">${providerCatalog.map((p,i)=>connectionCard(p.id,p.host,p.mode,i===0)).join('')}${connectionState.added.map(c=>connectionCard(c.name,c.host,c.mode,false)).join('')}<button class="add-connection" id="addGrafana">${icon('grafana')}<strong>Connect to Grafana</strong><small>Grafana Cloud or your own instance</small></button></div><div class="connection-caption">${icon('lock')}Read-only access · credentials stay on your device</div>`}
function bindSettings(){document.querySelectorAll('[data-setting]').forEach(e=>e.onchange=()=>{state.dirty=true;footer()});document.querySelectorAll('[data-view-sources]').forEach(b=>b.onclick=()=>{state.tab='datasources';render()});if(state.tab==='connections')bindConnections();}
function toast(s){document.getElementById('layer').innerHTML='<div class="toast" role="status">'+E(s)+'</div>';setTimeout(()=>document.getElementById('layer').replaceChildren(),2500)}
function connectionCard(name,host,mode,existing){const catalog=providerByID(name),sources=catalog?.sources||[];return `<article class="connection-card"><div class="connection-head"><div class="logo-tile">${icon('grafana')}</div><div><div class="connection-title">${E(name)}</div><div class="connection-host">${E(host)}</div></div><span class="spacer"></span><span class="health">${icon('connected')}Connected</span></div><div class="connection-meta"><span>${icon(mode==='cloud'?'cloud':'server')}${mode==='cloud'?'Grafana Cloud':'Self-hosted'}</span><span>${icon('shield')}Read only</span><span>${icon('prometheus')}Prometheus</span></div><div class="card-sources">${icon('database')}${sources.length||1} data source${sources.length===1?'':'s'}<span class="spacer"></span>${sources.length?`<button class="ghost" data-view-sources style="font-size:10px;height:22px">View sources${icon('chevron')}</button>`:'Ready to map'}</div>${existing&&connectionState.details?`<div class="connection-details"><div><label>Minimum interval</label><select data-setting><option>15 seconds</option><option>30 seconds</option></select></div><div><label>Credential</label><select><option>metrics-readonly</option></select></div></div>`:''}<div class="connection-bottom"><span class="key-status">${icon('lock')}${existing?'metrics-readonly':'Read token'}<span class="quiet">· local</span></span><span class="spacer"></span>${existing?`<button class="ghost" id="testConnection" aria-label="Test connection">${icon('refresh')}${state.tested?'Checked':'Test'}</button><button class="ghost" id="manageConnection">${icon('settings')}Manage</button>`:`<button class="ghost" data-map-new>${icon('code')}Global mappings</button>`}</div></article>`}
function connectionSetup(){const c=connectionState;const steps=['Instance','Access','Connected'].map((s,i)=>`${i?'<span class="step-line"></span>':''}<span class="step ${c.step===i+1?'current':c.step>i+1?'past':''}"><b>${c.step>i+1?'✓':i+1}</b>${s}</span>`).join('');return `<section class="setup"><div class="setup-head"><div class="logo-tile">${icon('grafana')}</div><div><h2>Connect to Grafana</h2><p>${c.step===1?'Choose your instance':c.step===2?'Add read-only access':'Your metrics connection is ready'}</p></div><span class="spacer"></span><button class="ghost icon" id="cancelSetup" aria-label="Cancel connection">${icon('close')}</button></div><div class="setup-body"><div class="steps">${steps}</div>${c.step===1?`<div class="deployment-choices"><button class="deployment ${c.mode==='cloud'?'selected':''}" data-mode="cloud">${icon('cloud')}<span><strong>Grafana Cloud</strong><small>Query your Cloud Metrics</small></span><span class="spacer"></span>${c.mode==='cloud'?icon('connected'):''}</button><button class="deployment ${c.mode==='self'?'selected':''}" data-mode="self">${icon('server')}<span><strong>Self-hosted</strong><small>Use a Grafana data source</small></span><span class="spacer"></span>${c.mode==='self'?icon('connected'):''}</button></div><div class="form-field"><label class="form-label" for="grafanaURL">${icon('link')}Grafana URL</label><input id="grafanaURL" type="url" placeholder="https://${c.mode==='cloud'?'your-team.grafana.net':'grafana.example.com'}" value="${E(c.url)}" autocomplete="off"></div><div class="form-field"><label class="form-label" for="connectionName">Connection name</label><input id="connectionName" placeholder="${c.mode==='cloud'?'grafanacloud-production':'grafana-production'}" value="${E(c.name)}" autocomplete="off"></div>`:c.step===2?accessForm():`<div class="setup-success"><div class="success-mark">${icon('check')}</div><h3>${E(c.name)}</h3><p>${E(new URL(c.url).hostname)}</p></div><div class="checklist"><div class="check-row">${icon('connected')}Read access<span class="quiet">${c.mode==='cloud'?'metrics:read':'datasources:query'}</span></div><div class="check-row">${icon('connected')}${c.mode==='cloud'?'Cloud Metrics endpoint':'Prometheus data source'}<span class="quiet">Verified in preview</span></div><div class="check-row">${icon('lock')}Credential storage<span class="quiet">Local · proposed</span></div></div>`}${c.error?`<div class="setup-error" role="alert">${icon('alert')}${E(c.error)}</div>`:''}</div><div class="setup-footer">${c.step>1&&c.step<3?`<button class="ghost" id="backSetup">Back</button>`:`<span class="muted-inline">${icon('shield')}Read-only metrics</span>`}<span class="spacer"></span>${c.step===1?`<button class="orange-btn" id="continueSetup">Continue${icon('arrow')}</button>`:c.step===2?`<button class="ghost" id="demoCredentials">Use sample values</button><button class="orange-btn" id="verifySetup">${icon('link')}Test & connect</button>`:`<button class="ghost" id="finishSetup">Done</button><button class="orange-btn" id="finishMapping">${icon('code')}Map metrics</button>`}</div></section>`}
function accessForm(){const c=connectionState;const docs=c.mode==='cloud'?'https://grafana.com/docs/grafana-cloud/security-and-account-management/authentication-and-permissions/access-policies/create-access-policies/':'https://grafana.com/docs/grafana/latest/administration/service-accounts/';return `<div class="token-guide">${icon('key')}<div><strong>${c.mode==='cloud'?'Cloud access policy token':'Service account token'}</strong><span class="scope-chip">${c.mode==='cloud'?'metrics:read':'datasources:read + datasources:query'}</span></div><a href="${E(new URL(c.mode==='cloud'?'':new URL(c.url).pathname.replace(/\/?$/,'/')+'org/serviceaccounts',c.url).href)}" target="_blank" rel="noopener noreferrer">Open Grafana${icon('external')}</a></div>${c.mode==='cloud'?`<div class="input-grid"><div class="form-field"><label class="form-label" for="metricsInstance">Metrics instance ID</label><input id="metricsInstance" inputmode="numeric" value="${E(c.instance)}" placeholder="1234567"></div><div class="form-field"><label class="form-label" for="metricsEndpoint">Prometheus query URL</label><input id="metricsEndpoint" type="url" value="${E(c.endpoint)}" placeholder="https://prometheus-….grafana.net/api/prom"></div></div>`:`<div class="form-field"><label class="form-label" for="datasourceUID">${icon('database')}Prometheus data source UID</label><input id="datasourceUID" value="${E(c.instance)}" placeholder="prometheus-production"></div>`}<div class="form-field"><label class="form-label" for="readToken">${icon('key')}${c.mode==='cloud'?'Access policy token':'Service account token'}</label><div class="token-input"><input id="readToken" type="password" autocomplete="off" placeholder="${c.hasToken?'Sample token entered':'Paste token'}"><span>${icon('lock')}Local only</span></div><div class="setup-note">No token? <a class="token-help" href="${docs}" target="_blank" rel="noopener noreferrer">Token setup${icon('external')}</a><span style="float:right">Preview · do not enter real credentials</span></div></div>`}
function bindConnections(){
  const c=connectionState,on=(id,fn)=>document.getElementById(id)?.addEventListener('click',fn),redraw=()=>renderBody();
  const start=()=>{Object.assign(c,{setup:true,step:1,error:'',verified:false,hasToken:false});redraw()};
  on('connectGrafana',start);on('addGrafana',start);
  on('cancelSetup',()=>{c.setup=false;c.hasToken=false;c.error='';redraw()});
  on('manageConnection',()=>{c.details=!c.details;redraw()});
  on('testConnection',()=>{state.tested=true;redraw();toast('Connection check passed · sample data')});
  document.querySelectorAll('[data-map-new]').forEach(b=>b.onclick=()=>{state.tab='mappings';render()});
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{c.mode=b.dataset.mode;c.url='';c.name='';c.instance='';c.endpoint='';c.hasToken=false;c.error='';redraw()});
  for(const[id,key]of[['grafanaURL','url'],['connectionName','name'],['metricsInstance','instance'],['metricsEndpoint','endpoint'],['datasourceUID','instance']]){const e=document.getElementById(id);if(e)e.oninput=()=>{c[key]=e.value;c.error=''}}
  const token=document.getElementById('readToken');if(token)token.oninput=()=>{c.hasToken=token.value.length>0};
  on('continueSetup',()=>{try{const u=new URL(c.url);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error();if(c.mode==='cloud'&&!u.hostname.endsWith('.grafana.net')){c.error='Use your Grafana Cloud stack URL.';redraw();return}c.url=u.href;c.name=c.name.trim()||u.hostname.split('.')[0];c.step=2;c.error='';redraw()}catch{c.error='Enter a valid HTTPS Grafana URL.';redraw()}});
  on('backSetup',()=>{c.step=1;c.error='';c.hasToken=false;redraw()});
  on('demoCredentials',()=>{if(c.mode==='cloud'){c.instance='1234567';c.endpoint='https://prometheus-prod-eu.grafana.net/api/prom'}else c.instance='prometheus-production';c.hasToken=true;redraw();document.getElementById('readToken').value='sample-token-not-a-credential'});
  on('verifySetup',()=>{if(!c.hasToken||!c.instance.trim()||(c.mode==='cloud'&&(!/^[0-9]+$/.test(c.instance)||!validQueryURL(c.endpoint)))){c.hasToken=false;c.error=c.mode==='cloud'?'Add an instance ID, HTTPS query URL, and read token.':'Add a data source UID and read token.';redraw();return}c.step=3;c.verified=true;c.error='';c.hasToken=false;redraw()});
  const finish=map=>{if(!c.verified)return;const id=c.name.trim();if(availableProviders().some(p=>p.id===id)){c.error='Choose a unique connection name.';redraw();return}c.added.push({name:id,host:new URL(c.url).hostname,mode:c.mode,sources:[{uid:c.mode==='cloud'?'cloud-metrics':c.instance,name:c.mode==='cloud'?'Cloud Metrics':c.instance,kind:'prometheus'}]});c.setup=false;c.verified=false;if(map){state.tab='mappings';render()}else redraw()};
  on('finishSetup',()=>finish(false));on('finishMapping',()=>finish(true));
}
function validQueryURL(value){try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password&&!u.search&&!u.hash}catch{return false}}
document.getElementById('discard').onclick=()=>{const saved=JSON.parse(initial);metrics.splice(0,metrics.length,...saved);state.dirty=false;state.message='';state.result=false;state.open=null;render()};document.getElementById('saveAll').onclick=()=>{if(state.dirty){state.dirty=false;footer();toast('Changes saved in preview')}else toast('Settings preview')};document.getElementById('close').onclick=()=>toast('Settings preview');document.getElementById('settingsSearch').oninput=e=>{state.filter=e.target.value;state.tab='mappings';render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.open!==null){state.open=null;renderBody()}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&document.getElementById('run')){e.preventDefault();document.getElementById('run').click()}});window.__mock={state,metrics,freezeAt(ms){document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms})}};render();
</script></body></html>
