  if(deleted)body='<div class="empty">'+I('LuFile')+'<h2>Deleted '+(n.liveDeleted?'from running filesystem':'in layer 3')+'</h2>This file is absent from the resulting filesystem.<br>Previous metadata · '+size(n.size)+'<p><button id="previous">View previous contents</button></p></div>';
  else if(locked)body='<div class="empty">'+I('LuLock')+'<h2>Permission denied</h2>Provider cannot list /root as uid 101.<br>Other directories remain available.</div>';
  else if(dir)body='<div class="empty">'+I('LuFolderOpen')+'<h2>'+esc(n.name)+'</h2>Directory · expand to inspect loaded children.<br>Provider loads additional children on demand.</div>';
  else if(n.kind==='link')body='<div class="empty">'+I('LuLink')+'<h2>Symbolic link</h2>/bin/sh → /bin/busybox<br>Target resolution stays within provider root.<p><button id="follow">Reveal target metadata</button></p></div>';
  else if(state.mode==='Compare'&&n.name==='nginx.conf')body='<div class="diffbar"><span>BASE IMAGE · read-only</span><span>RUNNING SNAPSHOT · +3 −2 lines</span></div><div class="diffcols"><div class="code">'+lines(base,true)+'</div><div class="code">'+lines(current,true)+'</div></div>';
  else if(state.mode==='Compare'&&n.change==='A')body='<div class="notice">Added in running filesystem · no baseline content</div><div class="code">'+lines(fileContents(n))+'</div>';
  else if(state.mode==='Compare'&&n.change==='M')body='<div class="empty"><h2>Structural change detected</h2>Baseline text is not loaded in this fixture.<br>Content comparison remains unknown.</div>';
  else body='<div class="code">'+lines(fileContents(n))+'</div>';
  return `<section class="preview" aria-label="File preview"><div class="previewhead">${I('LuFileCode')} <strong>${esc(n.name)}</strong><span class="tag">${state.mode==='Compare'?'DIFF':'READ ONLY'}</span><button id="details" class="quiet" aria-label="File metadata">${I('LuEllipsis')}</button></div><div class="crumb">${esc(n.path)}${n.change?' <span class="pill '+(n.change==='D'?'red':'amber')+'">'+({M:'Modified',D:'Deleted',A:'Added'}[n.change])+'</span>':''}</div>${body}<dl class="kv"><dt>Size / mode</dt><dd>${size(n.size)} · ${dir||locked?'drwxr-xr-x · 0755':n.kind==='link'?'lrwxrwxrwx · 0777':'-rw-r--r-- · 0644'}</dd><dt>Owner</dt><dd>${n.path.startsWith('/app')||n.path.startsWith('/var/log')?'nginx (101) : nginx (101)':'root (0) : root (0)'}</dd><dt>Origin</dt><dd>Layer ${n.layer} · ${esc(layers[n.layer][1])}</dd><dt>Modified</dt><dd>2026-11-01 10:42:12 UTC</dd></dl></section>`;
}
function activity(){return `<div class="activity"><div style="display:flex;justify-content:space-between"><strong>${I('LuRadio')} Live changes ${state.paused?'· view paused':'· following'} ${state.pending?'· '+state.pending+' pending':''}</strong><span class="muted">Simulation · stable selection; queued view updates</span></div>${state.events.length?state.events.slice(-3).map(e=>'<div class="event"><time>10:42:'+String(12+e.id).padStart(2,'0')+'</time><span class="green">'+e.kind.toUpperCase()+'</span><code>'+e.path+'</code><span class="muted">sequence '+(1042+e.id)+'</span></div>').join(''):'<span class="muted">No events yet. Simulate update to inspect change feedback.</span>'}</div>`}
function stateSurface(){return `<section class="preview"><div class="toolbar"><label for="scenario">Provider state</label><select id="scenario">${['permission','loading','empty','offline','binary','large','missing-tar'].map(v=>'<option '+(state.scenario===v?'selected':'')+'>'+v+'</option>').join('')}</select></div><div class="empty">${I(state.scenario==='permission'?'LuLock':'LuCircleAlert')}<h2>${({permission:'Permission denied',loading:'Loading /usr/lib…',empty:'Directory is empty',offline:'Filesystem disconnected',binary:'Binary file · libssl.so.3',large:'Preview limit reached · access.log', 'missing-tar':'Archive export unavailable'})[state.scenario]}</h2>${({permission:'Cannot list /root as uid 101. No escalation occurs automatically.',loading:'Only this branch is pending. Existing files stay interactive. Cancel stops the provider request.',empty:'No children in this directory. This differs from no search results.',offline:'Last snapshot remains visible, marked stale. Reconnect before trusting new reads.',binary:'1.7 MB · application/x-sharedlib. Binary preview is not supported. Metadata remains available.',large:'Showing first 64 KB of 284 MB. Consumer chooses streaming or download.', 'missing-tar':'Provider reports tar is missing in this container. Browsing and non-archive actions remain available.'})[state.scenario]}<p><button id="stateaction">${state.scenario==='loading'?'Cancel load':state.scenario==='empty'?'Refresh directory':state.scenario==='binary'||state.scenario==='large'?'Download file':state.scenario==='missing-tar'?'View capability details':'Retry'}</button></p></div></section>`}
function selectNode(path,e={}){const old=state.selected;state.selected=path;if(e.shiftKey){const paths=visible().map(n=>n.path),a=paths.indexOf(old),b=paths.indexOf(path);state.selection=new Set(paths.slice(Math.min(a,b),Math.max(a,b)+1))}else if(e.metaKey||e.ctrlKey){state.selection.has(path)?state.selection.delete(path):state.selection.add(path)}else state.selection=new Set([path]);render();focusPath(path)}
function focusPath(path){document.querySelectorAll('[data-path]').forEach(el=>{if(el.dataset.path===path){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest'})}})}
function bind(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.query='';state.changed=false;state.selected='/etc/nginx/nginx.conf';state.selection=new Set([state.selected]);history.replaceState(null,'','?mode='+encodeURIComponent(state.mode));render()});
  document.querySelectorAll('[data-path]').forEach(el=>{
    el.onclick=e=>{if(e.target.closest('[data-expand]')){const n=nodes.find(n=>n.path===el.dataset.path);if(n.kind==='dir'){state.expanded.has(n.path)?state.expanded.delete(n.path):state.expanded.add(n.path)}}selectNode(el.dataset.path,e)};
    el.ondblclick=()=>{const n=nodes.find(n=>n.path===el.dataset.path);if(n.kind==='dir'){state.expanded.has(n.path)?state.expanded.delete(n.path):state.expanded.add(n.path);render();focusPath(n.path)}};
    el.oncontextmenu=e=>{e.preventDefault();selectNode(el.dataset.path);state.menu={x:Math.min(e.clientX,innerWidth-210),y:Math.min(e.clientY,innerHeight-170)};renderOverlay()};
    el.onkeydown=e=>treeKey(e);
  });
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};
  const filter=document.getElementById('filter');
  if(filter)filter.oninput=e=>{const start=e.target.selectionStart;state.query=e.target.value;render();const input=document.getElementById('filter');input.focus();input.setSelectionRange(start,start)};
  on('clear',()=>{state.query='';render();document.getElementById('filter').focus()});
  on('emptyclear',()=>{state.query='';render()});
  for(const id of ['changed','hidden']){const el=document.getElementById(id);if(el)el.onchange=()=>{state[id]=el.checked;render()}}
  on('preview',()=>{state.preview=!state.preview;render()});
  on('refresh',()=>{state.synced=true;state.modal='Snapshot refreshed';render()});
  on('export',()=>{state.modal='export';renderOverlay()});
  on('details',()=>{state.modal='Metadata contract';renderOverlay()});
  on('previous',()=>{state.modal='Previous snapshot contents';renderOverlay()});
  on('follow',()=>{state.modal='Link target /bin/busybox';renderOverlay()});
  on('pause',()=>{state.paused=!state.paused;if(!state.paused){state.pending=0;for(const e of pendingEvents)applyUpdate(e);pendingEvents.length=0}render()});
  const eventKind=document.getElementById('event-kind');if(eventKind)eventKind.onchange=()=>{state.eventKind=eventKind.value};
  on('event',()=>{const e={id:++eventId,kind:state.eventKind||'modify',path:'/var/log/access.log'};if(e.kind==='add')e.path='/var/log/request-'+e.id+'.log';if(e.kind==='delete'||e.kind==='rename')e.path=state.selected;if(state.paused){state.pending++;pendingEvents.push(e)}else applyUpdate(e);render()});
  on('gap',()=>{state.synced=false;render()});
  on('resync',()=>{state.synced=true;state.pending=0;pendingEvents.length=0;render()});
  const reconcileLayer=()=>{const rows=visible();if(!rows.some(n=>n.path===state.selected)){state.selected=rows.find(n=>n.kind==='file'||n.kind==='link')?.path||'';state.selection=new Set(state.selected?[state.selected]:[])}render()};
  document.querySelectorAll('[data-layer]').forEach(el=>el.onclick=()=>{state.layer=+el.dataset.layer;reconcileLayer()});
  const cum=document.getElementById('cumulative');if(cum)cum.onchange=()=>{state.cumulative=cum.checked;reconcileLayer()};
  const scenario=document.getElementById('scenario');if(scenario)scenario.onchange=()=>{state.scenario=scenario.value;state.tar=scenario.value!=='missing-tar';render()};
  on('stateaction',()=>{state.modal=state.scenario==='missing-tar'?'Archive capability':state.scenario==='loading'?'Load cancelled':state.scenario==='binary'||state.scenario==='large'?'Download request':'Provider retry';renderOverlay()});
  const split=document.querySelector('.split');
  if(split){
    split.onpointerdown=e=>{split.setPointerCapture(e.pointerId);split.onpointermove=e=>document.documentElement.style.setProperty('--tree-width',Math.max(230,Math.min(650,e.clientX-48-(state.mode==='Image layers'?265:0)))+'px');split.onpointerup=()=>split.onpointermove=null};
    split.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const w=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tree-width'));document.documentElement.style.setProperty('--tree-width',Math.max(230,Math.min(650,w+(e.key==='ArrowRight'?20:-20)))+'px')}};
  }
}
function applyUpdate(e){
  const n=nodes.find(n=>n.path===e.path);
  if(e.kind==='add'){nodes.push({path:e.path,name:e.path.split('/').pop(),parent:'/var/log',kind:'file',change:'A',size:124,layer:3,depth:2});state.expanded.add('/var');state.expanded.add('/var/log')}
  if(e.kind==='modify'&&n){n.size+=256;n.change='M'}
  if(e.kind==='delete'&&n&&!['dir','locked'].includes(n.kind)){n.previous=fileContents(n);n.liveDeleted=true;n.change='D'}
  if(e.kind==='rename'&&n&&!['dir','locked'].includes(n.kind)){const old=n.path;n.path=n.parent+'/'+n.name+'.1';n.name+='.1';e.path=old+' → '+n.path;if(state.selected===old)state.selected=n.path;if(state.selection.delete(old))state.selection.add(n.path)}
  state.events.push(e);
}
let eventId=0;const pendingEvents=[];
function treeKey(e){const rows=visible(),i=rows.findIndex(n=>n.path===state.selected),n=rows[i];let next;if(e.key==='ArrowDown')next=rows[Math.min(rows.length-1,i+1)];if(e.key==='ArrowUp')next=rows[Math.max(0,i-1)];if(e.key==='Home')next=rows[0];if(e.key==='End')next=rows.at(-1);if(next){e.preventDefault();selectNode(next.path,e);return}if(e.key==='ArrowRight'&&n?.kind==='dir'){e.preventDefault();if(state.expanded.has(n.path)){next=rows[i+1];if(next)selectNode(next.path)}else{state.expanded.add(n.path);render();focusPath(n.path)}}if(e.key==='ArrowLeft'&&n){e.preventDefault();if(state.expanded.has(n.path)){state.expanded.delete(n.path);render();focusPath(n.path)}else if(n.parent!=='/')selectNode(n.parent)}if(e.key==='Enter'&&n){e.preventDefault();if(n.kind==='dir'){state.expanded.has(n.path)?state.expanded.delete(n.path):state.expanded.add(n.path);render();focusPath(n.path)}else{state.preview=true;render();focusPath(n.path)}}if(e.key===' '&&n){e.preventDefault();selectNode(n.path,{ctrlKey:true})}if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&e.key!==' '){const match=[...rows.slice(i+1),...rows.slice(0,i+1)].find(r=>r.name.toLowerCase().startsWith(e.key.toLowerCase()));if(match)selectNode(match.path)}}
function renderOverlay(){
  const root=document.getElementById('layer'),node=nodes.find(n=>n.path===state.selected);
  if(state.menu){
    const downloadable=node&&node.kind==='file'&&node.change!=='D';
    root.innerHTML=`<div class="menu" role="menu" style="left:${state.menu.x}px;top:${state.menu.y}px"><button role="menuitem" data-action="copy">${I('LuCopy')} Copy path</button><button role="menuitem" data-action="metadata">${I('LuFileText')} View metadata</button><button role="menuitem" data-action="download" ${downloadable?'':'disabled'}>${I('LuDownload')} Download file</button></div>`;
    root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{state.modal=b.dataset.action==='copy'?'Copy path':b.dataset.action==='metadata'?'Metadata contract':'Download request';state.menu=null;renderOverlay()});
    root.querySelector('button').focus();return;
  }
  if(!state.modal){root.innerHTML='';return}
  const exp=state.modal==='export';
  let content;
  if(exp)content=`<p>Export filesystem root from current snapshot. Provider performs archive creation and transfer.</p><p><strong>Source</strong> nginx · /<br><strong>Format</strong> tar archive · preserve POSIX metadata</p><label class="toggle"><input id="tar" type="checkbox" ${state.tar?'checked':''}> Provider supports archive export (tar available)</label>${!state.tar?'<p class="amber">tar is unavailable. Export is disabled. Browsing remains available.</p>':''}<p class="muted">No archive is created by this prototype. Real provider must report progress, cancellation, and failures.</p>`;
  else if(state.modal==='Previous snapshot contents')content='<p class="muted">'+esc(state.selected)+' · previous version</p><pre style="overflow:auto">'+esc((node?.previous||fileContents(node)).join('\n'))+'</pre>';
  else if(state.modal==='Copy path')content=`<p>Selected path, ready to copy:</p><input aria-label="Path to copy" style="width:100%;padding:8px;background:var(--bg);border:1px solid var(--line)" readonly value="${esc(state.selected)}">`;
  else {
    const descriptions={
      'Metadata contract':'Stable node ID, POSIX path, file kind, size, mode, owner, timestamps, layer provenance, and change status come from provider metadata. No credentials enter tree state.',
      'Archive capability':'archiveExport: unavailable · reason: missing-tool · requiredTool: tar. Provider owns transport and authorization.',
      'Download request':'Mock download request recorded. Consumer supplies file transfer, progress, cancellation, and error reporting. No real file is downloaded.',
      'Provider retry':'Mock retry request recorded. Provider owns reconnect and authorization. No connection occurs.',
      'Load cancelled':'Mock branch load cancelled. Other loaded branches remain available.',
      'Link target /bin/busybox':'Target kind: regular executable · /bin/busybox · layer 0. This mock shows metadata only; provider must enforce root boundaries.',
      'Export request recorded':'Mock archive request recorded for nginx · /. No export was performed. Provider supplies transfer progress and cancellation.',
      'Snapshot refreshed':'Provider snapshot refreshed in this simulation.'
    };
    content='<p>'+esc(descriptions[state.modal]||state.modal)+'</p>';
  }
  root.innerHTML=`<div class="modalback"><section role="dialog" aria-modal="true" aria-label="${exp?'Export filesystem':esc(state.modal)}" class="modal"><h2>${exp?'Export filesystem':esc(state.modal)}</h2>${content}<div class="buttons"><button id="close">${exp?'Cancel':'Close'}</button>${exp?`<button id="confirmexport" class="active" ${!state.tar?'disabled':''}>Request export</button>`:''}</div></section></div>`;
  document.getElementById('close').onclick=closeOverlay;
  if(exp){document.getElementById('tar').onchange=e=>{state.tar=e.target.checked;renderOverlay()};document.getElementById('confirmexport').onclick=()=>{state.modal='Export request recorded';renderOverlay()}}
  root.querySelector('button').focus();
}
function closeOverlay(){state.modal=null;state.menu=null;renderOverlay();focusPath(state.selected)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();if(e.key==='Tab'&&state.modal){const els=[...document.querySelectorAll('.modal button:not(:disabled),.modal input')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='Tab'&&state.menu){e.preventDefault();closeOverlay()}if(state.menu&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const bs=[...document.querySelectorAll('.menu button')],i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:bs.length-1))%bs.length].focus()}});document.addEventListener('mousedown',e=>{if(state.menu&&!e.target.closest('.menu')){state.menu=null;renderOverlay()}});window.__mock={state,freezeAt(ms){for(const a of document.getAnimations()){a.pause();a.currentTime=ms}}};render();
</script></body></html>
