<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omniview — Settings window design</title><script src="icons.js"></script><style>
:root{--base:#0e0f11;--surface:#141517;--raised:#1a1b1e;--inset:#09090b;--border:#2e3035;--line:#1e1f22;--fg:#e6e7ea;--muted:#898c94;--subtle:#6e7179;--accent:#8aafff;--soft:rgb(80 138 255 / .12);--green:#63ba8d;--radius:8px;--ease:cubic-bezier(.2,0,0,1);font:13px -apple-system,BlinkMacSystemFont,Inter,"Segoe UI",sans-serif;color:var(--fg)}
*{box-sizing:border-box}body{margin:0;background:var(--inset);height:100vh;overflow:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:0;background:none}svg{width:18px;height:18px;display:block}.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.muted{color:var(--muted)}.subtle{color:var(--subtle)}
#main{height:100%;background:var(--base)}.workspace-shot{position:absolute;inset:0;background:url('workspace.png') center/cover no-repeat;opacity:.62}.workspace-fallback{padding:20px 32px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);font-size:12px}.reopen{position:absolute;left:36px;bottom:40px;border:1px solid var(--border);background:var(--surface);padding:12px 18px;border-radius:8px;display:flex;gap:16px;align-items:center}.reopen kbd{color:var(--muted)}
#layer{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}#layer>*{pointer-events:auto}.window{width:min(1160px,calc(100vw - 80px));height:min(780px,calc(100vh - 80px));background:var(--base);border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:0 32px 100px #0008,0 2px 8px #0006;display:grid;grid-template-columns:236px 1fr;grid-template-rows:48px 1fr;animation:arrive 160ms var(--ease)}@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.titlebar{grid-column:1/-1;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:var(--surface);position:relative;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.1px}.traffic{position:absolute;left:18px;display:flex;gap:8px}.traffic button{width:12px;height:12px;padding:0;border-radius:50%;background:#ff5f57}.traffic button:nth-child(2){background:#febc2e}.traffic button:nth-child(3){background:#28c840}.window-note{position:absolute;right:20px;display:flex;gap:6px;align-items:center;font-size:11px;font-weight:400;color:var(--subtle)}.window-note svg{width:13px;height:13px}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:25px 14px 16px}.brand{display:flex;align-items:center;gap:10px;padding:0 12px 22px;font-size:18px;font-weight:600;letter-spacing:-.4px}.brand-mark{width:27px;height:27px;border:1px solid var(--border);border-radius:7px;color:var(--accent);display:grid;place-items:center;background:var(--base)}.searchbox{margin:0 7px 24px;position:relative;display:flex;align-items:center;gap:8px;background:var(--inset);border:1px solid var(--border);border-radius:7px;padding:9px 10px}.searchbox svg{width:14px;height:14px;color:var(--subtle)}.searchbox input{width:100%;min-width:0;background:none;border:0;outline:none!important;font-size:12px}.searchbox kbd{font:10px inherit;color:var(--subtle)}.group-label{font-size:10px;text-transform:uppercase;letter-spacing:1.15px;color:var(--subtle);margin:0 12px 9px}.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:2px 0;width:100%;text-align:left;color:var(--muted);border-radius:7px}.nav svg{width:17px;height:17px}.nav.active{background:var(--soft);color:var(--accent)}.nav.active:after{content:'';margin-left:auto;width:5px;height:5px;background:var(--accent);border-radius:50%}.nav:hover{background:var(--raised)}.nav-divider{height:1px;background:var(--line);margin:18px 10px}.sidebar-bottom{margin-top:auto;padding:18px 12px 0;color:var(--subtle);font-size:11px;display:flex;justify-content:space-between;align-items:center}.sidebar-bottom strong{display:block;font-weight:500;color:var(--muted);margin-bottom:5px}
.content{display:flex;flex-direction:column;min-height:0}.content-scroll{overflow:auto;flex:1;padding:34px 44px 30px}.eyebrow{color:var(--subtle);font-size:11px;display:flex;align-items:center;gap:7px;margin-bottom:11px}.eyebrow svg{width:12px;height:12px}h1{font-size:27px;letter-spacing:-.8px;font-weight:600;line-height:1.2;margin:0 0 9px;color:var(--fg)}.lede{margin:0 0 29px;line-height:1.6;color:var(--muted);font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}h2{font-size:13px;font-weight:600;margin:0}.badge{border:1px solid var(--border);padding:3px 7px;border-radius:5px;color:var(--muted);font-size:10px}.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.theme-card{padding:7px;border:1px solid var(--border);border-radius:9px;text-align:left;background:var(--surface);position:relative}.theme-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.mini{height:88px;border-radius:4px;overflow:hidden;background:var(--preview);display:grid;grid-template-columns:30px 1fr;border:1px solid #8882}.mini-side{border-right:1px solid #8882;background:#8881;padding:12px 7px}.mini-side i{display:block;height:3px;background:var(--preview-fg);opacity:.25;margin-bottom:8px;border-radius:2px}.mini-main{padding:13px 12px}.mini-main:before{content:'';display:block;width:45%;height:5px;background:var(--preview-fg);opacity:.7;border-radius:2px;margin-bottom:13px}.mini-main i{display:block;background:var(--preview-fg);height:4px;width:86%;opacity:.16;margin:7px 0;border-radius:2px}.mini-main i:nth-child(2){width:65%;background:var(--preview-accent);opacity:.8}.theme-label{padding:12px 5px 5px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.theme-label svg{width:15px;height:15px;color:var(--accent)}.theme-desc{color:var(--subtle);font-size:10px;padding:0 5px 5px}.card{border:1px solid var(--border);border-radius:9px;background:var(--surface);overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:18px 20px;min-height:76px}.row+.row{border-top:1px solid var(--line)}.row-label{font-size:12px;font-weight:500;margin-bottom:6px}.row-desc{font-size:11px;color:var(--muted);line-height:1.5;max-width:390px}.row select,.field{background:var(--raised);border:1px solid var(--border);padding:8px 10px;border-radius:6px;min-width:166px;font-size:12px}.field{width:182px}.toggle{width:32px;height:19px;border-radius:20px;background:var(--border);padding:3px;display:flex;align-items:center;flex-shrink:0}.toggle[aria-checked=true]{background:#5a7fe2}.toggle:after{content:'';height:13px;width:13px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0005}.toggle[aria-checked=true]:after{margin-left:auto}.callout{display:flex;gap:10px;margin:18px 0 0;color:var(--muted);font-size:11px;line-height:1.65}.callout svg{width:15px;height:15px;color:var(--subtle);margin-top:2px}.footer{height:67px;flex-shrink:0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 44px;background:var(--base)}.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.status svg{width:14px;height:14px;color:var(--green)}.actions{display:flex;gap:9px;align-items:center}.btn{padding:8px 13px;border-radius:6px;font-size:12px;border:1px solid var(--border);background:var(--surface)}.btn.primary{background:#5a7fe2;color:white;border-color:#7092e8}.btn.quiet{border-color:transparent;background:none;color:var(--muted)}.inline-link{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:11px}.inline-link svg{width:12px;height:12px}.error{color:#eda2a2;font-size:11px;margin-top:7px}.invalid{border-color:#db7777}.terminal-preview{background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:17px 20px;font:12px/1.9 ui-monospace,SFMono-Regular,monospace;color:var(--muted);margin-top:18px}.terminal-preview span{color:var(--green)}.terminal-preview b{color:var(--accent);font-weight:400}.terminal-preview i{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:middle}.results{display:flex;flex-direction:column;gap:12px}.result{padding:20px;border:1px solid var(--border);border-radius:9px;text-align:left;background:var(--surface)}.result:hover{border-color:var(--accent)}.result .path{color:var(--subtle);font-size:10px;margin-bottom:10px}.result strong{display:flex;justify-content:space-between;font-weight:500;margin-bottom:8px}.result p{font-size:12px;color:var(--muted);margin:0}.result mark{background:var(--soft);color:var(--accent);padding:1px 2px;border-radius:3px}.empty{padding:40px;text-align:center;color:var(--muted)}.dialog-scrim{position:absolute;inset:0;background:#0005;display:grid;place-items:center;z-index:9}.dialog{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:420px;padding:28px;box-shadow:0 20px 80px #0008}.dialog h2{font-size:18px;margin-bottom:12px}.dialog p{line-height:1.6;color:var(--muted);margin-bottom:24px}.dialog .actions{justify-content:flex-end}.flash{position:absolute;bottom:20px;background:var(--surface);border:1px solid var(--border);padding:12px 18px;border-radius:8px;color:var(--green);font-size:12px}
.workspace-shot{opacity:1}.workspace-fallback{display:none}.content-scroll{padding-top:29px}.lede{margin-bottom:23px}.mini{height:75px}.row{min-height:68px;padding:15px 20px}.section-head{margin-top:22px}.theme-desc{font-size:11px}.brand{padding-bottom:22px}.reopen{bottom:12px;padding:7px 12px;font-size:11px}
.content-scroll{padding-top:24px;padding-bottom:20px}.lede{margin-bottom:18px}.mini{height:60px}.row{min-height:58px;padding:12px 20px}.terminal-preview{padding:12px 20px}
body{color:var(--fg)}.content-scroll:has(.error) .terminal-preview{padding:8px 20px;margin-top:12px}.content-scroll:has(.error) .callout{margin-top:10px}
body.light{--base:#eef0f3;--surface:#f7f8fa;--raised:#fff;--inset:#e4e7ec;--border:#cbd1da;--line:#e4e7ec;--fg:#1b1d22;--muted:#4b5564;--subtle:#6b7481;--accent:#3d5fb0;--soft:rgb(71 109 206 / .13);--green:#34734d}body.light .error{color:#ac3434}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:1050px){.window{width:calc(100vw - 30px);grid-template-columns:210px 1fr}.content-scroll{padding:28px}.theme-grid{gap:8px}.row{gap:15px}.window-note{display:none}}
</style></head><body><div id="main"><div class="workspace-shot"></div><div class="workspace-fallback"><span>Omniview　 /　 Workspace</span><span>Resources　　Connections</span></div><button class="reopen" id="open-settings">Open settings <kbd>⌘ ,</kbd></button></div><div id="layer"></div><script>
'use strict';
const params=new URLSearchParams(location.search);document.body.classList.toggle('light',params.get('theme')==='light');
const icon=n=>`<span class="ic">${ICONS[n]||ICONS.LuSettings2}</span>`;
const categories=[['General','LuSettings2'],['Appearance','LuPaintbrush'],['Terminal','LuSquareTerminal'],['Editor','LuCode'],['Developer Settings','LuBeaker'],['Telemetry','LuActivity'],['Extensions','LuBrainCircuit'],['AI Tools','LuBot']];
const themes=[['void','Void','Default · quiet, focused dark','#0e0f11','#e6e7ea','#8aafff'],['light','Light','Clean, daylight-ready','#eef0f3','#1b1d22','#476dce'],['dark','Dark','Balanced, familiar contrast','#181a1c','#ccc','#89a7ee'],['obsidian','Obsidian','Deep, neutral surfaces','#16181c','#d5d8df','#9baeff'],['solarized-dark','Solarized Dark','Warm, low-contrast dark','#002b36','#839496','#b58900'],['solarized-light','Solarized Light','Warm, paper-like light','#fdf6e3','#657b83','#268bd2']];
const initial={theme:params.get('theme')==='light'?'light':'void',shell:'/bin/zsh',font:'12',cursor:'block',blink:true,terminalTheme:'application'};
const state={visible:true,created:1,opens:1,page:'Appearance',query:'',draft:{...initial},saved:{...initial},dirty:false,error:'',pending:null,returnFocus:null};
function changed(){state.dirty=Object.keys(initial).some(k=>state.draft[k]!==state.saved[k]);state.error='';renderContent()}
function nav(page){if(state.dirty){state.pending=page;showDialog();return}state.page=page;state.query='';document.getElementById('search').value='';renderNav();renderContent()}
function renderNav(){document.getElementById('nav').innerHTML=categories.map(([name,ic],i)=>`${i===6?'<div class="nav-divider"></div><div class="group-label">Capabilities</div>':''}<button class="nav ${state.page===name&&!state.query?'active':''}" data-page="${name}">${icon(ic)}${name}</button>`).join('');document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>nav(el.dataset.page))}
function shell(){document.getElementById('layer').innerHTML=`<section class="window" aria-label="Settings window"><header class="titlebar"><div class="traffic"><button id="close" aria-label="Close settings"></button><button id="minimize" aria-label="Minimize settings"></button><button id="expand" aria-label="Expand settings"></button></div>Omniview Settings<span class="window-note">${icon('LuExternalLink')} Independent window</span></header><aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('LuSettings2')}</span>Settings</div><label class="searchbox">${icon('LuSearch')}<input id="search" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off"><kbd>⌘K</kbd></label><div class="group-label">Application</div><nav id="nav" aria-label="Settings categories"></nav><div class="sidebar-bottom"><div><strong>Omniview</strong>Application preferences</div>${icon('LuCommand')}</div></aside><main class="content"><div class="content-scroll" id="body"></div><footer class="footer" id="footer"></footer></main></section>`;renderNav();renderContent();document.getElementById('search').value=state.query;document.getElementById('search').oninput=e=>{state.query=e.target.value;renderNav();renderContent()};document.getElementById('close').onclick=()=>hide();document.getElementById('minimize').onclick=()=>hide();document.getElementById('expand').onclick=()=>{document.querySelector('.window').style.cssText='width:calc(100vw - 30px);height:calc(100vh - 30px)'};}
const heading=(title,desc)=>`<div class="eyebrow">Application ${icon('LuChevronRight')} ${title}</div><h1>${title}</h1><p class="lede">${desc}</p>`;
const row=(title,desc,control)=>`<div class="row"><div><div class="row-label">${title}</div><div class="row-desc">${desc}</div></div>${control}</div>`;
function appearance(){return heading('Appearance','Make Omniview feel at home. Choose a theme for your entire workspace.')+`<div class="section-head"><h2>Color theme</h2><span class="badge">Saves automatically</span></div><div class="theme-grid">${themes.map(([id,name,desc,bg,fg,ac])=>`<button class="theme-card ${state.draft.theme===id?'selected':''}" data-theme="${id}" aria-pressed="${state.draft.theme===id}"><div class="mini" style="--preview:${bg};--preview-fg:${fg};--preview-accent:${ac}"><div class="mini-side"><i></i><i></i><i></i><i></i></div><div class="mini-main"><i></i><i></i><i></i></div></div><div class="theme-label">${name}${state.draft.theme===id?icon('LuCircleCheck'):''}</div><div class="theme-desc">${desc}</div></button>`).join('')}</div><div class="callout">${icon('LuInfo')}<span>Your theme applies and saves immediately across all Omniview windows.<br>Terminals and editors can follow your application theme or use their own.</span></div><div class="section-head"><h2>Connected preferences</h2></div><div class="card">${row('Terminal appearance','Set a terminal theme, font size, and cursor style.',`<button class="inline-link" data-go="Terminal">Terminal settings ${icon('LuArrowUpRight')}</button>`)}${row('Editor appearance','Choose syntax colors and text preferences.',`<button class="inline-link" data-go="Editor">Editor settings ${icon('LuArrowUpRight')}</button>`)}</div>`}
function terminal(){return heading('Terminal','A familiar shell, tuned to the way you work.')+`<div class="section-head"><h2>Shell</h2><span class="badge">New sessions</span></div><div class="card">${row('Default Shell','The executable used when opening a new terminal.',`<div><input class="field ${state.error?'invalid':''}" id="shell" aria-label="Default Shell" value="${state.draft.shell.replaceAll('&','&amp;').replaceAll('"','&quot;')}">${state.error?`<div class="error" role="alert">${state.error}</div>`:''}</div>`)}</div><div class="section-head"><h2>Appearance</h2></div><div class="card">${row('Theme','Follow your application theme or choose a terminal theme.',`<select id="terminalTheme" aria-label="Terminal theme"><option value="application">Application</option><option value="dracula">Dracula</option><option value="nord">Nord</option></select>`)}${row('Font Size','Text size in pixels.',`<input type="number" class="field" id="font" min="1" aria-label="Font Size" value="${state.draft.font}">`)}${row('Cursor Style','Choose how the insertion point appears.',`<select id="cursor" aria-label="Cursor Style"><option value="block">Block</option><option value="underline">Underline</option><option value="bar">Bar</option></select>`)}${row('Cursor Blink','Animate the cursor in the active terminal.',`<button id="blink" class="toggle" role="switch" aria-label="Cursor Blink" aria-checked="${state.draft.blink}"></button>`)}</div><div class="terminal-preview"><span>josh</span> <span class="subtle">@</span> <b>workspace</b> <span class="subtle">~/projects</span><br><span>❯</span> kubectl get pods <i></i></div><div class="callout">${icon('LuInfo')}Shell changes apply to newly opened terminals. Existing sessions keep running.</div>`}
function generic(){if(state.page==='General')return heading('General','Your everyday defaults, in one place.')+`<div class="section-head"><h2>Language & region</h2></div><div class="card">${row('Language','The language used throughout Omniview.','<select aria-label="Language"><option>English</option><option>Español</option></select>')}</div>`;return heading(state.page,'Manage '+state.page.toLowerCase()+' preferences without leaving your workspace.')+`<div class="card"><div class="row"><div><div class="row-label">Existing ${state.page.toLowerCase()} settings</div><div class="row-desc">This proposal preserves the current settings surface and its behavior.</div></div>${icon('LuArrowUpRight')}</div></div><div class="callout">${icon('LuInfo')}Layout reference only. Detailed redesign covers Appearance and Terminal.</div>`}
const searchItems=[['Terminal','Default Shell','The executable used when opening a new terminal.','shell'],['Terminal','Theme','Follow your application theme or choose a terminal theme.','terminalTheme'],['Appearance','Theme','The color theme for the application UI.','theme'],['Terminal','Font Size','The size of the font in the terminal.','font'],['Terminal','Cursor Style','The style of the cursor in the terminal.','cursor'],['Terminal','Cursor Blink','Whether the cursor should blink in the terminal.','blink']];
function search(){let q=state.query.toLowerCase();let found=searchItems.filter(x=>x.join(' ').toLowerCase().includes(q));return `<div class="eyebrow">All settings</div><h1>Search results</h1><p class="lede">${found.length} ${found.length===1?'setting':'settings'} matching “${state.query.replaceAll('&','&amp;').replaceAll('<','&lt;')}”</p><div class="results">${found.map(([cat,title,desc,key])=>`<button class="result" data-result="${cat}" data-key="${key}"><div class="path">Application / ${cat}</div><strong>${title}${icon('LuArrowUpRight')}</strong><p>${desc}</p></button>`).join('')||'<div class="empty">No matching settings. Try “theme”, “shell”, or “cursor”.</div>'}</div>`}
function renderContent(){document.getElementById('body').innerHTML=state.query?search():state.page==='Appearance'?appearance():state.page==='Terminal'?terminal():generic();document.getElementById('footer').innerHTML=`<span class="status">${icon(state.dirty?'LuInfo':'LuCircleCheck')}${state.error?'Resolve the highlighted setting to save.':state.dirty?'Unsaved changes':'All changes saved'}</span><div class="actions">${state.dirty?'<button class="btn quiet" id="discard">Discard changes</button>':''}<button class="btn ${state.dirty?'primary':''}" id="save">${state.dirty?'Save changes':'Done'}</button></div>`;document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.draft.theme=b.dataset.theme;state.saved.theme=b.dataset.theme;document.body.classList.toggle('light',b.dataset.theme==='light'||b.dataset.theme==='solarized-light');changed()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{let dest=b.dataset.result,key=b.dataset.key;nav(dest);document.getElementById(key)?.focus()});document.getElementById('save').onclick=()=>state.dirty?save():hide();document.getElementById('discard')?.addEventListener('click',()=>{state.draft={...state.saved};state.dirty=false;state.error='';renderContent()});for(const key of ['shell','font','cursor','terminalTheme']){let el=document.getElementById(key);if(!el)continue;if(el.tagName==='SELECT')el.value=state.draft[key];el.onchange=()=>{state.draft[key]=el.value;changed()}}document.getElementById('blink')?.addEventListener('click',()=>{state.draft.blink=!state.draft.blink;changed()})}
function save(){if(state.draft.shell.startsWith('/missing')){state.error='Choose an executable shell installed on this system.';renderContent();return false}state.saved={...state.draft};state.dirty=false;state.error='';renderContent();return true}
function hide(){state.visible=false;document.querySelector('.window').style.display='none';document.getElementById('open-settings').focus()}
function open(){state.visible=true;state.opens++;document.querySelector('.window').style.display='grid';document.getElementById('search').focus()}
function showDialog(){const el=document.createElement('div');el.className='dialog-scrim';el.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">Save your changes?</h2><p>You have unsaved changes in ${state.page}. Save or discard them before switching sections.</p><div class="actions"><button class="btn" id="cancel-nav">Cancel</button><button class="btn" id="discard-nav">Discard</button><button class="btn primary" id="save-nav">Save changes</button></div></div>`;document.getElementById('layer').append(el);document.getElementById('cancel-nav').onclick=()=>{state.pending=null;el.remove()};document.getElementById('discard-nav').onclick=()=>{state.draft={...state.saved};state.dirty=false;let dest=state.pending;state.pending=null;el.remove();nav(dest)};document.getElementById('save-nav').onclick=()=>{el.remove();if(save()){let dest=state.pending;state.pending=null;nav(dest)}};document.getElementById('cancel-nav').focus()}
document.getElementById('open-settings').onclick=open;window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();open()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&state.visible){e.preventDefault();document.getElementById('search').focus()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'&&state.visible){e.preventDefault();save()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='w'&&state.visible){e.preventDefault();hide()}if(e.key==='Escape'){if(document.querySelector('.dialog-scrim')){document.getElementById('cancel-nav').click()}else if(state.query){state.query='';document.getElementById('search').value='';renderNav();renderContent()}}});
window.__mock={state,freezeAt(ms){for(const a of document.getAnimations()){a.pause();a.currentTime=ms}}};shell();
</script></body></html>
